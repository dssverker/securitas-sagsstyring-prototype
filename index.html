<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sagsstyring – prototype</title>
<meta name="robots" content="noindex, nofollow">
<!-- Fallback per Securitas DS: Poppins er den nærmeste geometriske erstatning for Securitas Pro -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
  /* ==========================================================================
     Securitas Design System – tokens (fra claude.ai/design "Securitas Design System")
     Kilde: tokens/colors.css, typography.css, spacing.css, effects.css
     ========================================================================== */
  @font-face{font-family:"Securitas Pro";src:url("fonts/SecuritasPro-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Securitas Pro";src:url("fonts/SecuritasPro-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"Securitas Pro";src:url("fonts/SecuritasPro-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}

  :root {
    color-scheme: light;
    /* Brand */
    --sec-navy-blue:#031F30; --sec-red:#FC273F; --sec-purple:#8D5FFF; --sec-white:#FFFFFF;
    --sec-light-purple:#C2B4FC;
    /* UI ramps */
    --ui-blue-100:#ACC2DD; --ui-blue-200:#8EABCE; --ui-blue-300:#7599BF; --ui-blue-400:#587CAA; --ui-blue-500:#42638C;
    --ui-blue-600:#2E4869; --ui-blue-700:#172F48; --ui-blue-800:#031F30; --ui-blue-900:#011523;
    --ui-purple-100:#C2B4FC; --ui-purple-200:#AE97FD; --ui-purple-300:#9977FE; --ui-purple-400:#8D5FFF; --ui-purple-500:#6C47CF;
    --ui-red-400:#FC273F; --ui-red-500:#D31B3D; --ui-red-600:#AA1834;
    --ui-grey-100:#F7F7F7; --ui-grey-200:#EEEEEE; --ui-grey-300:#E5E5E4; --ui-grey-400:#D7D8D6; --ui-grey-500:#BABCBC;
    --ui-grey-600:#9C9EA0; --ui-grey-700:#717376; --ui-grey-800:#53565A; --ui-grey-900:#404346;
    /* Semantic */
    --surface-page:var(--sec-white); --surface-subtle:var(--ui-grey-100); --surface-card:var(--sec-white);
    --surface-framework:var(--ui-blue-800); --surface-framework-deep:var(--ui-blue-900);
    --text-primary:var(--ui-blue-800); --text-secondary:var(--ui-grey-800); --text-disabled:var(--ui-grey-700);
    --text-on-dark:var(--sec-white); --text-on-dark-muted:var(--ui-blue-100);
    --border-default:var(--ui-grey-400); --border-strong:var(--ui-blue-800);
    --cta-bg:var(--ui-blue-800); --cta-bg-hover:var(--ui-blue-700); --cta-bg-pressed:var(--ui-blue-900); --cta-bg-focus:var(--ui-blue-600); --cta-fg:var(--sec-white);
    --primary-bg:var(--sec-light-purple); --primary-bg-hover:var(--ui-purple-300); --primary-bg-pressed:var(--ui-purple-400); --primary-fg:var(--sec-navy-blue);
    --secondary-border:var(--sec-navy-blue); --secondary-border-hover:var(--ui-blue-700); --secondary-border-pressed:var(--ui-blue-900);
    --disabled-bg:var(--ui-grey-300); --disabled-fg:var(--ui-grey-800); --focus-ring:var(--ui-purple-400);
    /* Type */
    --font-brand:"Securitas Pro","Poppins","Helvetica Neue",Arial,sans-serif;
    /* Space (3px-grid) */
    --space-1:3px; --space-2:6px; --space-3:12px; --space-4:18px; --space-5:24px; --space-6:30px; --space-7:36px; --space-8:42px;
    --layout-1:12px; --layout-2:24px; --layout-3:36px; --layout-4:48px; --layout-5:60px; --layout-6:72px;
    --radius-overlay:6px; --radius-button:24px; --stroke:1px; --stroke-emphasis:2px;
    --button-height:48px; --button-padding-x:24px;
    /* Effects */
    --motion-base:200ms; --ease-standard:cubic-bezier(0.2,0,0.2,1);
    --shadow-overlay:0 2px 12px rgba(3,31,48,0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-brand); font-size: 15px; line-height: 24px; font-weight: 400;
    color: var(--text-primary); background: var(--surface-page);
    display: flex; min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
  h1 { font-size: 24px; line-height: 30px; }               /* Headline-04 */
  h2 { font-size: 18px; line-height: 24px; }               /* Headline-05 */
  h3 { font-size: 15px; line-height: 24px; }               /* Headline-06 */
  p { margin: 0; }
  .caption { font-size: 12px; line-height: 18px; }
  .muted { color: var(--text-secondary); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .ico { width: 24px; height: 24px; flex: none; fill: currentColor; }
  .ico.s { width: 18px; height: 18px; }
  *:focus-visible { outline: var(--stroke-emphasis) solid var(--focus-ring); outline-offset: 2px; }

  /* ---------- Framework (sidebar) ---------- */
  .sidebar {
    width: 240px; flex: none; background: var(--surface-framework); color: var(--text-on-dark);
    display: flex; flex-direction: column; padding: var(--space-5) var(--space-4); gap: var(--space-1);
    position: sticky; top: 0; height: 100vh;
  }
  #nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .brand { padding: var(--space-2) var(--space-3) var(--space-5); }
  .brand svg { width: 132px; height: auto; display: block; color: var(--sec-white); }
  .brand .caption { color: var(--text-on-dark-muted); margin-top: var(--space-3); }
  .nav-label { font-size: 12px; line-height: 18px; color: var(--text-on-dark-muted); padding: var(--space-4) var(--space-3) var(--space-1); }
  .nav-btn {
    display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left;
    background: none; border: 0; color: var(--text-on-dark); padding: var(--space-2) var(--space-3); cursor: pointer;
    transition: color var(--motion-base) var(--ease-standard);
  }
  .nav-btn span.lbl { border-bottom: var(--stroke-emphasis) solid transparent; padding-bottom: 1px; }
  .nav-btn:hover { color: var(--ui-blue-100); }
  .nav-btn.active { font-weight: 700; }
  .nav-btn.active span.lbl { border-bottom-color: var(--sec-purple); }
  .nav-btn .count { margin-left: auto; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--sec-white); background: var(--sec-red); min-width: 18px; height: 18px; padding: 0 var(--space-2); display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; }
  .sidebar .user { margin-top: auto; padding: var(--space-3); border-top: var(--stroke) solid var(--ui-blue-700); font-size: 12px; line-height: 18px; color: var(--text-on-dark-muted); display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-start; }
  .sidebar .user select { width: 100%; background: var(--surface-framework-deep); color: var(--sec-white); border: var(--stroke) solid var(--ui-blue-600); border-radius: var(--radius-overlay); padding: var(--space-2) var(--space-3); }
  .sidebar .user .link { color: var(--sec-white); font-size: 12px; line-height: 18px; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: var(--layout-3) var(--layout-4) var(--layout-6); max-width: 1224px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-5); flex-wrap: wrap; }
  .page-head p { margin-top: var(--space-2); color: var(--text-secondary); max-width: 64ch; }
  .replaces { font-size: 12px; line-height: 18px; color: var(--text-secondary); background: var(--surface-subtle); padding: var(--space-2) var(--space-3); border-radius: var(--radius-overlay); }
  .replaces b { color: var(--text-primary); }

  .card { background: var(--surface-card); border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); }
  .card-body { padding: var(--space-5); }
  .card + .card { margin-top: var(--space-5); }
  .toolbar { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: flex-end; padding: var(--space-4) var(--space-5); border-bottom: var(--stroke) solid var(--border-default); }
  .toolbar .spacer { flex: 1; }
  label.field, .field { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--text-secondary); }

  input[type=text], input[type=number], input[type=date], select, textarea {
    background: var(--surface-card); border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay);
    padding: var(--space-2) var(--space-3); min-width: 0; font-size: 15px; line-height: 24px; color: var(--text-primary);
    transition: border-color var(--motion-base) var(--ease-standard);
  }
  input:hover, select:hover, textarea:hover { border-color: var(--ui-grey-700); }
  input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--border-strong); outline-offset: 0; }
  input[readonly] { background: var(--surface-subtle); color: var(--text-secondary); }

  /* Buttons – DS §3.1.3: 48px, radius 24px, 24px side padding, 15/24 bold */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3);
    height: var(--button-height); padding: 0 var(--button-padding-x); border-radius: var(--radius-button);
    border: var(--stroke) solid var(--secondary-border); background: transparent; color: var(--sec-navy-blue);
    font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: background-color var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard), color var(--motion-base) var(--ease-standard);
  }
  .btn:hover { border-color: var(--secondary-border-hover); color: var(--ui-blue-700); }
  .btn:active { border-color: var(--secondary-border-pressed); color: var(--ui-blue-900); }
  .btn.cta { background: var(--cta-bg); color: var(--cta-fg); border-color: transparent; }
  .btn.cta:hover { background: var(--cta-bg-hover); color: var(--cta-fg); }
  .btn.cta:focus-visible { background: var(--cta-bg-focus); }
  .btn.cta:active { background: var(--cta-bg-pressed); }
  .btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
  .btn.primary:hover { background: var(--primary-bg-hover); color: var(--primary-fg); }
  .btn.primary:active { background: var(--primary-bg-pressed); }
  .btn:disabled { background: var(--disabled-bg); color: var(--disabled-fg); border-color: transparent; cursor: not-allowed; }
  /* Text link – DS §3.1.1 */
  .tlink { background: none; border: 0; padding: 0; font-weight: 700; color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; transition: color var(--motion-base) var(--ease-standard); }
  .tlink:hover { color: var(--ui-blue-600); }
  .tlink:active { color: var(--ui-blue-900); }
  /* Filter tabs – DS §3.1.4 */
  .ftabs { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .ftab { height: var(--button-height); padding: 0 var(--button-padding-x); border-radius: var(--radius-button); border: var(--stroke) solid var(--sec-navy-blue); background: transparent; color: var(--sec-navy-blue); font-weight: 700; cursor: pointer; transition: background-color var(--motion-base) var(--ease-standard), color var(--motion-base) var(--ease-standard); }
  .ftab:hover { background: var(--surface-subtle); }
  .ftab.on { background: var(--sec-navy-blue); color: var(--sec-white); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; line-height: 18px; color: var(--text-secondary); font-weight: 700; padding: var(--space-3) var(--space-3); border-bottom: var(--stroke) solid var(--border-default); white-space: nowrap; background: var(--surface-subtle); }
  th.num { text-align: right; }
  td { padding: var(--space-3); border-bottom: var(--stroke) solid var(--ui-grey-300); vertical-align: top; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-subtle); }
  tfoot td { font-weight: 700; background: var(--surface-subtle); border-bottom: 0; }
  .empty { padding: var(--space-6); text-align: center; color: var(--text-secondary); }

  /* Status – tekst med farvet prik (DS har ingen badge-komponent; rød kun som mikro-accent) */
  .st { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .st::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ui-grey-500); flex: none; }
  .st.opstart::before { background: var(--ui-grey-600); }
  .st.udf::before { background: var(--sec-purple); }
  .st.klar::before { background: var(--ui-blue-500); }
  .st.fakt::before { background: var(--sec-navy-blue); }
  .st.aaben::before { background: var(--ui-blue-300); }
  .st.nodot::before { display: none; }
  .alert { color: var(--ui-red-500); font-weight: 700; font-size: 12px; line-height: 18px; }
  .dg { font-weight: 700; }
  .dg.good { color: var(--sec-navy-blue); } .dg.warn { color: var(--ui-blue-500); } .dg.bad { color: var(--ui-red-500); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
  .stat { background: var(--surface-subtle); border-radius: var(--radius-overlay); padding: var(--space-3) var(--space-4); }
  .stat small { display: block; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .stat b { font-size: 24px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Projektkort */
  .proj-head .id { font-size: 12px; line-height: 18px; font-weight: 700; color: var(--ui-blue-500); }
  .tabs { display: flex; gap: var(--space-2); border-bottom: var(--stroke) solid var(--border-default); padding: 0 var(--space-3); }
  .tab { background: none; border: 0; padding: var(--space-3) var(--space-3); cursor: pointer; color: var(--text-secondary); font-weight: 700; border-bottom: var(--stroke-emphasis) solid transparent; margin-bottom: -1px; transition: color var(--motion-base) var(--ease-standard); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--sec-purple); }
  .tab:hover { color: var(--text-primary); }
  .tabpane { display: none; }
  .tabpane.active { display: block; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3) var(--space-4); }
  .form-grid label { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .form-grid .auto input { border-color: transparent; background: var(--ui-purple-100); color: var(--text-primary); }
  .hint { font-size: 12px; line-height: 18px; color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-2); }
  .hint .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--ui-purple-100); }
  .inline-form { display: grid; grid-template-columns: 1fr 1.2fr 2fr 1fr auto; gap: var(--space-3); align-items: end; padding: var(--space-4) var(--space-5); background: var(--surface-subtle); border-top: var(--stroke) solid var(--border-default); }
  .inline-form label { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 138px 1fr auto; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: var(--stroke) solid var(--ui-grey-300); }
  .log li time, .log li .who { color: var(--text-secondary); font-size: 12px; line-height: 18px; padding-top: 3px; font-variant-numeric: tabular-nums; }

  /* Modal – floating layer: den ene legitime skygge */
  .modal-bg { position: fixed; inset: 0; background: rgba(3,31,48,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: var(--space-5); }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface-card); border-radius: var(--radius-overlay); width: min(720px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow-overlay); }
  .modal header { padding: var(--space-4) var(--space-5); border-bottom: var(--stroke) solid var(--border-default); display: flex; justify-content: space-between; align-items: center; }
  .modal .body { padding: var(--space-5); }
  .modal footer { padding: var(--space-4) var(--space-5); border-top: var(--stroke) solid var(--border-default); display: flex; justify-content: flex-end; gap: var(--space-3); }
  .pdf { border: var(--stroke) solid var(--border-default); background: #fff; color: var(--text-primary); padding: var(--space-6) var(--space-7); }
  .pdf .pdf-head { display: flex; justify-content: space-between; align-items: center; border-bottom: var(--stroke-emphasis) solid var(--sec-navy-blue); padding-bottom: var(--space-3); margin-bottom: var(--space-4); }
  .pdf .pdf-head b { font-size: 18px; line-height: 24px; }
  .pdf dl { display: grid; grid-template-columns: 150px 1fr 150px 1fr; gap: var(--space-1) var(--space-3); margin: 0 0 var(--space-4); }
  .pdf dt { color: var(--text-secondary); } .pdf dd { margin: 0; font-weight: 700; }

  .toast { position: fixed; bottom: var(--space-5); left: 50%; transform: translateX(-50%); background: var(--sec-navy-blue); color: var(--sec-white); padding: var(--space-3) var(--space-5); border-radius: var(--radius-overlay); box-shadow: var(--shadow-overlay); opacity: 0; transition: opacity var(--motion-base) var(--ease-standard); z-index: 60; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Tekniker-telefon */
  .phone-wrap { display: grid; grid-template-columns: 390px 1fr; gap: var(--layout-3); align-items: start; }
  .phone { width: 390px; background: var(--sec-navy-blue); border-radius: 36px; padding: var(--space-3); }
  .screen { background: var(--surface-page); border-radius: 27px; height: 780px; overflow: auto; display: flex; flex-direction: column; }
  .screen .app-bar { background: var(--surface-framework); color: var(--sec-white); padding: var(--space-7) var(--space-4) var(--space-4); border-radius: 27px 27px 0 0; display: flex; justify-content: space-between; align-items: flex-end; }
  .screen .app-bar b { font-size: 18px; line-height: 24px; display: block; }
  .screen .app-bar small { color: var(--text-on-dark-muted); font-size: 12px; line-height: 18px; }
  .screen .app-bar svg { width: 60px; height: auto; color: var(--sec-white); }
  .screen .content { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .screen .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: var(--space-2); }
  .screen .mat { display: grid; grid-template-columns: 1fr 1.4fr 60px auto; gap: var(--space-2); align-items: center; }
  .screen .mat-list { display: flex; flex-direction: column; gap: var(--space-2); }
  .screen .mat-list .item { display: flex; justify-content: space-between; align-items: center; border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); padding: var(--space-2) var(--space-3); }
  .site-chip { background: var(--ui-purple-100); border-radius: var(--radius-overlay); padding: var(--space-3); }
  .site-chip b { display: block; }
  .my-cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .my-cases li { border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); padding: var(--space-2) var(--space-3); cursor: pointer; transition: border-color var(--motion-base) var(--ease-standard); }
  .my-cases li:hover { border-color: var(--border-strong); }
  .my-cases li.sel { border-color: var(--border-strong); border-width: 2px; padding: 5px 11px; }
  .my-cases li b { display: block; font-size: 12px; line-height: 18px; color: var(--ui-blue-500); }
  .side-note { color: var(--text-secondary); max-width: 56ch; }
  .side-note h2 { color: var(--text-primary); margin-bottom: var(--space-2); }
  .side-note ul { padding-left: 18px; margin: var(--space-2) 0 var(--space-5); }
  .side-note li { margin-bottom: var(--space-1); }
  .icobtn { width: var(--button-height); height: var(--button-height); padding: 0; border-radius: 50%; }

  /* ---------- Søg (pages/soeg.js) ---------- */
  #soegInput { font-size: 20px; height: 56px; padding: 0 var(--space-4); }
  .soeg-group + .soeg-group { margin-top: var(--space-5); }
  .soeg-group h2 { font-size: 16px; line-height: 22px; margin: 0 0 var(--space-3); }
  .soeg-group h2 .muted { font-weight: 400; }
  mark { background: var(--ui-purple-100); color: inherit; padding: 0 2px; }

  /* ---------- Eftersyn (pages/eftersyn.js) ---------- */
  .st.over::before { background: var(--ui-red-500); }
  .st.snart::before { background: var(--ui-blue-500); }
  .ef-cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--space-3); }
  .ef-cal .card-body { padding: var(--space-4); }
  .ef-cal h3 { margin-bottom: var(--space-2); }
  .ef-cal ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .ef-cal li { border-bottom: 1px solid var(--ui-grey-300); padding-bottom: var(--space-2); }
  .ef-cal li:last-child { border-bottom: 0; padding-bottom: 0; }
  .ef-cal .count { font-size: 24px; line-height: 30px; font-weight: 700; }
  .ef-cal.overdue .card { border-color: var(--ui-red-500); }

  /* ---------- Rapporter (pages/rapporter.js) ---------- */
  .rap-toolbar{display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-5)}
  .rap-toolbar .grp{display:flex;flex-direction:column;gap:var(--space-1)}
  .rap-toolbar .lbl{font-size:12px;line-height:18px;color:var(--text-secondary)}
  .rap-card .card-body{padding:var(--space-5)}
  .rap-card h2{margin-bottom:var(--space-1)}
  .rap-sub{color:var(--text-secondary);margin-bottom:var(--space-4)}
  .rap-chart{overflow-x:auto}
  .rap-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;margin:var(--space-3) 0 var(--space-4)}
  .rap-lg{display:inline-flex;align-items:center;gap:var(--space-2);font-size:12px;line-height:18px;color:var(--text-secondary)}
  .rap-lg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
  .rap-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--space-5);align-items:start}

  @media (max-width: 900px) {
    body { flex-direction: column; }
    /* Sidebar bliver en vandret, scrollbar topbar med ikoner + korte labels */
    .sidebar {
      width: auto; height: auto; position: sticky; top: 0; z-index: 40;
      flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 0;
      padding: var(--space-2) var(--space-3); overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .sidebar .brand { display: none; }
    .sidebar .nav-label { display: none; }
    .sidebar .user { display: flex; flex-direction: row; align-items: center; gap: var(--space-2); margin: 0 0 0 var(--space-2); padding: 0 0 0 var(--space-3); border-top: 0; border-left: var(--stroke) solid var(--ui-blue-700); flex: none; }
    .sidebar .user select { width: auto; max-width: 160px; }
    .sidebar .user .link { white-space: nowrap; }
    #nav { flex-direction: row; flex-wrap: nowrap; gap: var(--space-1); flex: none; }
    .nav-btn { width: auto; flex-direction: column; gap: var(--space-1); padding: var(--space-2); text-align: center; white-space: nowrap; }
    .nav-btn .ico { width: 20px; height: 20px; }
    .nav-btn span.lbl { font-size: 11px; line-height: 14px; }
    .nav-btn .count { position: absolute; margin-left: 0; transform: translate(10px, -10px); }
    .nav-btn { position: relative; }

    .main { padding: var(--space-4); max-width: 100%; }

    /* KPI-kort i to kolonner i stedet for at klemmes vandret */
    .stats { grid-template-columns: repeat(2, 1fr); }

    /* Værktøjslinjer og formularer stakker i én kolonne */
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .spacer { display: none; }
    .toolbar .ftabs, .toolbar .btn { width: 100%; }
    .inline-form { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .rap-grid2 { grid-template-columns: 1fr; }
    .rap-toolbar { flex-direction: column; align-items: stretch; }

    /* Brede tabeller: behold kolonnebredden og lad table-wrap scrolle vandret i stedet for at klemme */
    .table-wrap table { min-width: 720px; }
    .phone-wrap .table-wrap table, .modal .table-wrap table { min-width: 0; }

    /* Modaler fylder skærmen på mobil */
    .modal-bg { padding: 0; }
    .modal { width: 100%; max-width: none; height: 100vh; max-height: 100vh; border-radius: 0; }

    .phone-wrap { grid-template-columns: 1fr; }
    .phone { width: 100%; max-width: none; }
  }

  /* AI-scan af faktura (mock) */
  .scan { padding: var(--space-4) var(--space-5); border-top: var(--stroke) solid var(--border-default); display: flex; flex-direction: column; gap: var(--space-3); }
  .scan-drop { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); border: var(--stroke) dashed var(--ui-grey-600); border-radius: var(--radius-overlay); cursor: pointer; transition: border-color var(--motion-base) var(--ease-standard), background-color var(--motion-base) var(--ease-standard); flex-wrap: wrap; }
  .scan-drop:hover, .scan-drop.over { border-color: var(--sec-navy-blue); background: var(--surface-subtle); }
  .scan-drop .ico { color: var(--sec-navy-blue); }
  .scan-drop > div:not(.scan-demos) { flex: 1; min-width: 240px; }
  .scan-demos { width: 100%; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .scan-result { border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
  .scan-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .scan-actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .scan-progress { height: 6px; background: var(--ui-grey-200); border-radius: 3px; overflow: hidden; }
  .scan-progress span { display: block; height: 100%; width: 40%; background: var(--sec-purple); animation: scanbar 1.2s var(--ease-standard) infinite; }
  @keyframes scanbar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .scan-progress span { animation: none; width: 100%; } }
  .form-grid label.conf-low input { background: var(--ui-purple-100); border-color: transparent; }
  .form-grid label .caption { float: right; color: var(--ui-purple-500); font-weight: 700; }

  /* Feedback-widget */
  .fb-btn { position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: 40; box-shadow: var(--shadow-overlay); }
  .fb-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(3,31,48,.92); display: grid; grid-template-columns: 1fr 360px; gap: var(--space-4); padding: var(--space-4); }
  .fb-overlay[hidden] { display: none; }
  .fb-stage { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
  .fb-tools { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; color: var(--sec-white); }
  .fb-tools .tlink { color: var(--sec-white); }
  .fb-tools .ftab { border-color: var(--sec-white); color: var(--sec-white); }
  .fb-tools .ftab.on { background: var(--sec-white); color: var(--sec-navy-blue); }
  .fb-title { font-weight: 700; }
  .fb-canvas-wrap { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; overflow: auto; }
  .fb-canvas-wrap canvas { max-width: 100%; max-height: 100%; border-radius: var(--radius-overlay); background: #fff; cursor: crosshair; touch-action: none; }
  .fb-overlay.noshot .fb-stage { opacity: .35; pointer-events: none; }
  .fb-form { background: var(--surface-card); border-radius: var(--radius-overlay); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); overflow: auto; }
  .fb-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .fb-list { display: flex; flex-direction: column; }
  .fb-item { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: var(--stroke) solid var(--ui-grey-300); }
  .fb-thumb { border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); overflow: hidden; background: var(--surface-subtle); padding: 0; cursor: pointer; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; }
  .fb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fb-noshot { cursor: default; }
  .fb-meta { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-1); }
  .fb-tags { display: flex; gap: var(--space-3); margin-bottom: var(--space-2); }
  .fb-svar { margin-top: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface-subtle); border-radius: var(--radius-overlay); }
  /* Adgangskode og velkomst */
  .gate { position: fixed; inset: 0; z-index: 80; background: var(--sec-navy-blue); display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  .gate[hidden] { display: none; }
  .gate-card { background: var(--surface-card); border-radius: var(--radius-overlay); padding: var(--space-7); width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-4); }
  .gate-wide { width: min(640px, 100%); }
  .gate-logo { width: 120px; height: auto; color: var(--sec-navy-blue); }
  .gate-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: var(--space-2); }
  html.gated .sidebar, html.gated .main, html.gated .fb-btn { visibility: hidden; }
  @media (max-width: 900px) {
    .fb-overlay { grid-template-columns: 1fr; overflow: auto; }
    .fb-item { grid-template-columns: 1fr; }
    .fb-btn { right: var(--space-3); bottom: var(--space-3); }
  }

  /* Print (PDF via browserens udskriv) */
  .print-only { display: none; }
  @media print {
    body > *:not(.print-only) { display: none !important; }
    .print-only { display: block; padding: 12mm; font-size: 11px; line-height: 16px; color: #000; }
    .print-only h1 { font-size: 16px; margin-bottom: 8px; }
    .print-only table { width: 100%; border-collapse: collapse; }
    .print-only th, .print-only td { border-bottom: 1px solid #999; padding: 3px 6px; text-align: left; background: none !important; color: #000; }
    .print-only .num { text-align: right; }
    .print-only .tlink, .print-only button { display: none; }
  }
</style>
</head>

  const icon = (name, cls = 'ico s') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  let S;

  Object.keys(D).forEach(k => { if (!(k in S)) S[k] = JSON.parse(JSON.stringify(D[k])); });

  };

  // ---------- opslag ----------
  const site = id => (S.sites || []).find(s => s.id === id) || {};

    const salg = (p.salgspris || 0) + (p.ekstraArbejde || 0);
    const udg = (p.udgifter || []).reduce((a, u) => a + (+u.beloeb || 0), 0);
    const fakt = (p.fakturering || []).filter(f => f.status === 'Faktureret').reduce((a, f) => a + (+f.beloeb || 0), 0);
    const dgB = salg ? (salg - (p.salgKost || 0)) / salg * 100 : null;

    return { salg, udg, fakt, rest: salg - fakt, dgB, dgF, timer };

  const STATUS_CLASS = { 'Opstart': 'opstart', 'Under udførsel': 'udf', 'Klar til fakturering': 'klar', 'Faktureret': 'fakt', 'Åben': 'aaben', 'Lukket til fakturering': 'klar', 'Afsluttet': 'fakt' };

  const siteLabel = (s, short) => {
    const o = typeof s === 'string' ? site(s) : (s || {});
    if (short) return o.kode || o.navn || o.id || '';

  };
  const INTERN_KATEGORIER = ['Ferie', 'Sygdom', 'Kursus', 'Afspadsering', 'Intern tid'];

    const o = typeof s === 'string' ? site(s) : (s || {});

  };
  const workdays = (year, month) => { // month 1-12
    let c = 0; const dt = new Date(year, month - 1, 1);
    while (dt.getMonth() === month - 1) { const wd = dt.getDay(); if (wd !== 0 && wd !== 6) c++; dt.setDate(dt.getDate() + 1); }

  };

  const subtasks = prdk => (S.serviceopgaver || []).filter(o => o.parent === prdk);

    const n = subtasks(prdk).map(o => +(o.id.split('-')[1] || 0)).reduce((a, b) => Math.max(a, b), 0) + 1;

    const esc = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

  };

    document.querySelectorAll('.print-only').forEach(x => x.remove());

  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); };

  // knap der åbnede modalen, når den lukkes (via lukkeknap, Annullér, Escape eller closeModal()).
  let lastFocused = null;
  const focusables = m => $$('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', m)
    .filter(el => el.offsetParent !== null);
  const trapKeydown = e => {
    if (e.key !== 'Tab') return;
    const m = e.currentTarget;
    const f = focusables(m);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  const openModal = id => {
    lastFocused = document.activeElement;
    $$('.modal-bg.open').forEach(x => { if (x.id !== id) x.classList.remove('open'); });
    const m = $('#' + id); m.classList.add('open');
    const f = m.querySelector('input:not([readonly]), select, button.cta') || focusables(m)[0];
    if (f) f.focus();
    if (!m._trapBound) { m._trapBound = true; m.addEventListener('keydown', trapKeydown); }
  };
  const closeModal = id => {
    const m = $('#' + id); m.classList.remove('open');
    if (lastFocused && document.body.contains(lastFocused) && lastFocused.closest('.modal-bg') !== m) { lastFocused.focus(); }
    lastFocused = null;
  };
  const confirmDialog = text => Promise.resolve(window.confirm(text));

  // ---------- sider ----------
  const pages = [];
  const GROUP_ORDER = ['Projekter', 'Service', 'Økonomi', 'Stamdata', 'Rapporter'];
  let currentProj = null;

  function registerPage(p) { pages.push(p); }
  const getPage = id => pages.find(p => p.id === id) || null;

  function visiblePages() {
    const r = role();
    return pages.filter(p => !p.roles || p.roles.includes(r)).sort((a, b) => (a.order || 99) - (b.order || 99));
  }

  function mount() {
    const main = $('#main');
    pages.forEach(p => {
      if ($('#page-' + p.id)) return;
      const sec = document.createElement('section');
      sec.className = 'page'; sec.id = 'page-' + p.id; sec.innerHTML = p.html || '';
      main.appendChild(sec);
      // modaler skal kunne åbnes fra andre sider (fx projektkortets "Fakturakladde"-knap), så de må
      // ikke sidde inde i en skjult .page-sektion (display:none på forælder slår position:fixed ihjel).
      $$('.modal-bg', sec).forEach(m => document.body.appendChild(m));
      if (p.init) p.init();
      p._mounted = true;
    });
    $$('[data-close]').forEach(b => { if (!b._bound) { b._bound = true; b.addEventListener('click', () => closeModal(b.closest('.modal-bg').id)); } });
  }

  function renderNav() {
    const nav = $('#nav'); nav.innerHTML = '';
    const vis = visiblePages();
    GROUP_ORDER.forEach(g => {
      const items = vis.filter(p => (p.group || 'Projekter') === g && !p.hidden);
      if (!items.length) return;
      const lbl = document.createElement('div'); lbl.className = 'nav-label'; lbl.textContent = g; nav.appendChild(lbl);
      items.forEach(p => {
        const b = document.createElement('button'); b.className = 'nav-btn'; b.dataset.page = p.id;
        b.innerHTML = `${icon(p.icon || 'screen', 'ico')}<span class="lbl">${h(p.label)}</span>${p.id === 'indbakke' ? '<span class="count" id="inboxCount">0</span>' : ''}`;
        b.addEventListener('click', () => go(p.id));
        nav.appendChild(b);
      });
    });
    // projektkort-genvej (skjult side) vises når et projekt er åbent
    const pk = vis.find(p => p.id === 'projekt');
    if (pk && currentProj) {
      const b = document.createElement('button'); b.className = 'nav-btn'; b.dataset.page = 'projekt';
      b.innerHTML = `${icon('calendar-check', 'ico')}<span class="lbl">${h(currentProj)}</span>`;
      b.addEventListener('click', () => go('projekt'));
      const first = nav.querySelector('.nav-label + .nav-btn + .nav-btn') || nav.firstChild.nextSibling.nextSibling;
      nav.insertBefore(b, first ? first.nextSibling : null);
    }
    save();
  }

  function go(pageId) {
    const p = pages.find(x => x.id === pageId);
    if (!p) return;
    if (p.roles && !p.roles.includes(role())) { toast('Denne visning er ikke tilgængelig for din rolle'); return; }
    $$('.page').forEach(s => s.classList.toggle('active', s.id === 'page-' + pageId));
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
    if (p.render) p.render();
    window.scrollTo(0, 0);
    S.lastPage = pageId; save();
  }

  function openProject(id) { currentProj = id; renderNav(); go('projekt'); }

  function defaultPage() {
    const r = role();
    const pref = { Tekniker: 'tid', Fakturering: 'fakturering', Service: 'service', Chef: 'projekter' }[r] || 'indbakke';
    const vis = visiblePages();
    return (vis.find(p => p.id === pref) || vis[0]).id;
  }

  // ---------- bruger / roller ----------
  function initUser() {
    const us = $('#userSel'); us.innerHTML = '';
    D.medarbejdere.forEach(m => us.add(new Option(`${m.navn} (${m.rolle})`, m.id)));
    us.value = S.user;
    us.addEventListener('change', () => { S.user = us.value; save(); renderNav(); go(defaultPage()); });
    $('#resetDemo').addEventListener('click', () => { try { localStorage.removeItem(STATE_KEY); } catch (e) {} location.reload(); });
  }

  // Escape lukker åbne dialoger (og sender fokus tilbage til den knap der åbnede dem)
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal-bg.open').forEach(m => closeModal(m.id)); });

  // Space/Enter aktiverer rækker og listeelementer med klik-handling (tabindex="0")
  document.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Spacebar' && e.key !== 'Enter') return;
    const el = e.target.closest('tr.click[tabindex], .my-cases li[tabindex], [data-site][tabindex]');
    if (!el) return;
    if (e.key !== 'Enter') e.preventDefault(); // undgå sidescroll ved mellemrum
    el.click();
  });

  // Enter i et frit søgefelt (ikke i en formular) trigger søgningen med det samme i stedet for at vente på debounce
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!e.target.matches('input[type=text]') || e.target.closest('form')) return;
    e.target.dispatchEvent(new Event('input', { bubbles: true }));
  });

  // Generisk formular-validering: viser en toast med hvilket felt der mangler, i stedet for kun browserens standardboble
  document.addEventListener('submit', e => {
    const form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    const invalid = form.querySelector(':invalid');
    if (!invalid) return;
    e.preventDefault(); e.stopImmediatePropagation();
    let label = invalid.closest('label');
    let felt = '';
    if (label) {
      const clone = label.cloneNode(true);
      $$('input,select,textarea', clone).forEach(el => el.remove());
      felt = clone.textContent.trim();
    }
    if (!felt) felt = invalid.getAttribute('aria-label') || invalid.placeholder || invalid.name || 'et påkrævet felt';
    toast(`Udfyld ${felt.replace(/:$/, '').toLowerCase()} for at fortsætte`);
    invalid.focus();
  }, true);

  window.App = {
    D, S, save, $, $$, kr, n, pct, h, today, now, icon, st, dgCell, site, bc, emp, proj, calc, role,
    toast, openModal, closeModal, confirmDialog, go, openProject, registerPage, getPage,
    siteLabel, INTERN_KATEGORIER, isIntern, pris, workdays, expectedHours, subtasks, nextSubtaskId, csvDownload, printSection,
    get currentProj() { return currentProj; },
    icons: ['feed', 'screen', 'calendar-check', 'mobile', 'home', 'check', 'close', 'export', 'search', 'service', 'user', 'time', 'mail', 'notification', 'download', 'info', 'shield-check', 'location'],
  };

  document.addEventListener('DOMContentLoaded', () => {
    initUser(); mount(); renderNav();
    const start = S.lastPage && visiblePages().find(p => p.id === S.lastPage && p.id !== 'projekt') ? S.lastPage : defaultPage();
    go(start);
  });
})();

</script>

  render() {

        <td>${h(i.model)}</td><td>${h(i.salg)}</td>

        <td><button class="tlink" data-assign="${i.id}">Tildel</button></td>

    $$('[data-assign]', tb).forEach(b => b.addEventListener('click', () => this.openAssign(b.dataset.assign)));
  },
});

<script>
// Projektoverblik. Erstatter "Projekter"-arket i begge xlsm-filer.

// Fælles fabrik til at oprette projekter – bruges herfra og fra pages/indbakke.js,
// så begge steder opretter projekter med samme struktur (stamdata, tomme lister, opstartslog).
window.ProjectFactory = {
  create(opts) {
    const { S, today, now } = App;
    const id = 'PRDK00' + S.nextPrdk;
    const p = {
      id, navn: opts.navn, siteId: opts.siteId, stedNr: opts.stedNr || '', opportunity: opts.opportunity,
      type: opts.type, model: opts.model || 'Kontant', pm: opts.pm, se: '', ul: opts.ul || '', afdeling: opts.afdeling,
      status: 'Opstart', oprettet: today(), maaned: today().slice(0, 7), rekvirent: opts.rekvirent || '', ref: opts.ref || '', wo: opts.wo || '',
      salgspris: opts.salgspris || 0, ekstraArbejde: 0,
      salgKost: opts.salgKost != null ? opts.salgKost : Math.round((opts.salgspris || 0) * 0.65),
      mdlRate: opts.mdlRate || 0, loebetid: opts.loebetid || 0,
      udgifter: [], fakturering: [],
      log: [{ dato: now(), tekst: opts.logTekst || 'Oprettelse af sag samt overdragelse af projekt', af: S.user, pmTid: 0.5, seTid: 0, ulTid: 0 }],
    };
    S.projekter.unshift(p);
    S.nextPrdk++;
    return p;
  },
};

App.registerPage({
  id: 'projekter', label: 'Projektoverblik', group: 'Projekter', icon: 'screen', order: 20,
  roles: ['Chef', 'PM', 'Fakturering'],
  html: `
    <div class="page-head">

      </div>
      <div class="replaces">Erstatter <b>Projekter</b>-arket i Genneralle projekter.xlsm og Projekter Novo.xlsm</div>

        <label class="field">Måned <input type="text" id="fMaaned" placeholder="2026-03" size="8"></label>

        <span class="spacer"></span>
        <button class="btn primary" id="btnNewCase">Ny sag</button>
        <button class="btn" id="btnExport"><svg class="ico s"><use href="#i-export"/></svg>Eksportér til Excel</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Projekt</th><th>Kunde</th><th>Type</th><th>Afdeling</th><th>PM</th><th>Status</th>
            <th class="num">Salg total</th><th class="num">Kostpris</th><th class="num">Udgifter</th><th class="num">DG beregnet</th><th class="num">DG faktisk</th><th class="num">Faktureret</th><th class="num">Rest</th>
          </tr></thead>
          <tbody id="projRows"></tbody>
          <tfoot><tr id="projSum"></tr></tfoot>
        </table>
      </div>
    </div>

    <div class="modal-bg" id="modalNewCase">
      <div class="modal" role="dialog" aria-labelledby="newCaseTitle">
        <header><h2 id="newCaseTitle">Ny sag</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid" style="margin-bottom:18px">
            <label>Site<select id="ncSiteSel"></select></label>
          </div>
          <div class="form-grid" id="ncNewSite" style="margin-bottom:18px">
            <label>Kunde<input type="text" id="ncKunde"></label>
            <label>Site-navn<input type="text" id="ncSiteNavn"></label>
            <label>Site-kode<input type="text" id="ncSiteKode" placeholder="fx GSBC (valgfrit)"></label>
            <label>Adresse<input type="text" id="ncAdresse"></label>
            <label>Postnr.<input type="text" id="ncPostnr"></label>
            <label>By<input type="text" id="ncBy"></label>
          </div>
          <div class="form-grid" style="margin-bottom:18px">
            <label>Sted nr. (AS400)<input type="text" id="ncStedNr"></label>
            <label class="auto">BC-opslag<input type="text" id="ncBcPreview" readonly></label>
            <label>Opportunity<input type="text" id="ncOpportunity" placeholder="DK-O-…"></label>
            <label>Beskrivelse<input type="text" id="ncBeskrivelse"></label>
            <label>Installationstype<select id="ncType"><option>AIA</option><option>ADK</option><option>TVO</option><option>KOMBI</option><option>ANDET</option></select></label>
            <label>Model<select id="ncModel"><option>Kontant</option><option>Solution</option></select></label>
            <label>Afdeling<select id="ncAfdeling"><option>Generel</option><option>Novo</option></select></label>

            <label>Salgspris (kr.)<input type="number" id="ncSalgspris" step="1"></label>

        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="ncOk">Opret sag</button></footer>

  `,
  init() {
    const { $, $$, D, S, site, bc, save, toast, openModal, closeModal, openProject, h, siteLabel } = App;
    const fPm = $('#fPm');
    D.medarbejdere.filter(m => m.rolle === 'PM').forEach(m => fPm.add(new Option(m.navn, m.id)));
    ['#fPm', '#fStatus', '#fMaaned', '#fSearch'].forEach(s => $(s).addEventListener('input', () => this.render()));
    $$('#fAfd .ftab').forEach(b => b.addEventListener('click', () => { S.fAfd = b.dataset.v; App.save(); this.render(); }));
    $('#btnExport').addEventListener('click', () => toast('Kun i den færdige løsning: her downloades listen som Excel-fil'));

    const ncPm = $('#ncPm');
    D.medarbejdere.filter(m => m.rolle === 'PM').forEach(m => ncPm.add(new Option(`${m.navn} (${m.afdeling})`, m.id)));

    $('#btnNewCase').addEventListener('click', () => {

        navn: `${s.navn} – ${beskrivelse}`, siteId: s.id, stedNr: s.stedNr, opportunity,
        type: $('#ncType').value, model: $('#ncModel').value, pm: ncPm.value, ul: s.ul || '',
        afdeling: $('#ncAfdeling').value, rekvirent: s.kontakt || '', salgspris: +$('#ncSalgspris').value || 0,

      });

    });
  },
  render() {
    const { $, $$, S, site, emp, calc, kr, h, st, dgCell, pct, openProject, siteLabel } = App;
    $$('#fAfd .ftab').forEach(x => x.classList.toggle('on', x.dataset.v === (S.fAfd || '')));
    const q = $('#fSearch').value.trim().toLowerCase();
    const rows = S.projekter.filter(p => {
      if (S.fAfd && p.afdeling !== S.fAfd) return false;
      if ($('#fPm').value && p.pm !== $('#fPm').value) return false;
      if ($('#fStatus').value && p.status !== $('#fStatus').value) return false;
      if ($('#fMaaned').value && !(p.maaned || '').startsWith($('#fMaaned').value)) return false;
      if (q) {
        const s = site(p.siteId);
        const hay = [p.id, p.navn, s.kunde, s.kode, s.navn, ...p.udgifter.flatMap(u => [u.faktura, u.leverandoer, u.ydelse, u.beloeb]), ...p.fakturering.map(f => f.tekst)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const tot = { salg: 0, kost: 0, udg: 0, fakt: 0, rest: 0 };
    $('#projRows').innerHTML = rows.map(p => {
      const c = calc(p); tot.salg += c.salg; tot.kost += p.salgKost || 0; tot.udg += c.udg; tot.fakt += c.fakt; tot.rest += c.rest;
      const s = site(p.siteId);
      return `<tr class="click" data-open="${p.id}" tabindex="0">
        <td><b>${p.id}</b><br><span class="muted">${h(p.navn)}</span></td>
        <td>${h(s.kunde)}<br><span class="muted">${h(siteLabel(s))}</span></td><td>${h(p.type)}</td><td>${h(p.afdeling)}</td><td>${h(emp(p.pm).navn)}</td><td>${st(p.status)}</td>
        <td class="num">${kr(c.salg)}</td><td class="num">${kr(p.salgKost)}</td><td class="num">${kr(c.udg)}</td>${dgCell(c.dgB)}${dgCell(c.dgF)}
        <td class="num">${kr(c.fakt)}</td><td class="num">${kr(c.rest)}</td></tr>`;
    }).join('') || '<tr><td colspan="13" class="empty">Ingen projekter matcher filteret. Ryd filtrene, eller opret en ny sag.</td></tr>';
    const dg = tot.salg ? (tot.salg - tot.udg) / tot.salg * 100 : null;
    $('#projSum').innerHTML = `<td colspan="6">${rows.length} projekter</td><td class="num">${kr(tot.salg)}</td><td class="num">${kr(tot.kost)}</td><td class="num">${kr(tot.udg)}</td><td class="num">${tot.salg ? pct((tot.salg - tot.kost) / tot.salg * 100) : '–'}</td>${dgCell(dg)}<td class="num">${kr(tot.fakt)}</td><td class="num">${kr(tot.rest)}</td>`;
    $$('[data-open]').forEach(r => {
      r.addEventListener('click', () => openProject(r.dataset.open));
    });
    const all = S.projekter.map(calc);
    $('#projStats').innerHTML = [
      ['Aktive projekter', S.projekter.filter(p => p.status !== 'Faktureret' && p.status !== 'Afsluttet').length],
      ['Klar til fakturering', kr(S.projekter.flatMap(p => p.fakturering).filter(f => f.status === 'Klar til fakturering').reduce((a, f) => a + +f.beloeb, 0))],
      ['Rest at fakturere', kr(all.reduce((a, c) => a + c.rest, 0))],
      ['Nye sager i indbakken', S.indbakke.length],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');
  },
});

</script>

          <button class="btn primary" type="button" id="scBook">Bogfør udgift</button>

      const take = () => ({ faktura: $('#scFaktura').value.trim(), leverandoer: $('#scLev').value.trim(), ydelse: $('#scYdelse').value.trim(), beloeb: +$('#scNetto').value, dato: today(), bilag: r.fil, fakturadato: $('#scDato').value });
      $('#scBook').addEventListener('click', () => {
        const rec = take();
        if (!rec.faktura || !rec.leverandoer || !rec.beloeb) return toast('Udfyld faktura nr., leverandør og beløb før bogføring');
        p.udgifter.push(rec); save(); res.hidden = true; this.render(); toast(`Udgift fra ${rec.leverandoer} bogført på ${p.id} med bilag`);
      });
      $('#scToForm').addEventListener('click', () => {
        const rec = take(); const form = $('#udgForm');
        form.faktura.value = rec.faktura; form.leverandoer.value = rec.leverandoer; form.ydelse.value = rec.ydelse; form.beloeb.value = rec.beloeb;
        res.hidden = true; form.faktura.focus(); toast('Felter overført. Kontrollér og bogfør.');
      });
      $('#scCancel').addEventListener('click', () => { res.hidden = true; });
    };
    const runScan = r => {
      const res = $('#scanResult'); res.hidden = false;
      res.innerHTML = `<div class="scan-head"><b>Scanner ${h(r.fil)}</b><span class="muted caption">Læser faktura nr., leverandør, linjer og beløb</span></div><div class="scan-progress"><span></span></div>`;
      setTimeout(() => showScan(r), 1200);
    };
    const drop = $('#scanDrop'), fileIn = $('#scanFile');
    drop.addEventListener('click', e => { if (!e.target.closest('[data-demo]')) fileIn.click(); });
    drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
    fileIn.addEventListener('change', () => { if (fileIn.files[0]) runScan(guessFromFile(fileIn.files[0])); fileIn.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) runScan(guessFromFile(f)); });
    $$('[data-demo]', drop).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); runScan({ ...DEMOS[b.dataset.demo] }); }));

    $('#fakForm').addEventListener('submit', e => {
      e.preventDefault(); const fd = new FormData(e.target); const p = cur();
      if (fakEditIdx != null) {
        const old = p.fakturering[fakEditIdx];
        old.tekst = fd.get('tekst'); old.rekv = fd.get('rekv'); old.beloeb = +fd.get('beloeb');
        fakEditIdx = null; e.target.querySelector('button[type=submit]').textContent = 'Tilføj linje';
        toast('Faktureringslinje opdateret');
      } else {
        p.fakturering.push({ tekst: fd.get('tekst'), rekv: fd.get('rekv'), beloeb: +fd.get('beloeb'), status: 'Under udførsel', dato: '', initialer: '' });
      }
      save(); e.target.reset(); this.render();
    });
    $('#logForm').addEventListener('submit', e => {
      e.preventDefault(); const fd = new FormData(e.target); const p = cur();
      p.log.unshift({ dato: now(), tekst: fd.get('tekst'), af: S.user, pmTid: +fd.get('pmTid'), seTid: +fd.get('seTid'), ulTid: +fd.get('ulTid') });
      save(); e.target.reset(); this.render();
    });
    $('#btnAfslut').addEventListener('click', () => {
      const p = cur(); const s = site(p.siteId);
      const saOpts = ['Serviceaftale 1', 'Serviceaftale 2', 'Serviceaftale 4', 'Novo rammeaftale', 'Ingen'];
      $('#afInstallation').value = s.installation || p.type || '';
      $('#afAnlaegList').innerHTML = s.anlaeg ? `<option value="${h(s.anlaeg)}">` : '';
      $('#afAnlaeg').value = s.anlaeg || '';
      $('#afServiceaftale').value = saOpts.includes(s.serviceaftale) ? s.serviceaftale : (p.afdeling === 'Novo' ? 'Novo rammeaftale' : 'Ingen');
      $('#afUl').value = s.ul || p.ul || '';
      $('#afTimepris').value = s.timepris || 0;
      $('#afKoersel').value = s.koersel || 0;
      $('#afEftersyn').value = s.eftersyn ? 'Ja' : 'Nej';
      $('#afEsMaaned').value = s.esMaaned || (new Date().getMonth() + 1);
      $('#afInterval').value = s.interval || 12;
      openModal('modalAfslut');
    });
    $('#afOk').addEventListener('click', () => {
      const p = cur(); const s = site(p.siteId);
      s.installation = $('#afInstallation').value.trim();
      s.anlaeg = $('#afAnlaeg').value.trim();
      s.serviceaftale = $('#afServiceaftale').value;
      s.ul = $('#afUl').value.trim();
      s.timepris = +$('#afTimepris').value || 0;
      s.koersel = +$('#afKoersel').value || 0;
      s.eftersyn = $('#afEftersyn').value === 'Ja';
      s.esMaaned = +$('#afEsMaaned').value || null;
      s.interval = +$('#afInterval').value || 12;
      s.sidsteEftersyn = today();
      p.status = 'Afsluttet';
      p.log.unshift({ dato: now(), tekst: 'Projekt afsluttet – serviceaftale oprettet/opdateret i kundekartotek', af: S.user, pmTid: 0.5, seTid: 0, ulTid: 0 });
      save(); closeModal('modalAfslut');
      toast(`${p.id} afsluttet – serviceaftale opdateret for ${s.id}`);
      App._highlightSite = s.id;
      App.go('kunder');
    });
    $('#btnSendFak').addEventListener('click', () => {
      const p = cur(), s = site(p.siteId), m = bc(p.stedNr);
      const lines = p.fakturering.filter(f => f.status === 'Klar til fakturering');
      $('#fakFra').value = emp(S.user).navn;
      $('#pdfPreview').innerHTML = `
        <div class="pdf-head"><b>Faktureringsanmodning</b><span class="muted">${p.id} · ${today()}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
        <dl>
          <dt>Kunde</dt><dd>${h(s.kunde)}</dd><dt>Account nr.</dt><dd>${m ? h(m.account) : '–'}</dd>
          <dt>Adresse</dt><dd>${h(App.siteLabel(s))}</dd><dt>Site nr.</dt><dd>${h(s.id)}</dd>
          <dt>Projekt nr.</dt><dd>${p.id}</dd><dt>Tilbuds nr.</dt><dd>${h(p.opportunity)}</dd>
          <dt>Costcenter</dt><dd>${m ? h(m.costcenter) : '–'}</dd><dt>Profitcenter</dt><dd>${m ? h(m.profitcenter) : '–'}</dd>
          <dt>TOS</dt><dd>${m ? h(m.tos) : '–'}</dd><dt>Rekvirent</dt><dd>${h(p.rekvirent) || '–'}</dd>
          <dt>WO</dt><dd>${h(p.wo) || '–'}</dd><dt>PO / rekv. nr.</dt><dd>${h(lines[0]?.rekv) || '–'}</dd>
        </dl>
        <table><thead><tr><th>Arbejdsbeskrivelse</th><th class="num">Beløb</th></tr></thead>
        <tbody>${lines.map(f => `<tr><td>${h(f.tekst)}</td><td class="num">${kr(f.beloeb)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Samlet pris ekskl. moms</td><td class="num">${kr(lines.reduce((a, f) => a + +f.beloeb, 0))}</td></tr></tfoot></table>
        <p class="caption muted" style="margin-top:18px">Alle felter ovenfor er hentet fra projektet. Ingen er tastet til denne anmodning.</p>`;
      openModal('modalFak');
    });
    $('#fakSend').addEventListener('click', () => {
      const p = cur();
      p.fakturering.forEach(f => { if (f.status === 'Klar til fakturering') { f.status = 'Faktureret'; f.dato = today(); f.initialer = S.user; } });
      p.log.unshift({ dato: now(), tekst: `Faktureringsanmodning sendt til ${$('#fakTil').value} (PDF via Outlook)`, af: S.user, pmTid: 0.5, seTid: 0, ulTid: 0 });
      if (p.fakturering.every(f => f.status === 'Faktureret')) p.status = 'Faktureret';
      save(); closeModal('modalFak'); this.render(); toast('Faktureringsanmodning sendt. Linjerne er markeret Faktureret.');
    });
  },
  render() {
    const { $, $$, S, proj, site, bc, emp, calc, kr, n, pct, h, st, save, toast, go, siteLabel, subtasks } = App;
    const p = proj(App.currentProj); if (!p) return go('projekter');
    const s = site(p.siteId), c = calc(p);
    const delopgaver = subtasks(p.id);
    $('#pId').textContent = `${p.id} · ${p.opportunity} · ${p.afdeling}`;
    $('#pNavn').textContent = p.navn;
    $('#pSub').textContent = `${s.kunde} · ${siteLabel(s)} · PM ${emp(p.pm).navn}`;
    $('#pStatus').value = p.status;
    $('#btnAfslut').disabled = p.status !== 'Faktureret';
    $('#pStats').innerHTML = [
      ['Salg total', kr(c.salg)], ['Udgifter', kr(c.udg)], ['DG beregnet', pct(c.dgB)], ['DG faktisk', pct(c.dgF)],
      ['Faktureret', kr(c.fakt)], ['Rest', kr(c.rest)], ['Teknikertimer', n(c.timer) + ' t'],
      ['Delopgaver', `${delopgaver.filter(o => o.status === 'Åben').length} åbne / ${delopgaver.length} i alt`],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

    // Stamdata
    const m = bc(p.stedNr);
    const f = (label, val, opts = {}) => `<label class="${opts.auto ? 'auto' : ''}">${label}<input type="${opts.type || 'text'}" value="${h(val)}" ${opts.name ? `name="${opts.name}"` : 'readonly'}></label>`;
    $('#stamForm').innerHTML = [
      f('Sted nr. (AS400)', p.stedNr, { name: 'stedNr' }),
      f('Sted navn', m ? m.stedNavn : (p.stedNr ? 'Ukendt sted nr.' : 'Indtast sted nr.'), { auto: true }),
      f('Costcenter', m ? `${m.costcenter} – ${m.costcenterNavn}` : '', { auto: true }),
      f('TOS', m ? `${m.tos} – ${m.tosNavn}` : '', { auto: true }),
      f('Account (DK-A)', m ? `${m.account} – ${m.accountNavn}` : '', { auto: true }),
      f('Profitcenter', m ? m.profitcenter : '', { auto: true }),
      f('Site (DK-S)', s.id, { auto: true }),
      f('Kunde', s.kunde, { auto: true }),
      f('Adresse', `${s.adresse}, ${s.postnr} ${s.by}`, { auto: true }),
      f('Site-kode', s.kode, { name: 'siteKode' }),
      f('Rekvirent', p.rekvirent, { name: 'rekvirent' }),
      f('Ref. / formålsnr.', p.ref, { name: 'ref' }),
      f('WO', p.wo, { name: 'wo' }),
      f('Installationstype', p.type, { auto: true }),
      f('Model', p.model + (p.model === 'Solution' ? ` (${p.loebetid} mdr. × ${kr(p.mdlRate)})` : ''), { auto: true }),
      f('Underleverandør', p.ul, { name: 'ul' }),
      f('Salgspris', p.salgspris, { name: 'salgspris', type: 'number' }),
      f('Ekstra arbejde', p.ekstraArbejde, { name: 'ekstraArbejde', type: 'number' }),
      f('Salg kostpris', p.salgKost, { name: 'salgKost', type: 'number' }),
    ].join('');
    $$('#stamForm input[name]').forEach(i => i.addEventListener('change', () => {
      if (i.name === 'siteKode') { s.kode = i.value.trim(); save(); this.render(); return; }
      p[i.name] = i.type === 'number' ? +i.value : i.value; save(); this.render();
      if (i.name === 'stedNr') toast(bc(i.value) ? 'Stamdata hentet fra Business Central-mapping' : 'Sted nr. findes ikke i mappingen');
    }));

    // Udgifter
    $('#udgRows').innerHTML = p.udgifter.map((u, i) => `<tr><td>${h(u.faktura)}${u.bilag ? `<br><span class="caption muted">Bilag: ${h(u.bilag)}</span>` : ''}</td><td>${h(u.leverandoer)}</td><td>${h(u.ydelse)}</td><td class="num">${kr(u.beloeb)}</td><td class="muted">${h(u.dato)}</td>
      <td><button class="tlink" data-udgedit="${i}">Rediger</button> <button class="tlink" data-udgdel="${i}">Slet</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Ingen udgifter endnu.</td></tr>';
    $('#udgSum').innerHTML = `<td colspan="3">Total</td><td class="num">${kr(c.udg)}</td><td></td><td></td>`;
    $$('[data-udgedit]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.udgedit; const u = p.udgifter[i]; udgEditIdx = i;
      const form = $('#udgForm');
      form.faktura.value = u.faktura; form.leverandoer.value = u.leverandoer; form.ydelse.value = u.ydelse; form.beloeb.value = u.beloeb;
      form.querySelector('button[type=submit]').textContent = 'Gem ændring';
    }));
    $$('[data-udgdel]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.udgdel;
      App.confirmDialog('Slet udgiften?').then(ok => { if (!ok) return; p.udgifter.splice(i, 1); save(); this.render(); toast('Udgift slettet'); });
    }));

    // Fakturering
    $('#fakRows').innerHTML = p.fakturering.map((fl, i) => `<tr><td>${h(fl.tekst)}</td><td>${h(fl.rekv)}</td><td class="num">${kr(fl.beloeb)}</td>
      <td>${fl.status === 'Faktureret' ? st(fl.status) : `<select data-fstat="${i}" aria-label="Status"><option${fl.status === 'Under udførsel' ? ' selected' : ''}>Under udførsel</option><option${fl.status === 'Klar til fakturering' ? ' selected' : ''}>Klar til fakturering</option></select>`}</td>
      <td class="muted">${h(fl.dato)}</td><td>${h(fl.initialer)}</td>
      <td>${fl.status === 'Faktureret' ? '' : `<button class="tlink" data-fakedit="${i}">Rediger</button> <button class="tlink" data-fakdel="${i}">Slet</button>`}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Ingen faktureringslinjer endnu.</td></tr>';
    $('#fakSum').innerHTML = `<td colspan="2">Faktureret ${kr(c.fakt)} · Rest ${kr(c.rest)}</td><td class="num">${kr(p.fakturering.reduce((a, x) => a + +x.beloeb, 0))}</td><td colspan="4"></td>`;
    $$('[data-fstat]').forEach(sel => sel.addEventListener('change', () => { p.fakturering[+sel.dataset.fstat].status = sel.value; save(); this.render(); }));
    $('#btnSendFak').disabled = !p.fakturering.some(x => x.status === 'Klar til fakturering');
    $$('[data-fakedit]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.fakedit; const fl = p.fakturering[i]; fakEditIdx = i;
      const form = $('#fakForm');
      form.tekst.value = fl.tekst; form.rekv.value = fl.rekv; form.beloeb.value = fl.beloeb;
      form.querySelector('button[type=submit]').textContent = 'Gem ændring';
    }));
    $$('[data-fakdel]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.fakdel;
      App.confirmDialog('Slet faktureringslinjen?').then(ok => { if (!ok) return; p.fakturering.splice(i, 1); save(); this.render(); toast('Faktureringslinje slettet'); });
    }));

    // Delopgaver
    const timerForDelopg = id => S.tid.filter(t => t.sag === id).reduce((a, t) => a + (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0), 0);
    $('#delopgRows').innerHTML = delopgaver.map(o => {
      const canLuk = o.status === 'Åben';
      const canGenaabn = o.status === 'Lukket til fakturering';
      return `<tr>
        <td><b>${h(o.id)}</b></td>
        <td>${h(o.beskrivelse)}</td>
        <td>${h(o.type || 'Service')}</td>
        <td>${h(emp(o.tekniker).navn)}</td>
        <td>${st(o.status)}</td>
        <td class="num">${n(timerForDelopg(o.id))}</td>
        <td class="num">${o.kladde ? kr(o.kladde.total) : '–'}</td>
        <td>
          <button class="tlink" data-act="kladde" data-id="${h(o.id)}">Fakturakladde</button> ·
          ${canLuk ? `<button class="tlink" data-act="luk" data-id="${h(o.id)}">Luk til fakturering</button> · ` : ''}
          ${canGenaabn ? `<button class="tlink" data-act="genaabn" data-id="${h(o.id)}">Genåbn</button> · ` : ''}
          <button class="tlink" data-act="rediger" data-id="${h(o.id)}">Rediger</button>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" class="empty">Ingen delopgaver på projektet endnu. Opret den første med "Ny delopgave".</td></tr>';

    // Tid og log (inkl. timer registreret på delopgaver)
    const rows = S.tid.filter(t => t.sag === p.id || (t.sag || '').startsWith(p.id + '-')).sort((a, b) => b.dato.localeCompare(a.dato));
    const sum = k => rows.reduce((a, t) => a + (+t[k] || 0), 0);
    $('#tidRows').innerHTML = rows.map(t => `<tr><td>${t.dato}</td><td>${h(t.sag)}</td><td>${h(emp(t.tekniker).navn)}</td><td class="num">${n(t.timer)}</td><td class="num">${n(t.ot1)}</td><td class="num">${n(t.ot2)}</td><td class="num">${n(t.koersel)}</td><td>${h(t.udfoert)}</td><td class="muted">${(t.materialer || []).map(x => `${x.antal} × ${h(x.model)}`).join(', ')}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">Ingen teknikertimer registreret på sagen.</td></tr>';
    $('#tidSum').innerHTML = `<td colspan="3">Total</td><td class="num">${n(sum('timer'))}</td><td class="num">${n(sum('ot1'))}</td><td class="num">${n(sum('ot2'))}</td><td class="num">${n(sum('koersel'))}</td><td colspan="2"></td>`;
    $('#logRows').innerHTML = p.log.map((l, i) => `<li><time>${h(l.dato)}</time><span>${h(l.tekst)}</span><span class="who">${h(emp(l.af).navn)} · PM ${n(l.pmTid)} t / SE ${n(l.seTid)} t / UL ${n(l.ulTid)} t${l.af === S.user ? ` · <button class="tlink" data-logdel="${i}">Slet</button>` : ''}</span></li>`).join('');
    $$('[data-logdel]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.logdel;
      App.confirmDialog('Slet log-posten?').then(ok => { if (!ok) return; p.log.splice(i, 1); save(); this.render(); toast('Log-post slettet'); });
    }));
  },
});

</script>
<script>
// Tidsregistrering – teknikerens telefon. Erstatter Tids_registrering og teknikerarkene.
App.registerPage({
  id: 'tid', label: 'Tidsregistrering', group: 'Service', icon: 'mobile', order: 40,
  html: `
    <div class="page-head">
      <div>
        <h1>Tidsregistrering – teknikerens telefon</h1>
        <p>Teknikeren vælger en af sine åbne sager – eller registrerer intern tid (ferie, sygdom, kursus m.m.). Kunde og adresse følger med fra sagen, så der kun tastes timer, udført arbejde og materialer.</p>
      </div>
      <div class="replaces">Erstatter <b>Tids_registrering</b> og de seks teknikerark</div>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <div class="app-bar"><div><b>Mine opgaver</b><small id="techName"></small></div><svg aria-label="Securitas"><use href="#logo-white"/></svg></div>
          <div class="content">
            <div class="field">Tekniker<select id="techSel"></select></div>
            <div class="field">Registrér på
              <div class="ftabs" id="regMode">
                <button type="button" class="ftab on" data-mode="sag">Sag</button>
                <button type="button" class="ftab" data-mode="intern">Intern tid</button>
              </div>
            </div>
            <div class="field" id="caseField">Mine åbne sager<ul class="my-cases" id="myCases"></ul></div>
            <div class="field" id="internField" hidden>Kategori<ul class="my-cases" id="internCats"></ul></div>
            <div class="site-chip" id="siteChip">Vælg en sag</div>
            <div class="field">Dato<input type="date" id="tDato"></div>
            <div class="row">
              <div class="field">Timer<input type="number" id="tTimer" step="0.5" value="7.5"></div>
              <div class="field">OT 1<input type="number" id="tOt1" step="0.5" value="0"></div>
              <div class="field">OT 2<input type="number" id="tOt2" step="0.5" value="0"></div>
              <div class="field" id="koerselField">Kørsel<input type="number" id="tKoersel" step="1" value="1"></div>
            </div>
            <div class="field">Udført<textarea id="tUdfoert" rows="3" placeholder="Hvad blev lavet?"></textarea></div>
            <div class="field" id="matField">Materialer der ikke er købt til sagen
              <div class="mat">
                <select id="mType"></select>
                <select id="mModel"></select>
                <input type="number" id="mAntal" value="1" min="1" aria-label="Antal">
                <button class="tlink" type="button" id="mAdd">Tilføj</button>
              </div>
              <div class="mat-list" id="matList"></div>
            </div>
            <button class="btn cta" id="tGem">Gem registrering</button>
          </div>
        </div>
      </div>
      <div class="side-note">
        <h2>Hvad sker der bag skærmen</h2>
        <ul>
          <li>Sagen (PRDK eller CAS) bærer selv kunde, adresse, sted nr. og PO. Teknikeren taster det aldrig.</li>
          <li>Registreringen lander direkte på projektkortets fane <b>Tid og log</b> og i kontering af timer.</li>
          <li>Intern tid (ferie, sygdom, kursus, afspadsering) tælles med i kontering og "denne måned", men vises aldrig i sags- eller faktureringslister.</li>
          <li>Materialer tages fra det fælles katalog (Materiale liste) og kan bruges til efterfakturering.</li>
          <li>Når en serviceopgave lukkes, går den til <b>Til fakturering</b> uden at nogen kopierer rækker.</li>
        </ul>
        <h2>Denne måned <small id="monthLabel"></small></h2>
        <div class="stats" id="monthStats"></div>
        <h2>Seneste registreringer</h2>
        <div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Dato</th><th>Sag</th><th>Tekniker</th><th class="num">Timer</th></tr></thead>
          <tbody id="recentTid"></tbody>
        </table></div></div>
      </div>
    </div>
  `,
  init() {
    const { $, $$, D, S, save, toast, today, h } = App;
    const techSel = $('#techSel');
    D.medarbejdere.filter(m => m.rolle === 'Tekniker').forEach(m => techSel.add(new Option(m.navn, m.id)));
    this.mode = 'sag'; this.selCase = null; this.selKat = null;
    $('#tDato').value = today();
    const mType = $('#mType'), mModel = $('#mModel');
    Object.keys(D.materialer).forEach(k => mType.add(new Option(k, k)));
    const fillModels = () => { mModel.innerHTML = ''; (D.materialer[mType.value] || []).forEach(m => mModel.add(new Option(m, m))); };
    mType.addEventListener('change', fillModels); fillModels();
    techSel.addEventListener('change', () => { this.selCase = null; this.selKat = null; this.render(); });

    $$('#regMode .ftab').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.mode === this.mode) return;
      this.mode = b.dataset.mode;
      if (this.mode === 'intern') { if (!this.selKat) this.selKat = App.INTERN_KATEGORIER[0]; $('#tTimer').value = this.selKat === 'Intern tid' ? 3 : 7.4; }
      this.render();
    }));

    const renderMats = () => {
      $('#matList').innerHTML = this.mats.map((m, i) => `<div class="item"><span>${m.antal} × ${h(m.type)} · ${h(m.model)}</span><button class="tlink" data-rm="${i}">Fjern</button></div>`).join('');
      $$('[data-rm]').forEach(b => b.addEventListener('click', () => { this.mats.splice(+b.dataset.rm, 1); renderMats(); }));
    };
    this.mats = [];
    $('#mAdd').addEventListener('click', () => { this.mats.push({ type: mType.value, model: mModel.value, antal: +$('#mAntal').value || 1 }); renderMats(); });

    $('#tGem').addEventListener('click', () => {
      const dato = $('#tDato').value, timer = +$('#tTimer').value, ot1 = +$('#tOt1').value, ot2 = +$('#tOt2').value;
      if (this.mode === 'sag') {
        if (!this.selCase) return toast('Vælg en sag først');
        if (!$('#tUdfoert').value.trim()) return toast('Skriv hvad der blev udført, før du gemmer');
        S.tid.push({ dato, sag: this.selCase, tekniker: techSel.value, timer, ot1, ot2, koersel: +$('#tKoersel').value, udfoert: $('#tUdfoert').value.trim(), materialer: this.mats });
        this.mats = []; renderMats(); $('#tUdfoert').value = ''; save(); this.render();
        toast(`Gemt på ${this.selCase}. Timerne vises nu på projektkortet.`);
      } else {
        if (!this.selKat) return toast('Vælg en kategori først');
        const udfoert = $('#tUdfoert').value.trim() || this.selKat;
        S.tid.push({ dato, sag: 'Intern', kategori: this.selKat, tekniker: techSel.value, timer, ot1: 0, ot2: 0, koersel: 0, udfoert, materialer: [] });
        $('#tUdfoert').value = ''; save(); this.render();
        toast(`Gemt som intern tid – ${this.selKat}.`);
      }
    });
  },
  myCases(tech) {
    const { S, emp } = App;
    const t = emp(tech);
    const ps = S.projekter.filter(p => p.status !== 'Faktureret' && (p.afdeling === t.afdeling || S.tid.some(x => x.sag === p.id && x.tekniker === tech))).map(p => ({ id: p.id, navn: p.navn, siteId: p.siteId, kind: 'Projekt' }));
    const cs = (S.serviceopgaver || []).filter(c => c.tekniker === tech && c.status === 'Åben' && !c.parent).map(c => ({ id: c.id, navn: c.beskrivelse, siteId: c.siteId, kind: 'Service' }));
    const subs = (S.serviceopgaver || []).filter(c => c.tekniker === tech && c.status === 'Åben' && c.parent).map(c => {
      const parentP = (S.projekter || []).find(pp => pp.id === c.parent);
      return { id: c.id, navn: c.beskrivelse || (parentP ? parentP.navn : ''), siteId: c.siteId, kind: 'Delopgave' };
    });
    return [...cs, ...subs, ...ps];
  },
  render() {
    const { $, $$, S, site, siteLabel, emp, h, n, isIntern, INTERN_KATEGORIER, expectedHours } = App;
    const techSel = $('#techSel');
    // Er den aktuelle bruger tekniker, vælges vedkommende automatisk
    if (emp(S.user).rolle === 'Tekniker' && techSel.value !== S.user) { techSel.value = S.user; this.selCase = null; this.selKat = null; }
    const tech = techSel.value; $('#techName').textContent = emp(tech).navn;

    // ---- registrér-på tabs ----
    $$('#regMode .ftab').forEach(b => b.classList.toggle('on', b.dataset.mode === this.mode));
    $('#caseField').hidden = this.mode !== 'sag';
    $('#internField').hidden = this.mode !== 'intern';
    $('#koerselField').hidden = this.mode === 'intern';
    $('#matField').hidden = this.mode === 'intern';

    // ---- sagsliste ----
    const cases = this.myCases(tech);
    if (this.mode === 'sag' && (!this.selCase || !cases.find(c => c.id === this.selCase))) this.selCase = cases[0]?.id || null;
    $('#myCases').innerHTML = cases.map(c => `<li class="${c.id === this.selCase ? 'sel' : ''}" data-case="${c.id}" tabindex="0"><b>${c.kind === 'Delopgave' ? `${c.kind} · ${c.id}` : `${c.id} · ${c.kind}`}</b>${h(c.navn)}<br><span class="muted">${h(siteLabel(c.siteId))}</span></li>`).join('') || '<li class="empty">Ingen åbne sager på denne tekniker. Vælg en anden tekniker, eller opret en serviceopgave.</li>';
    $$('[data-case]').forEach(li => li.addEventListener('click', () => { this.mode = 'sag'; this.selCase = li.dataset.case; this.render(); }));

    // ---- interne kategorier ----
    if (!this.selKat) this.selKat = INTERN_KATEGORIER[0];
    $('#internCats').innerHTML = INTERN_KATEGORIER.map(k => `<li class="${this.mode === 'intern' && k === this.selKat ? 'sel' : ''}" data-kat="${h(k)}" tabindex="0"><b>${h(k)}</b></li>`).join('');
    $$('[data-kat]').forEach(li => li.addEventListener('click', () => {
      this.selKat = li.dataset.kat;
      $('#tTimer').value = this.selKat === 'Intern tid' ? 3 : 7.4;
      this.render();
    }));

    // ---- site-chip ----
    if (this.mode === 'intern') {
      $('#siteChip').innerHTML = '<b>Securitas A/S · intern tid</b>';
    } else {
      const c = cases.find(x => x.id === this.selCase); const s = c ? site(c.siteId) : null;
      $('#siteChip').innerHTML = s ? `<b>${h(siteLabel(s))}</b>${h(s.postnr)} ${h(s.by)} · sted nr. ${h(s.stedNr) || '–'}` : 'Vælg en sag';
    }

    // ---- denne måned ----
    const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + 1;
    const prefix = `${y}-${String(m).padStart(2, '0')}`;
    const monthTid = S.tid.filter(t => t.tekniker === tech && (t.dato || '').startsWith(prefix));
    const sum = list => list.reduce((a, t) => a + (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0), 0);
    const internHours = sum(monthTid.filter(isIntern));
    const caseHours = sum(monthTid.filter(t => !isIntern(t)));
    const total = internHours + caseHours;
    const expected = expectedHours(y, m);
    const diff = Math.round((total - expected) * 10) / 10;
    $('#monthLabel').textContent = now.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' });
    $('#monthStats').innerHTML = `
      <div class="stat"><small>Sager</small><b>${n(caseHours)}</b></div>
      <div class="stat"><small>Intern tid</small><b>${n(internHours)}</b></div>
      <div class="stat"><small>Registreret i alt</small><b>${n(total)}</b></div>
      <div class="stat"><small>Forventet</small><b>${n(expected)}</b></div>
      <div class="stat"><small>Difference</small><b>${diff > 0 ? '+' : ''}${n(diff)}</b></div>
    `;

    // ---- seneste registreringer ----
    $('#recentTid').innerHTML = [...S.tid].sort((a, b) => b.dato.localeCompare(a.dato)).slice(0, 8).map(t => `<tr><td>${t.dato}</td><td>${isIntern(t) ? `Intern · ${h(t.kategori)}` : h(t.sag)}</td><td>${h(emp(t.tekniker).navn)}</td><td class="num">${n((+t.timer) + (+t.ot1) + (+t.ot2))}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Ingen registreringer endnu.</td></tr>';
  },
});

</script>

let kCurrentKunde = null;   // valgt kunde på kundeniveau
let kSearch = '';           // søgning på kundelisten
let kSiteSearch = '';       // søgning på kundeniveau
let kFilter = '';           // filter på "Alle sites"

App.registerPage({

          </div>
          <label class="field">Søg <input type="text" id="asSearch" placeholder="Kunde, site, adresse" size="28"></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Kode</th><th>Site (DK-S)</th><th>Kunde</th><th>Site-navn</th><th>Adresse</th><th>Sted nr.</th><th>Costcenter</th><th>TOS</th><th>Account</th>
              <th>Installation</th><th>Serviceaftale</th><th>UL</th><th class="num">Timepris</th><th>Eftersyn</th><th>Sidst opdateret</th><th class="num">Projekter</th>
            </tr></thead>
            <tbody id="siteRows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal-bg" id="modalSite">
      <div class="modal" role="dialog" aria-labelledby="siteTitle">
        <header><h2 id="siteTitle">Site</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid" id="siteDetail" style="margin-bottom:18px"></div>
          <h3 style="margin-bottom:8px">Projekter på sitet</h3>
          <ul class="log" id="siteProjects"></ul>
          <h3 style="margin:18px 0 8px">Serviceopgaver på sitet</h3>
          <ul class="log" id="siteCases"></ul>
        </div>
        <footer><button class="btn" data-close>Luk</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalNewKunde">
      <div class="modal" role="dialog" aria-labelledby="newKundeTitle">
