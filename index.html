<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sagsstyring – prototype</title>
<meta name="robots" content="noindex, nofollow">
<!-- Fallback per Securitas DS: Poppins er den nærmeste geometriske erstatning for Securitas Pro -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
  /* ==========================================================================
     Securitas Design System – tokens (fra claude.ai/design "Securitas Design System")
     Kilde: tokens/colors.css, typography.css, spacing.css, effects.css
     ========================================================================== */
  @font-face{font-family:"Securitas Pro";src:url("fonts/SecuritasPro-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Securitas Pro";src:url("fonts/SecuritasPro-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"Securitas Pro";src:url("fonts/SecuritasPro-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}

  :root {
    color-scheme: light;
    /* Brand */
    --sec-navy-blue:#031F30; --sec-red:#FC273F; --sec-purple:#8D5FFF; --sec-white:#FFFFFF;
    --sec-light-purple:#C2B4FC;
    /* UI ramps */
    --ui-blue-100:#ACC2DD; --ui-blue-200:#8EABCE; --ui-blue-300:#7599BF; --ui-blue-400:#587CAA; --ui-blue-500:#42638C;
    --ui-blue-600:#2E4869; --ui-blue-700:#172F48; --ui-blue-800:#031F30; --ui-blue-900:#011523;
    --ui-purple-100:#C2B4FC; --ui-purple-200:#AE97FD; --ui-purple-300:#9977FE; --ui-purple-400:#8D5FFF; --ui-purple-500:#6C47CF;
    --ui-red-400:#FC273F; --ui-red-500:#D31B3D; --ui-red-600:#AA1834;
    --ui-grey-100:#F7F7F7; --ui-grey-200:#EEEEEE; --ui-grey-300:#E5E5E4; --ui-grey-400:#D7D8D6; --ui-grey-500:#BABCBC;
    --ui-grey-600:#9C9EA0; --ui-grey-700:#717376; --ui-grey-800:#53565A; --ui-grey-900:#404346;
    /* Semantic */
    --surface-page:var(--sec-white); --surface-subtle:var(--ui-grey-100); --surface-card:var(--sec-white);
    --surface-framework:var(--ui-blue-800); --surface-framework-deep:var(--ui-blue-900);
    --text-primary:var(--ui-blue-800); --text-secondary:var(--ui-grey-800); --text-disabled:var(--ui-grey-700);
    --text-on-dark:var(--sec-white); --text-on-dark-muted:var(--ui-blue-100);
    --border-default:var(--ui-grey-400); --border-strong:var(--ui-blue-800);
    --cta-bg:var(--ui-blue-800); --cta-bg-hover:var(--ui-blue-700); --cta-bg-pressed:var(--ui-blue-900); --cta-bg-focus:var(--ui-blue-600); --cta-fg:var(--sec-white);
    --primary-bg:var(--sec-light-purple); --primary-bg-hover:var(--ui-purple-300); --primary-bg-pressed:var(--ui-purple-400); --primary-fg:var(--sec-navy-blue);
    --secondary-border:var(--sec-navy-blue); --secondary-border-hover:var(--ui-blue-700); --secondary-border-pressed:var(--ui-blue-900);
    --disabled-bg:var(--ui-grey-300); --disabled-fg:var(--ui-grey-800); --focus-ring:var(--ui-purple-400);
    /* Type */
    --font-brand:"Securitas Pro","Poppins","Helvetica Neue",Arial,sans-serif;
    /* Space (3px-grid) */
    --space-1:3px; --space-2:6px; --space-3:12px; --space-4:18px; --space-5:24px; --space-6:30px; --space-7:36px; --space-8:42px;
    --layout-1:12px; --layout-2:24px; --layout-3:36px; --layout-4:48px; --layout-5:60px; --layout-6:72px;
    --radius-overlay:6px; --radius-button:24px; --stroke:1px; --stroke-emphasis:2px;
    --button-height:48px; --button-padding-x:24px;
    /* Effects */
    --motion-base:200ms; --ease-standard:cubic-bezier(0.2,0,0.2,1);
    --shadow-overlay:0 2px 12px rgba(3,31,48,0.16);
  }

  * { box-sizing: border-box; }
  /* body må ikke have fast højde: sidebaren er sticky inden for body, og med height:100% slap den sit greb og
     rullede væk, så snart en side var højere end vinduet (menuen forsvandt på alle lange sider). */
  html, body { margin: 0; }
  html { height: 100%; }
  body {
    font-family: var(--font-brand); font-size: 15px; line-height: 24px; font-weight: 400;
    color: var(--text-primary); background: var(--surface-page);
    display: flex; min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
  h1 { font-size: 24px; line-height: 30px; }               /* Headline-04 */
  h2 { font-size: 18px; line-height: 24px; }               /* Headline-05 */
  h3 { font-size: 15px; line-height: 24px; }               /* Headline-06 */
  p { margin: 0; }
  .caption { font-size: 12px; line-height: 18px; }
  .muted { color: var(--text-secondary); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .ico { width: 24px; height: 24px; flex: none; fill: currentColor; }
  .ico.s { width: 18px; height: 18px; }
  *:focus-visible { outline: var(--stroke-emphasis) solid var(--focus-ring); outline-offset: 2px; }

  /* ---------- Framework (sidebar) ---------- */
  .sidebar {
    width: 240px; flex: none; background: var(--surface-framework); color: var(--text-on-dark);
    display: flex; flex-direction: column; padding: var(--space-5) var(--space-4); gap: var(--space-1);
    position: sticky; top: 0; height: 100vh;
  }
  #nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .brand { padding: var(--space-2) var(--space-3) var(--space-5); }
  .brand svg { width: 132px; height: auto; display: block; color: var(--sec-white); }
  .brand .caption { color: var(--text-on-dark-muted); margin-top: var(--space-3); }
  .nav-label { font-size: 12px; line-height: 18px; color: var(--text-on-dark-muted); padding: var(--space-4) var(--space-3) var(--space-1); }
  .nav-btn {
    display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left;
    background: none; border: 0; color: var(--text-on-dark); padding: var(--space-2) var(--space-3); cursor: pointer;
    transition: color var(--motion-base) var(--ease-standard);
  }
  .nav-btn span.lbl { border-bottom: var(--stroke-emphasis) solid transparent; padding-bottom: 1px; }
  .nav-btn:hover { color: var(--ui-blue-100); }
  .nav-btn.active { font-weight: 700; }
  .nav-btn.active span.lbl { border-bottom-color: var(--sec-purple); }
  .nav-btn .count { margin-left: auto; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--sec-white); background: var(--sec-red); min-width: 18px; height: 18px; padding: 0 var(--space-2); display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; }
  .sidebar .user { margin-top: auto; padding: var(--space-3); border-top: var(--stroke) solid var(--ui-blue-700); font-size: 12px; line-height: 18px; color: var(--text-on-dark-muted); display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-start; }
  .sidebar .user select { width: 100%; background: var(--surface-framework-deep); color: var(--sec-white); border: var(--stroke) solid var(--ui-blue-600); border-radius: var(--radius-overlay); padding: var(--space-2) var(--space-3); }
  .sidebar .user .link { color: var(--sec-white); font-size: 12px; line-height: 18px; }
  .sidebar .user-links { display: flex; gap: var(--space-3); align-items: center; }

  /* ---------- Menu med undermenuer (B6/F1) ---------- */
  /* Søg (fast, global knap) + "Aktiv sag" ligger over grupperne, adskilt med en linje. */
  .nav-top { display: flex; flex-direction: column; gap: var(--space-1); border-bottom: var(--stroke) solid var(--ui-blue-700); padding-bottom: var(--space-3); margin-bottom: var(--space-2); }
  .nav-search { font-weight: 700; }
  .nav-active-wrap { display: flex; flex-direction: column; }
  .nav-groups { display: flex; flex-direction: column; gap: var(--space-1); }
  .nav-group {
    display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left; font: inherit; font-weight: 700;
    background: none; border: 0; color: var(--text-on-dark); padding: var(--space-2) var(--space-3); cursor: pointer;
    transition: color var(--motion-base) var(--ease-standard);
  }
  .nav-group:hover { color: var(--ui-blue-100); }
  .nav-group .chev { margin-left: auto; width: 7px; height: 7px; flex: none; border-right: var(--stroke-emphasis) solid currentColor; border-bottom: var(--stroke-emphasis) solid currentColor; transform: rotate(45deg); transition: transform var(--motion-base) var(--ease-standard); }
  .nav-group[aria-expanded="true"] .chev { transform: rotate(-135deg); }
  /* 3 px lilla markering på gruppen med den aktive side (wireframens "▌") – ingen fyldt baggrund */
  .nav-group.has-active { box-shadow: inset 3px 0 0 var(--sec-purple); border-radius: var(--radius-overlay); }
  .nav-sub { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-1) 0 var(--space-2) var(--space-4); }
  .nav-sub .nav-active { margin-top: var(--space-2); padding-top: var(--space-3); border-top: var(--stroke) solid var(--ui-blue-700); }

  /* ---------- Main ---------- */
  /* C8 (KRAV-GAP-v6): loftet var 1224px, venstrestillet, så brede skærme fik tom plads i højre side.
     Hævet til 1600px – under 1560px viewport (desktop-sidebar 240px + 2×48px main-padding) er .main
     alligevel smallere end loftet og upåvirket, så 1280/1440 px ikke ændrer sig. */
  .main { flex: 1; min-width: 0; padding: var(--layout-3) var(--layout-4) var(--layout-6); max-width: 1600px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-5); flex-wrap: wrap; }
  .page-head p { margin-top: var(--space-2); color: var(--text-secondary); max-width: 64ch; }
  .replaces { font-size: 12px; line-height: 18px; color: var(--text-secondary); background: var(--surface-subtle); padding: var(--space-2) var(--space-3); border-radius: var(--radius-overlay); }
  .replaces b { color: var(--text-primary); }

  .card { background: var(--surface-card); border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); }
  .card-body { padding: var(--space-5); }
  .card + .card { margin-top: var(--space-5); }
  .toolbar { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: flex-end; padding: var(--space-4) var(--space-5); border-bottom: var(--stroke) solid var(--border-default); }
  .toolbar .spacer { flex: 1; }
  label.field, .field { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--text-secondary); }

  input[type=text], input[type=number], input[type=date], select, textarea {
    background: var(--surface-card); border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay);
    padding: var(--space-2) var(--space-3); min-width: 0; font-size: 15px; line-height: 24px; color: var(--text-primary);
    transition: border-color var(--motion-base) var(--ease-standard);
  }
  input:hover, select:hover, textarea:hover { border-color: var(--ui-grey-700); }
  input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--border-strong); outline-offset: 0; }
  input[readonly] { background: var(--surface-subtle); color: var(--text-secondary); }

  /* Buttons – DS §3.1.3: 48px, radius 24px, 24px side padding, 15/24 bold */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3);
    height: var(--button-height); padding: 0 var(--button-padding-x); border-radius: var(--radius-button);
    border: var(--stroke) solid var(--secondary-border); background: transparent; color: var(--sec-navy-blue);
    font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: background-color var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard), color var(--motion-base) var(--ease-standard);
  }
  .btn:hover { border-color: var(--secondary-border-hover); color: var(--ui-blue-700); }
  .btn:active { border-color: var(--secondary-border-pressed); color: var(--ui-blue-900); }
  .btn.cta { background: var(--cta-bg); color: var(--cta-fg); border-color: transparent; }
  .btn.cta:hover { background: var(--cta-bg-hover); color: var(--cta-fg); }
  .btn.cta:focus-visible { background: var(--cta-bg-focus); }
  .btn.cta:active { background: var(--cta-bg-pressed); }
  .btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
  .btn.primary:hover { background: var(--primary-bg-hover); color: var(--primary-fg); }
  .btn.primary:active { background: var(--primary-bg-pressed); }
  .btn:disabled { background: var(--disabled-bg); color: var(--disabled-fg); border-color: transparent; cursor: not-allowed; }
  /* Text link – DS §3.1.1 */
  .tlink { background: none; border: 0; padding: 0; font-weight: 700; color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; transition: color var(--motion-base) var(--ease-standard); }
  .tlink:hover { color: var(--ui-blue-600); }
  .tlink:active { color: var(--ui-blue-900); }
  /* Filter tabs – DS §3.1.4 */
  .ftabs { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .ftab { height: var(--button-height); padding: 0 var(--button-padding-x); border-radius: var(--radius-button); border: var(--stroke) solid var(--sec-navy-blue); background: transparent; color: var(--sec-navy-blue); font-weight: 700; cursor: pointer; transition: background-color var(--motion-base) var(--ease-standard), color var(--motion-base) var(--ease-standard); }
  .ftab:hover { background: var(--surface-subtle); }
  .ftab.on { background: var(--sec-navy-blue); color: var(--sec-white); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; line-height: 18px; color: var(--text-secondary); font-weight: 700; padding: var(--space-3) var(--space-3); border-bottom: var(--stroke) solid var(--border-default); white-space: nowrap; background: var(--surface-subtle); }
  th.num { text-align: right; }
  td { padding: var(--space-3); border-bottom: var(--stroke) solid var(--ui-grey-300); vertical-align: top; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-subtle); }
  tfoot td { font-weight: 700; background: var(--surface-subtle); border-bottom: 0; }
  .empty { padding: var(--space-6); text-align: center; color: var(--text-secondary); }

  /* Status – tekst med farvet prik (DS har ingen badge-komponent; rød kun som mikro-accent) */
  .st { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .st::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ui-grey-500); flex: none; }
  .st.opstart::before { background: var(--ui-grey-600); }
  .st.udf::before { background: var(--sec-purple); }
  .st.klar::before { background: var(--ui-blue-500); }
  .st.fakt::before { background: var(--sec-navy-blue); }
  .st.aaben::before { background: var(--ui-blue-300); }
  .st.sendt::before { background: var(--ui-blue-700); }
  .st.delvis::before { background: var(--ui-purple-300); }
  .st.nodot::before { display: none; }
  .alert { color: var(--ui-red-500); font-weight: 700; font-size: 12px; line-height: 18px; }
  .dg { font-weight: 700; }
  .dg.good { color: var(--sec-navy-blue); } .dg.warn { color: var(--ui-blue-500); } .dg.bad { color: var(--ui-red-500); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
  .stat { background: var(--surface-subtle); border-radius: var(--radius-overlay); padding: var(--space-3) var(--space-4); }
  .stat small { display: block; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .stat b { font-size: 24px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Projektkort */
  .proj-head .id { font-size: 12px; line-height: 18px; font-weight: 700; color: var(--ui-blue-500); }
  .tabs { display: flex; gap: var(--space-2); border-bottom: var(--stroke) solid var(--border-default); padding: 0 var(--space-3); }
  .tab { background: none; border: 0; padding: var(--space-3) var(--space-3); cursor: pointer; color: var(--text-secondary); font-weight: 700; border-bottom: var(--stroke-emphasis) solid transparent; margin-bottom: -1px; transition: color var(--motion-base) var(--ease-standard); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--sec-purple); }
  .tab:hover { color: var(--text-primary); }
  .tabpane { display: none; }
  .tabpane.active { display: block; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3) var(--space-4); }
  .form-grid label { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .form-grid .auto input { border-color: transparent; background: var(--ui-purple-100); color: var(--text-primary); }
  .hint { font-size: 12px; line-height: 18px; color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-2); }
  .hint .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--ui-purple-100); }
  .inline-form { display: grid; grid-template-columns: 1fr 1.2fr 2fr 1fr auto; gap: var(--space-3); align-items: end; padding: var(--space-4) var(--space-5); background: var(--surface-subtle); border-top: var(--stroke) solid var(--border-default); }
  .inline-form label { display: flex; flex-direction: column; gap: var(--space-1); font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 138px 1fr auto; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: var(--stroke) solid var(--ui-grey-300); }
  .log li time, .log li .who { color: var(--text-secondary); font-size: 12px; line-height: 18px; padding-top: 3px; font-variant-numeric: tabular-nums; }

  /* Modal – floating layer: den ene legitime skygge */
  .modal-bg { position: fixed; inset: 0; background: rgba(3,31,48,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: var(--space-5); }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface-card); border-radius: var(--radius-overlay); width: min(720px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow-overlay); }
  .modal header { padding: var(--space-4) var(--space-5); border-bottom: var(--stroke) solid var(--border-default); display: flex; justify-content: space-between; align-items: center; }
  .modal .body { padding: var(--space-5); }
  .modal footer { padding: var(--space-4) var(--space-5); border-top: var(--stroke) solid var(--border-default); display: flex; justify-content: flex-end; gap: var(--space-3); }
  .pdf { border: var(--stroke) solid var(--border-default); background: #fff; color: var(--text-primary); padding: var(--space-6) var(--space-7); }
  .pdf .pdf-head { display: flex; justify-content: space-between; align-items: center; border-bottom: var(--stroke-emphasis) solid var(--sec-navy-blue); padding-bottom: var(--space-3); margin-bottom: var(--space-4); }
  .pdf .pdf-head b { font-size: 18px; line-height: 24px; }
  .pdf dl { display: grid; grid-template-columns: 150px 1fr 150px 1fr; gap: var(--space-1) var(--space-3); margin: 0 0 var(--space-4); }
  .pdf dt { color: var(--text-secondary); } .pdf dd { margin: 0; font-weight: 700; }

  .toast { position: fixed; bottom: var(--space-5); left: 50%; transform: translateX(-50%); background: var(--sec-navy-blue); color: var(--sec-white); padding: var(--space-3) var(--space-5); border-radius: var(--radius-overlay); box-shadow: var(--shadow-overlay); opacity: 0; transition: opacity var(--motion-base) var(--ease-standard); z-index: 60; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Tekniker-telefon */
  .phone-wrap { display: grid; grid-template-columns: 390px 1fr; gap: var(--layout-3); align-items: start; }
  .phone { width: 390px; background: var(--sec-navy-blue); border-radius: 36px; padding: var(--space-3); }
  .screen { background: var(--surface-page); border-radius: 27px; height: 780px; overflow: auto; display: flex; flex-direction: column; }
  .screen .app-bar { background: var(--surface-framework); color: var(--sec-white); padding: var(--space-7) var(--space-4) var(--space-4); border-radius: 27px 27px 0 0; display: flex; justify-content: space-between; align-items: flex-end; }
  .screen .app-bar b { font-size: 18px; line-height: 24px; display: block; }
  .screen .app-bar small { color: var(--text-on-dark-muted); font-size: 12px; line-height: 18px; }
  .screen .app-bar svg { width: 60px; height: auto; color: var(--sec-white); }
  .screen .content { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .screen .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: var(--space-2); }
  .screen .mat { display: grid; grid-template-columns: 1fr 1.4fr 60px auto; gap: var(--space-2); align-items: center; }
  .screen .mat-list { display: flex; flex-direction: column; gap: var(--space-2); }
  .screen .mat-list .item { display: flex; justify-content: space-between; align-items: center; border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); padding: var(--space-2) var(--space-3); }
  .site-chip { background: var(--ui-purple-100); border-radius: var(--radius-overlay); padding: var(--space-3); }
  .site-chip b { display: block; }
  .my-cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .my-cases li { border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); padding: var(--space-2) var(--space-3); cursor: pointer; transition: border-color var(--motion-base) var(--ease-standard); }
  .my-cases li:hover { border-color: var(--border-strong); }
  .my-cases li.sel { border-color: var(--border-strong); border-width: 2px; padding: 5px 11px; }
  .my-cases li b { display: block; font-size: 12px; line-height: 18px; color: var(--ui-blue-500); }
  .side-note { color: var(--text-secondary); max-width: 56ch; }
  .side-note h2 { color: var(--text-primary); margin-bottom: var(--space-2); }
  .side-note ul { padding-left: 18px; margin: var(--space-2) 0 var(--space-5); }
  .side-note li { margin-bottom: var(--space-1); }
  .icobtn { width: var(--button-height); height: var(--button-height); padding: 0; border-radius: 50%; }

  /* ---------- Søg (pages/soeg.js) ---------- */
  #soegInput { font-size: 20px; height: 56px; padding: 0 var(--space-4); }
  .soeg-group + .soeg-group { margin-top: var(--space-5); }
  .soeg-group h2 { font-size: 16px; line-height: 22px; margin: 0 0 var(--space-3); }
  .soeg-group h2 .muted { font-weight: 400; }
  mark { background: var(--ui-purple-100); color: inherit; padding: 0 2px; }

  /* ---------- Eftersyn (pages/eftersyn.js) ---------- */
  .st.over::before { background: var(--ui-red-500); }
  .st.snart::before { background: var(--ui-blue-500); }
  .ef-cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--space-3); }
  .ef-cal .card-body { padding: var(--space-4); }
  .ef-cal h3 { margin-bottom: var(--space-2); }
  .ef-cal ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .ef-cal li { border-bottom: 1px solid var(--ui-grey-300); padding-bottom: var(--space-2); }
  .ef-cal li:last-child { border-bottom: 0; padding-bottom: 0; }
  .ef-cal .count { font-size: 24px; line-height: 30px; font-weight: 700; }
  .ef-cal.overdue .card { border-color: var(--ui-red-500); }

  /* ---------- Rapporter (pages/rapporter.js) ---------- */
  .rap-toolbar{display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-5)}
  .rap-toolbar .grp{display:flex;flex-direction:column;gap:var(--space-1)}
  .rap-toolbar .lbl{font-size:12px;line-height:18px;color:var(--text-secondary)}
  .rap-card .card-body{padding:var(--space-5)}
  .rap-card h2{margin-bottom:var(--space-1)}
  .rap-sub{color:var(--text-secondary);margin-bottom:var(--space-4)}
  .rap-chart{overflow-x:auto;max-width:900px} /* C8: svg'en skalerer til 100% af denne – uden loft bliver diagrammet kæmpestort på brede skærme */
  .rap-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;margin:var(--space-3) 0 var(--space-4)}
  .rap-lg{display:inline-flex;align-items:center;gap:var(--space-2);font-size:12px;line-height:18px;color:var(--text-secondary)}
  .rap-lg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
  .rap-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--space-5);align-items:start}

  @media (max-width: 900px) {
    body { flex-direction: column; }
    /* Sidebar bliver en vandret, scrollbar topbar med ikoner + korte labels */
    .sidebar {
      width: auto; height: auto; position: sticky; top: 0; z-index: 40;
      flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 0;
      padding: var(--space-2) var(--space-3); overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .sidebar .brand { display: none; }
    .sidebar .nav-label { display: none; }
    .sidebar .user { display: flex; flex-direction: row; align-items: center; gap: var(--space-2); margin: 0 0 0 var(--space-2); padding: 0 0 0 var(--space-3); border-top: 0; border-left: var(--stroke) solid var(--ui-blue-700); flex: none; }
    .sidebar .user select { width: auto; max-width: 160px; }
    .sidebar .user .link { white-space: nowrap; }
    #nav { flex-direction: row; flex-wrap: nowrap; gap: var(--space-1); flex: none; }
    .nav-btn { width: auto; flex-direction: column; gap: var(--space-1); padding: var(--space-2); text-align: center; white-space: nowrap; }
    .nav-btn .ico { width: 20px; height: 20px; }
    .nav-btn span.lbl { font-size: 11px; line-height: 14px; }
    .nav-btn .count { position: absolute; margin-left: 0; transform: translate(10px, -10px); }
    .nav-btn { position: relative; }

    .main { padding: var(--space-4); max-width: 100%; }

    /* KPI-kort i to kolonner i stedet for at klemmes vandret */
    .stats { grid-template-columns: repeat(2, 1fr); }

    /* Værktøjslinjer og formularer stakker i én kolonne */
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .spacer { display: none; }
    .toolbar .ftabs, .toolbar .btn { width: 100%; }
    .inline-form { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .rap-grid2 { grid-template-columns: 1fr; }
    .rap-toolbar { flex-direction: column; align-items: stretch; }

    /* Brede tabeller: behold kolonnebredden og lad table-wrap scrolle vandret i stedet for at klemme */
    .table-wrap table { min-width: 720px; }
    .phone-wrap .table-wrap table, .modal .table-wrap table { min-width: 0; }

    /* Modaler fylder skærmen på mobil */
    .modal-bg { padding: 0; }
    .modal { width: 100%; max-width: none; height: 100vh; max-height: 100vh; border-radius: 0; }

    .phone-wrap { grid-template-columns: 1fr; }
    .phone { width: 100%; max-width: none; }
  }

  /* AI-scan af faktura (mock) */
  .scan { padding: var(--space-4) var(--space-5); border-top: var(--stroke) solid var(--border-default); display: flex; flex-direction: column; gap: var(--space-3); }
  .scan-drop { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); border: var(--stroke) dashed var(--ui-grey-600); border-radius: var(--radius-overlay); cursor: pointer; transition: border-color var(--motion-base) var(--ease-standard), background-color var(--motion-base) var(--ease-standard); flex-wrap: wrap; }
  .scan-drop:hover, .scan-drop.over { border-color: var(--sec-navy-blue); background: var(--surface-subtle); }
  .scan-drop .ico { color: var(--sec-navy-blue); }
  .scan-drop > div:not(.scan-demos) { flex: 1; min-width: 240px; }
  .scan-demos { width: 100%; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .scan-result { border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
  .scan-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .scan-actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .scan-progress { height: 6px; background: var(--ui-grey-200); border-radius: 3px; overflow: hidden; }
  .scan-progress span { display: block; height: 100%; width: 40%; background: var(--sec-purple); animation: scanbar 1.2s var(--ease-standard) infinite; }
  @keyframes scanbar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .scan-progress span { animation: none; width: 100%; } }
  .form-grid label.conf-low input { background: var(--ui-purple-100); border-color: transparent; }
  .form-grid label .caption { float: right; color: var(--ui-purple-500); font-weight: 700; }

  /* Feedback-widget */
  .fb-btn { position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: 40; box-shadow: var(--shadow-overlay); }
  .fb-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(3,31,48,.92); display: grid; grid-template-columns: 1fr 360px; gap: var(--space-4); padding: var(--space-4); }
  .fb-overlay[hidden] { display: none; }
  .fb-stage { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
  .fb-tools { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; color: var(--sec-white); }
  .fb-tools .tlink { color: var(--sec-white); }
  .fb-tools .ftab { border-color: var(--sec-white); color: var(--sec-white); }
  .fb-tools .ftab.on { background: var(--sec-white); color: var(--sec-navy-blue); }
  .fb-title { font-weight: 700; }
  .fb-canvas-wrap { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; overflow: auto; }
  .fb-canvas-wrap canvas { max-width: 100%; max-height: 100%; border-radius: var(--radius-overlay); background: #fff; cursor: crosshair; touch-action: none; }
  .fb-overlay.noshot .fb-stage { opacity: .35; pointer-events: none; }
  .fb-form { background: var(--surface-card); border-radius: var(--radius-overlay); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); overflow: auto; }
  .fb-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .fb-list { display: flex; flex-direction: column; }
  .fb-item { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: var(--stroke) solid var(--ui-grey-300); }
  .fb-thumb { border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); overflow: hidden; background: var(--surface-subtle); padding: 0; cursor: pointer; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; }
  .fb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fb-noshot { cursor: default; }
  .fb-meta { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-1); }
  .fb-tags { display: flex; gap: var(--space-3); margin-bottom: var(--space-2); }
  .fb-svar { margin-top: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface-subtle); border-radius: var(--radius-overlay); }
  /* Adgangskode og velkomst */
  .gate { position: fixed; inset: 0; z-index: 80; background: var(--sec-navy-blue); display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  .gate[hidden] { display: none; }
  .gate-card { background: var(--surface-card); border-radius: var(--radius-overlay); padding: var(--space-7); width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-4); }
  .gate-wide { width: min(640px, 100%); }
  .gate-logo { width: 120px; height: auto; color: var(--sec-navy-blue); }
  .gate-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: var(--space-2); }
  html.gated .sidebar, html.gated .main, html.gated .fb-btn { visibility: hidden; }
  @media (max-width: 900px) {
    .fb-overlay { grid-template-columns: 1fr; overflow: auto; }
    .fb-item { grid-template-columns: 1fr; }
    .fb-btn { right: var(--space-3); bottom: var(--space-3); }
  }

  /* Print (PDF via browserens udskriv) */
  .print-only { display: none; }
  @media print {
    body > *:not(.print-only) { display: none !important; }
    .print-only { display: block; padding: 12mm; font-size: 11px; line-height: 16px; color: #000; }
    .print-only h1 { font-size: 16px; margin-bottom: 8px; }
    .print-only table { width: 100%; border-collapse: collapse; }
    .print-only th, .print-only td { border-bottom: 1px solid #999; padding: 3px 6px; text-align: left; background: none !important; color: #000; }
    .print-only .num { text-align: right; }
    .print-only .tlink, .print-only button { display: none; }
  }

  /* Tætte tabeller (én linje pr. række) og sortering – PLAN-v4 */
  .table-dense { font-size: 14px; line-height: 21px; }
  .table-dense th, .table-dense td { padding: var(--space-2) 9px; white-space: nowrap; vertical-align: middle; }
  .table-dense td.cut { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  .table-dense td.cut.w-s { max-width: 160px; }
  .table-dense td.cut.w-m { max-width: 240px; }
  .table-dense td.cut.w-l { max-width: 420px; }
  .table-dense td.actions { white-space: nowrap; }
  .table-dense td.actions .tlink + .tlink { margin-left: var(--space-3); }
  th.sortable { cursor: pointer; user-select: none; padding-right: 18px; position: relative; }
  th.sortable::after { content: ""; position: absolute; right: 6px; top: 50%; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--ui-grey-500); transform: translateY(-50%); }
  th.sortable.sorted { color: var(--text-primary); }
  th.sortable.sorted[data-dir="asc"]::after { border-top: 0; border-bottom: 5px solid var(--sec-navy-blue); }
  th.sortable.sorted[data-dir="desc"]::after { border-top: 5px solid var(--sec-navy-blue); }
  th.sortable:hover { color: var(--text-primary); }
  tr[data-child] td { background: var(--surface-subtle); font-size: 12px; line-height: 18px; }

  /* F8 (B3): filterknap – genbruger nøjagtig den plads, sorteringspilen allerede havde (padding-right
     er uændret, 18/16 px alt efter breakpoint), så ingen kolonne bliver bredere. Knappen ligger som en
     rigtig <button> ovenpå den samme pil-plads; th.sortable::after skjules for kolonner med filter, og
     pilen tegnes i stedet på knappen, så den fortsat viser sorteringsretningen. */
  th.sortable.has-filter::after { display: none; }
  th.sortable .colfilter-btn { position: absolute; right: 0; top: 0; bottom: 0; width: 16px; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; color: inherit; }
  th.sortable .colfilter-btn::after { content: ""; position: absolute; right: 6px; top: 50%; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--ui-grey-500); transform: translateY(-50%); }
  th.sortable.sorted[data-dir="asc"] .colfilter-btn::after { border-top: 0; border-bottom: 5px solid var(--sec-navy-blue); }
  th.sortable.sorted[data-dir="desc"] .colfilter-btn::after { border-top: 5px solid var(--sec-navy-blue); }
  /* Lilla mikro-markering (aldrig baggrund) af en kolonne med et aktivt filter – uden at ændre bredden */
  th.sortable.filtered .colfilter-btn::before { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--sec-purple); }

  /* F8: statuslinjen under en filtreret tabel og den forklarende linje i tfoot, når summen (regnet af
     siden selv) dækker alle rækker, mens et kolonnefilter kun viser nogle af dem. */
  .tbl-filter-status { margin-top: var(--space-3); font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .tbl-filter-status[hidden] { display: none; }
  tfoot tr.f8-note td { background: var(--surface-subtle); font-weight: 400; font-size: 12px; line-height: 18px; color: var(--text-secondary); border-bottom: 0; padding-top: 0; }

  /* F8: popoveren ligger i document.body (som modalerne), ikke i .table-wrap, så den vandrette scroll
     ikke klipper den. Positioneres i JS ud fra th.getBoundingClientRect(). */
  .colfilter-pop { position: fixed; z-index: 55; width: 280px; max-width: calc(100vw - 16px); max-height: 360px; overflow: auto; background: var(--surface-card); border: var(--stroke) solid var(--border-default); border-radius: var(--radius-overlay); box-shadow: var(--shadow-overlay); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .colfilter-pop[hidden] { display: none; }
  .colfilter-pop .cf-values { display: flex; flex-direction: column; gap: var(--space-1); max-height: 200px; overflow: auto; }
  .cf-value { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) 0; cursor: pointer; }
  .cf-value[hidden] { display: none; }
  .cf-value .cf-vlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-value .cf-vcount { flex: none; }
  .cf-tools, .cf-range, .cf-actions { display: flex; gap: var(--space-3); }
  .cf-range .field { flex: 1; }
  .cf-actions { justify-content: flex-end; flex-wrap: wrap; }

  /* Mellemstore skærme (fx 1280-1440 px): mindre sidemargin og kortere tekstkolonner, så listerne passer uden vandret scroll */
  @media (max-width: 1440px) and (min-width: 901px) {
    .main { padding-left: var(--layout-2); padding-right: var(--layout-2); }
    .table-dense td.cut.w-m { max-width: 160px; }
    .table-dense td.cut.w-s { max-width: 120px; }
    .table-dense th, .table-dense td { padding-left: 6px; padding-right: 6px; }
    th.sortable { padding-right: 16px; }
  }

  /* Mellemstore skærme: ikon-sidebar, så tabellerne får pladsen. B6/F1 (konflikt 1): gruppen ER
     ikonet her, og undermenuen kommer som et udslag ved siden af skinnen i stedet for at folde
     inline ud som i den fulde sidebar. */
  @media (max-width: 1440px) and (min-width: 901px) {
    .sidebar { width: 72px; padding: var(--space-4) var(--space-2); }
    .sidebar .brand { padding: var(--space-2) 0 var(--space-4); }
    .sidebar .brand svg { width: 48px; }
    .sidebar .brand .caption, .sidebar .nav-label, .nav-btn .lbl, .sidebar .user .link,
    .nav-group .lbl, .nav-group .chev, .nav-active-wrap { display: none; }
    .sidebar .user { font-size: 0; padding: var(--space-2) 0; }
    .sidebar .user select { font-size: 12px; padding: var(--space-1); }
    .sidebar .user-links { justify-content: center; }
    .nav-btn, .nav-group { justify-content: center; padding: var(--space-3) 0; }
    .nav-btn .count { position: absolute; margin: 0; transform: translate(14px, -12px); }
    .nav-btn { position: relative; }
    .nav-btn.active { background: var(--ui-blue-700); border-radius: var(--radius-overlay); }
    .nav-group[aria-expanded="true"] { background: var(--ui-blue-700); border-radius: var(--radius-overlay); }
    .sidebar .user-mini { display: flex; }

    /* Udslaget: lukket vises som normalt via hidden-attributten (§ globalreglen nedenfor); når JS
       fjerner den, flyder panelet ud til højre for skinnen med App.icon()-labels synlige igen. */
    .nav-item { position: relative; }
    .nav-sub:not([hidden]) {
      position: absolute; left: calc(100% + var(--space-2)); top: 0; z-index: 30; min-width: 232px;
      background: var(--surface-framework); border-radius: var(--radius-overlay); box-shadow: var(--shadow-overlay);
      padding: var(--space-2);
    }
    .nav-sub .nav-btn, .nav-sub .nav-group { justify-content: flex-start; padding: var(--space-2) var(--space-3); }
    .nav-sub .nav-btn .lbl { display: inline; }
    .nav-sub .nav-btn .count { position: static; margin: 0 0 0 auto; transform: none; }
  }

  /* hidden-attributten skal altid vinde over komponenternes egen display (fx .btn og .rap-toolbar .grp) */
  [hidden]:not([hidden="until-found" i]) { display: none !important; }

  /* ---------- Økonomisk overblik (pages/oekonomi.js) – PLAN-v5 ---------- */
  .inline-form.cols-5 { grid-template-columns: 1fr 1.2fr 2fr 1fr 1fr auto; }
  .oek-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-5); } /* otte felter = to rækker à fire */
  .oek-kpi { display: flex; flex-direction: column; gap: var(--space-1); }
  .oek-kpi .oek-sub { font-size: 12px; line-height: 18px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .oek-delta { font-weight: 700; color: var(--text-primary); white-space: nowrap; }
  .oek-delta.neg, .oek-neg { color: var(--ui-red-500); }
  .oek-table th, .oek-table td { font-variant-numeric: tabular-nums; }
  /* Valgt måned: neutral flade + lilla streg som mikro-accent (lilla bruges aldrig som baggrund) */
  .oek-table tbody tr.on td { background: var(--surface-subtle); font-weight: 700; }
  .oek-table tbody tr.on td:first-child { box-shadow: inset 3px 0 0 var(--sec-purple); }
  .oek-table tbody tr.later td { color: var(--text-disabled); }
  .oek-note { margin: var(--space-4) 0 0; }
  .oek-def { margin-top: var(--space-3); }
  .oek-def summary { cursor: pointer; font-weight: 700; color: var(--sec-navy-blue); }
  .oek-def dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-4); margin: var(--space-3) 0 0; max-width: 88ch; }
  .oek-def dt { font-weight: 700; }
  .oek-def dd { margin: 0; color: var(--text-secondary); }
  /* Ti kolonner: pinnes til den tætte bredde uanset skærmbredde, så tabellen heller ikke scroller vandret ved 1920 px (som #projTable) */
  #oekDrill th, #oekDrill td { padding-left: 6px; padding-right: 6px; }
  #oekDrill th.sortable { padding-right: 16px; }
  #oekDrill td.cut.w-m { max-width: 160px; }
  #oekDrill td.cut.w-s { max-width: 120px; }
  #oekDrill.hide-pm thead th:nth-child(4), #oekDrill.hide-pm tbody td:nth-child(4):not(.empty) { display: none; }
  #oekCharts h3 { margin: var(--space-4) 0 var(--space-2); }
  #oekCharts .rap-chart { max-width: 820px; } /* støttediagram: må ikke skalere op og fylde mere end tabellen */
  @media (max-width: 900px) {
    .inline-form.cols-5 { grid-template-columns: 1fr; }
    .oek-kpis { grid-template-columns: repeat(2, 1fr); }
    .oek-def dl { grid-template-columns: 1fr; gap: 0; }
    .oek-def dd { margin-bottom: var(--space-2); }
  }
  @media print {
    .print-only h2 { font-size: 12px; line-height: 16px; margin: 14px 0 4px; }
    .print-only tfoot td { font-weight: 700; }
    .print-only tr { break-inside: avoid; }
    .print-only .oek-print-meta { margin: 0 0 6px; color: #333; }
    .print-only .oek-print-logo { position: absolute; top: 10mm; right: 12mm; width: 84px; color: #031F30; }
    .print-only .oek-delta, .print-only .oek-neg { color: #000; }
  }
</style>
</head>

<script>
// Kerne: state, helpers, navigation, side-registrering og roller.
// Sider registrerer sig via App.registerPage({...}) – se PLAN-v2.md.
(function () {
  const D = window.DEMO;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const kr = v => (Math.round(v || 0)).toLocaleString('da-DK') + ' kr.';
  const n = v => String(v ?? '').replace('.', ',');
  const pct = v => v == null ? '–' : n((+v).toFixed(1)) + ' %';
  const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Lokal dato, ikke UTC: toISOString() gav gårsdagens dato mellem midnat og kl. 02 dansk tid – og dermed forkert
  // faktura- og bogføringsdato, som Økonomisk overblik periodiserer på.
  const today = () => { const d = new Date(), p2 = v => String(v).padStart(2, '0'); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };
  const now = () => today() + ' ' + new Date().toTimeString().slice(0, 5);
  const icon = (name, cls = 'ico s') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const STATE_KEY = 'sd-proto-v3';

  // ---------- state ----------
  let S;
  try { S = JSON.parse(localStorage.getItem(STATE_KEY)); } catch (e) { S = null; }
  if (!S || S.dataVersion !== D.version) S = { dataVersion: D.version, user: 'HERA', nextPrdk: 1401, fAfd: '' };
  // Alle samlinger i DEMO kopieres ind i S første gang (og nye samlinger ved senere udvidelse af data.js)
  Object.keys(D).forEach(k => { if (!(k in S)) S[k] = JSON.parse(JSON.stringify(D[k])); });
  // Samlinger der ikke findes i DEMO, og derfor aldrig bliver oprettet af linjen ovenfor.
  // historik = auditsporet bag App.log()/App.saetFelt() (PLAN-v6-spor1 §3).
  // salgsarkiv = tildelte indbakke-poster, som Spor 2 (F3) flytter hertil i stedet for at slette dem.
  S.historik = S.historik || [];
  S.salgsarkiv = S.salgsarkiv || [];
  // navOpen = hvilke menugrupper der er foldet ud (B6/F1) · currentProj flyttet hertil fra en modulvariabel,
  // så det aktive projektkort overlever genindlæsning (planens konflikt-afsnit nr. 15's antagelse).
  S.navOpen = S.navOpen || {};
  // colFilter = kolonnefiltre pr. tabelnøgle og kolonne-ETIKET (F8/B3, PLAN-v6-spor2 §F8).
  S.colFilter = S.colFilter || {};
  const save = () => {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch (e) {}
    const c = $('#inboxCount'); if (c) c.textContent = (S.indbakke || []).length;
  };

  // ---------- opslag ----------
  const site = id => (S.sites || []).find(s => s.id === id) || {};
  const bc = nr => (D.bcMapping || []).find(m => m.stedNr === String(nr || '').trim()) || null;
  const emp = id => (D.medarbejdere || []).find(m => m.id === id) || { navn: id, id, rolle: '' };
  const proj = id => (S.projekter || []).find(p => p.id === id);
  const role = () => emp(S.user).rolle || 'PM';

  // ---------- v7-opslag: kunde, installation, underleverandør (kompatibilitetslaget, PLAN-v6-spor1 §4) ----------
  // Navnene her er kontrakt for bølge B2-B5 og må ikke skifte. Alle helpers læser de NYE felter
  // (kundeId, installationer, ulId) – aldrig spejlfelterne – og tåler ukendte id'er og halvt udfyldte
  // poster: de svarer {} / '' / [] i stedet for at kaste, fordi sites oprettet i browseren mangler felter.
  const idOf = x => typeof x === 'string' ? x : (x && x.id) || '';
  const kunde = id => (S.kunder || []).find(k => k.id === idOf(id)) || {};
  const kundeAf = siteOrId => kunde(((typeof siteOrId === 'string' ? site(siteOrId) : siteOrId) || {}).kundeId);
  const kundeNavn = siteOrId => kundeAf(siteOrId).navn || '';
  const INSTALLATION_TYPER = ['AIA', 'ADK', 'TVO'];                    // BRAND og ANDET er reserveret (§1.3)
  const TYPE_ORDER = ['AIA', 'ADK', 'TVO', 'BRAND', 'ANDET'];          // fast visningsrækkefølge, ukendte typer sidst
  const typeRang = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? TYPE_ORDER.length : i; };
  const installation = id => (S.installationer || []).find(i => i.id === idOf(id)) || {};
  const installationer = siteOrId => {
    const sid = idOf(siteOrId);
    if (!sid) return [];
    return (S.installationer || []).filter(i => i.siteId === sid)
      .sort((a, b) => typeRang(a.type) - typeRang(b.type) || String(a.type || '').localeCompare(String(b.type || ''), 'da') || String(a.id || '').localeCompare(String(b.id || '')));
  };
  const installationTyper = siteOrId => [...new Set(installationer(siteOrId).map(i => i.type).filter(Boolean))].join('-');
  const serviceaftaler = siteOrId => [...new Set(installationer(siteOrId).map(i => (i.serviceaftale || '').trim()).filter(Boolean))];
  // Datohjælpere til eftersyn. isoDato regner lokalt (today() bruger UTC og må ikke ændres her).
  const parseDato = v => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const isoDato = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  // Samme regning som eftersynskalenderen bruger i dag: sidste eftersyn + interval, ellers den faste måned.
  const naesteEftersyn = (e, t) => {
    if (!e || !e.aktiv) return '';
    const sidste = parseDato(e.sidste);
    if (sidste) { sidste.setMonth(sidste.getMonth() + (+e.interval || 12)); return isoDato(sidste); }
    const m = +e.maaned;
    if (m >= 1 && m <= 12) { let d = new Date(t.getFullYear(), m - 1, 1); if (d < t) d = new Date(t.getFullYear() + 1, m - 1, 1); return isoDato(d); }
    return '';
  };
  // Sitets eftersyn set under ét, så eftersynslisten fortsat er 23 rækker og ikke 42 (§4, afvigelse 7).
  // Den installation med den tidligste næste dato bestemmer rækken; er ingen aktiv, vises den første
  // installations måned og interval, så kalenderen stadig kan placere sitet.
  const eftersynSite = siteOrId => {
    const inst = installationer(siteOrId);
    const tom = { aktiv: false, maaned: 0, interval: 12, sidste: '', cas: '', naeste: '' };
    if (!inst.length) return tom;
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const kandidater = inst.map(i => ({ e: i.eftersyn || {}, naeste: naesteEftersyn(i.eftersyn, t) }));
    const aktive = kandidater.filter(k => k.e.aktiv);
    const valgt = aktive.length
      ? aktive.reduce((a, b) => (a.naeste || '9999-99-99') <= (b.naeste || '9999-99-99') ? a : b)

  const parseNum = raw => { const s = raw.replace(/\./g, '').replace(',', '.').replace(/[^0-9.\-]/g, ''); const v = parseFloat(s); return isNaN(v) ? -Infinity : v; };

    if (soegPage) top.appendChild(buildLeafBtn(soegPage, 'nav-search'));

    const activeP = S.currentProj && proj(S.currentProj);
    if (activeP) {
      const wrap = document.createElement('div'); wrap.className = 'nav-active-wrap';
      const lbl = document.createElement('div'); lbl.className = 'nav-label'; lbl.textContent = 'Aktiv sag';
      wrap.appendChild(lbl); wrap.appendChild(buildActiveProjBtn(activeP));
      top.appendChild(wrap);
    }
    nav.appendChild(top);

    const groups = document.createElement('div'); groups.className = 'nav-groups';
    GROUP_ORDER.forEach(g => {
      // Søg er global og ligger uden for grupperne (se rapportens note om pages/soeg.js)
      const items = vis.filter(p => (p.group || 'Projekter') === g && !p.hidden && p.id !== 'soeg');
      if (!items.length) return;
      groups.appendChild(buildNavGroup(g, items, activeP));
    });
    nav.appendChild(groups);
  }

  function renderNav() {
    const nav = $('#nav'); if (!nav) return;
    nav.innerHTML = '';
    const vis = visiblePages();
    S.navOpen = S.navOpen || {};
    if (isMobile()) renderNavFlat(nav, vis); else renderNavGrouped(nav, vis);
    save();
  }

  // Åbner (og husker) den gruppe en side hører til, uden at bygge hele menuen om – kaldes ved hver
  // navigation, så fokus og de øvrige gruppers tilstand ikke forstyrres. Søg og Feedback ligger uden
  // for gruppesystemet og springes over.
  function revealNavGroup(pageId, g) {
    const nav = $('#nav'); if (!nav) return;
    const uden = pageId === 'soeg' || pageId === 'feedback';
    $$('.nav-group', nav).forEach(b => b.classList.toggle('has-active', !uden && b.dataset.group === g));
    if (railWidth()) { closeRailFlyouts(); return; } // skinnen: en valgt side lukker udslaget; gruppen markeres kun med has-active
    if (uden || !g) return;
    const btn = nav.querySelector('.nav-group[data-group="' + g + '"]');
    if (!btn) return; // fladt (mobil) – ingen gruppeknapper at åbne
    const sub = $('#' + btn.getAttribute('aria-controls'));
    if (S.navOpen[g] && sub && !sub.hidden) return;
    S.navOpen[g] = true;
    btn.setAttribute('aria-expanded', 'true');
    if (sub) sub.hidden = false;
    save();
  }

  function go(pageId) {
    const p = pages.find(x => x.id === pageId);
    if (!p) return;
    if (p.roles && !p.roles.includes(role())) { toast('Denne visning er ikke tilgængelig for din rolle'); return; }
    $$('.page').forEach(s => s.classList.toggle('active', s.id === 'page-' + pageId));
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
    revealNavGroup(pageId, p.group || 'Projekter');
    if (p.render) p.render();
    window.scrollTo(0, 0);
    S.lastPage = pageId; save();
  }

  function openProject(id) { S.currentProj = id; renderNav(); go('projekt'); }

  function defaultPage() {
    const r = role();
    const pref = { Tekniker: 'tid', Fakturering: 'fakturering', Service: 'service', Chef: 'projekter' }[r] || 'indbakke';
    const vis = visiblePages();
    return (vis.find(p => p.id === pref) || vis[0]).id;
  }

  // ---------- bruger / roller ----------
  function initUser() {
    const us = $('#userSel'); us.innerHTML = '';
    D.medarbejdere.forEach(m => us.add(new Option(`${m.navn} (${m.rolle}${m.lederFor ? ', afdelingsleder' : ''})`, m.id)));
    us.value = S.user;
    us.addEventListener('change', () => { S.user = us.value; save(); renderNav(); go(defaultPage()); });

    // Feedback hører til prototypen, ikke til produktet (B6/F1): flyttet fra menuens grupper ned i
    // foden, på samme linje som "Nulstil demo-data". Siden er stadig registreret (feedback.js) og
    // rammes af rollefiltrering som enhver anden side – den er bare ikke en del af gruppesystemet.
    const userBox = $('.user'), reset = $('#resetDemo');
    if (userBox && reset && !$('#navFeedback')) {
      const row = document.createElement('div'); row.className = 'user-links';
      const fb = document.createElement('button'); fb.type = 'button'; fb.id = 'navFeedback'; fb.className = 'tlink link'; fb.textContent = 'Feedback';
      fb.addEventListener('click', () => go('feedback'));
      row.appendChild(fb);
      userBox.appendChild(row);
      row.appendChild(reset); // flytter den eksisterende knap ned på samme linje som Feedback
    }
    reset.addEventListener('click', () => { try { localStorage.removeItem(STATE_KEY); } catch (e) {} location.reload(); });
  }

  // Escape lukker åbne dialoger og en åben menu-udslag (F1: rail-visningen ved 901-1440 px), og
  // sender fokus tilbage til den knap der åbnede dem
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    // F8: kolonnefilterets popover ligger øverst – luk kun den ved første Escape, som modalerne
    if (colFilterPop && !colFilterPop.hidden) { closeColFilterPop(true); return; }
    $$('.modal-bg.open').forEach(m => closeModal(m.id));
    const item = document.activeElement && document.activeElement.closest('.nav-item');
    const btn = item && item.querySelector('.nav-group[aria-expanded="true"]');
    const sub = btn && $('#' + btn.getAttribute('aria-controls'));
    if (btn && sub && !sub.hidden) { toggleNavGroup(btn.dataset.group, btn, sub, false); btn.focus(); }
  });

  // F8: klik uden for popoveren, eller sideeffekt af en scroll, lukker den (ligesom modalernes
  // baggrund). Klik på selve filterknappen stopper sin egen boble (bindColFilterButton), så den ikke
  // rammer denne lytter og lukker popoveren, samme øjeblik den skulle åbnes.
  document.addEventListener('click', e => {
    if (!colFilterPop || colFilterPop.hidden || colFilterPop.contains(e.target)) return;
    closeColFilterPop(false);
  });
  // F1: et klik uden for menuen lukker et åbent udslag i skinnen
  document.addEventListener('click', e => { if (railWidth() && !(e.target.closest && e.target.closest('#nav'))) closeRailFlyouts(); });
  document.addEventListener('scroll', () => { if (colFilterPop && !colFilterPop.hidden) closeColFilterPop(false); }, true);

  // Piletaster flytter fokus mellem menuens knapper (gruppeknapper og synlige sider i et åbent udslag) – F1
  document.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const nav = document.activeElement && document.activeElement.closest('#nav');
    if (!nav) return;
    const items = $$('button', nav).filter(el => el.offsetParent !== null);
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const next = items[e.key === 'ArrowDown' ? Math.min(i + 1, items.length - 1) : Math.max(i - 1, 0)];
    if (next) next.focus();
  });

  // Space/Enter aktiverer rækker og listeelementer med klik-handling (tabindex="0")
  document.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Spacebar' && e.key !== 'Enter') return;
    const el = e.target.closest('tr.click[tabindex], .my-cases li[tabindex], [data-site][tabindex]');
    if (!el) return;
    if (e.key !== 'Enter') e.preventDefault(); // undgå sidescroll ved mellemrum
    el.click();
  });

  // Enter i et frit søgefelt (ikke i en formular) trigger søgningen med det samme i stedet for at vente på debounce
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!e.target.matches('input[type=text]') || e.target.closest('form')) return;
    e.target.dispatchEvent(new Event('input', { bubbles: true }));
  });

  // Generisk formular-validering: viser en toast med hvilket felt der mangler, i stedet for kun browserens standardboble
  document.addEventListener('submit', e => {
    const form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    const invalid = form.querySelector(':invalid');
    if (!invalid) return;
    e.preventDefault(); e.stopImmediatePropagation();
    let label = invalid.closest('label');
    let felt = '';
    if (label) {
      const clone = label.cloneNode(true);
      $$('input,select,textarea', clone).forEach(el => el.remove());
      felt = clone.textContent.trim();
    }
    if (!felt) felt = invalid.getAttribute('aria-label') || invalid.placeholder || invalid.name || 'et påkrævet felt';
    toast(`Udfyld ${felt.replace(/:$/, '').toLowerCase()} for at fortsætte`);
    invalid.focus();
  }, true);

  window.App = {
    D, S, save, $, $$, kr, n, pct, h, today, now, icon, st, stKort, dgCell, site, bc, emp, proj, calc, role,
    toast, openModal, closeModal, confirmDialog, trapFocus, go, openProject, registerPage, getPage,
    siteLabel, siteAddress, INTERN_KATEGORIER, isIntern, pris, workdays, expectedHours, subtasks, nextSubtaskId, csvDownload, downloadMode, printSection,
    sortable, applySort, lederFor, scopeOptions, resolveScope, inScope,
    // F8 (B3): rene hjælpefunktioner uden DOM, eksponeret for tools/test-f8.js – bruges internt af
    // applySort/applyFilter og skal ikke kaldes af sidefiler.
    colFilterMatch, migrateSortState, colIndexByLabel,
    // v7-kompatibilitetslaget (PLAN-v6-spor1 §4) – kontrakt for bølge B2-B5
    kunde, kundeAf, kundeNavn, installation, installationer, installationTyper, serviceaftaler, eftersynSite,
    ul, ulNavn, ulAf, stedNr, projStatus, erIgangvaerende, igangvaerendeProjekter,
    saetFelt, log, historikFor, maaRette, maaRetteRoller, retteForklaring, PROTOTYPE_FORBEHOLD, RETTIGHEDER,
    UDFOERELSE_STATUS, FAKTURALINJE_STATUS, FAKTURERING_STATUS, INSTALLATION_STATUS, INSTALLATION_TYPER,
    get currentProj() { return S.currentProj || null; },
    icons: ['feed', 'screen', 'calendar-check', 'mobile', 'home', 'check', 'close', 'export', 'search', 'service', 'user', 'time', 'mail', 'notification', 'download', 'info', 'shield-check', 'location'],
  };

  document.addEventListener('DOMContentLoaded', () => {
    initUser(); mount(); renderNav();
    const start = S.lastPage && visiblePages().find(p => p.id === S.lastPage && p.id !== 'projekt') ? S.lastPage : defaultPage();
    go(start);
    // Menuen skifter form ved 900 px (flad stribe <-> grupper med udslag) – byg den om, hvis vinduet
    // krydser grænsen live, uden at brugeren genindlæser.
    try { window.matchMedia('(max-width: 900px)').addEventListener('change', () => renderNav()); } catch (e) {}
    // Skifter vinduet mellem bred menu og skinne, bygges menuen om, så fold-tilstand (bred) og udslag (skinne) ikke blandes
    try { window.matchMedia('(max-width: 1440px)').addEventListener('change', () => renderNav()); } catch (e) {}
    // F8: en åben filterpopover er positioneret ud fra sin kolonne ved åbning og følger ikke med, hvis
    // vinduet ændrer størrelse – luk den i stedet for at lade den svæve forkert placeret.
    try { window.addEventListener('resize', () => { if (colFilterPop && !colFilterPop.hidden) closeColFilterPop(false); }); } catch (e) {}
  });
})();

</script>
<script>
// Indbakke – nye sager fra salg. Erstatter "projekt modtagende projekter.xlsx".
//
// A1 (F3): salgsleddet skal kunne ses igen fra kundebilledet. Tildelingen skriver p.salg og arkiverer
// posten i S.salgsarkiv (bølge B3); window.SalgsLed herunder er den fælles LÆSEVEJ, så kundebilledet kan
// vise salget uden at kende indbakkens opbygning – samme mønster som window.ProjektFlow i projekt.js.
window.SalgsLed = {
  // Salgsleddet for ét projekt. p.salg er kilden. Findes den ikke (projekter fra før tildelingen gemte
  // den), læses arkivposten, så gamle sager ikke står tomme i forløbet. Sidste udvej er projektets eget
  // opportunity-nummer – det er stadig et salgsled, bare uden sælger og servicebeløb.
  forProjekt(p) {
    if (!p) return null;
    const s = p.salg || {};
    if (s.saelger || s.arkitekt || s.servicebeloeb || s.opportunity || s.modtaget) {
      return {
        saelger: s.saelger || '', arkitekt: s.arkitekt || '', servicebeloeb: +s.servicebeloeb || 0,
        opportunity: s.opportunity || p.opportunity || '', modtaget: s.modtaget || '', kilde: 'projekt',
      };
    }
    const a = (App.S.salgsarkiv || []).find(x => x.projektId === p.id);
    if (a) {
      return {
        saelger: a.salg || '', arkitekt: a.arkitekt || '', servicebeloeb: +a.service || 0,
        opportunity: a.opportunity || p.opportunity || '', modtaget: a.dato || '', kilde: 'arkiv',
      };
    }
    if (!p.opportunity) return null;
    return { saelger: '', arkitekt: '', servicebeloeb: 0, opportunity: p.opportunity, modtaget: '', kilde: 'projekt' };
  },
  // Poster, der endnu ligger i indbakken – forløbet begynder ved salget, ikke først ved projektet.
  afventer(siteId) { return (App.S.indbakke || []).filter(i => i.siteId === siteId); },
  // Arkiverede (tildelte) poster på et site. Bruges ikke af skærmene i dag, men er den vej tilbage til
  // den oprindelige post, hvis et projekt slettes – derfor eksponeret sammen med resten.
  arkivFor(siteId) { return (App.S.salgsarkiv || []).filter(a => a.siteId === siteId); },
  // Hvad der reelt mangler, før sagen kan tildeles – regnet ud af data i stedet for kun at gengive
  // salgs fritekst (KRAV-GAP A1a: "Mangler"-kolonnen blokerer intet). Den BLOKERER fortsat ikke:
  // listen vises i kolonnen og i tildel-modalen, og sagen kan tildeles alligevel.
  mangler(i) {
    const o = i || {};
    const ud = [];
    const s = App.site(o.siteId);
    if (!s.id) ud.push('Site findes ikke');
    else {
      if (!App.kundeAf(s).id) ud.push('Kunde ikke koblet på sitet');
      if (!s.stedNr) ud.push('Sted nr.');
    }
    if (!o.opportunity) ud.push('Opportunity');
    if (!(+o.oekonomi)) ud.push('Salgspris');
    return ud;
  },
};

App.registerPage({
  id: 'indbakke', label: 'Indbakke', group: 'Projekter', icon: 'feed', order: 10,
  roles: ['Chef', 'PM'],
  html: `
    <div class="page-head">
      <div>
        <h1>Indbakke – nye sager fra salg</h1>
        <p>Salg registrerer sagen én gang med opportunity og site. Henrik tildeler afdeling og projektleder, og sagen bliver til et projekt med stamdata udfyldt.</p>
      </div>
      <div class="replaces">Erstatter <b>projekt modtagende projekter.xlsx</b></div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Dato</th><th>Opportunity</th><th>Kunde og site</th><th>Produkt</th><th>Beskrivelse</th><th class="num">Økonomi</th><th>Model</th><th>Salg</th><th>Mangler</th><th></th>
          </tr></thead>
          <tbody id="inboxRows"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-bg" id="modalAssign">
      <div class="modal" role="dialog" aria-labelledby="assignTitle">
        <header><h2 id="assignTitle">Tildel projekt</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <p id="assignInfo" style="margin-bottom:18px"></p>
          <p class="caption muted" style="margin-bottom:18px">Sælger, arkitekt og servicebeløb følger med over på projektet og kan ses igen i kundens forløb.</p>
          <div class="form-grid">
            <label>Projektnummer<input type="text" id="aPrdk" readonly></label>
            <label>Afdeling<select id="aAfd"><option>Generel</option><option>Novo</option></select></label>
            <label>Projektleder<select id="aPm"></select></label>
            <label>Installationstype<select id="aType"><option>AIA</option><option>ADK</option><option>TVO</option><option>KOMBI</option><option>ANDET</option></select></label>
          </div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="aOk">Opret projekt og send til PM</button></footer>
      </div>
    </div>
  `,
  // Afdelingen gættes ud fra kundens hidtidige projekter i stedet for at læse kundenavnet: navnet er
  // et spejlfelt, og "starter med Novo" holdt kun, så længe én kunde havde sin egen afdeling.
  // Ligger på siden (ikke i init), så den kan afprøves uden DOM – se tools/test-b3.js.
  afdelingForSite(siteId) {
    const { S } = App;
    const kundeId = App.kundeAf(siteId).id;
    const sites = kundeId ? (S.sites || []).filter(x => x.kundeId === kundeId).map(x => x.id) : [siteId];
    const tal = {};
    (S.projekter || []).forEach(p => { if (sites.includes(p.siteId) && p.afdeling) tal[p.afdeling] = (tal[p.afdeling] || 0) + 1; });
    return Object.keys(tal).sort((a, b) => tal[b] - tal[a])[0] || 'Generel';
  },
  init() {
    const { $, S, D, site, emp, save, toast, today, now, openModal, closeModal, openProject } = App;
    let assigning = null;
    this.openAssign = id => {
      assigning = S.indbakke.find(i => i.id === id);
      const s = site(assigning.siteId);
      // Samme mangelliste som kolonnen – advarsel, ikke spærring: PM kan tildele og rette sitet bagefter.
      const mangler = window.SalgsLed.mangler(assigning);
      $('#assignInfo').innerHTML = `<b>${App.h(App.kundeNavn(s))}</b> – ${App.h(assigning.tekst)}<br><span class="muted">${App.h(assigning.opportunity)} · ${App.h(App.siteLabel(s))} · sted nr. ${App.h(s.stedNr) || 'mangler'}</span>`
        + (mangler.length ? `<br><span class="alert">Mangler: ${App.h(mangler.join(' · '))}</span><br><span class="caption muted">Sagen kan tildeles alligevel – felterne rettes på sitet bagefter.</span>` : '')
        + (assigning.mangler ? `<br><span class="caption muted">Note fra salg: ${App.h(assigning.mangler)}</span>` : '');
      $('#aPrdk').value = 'PRDK00' + S.nextPrdk;
      $('#aAfd').value = this.afdelingForSite(s.id);
      const pm = $('#aPm'); pm.innerHTML = '';
      D.medarbejdere.filter(m => m.rolle === 'PM').forEach(m => pm.add(new Option(`${m.navn} (${m.afdeling})`, m.id)));
      $('#aType').value = ['AIA', 'ADK', 'TVO'].includes(assigning.produkt) ? assigning.produkt : 'KOMBI';
      openModal('modalAssign');
    };
    $('#aOk').addEventListener('click', () => {
      const i = assigning, s = site(i.siteId);
      const p = window.ProjectFactory.create({
        navn: `${s.navn} – ${i.tekst}`, siteId: s.id, opportunity: i.opportunity,
        type: $('#aType').value, model: i.model, pm: $('#aPm').value, afdeling: $('#aAfd').value,
        rekvirent: s.kontakt || '', salgspris: i.oekonomi, salgKost: Math.round(i.oekonomi * 0.65),
        mdlRate: i.mdlRate, loebetid: i.loebetid,
      });
      // A1: salgsleddet følger med over på projektet i stedet for at forsvinde med indbakke-posten,
      // og posten arkiveres, så forløbet Salg → Installation → Service kan vises på kundebilledet (F3).
      p.salg = { saelger: i.salg || '', arkitekt: i.arkitekt || '', servicebeloeb: +i.service || 0, opportunity: i.opportunity, modtaget: i.dato };
      S.salgsarkiv = S.salgsarkiv || [];
      S.salgsarkiv.push({ ...i, tildelt: today(), tildeltAf: S.user, projektId: p.id });
      S.indbakke = S.indbakke.filter(x => x.id !== i.id);
      save(); closeModal('modalAssign');
      toast(`${p.id} er oprettet og sendt til ${emp(p.pm).navn}`);
      openProject(p.id);
    });
  },
  render() {
    const { $, $$, S, site, kr, h, icon, siteLabel } = App;
    const tb = $('#inboxRows');
    if (!S.indbakke.length) { tb.innerHTML = '<tr><td colspan="10" class="empty">Ingen nye sager. Alt er tildelt.</td></tr>'; return; }
    tb.innerHTML = S.indbakke.map(i => {
      const s = site(i.siteId);
      // "Mangler" viser de huller, vi selv kan se i data; salgs egen note står under som note, så en
      // forældet note (fx "mangler sted nr." på et site, der har fået et) ikke læses som en sandhed.
      const mangler = window.SalgsLed.mangler(i);
      const manglerCelle = [
        mangler.length ? `<span class="alert">${h(mangler.join(' · '))}</span>` : '',
        i.mangler ? `<span class="caption muted">Note fra salg: ${h(i.mangler)}</span>` : '',
      ].filter(Boolean).join('<br>') || `<span class="st nodot" style="gap:3px">${icon('check')} Komplet</span>`;
      return `<tr>
        <td>${i.dato}</td><td><b>${h(i.opportunity)}</b></td>
        <td><b>${h(App.kundeNavn(s))}</b><br><span class="muted">${h(siteLabel(s))}</span></td>
        <td>${h(i.produkt)}</td><td style="max-width:28ch">${h(i.tekst)}</td>
        <td class="num">${kr(i.oekonomi)}${i.model === 'Solution' ? `<br><span class="caption muted">${i.loebetid} mdr. × ${kr(i.mdlRate)}</span>` : ''}</td>
        <td>${h(i.model)}</td><td>${h(i.salg)}</td>
        <td>${manglerCelle}</td>
        <td><button class="tlink" data-assign="${i.id}">Tildel</button></td>
      </tr>`;
    }).join('');
    $$('[data-assign]', tb).forEach(b => b.addEventListener('click', () => this.openAssign(b.dataset.assign)));
  },
});

</script>
<script>
// Projektoverblik. Erstatter "Projekter"-arket i begge xlsm-filer.

// Fælles fabrik til at oprette projekter – bruges herfra og fra pages/indbakke.js,
// så begge steder opretter projekter med samme struktur (stamdata, tomme lister, opstartslog).
window.ProjectFactory = {
  create(opts) {
    const { S, today, now } = App;
    const id = 'PRDK00' + S.nextPrdk;
    // v7 (PLAN-v6-spor1 §1.4): udførelsen gemmes, faktureringsstatus er afledt af linjerne, og
    // overdragelsen er afslutningen. Underleverandøren peger på et id; mangler den, arver projektet
    // sitets egen UL fra installationerne. Sted nr. bor kun på sitet og slås op med App.stedNr().
    const ulId = opts.ulId != null ? opts.ulId : ((App.installationer(opts.siteId).find(i => i.ulId) || {}).ulId || '');
    const p = {
      id, navn: opts.navn, siteId: opts.siteId, opportunity: opts.opportunity,
      // C4/C5 (KRAV-GAP-v6): valgfrie linkfelter til CEP – tomme som standard, så eksisterende gemt state er uændret.
      cepProjektUrl: '', opportunityUrl: '',
      type: opts.type, model: opts.model || 'Kontant', pm: opts.pm, se: '', ulId, afdeling: opts.afdeling,
      udfoerelse: App.UDFOERELSE_STATUS[0], overdragelse: null,
      oprettet: today(), maaned: today().slice(0, 7), rekvirent: opts.rekvirent || '', ref: opts.ref || '', wo: opts.wo || '',
      salgspris: opts.salgspris || 0, ekstraArbejde: opts.ekstraArbejde || 0,
      salgKost: opts.salgKost != null ? opts.salgKost : Math.round((opts.salgspris || 0) * 0.65),
      mdlRate: opts.mdlRate || 0, loebetid: opts.loebetid || 0,
      // F10 (krav C1): en læst kalk gemmes med tallene bag salgspris/kostpris, så stamdata senere kan vise
      // kilden ("fra kalk <fil>" i stedet for "skøn (65 %)"). null, når sagen er oprettet uden kalk.
      kalk: opts.kalk || null,
      udgifter: [], fakturering: [],
      log: [{ dato: now(), tekst: opts.logTekst || 'Oprettelse af sag samt overdragelse af projekt', af: S.user, pmTid: 0.5, seTid: 0, ulTid: 0 }],
    };
    S.projekter.unshift(p);
    S.nextPrdk++;
    return p;
  },
};

  `,
  init() {
    const { $, $$, D, S, site, bc, save, toast, openModal, closeModal, openProject, h, kr, siteLabel } = App;
    const fPm = $('#fPm');
    D.medarbejdere.filter(m => m.rolle === 'PM').forEach(m => fPm.add(new Option(m.navn, m.id)));
    // Rollen PM: filteret forudindstilles til brugeren selv, men først når rollen er kendt (render), og
