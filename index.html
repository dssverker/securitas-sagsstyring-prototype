      $('#btnBackKunder').addEventListener('click', () => { kCurrentKunde = null; this.render(); });
      $('#kdSearch').addEventListener('input', () => this.renderKundeDetail());
      // Forløbet er langt på en kunde med mange sites; valget om at folde det væk huskes som
      // "Vis flere felter" gør det. Standard er vist, fordi det er selve pointen med kundebilledet.
      $('#kdForloebToggle').addEventListener('click', () => {
        S.kunderVisForloeb = !(S.kunderVisForloeb !== false);
        save(); this.renderKundeDetail();
      });

      // ---------- F2: rediger kundens stamdata ----------
      $('#kdBtnRediger').addEventListener('click', () => { kunRedigerer = true; this.renderStamdata(); });
      $('#kdBtnAnnuller').addEventListener('click', () => { kunRedigerer = false; this.renderStamdata(); });
      $('#kdBtnGem').addEventListener('click', () => this.gemStamdata());
      $('#kdHistorikToggle').addEventListener('click', () => { S.kunderVisHistorik = !S.kunderVisHistorik; save(); this.renderStamdata(); });
      $('#kdHistorikSoeg').addEventListener('input', () => { kunHistSoeg = ($('#kdHistorikSoeg').value || '').trim().toLowerCase(); this.renderStamdata(); });

      // ---------- F5: noter på kunden ----------
      $('#kdNoteAdd').addEventListener('click', () => {
        if (this.tilfoejKundeNote($('#kdNoteTekst').value)) { $('#kdNoteTekst').value = ''; toast('Noten er tilføjet'); this.renderKundeDetail(); }
        else toast('Skriv en note, før den kan tilføjes');
      });

      this.openKunde = kundeId => { kCurrentKunde = kundeId; kdSearch = ''; $('#kdSearch').value = ''; kunRedigerer = false; this.render(); };
      // Kaldes af sites.js' "Kunder"-fane, så et fane-skifte altid lander på listen (samme regel som
      // det gamle kView-flag: skift til "Kunder" nulstillede den valgte kunde).
      this.tilbageTilListe = () => { kCurrentKunde = null; };

      // ---------- ny kunde ----------
      // Opretter en rigtig kundepost (næste K-id) i stedet for det gamle falske site "<kunde> – hovedadresse".
      // Kunden har ingen adresse i v7-modellen – sites tilføjes bagefter via "Nyt site" på kundens side.
      $('#btnNewKunde').addEventListener('click', () => {
        $('#nkNavn').value = ''; $('#nkCepAccount').value = '';
        openModal('modalNewKunde');
      });
      $('#nkOk').addEventListener('click', () => {
        // F2: vagten sidder på selve skrivningen, ikke kun på knappen – knappen er skjult for dem, der
        // ikke må oprette, men en skjult knap er ikke en håndhævelse (se "Kun simulerbart" i planen).
        if (!App.maaRette('kunde')) { toast('Du kan ikke oprette kunder'); return; }
        const navn = $('#nkNavn').value.trim();
        if (!navn) { toast('Udfyld kunde navn'); return; }
        if ((S.kunder || []).some(k => k.navn.trim().toLowerCase() === navn.toLowerCase())) { toast('Kunden findes allerede'); return; }
        const cepAccount = $('#nkCepAccount').value.trim();
        S.kunder = S.kunder || [];
        const maxK = S.kunder.reduce((a, k) => { const m = /^K-(\d+)$/.exec(k.id); return m ? Math.max(a, +m[1]) : a; }, 0);
        const k = { id: 'K-' + String(maxK + 1).padStart(4, '0'), navn, cepAccount, cepAccountNavn: cepAccount ? navn : '', alias: [], noter: [], oprettet: today() };
        S.kunder.push(k);
        // Oprettelse er en sammensat hændelse: én post i stedet for ét felt ad gangen (planens §3 om
        // App.log til sammensatte ændringer). App.log kalder selv save().
        App.log('kunde', k.id, 'oprettet', '', navn);
        closeModal('modalNewKunde');
        toast(`${navn} er oprettet`);
        this.openKunde(k.id);
      });

      // ---------- nyt site: åbnes herfra (kundekonteksten kendes kun her), oprettes i pages/sites.js ----------
      $('#btnNewSite').addEventListener('click', () => {
        if (!kCurrentKunde) return;
        App.getPage('sites').openNewSiteFor(kCurrentKunde);
      });
    },

    // ---------- F2: kundens stamdata, rettigheder og historik ----------
    // Egen render, så "Rediger"/"Gem"/"Annullér" og historik-foldningen kan tegne kortet om uden at
    // bygge forløbet, noterne og site-tabellen op igen.
    renderStamdata() {
      const { $, $$, h, S } = App;
      const k = App.kunde(kCurrentKunde);
      const maa = App.maaRette('kunde', k);
      if (!maa) kunRedigerer = false;   // rolleskift midt i en redigering må ikke efterlade skrivbare felter
      $('#kdStamdataHvem').textContent = maa
        ? 'Du må rette kundeposten. Hver ændring gemmes med hvem, hvornår og fra → til.'
        : App.retteForklaring('kunde', k);
      $('#kdBtnRediger').style.display = maa && !kunRedigerer ? '' : 'none';
      $('#kdBtnGem').style.display = kunRedigerer ? '' : 'none';
      $('#kdBtnAnnuller').style.display = kunRedigerer ? '' : 'none';
      $('#kdStamdataFelter').innerHTML = KUN_FELTER.map(f => {
        const v = f.liste ? (k[f.felt] || []).join(', ') : (k[f.felt] ?? '');
        const skrivbar = kunRedigerer && f.rediger;
        const note = f.laast ? `<span class="caption">${h(f.laast)}</span>` : (skrivbar && f.hint ? `<span class="caption">${h(f.hint)}</span>` : '');
        return `<label>${h(f.label)}${note}<input type="text" id="kdf-${f.felt}" value="${h(String(v))}"${skrivbar ? '' : ' readonly'}></label>`;
      }).join('');

      const vis = !!S.kunderVisHistorik;
      const btn = $('#kdHistorikToggle');
      btn.textContent = vis ? 'Skjul historik' : 'Vis historik';
      btn.setAttribute('aria-expanded', vis ? 'true' : 'false');
      btn.classList.toggle('on', vis);
      $('#kdHistorikBody').style.display = vis ? '' : 'none';
      if (!vis) return;
      const poster = App.historikFor('kunde', k.id)
        .filter(p => !kunHistSoeg || `${p.felt} ${p.fra} ${p.til} ${p.af} ${p.dato}`.toLowerCase().includes(kunHistSoeg));
      $('#kdHistorikListe').innerHTML = kunLogListe(poster);
      $('#kdHistorikForbehold').textContent = App.PROTOTYPE_FORBEHOLD;
    },

    gemStamdata() {
      const { $, S, toast } = App;
      const k = App.kunde(kCurrentKunde);
      if (!App.maaRette('kunde', k)) { toast('Du kan ikke rette kundeposten'); return false; }
      const navn = ($('#kdf-navn').value || '').trim();
      if (!navn) { toast('Kunde navn kan ikke være tomt'); return false; }
      if ((S.kunder || []).some(x => x.id !== k.id && String(x.navn || '').trim().toLowerCase() === navn.toLowerCase())) { toast('En anden kunde hedder allerede det'); return false; }
      let aendret = App.saetFelt(k, 'kunde', k.id, 'navn', navn) ? 1 : 0;
      // alias er en liste: App.saetFelt sammenligner med === og ville logge hver gang, så ændringen
      // afgøres på den sammenføjede tekst og skrives med App.log (samme vej, samme postformat).
      const nyAlias = ($('#kdf-alias').value || '').split(',').map(x => x.trim()).filter(Boolean);
      const foerAlias = (k.alias || []).join(', '), tilAlias = nyAlias.join(', ');
      if (foerAlias !== tilAlias) { k.alias = nyAlias; App.log('kunde', k.id, 'alias', foerAlias, tilAlias); aendret++; }
      App.save();
      kunRedigerer = false;
      this.renderKundeDetail();
      toast(aendret ? 'Kundens stamdata er gemt' : 'Ingen ændringer at gemme');
      return aendret > 0;
    },

    // ---------- F5: noter på kunden ----------
    // Noter er ikke stamdata: alle, der kan se kunden, må skrive en note (planens F5-afsnit), og
    // App.maaRette spørges derfor bevidst ikke her. Slet-reglen er projektloggens: kun sine egne.
    tilfoejKundeNote(tekst) {
      const k = App.kunde(kCurrentKunde);
      const t = String(tekst || '').trim();
      if (!k.id || !t) return false;
      k.noter = k.noter || [];
      k.noter.push({ dato: App.now(), af: App.S.user, tekst: t });
      App.log('kunde', k.id, 'note', '', t);   // også i historikken, så ét sted viser hele billedet
      return true;
    },
    sletKundeNote(i) {
      const k = App.kunde(kCurrentKunde);
      const n = (k.noter || [])[i];
      if (!n) return false;
      if (n.af !== App.S.user) { App.toast('Du kan kun slette dine egne noter'); return false; }
      k.noter.splice(i, 1);
      App.log('kunde', k.id, 'note', n.tekst, '');
      return true;
    },

    // ---------- åbne sager pr. site ----------
    // Delt i to tal i stedet for én blandet "Åbne sager" (§2.5): igangværende projekter via
    // App.igangvaerendeProjekter (afgøres af overdragelse, ikke af den gamle status) og åbne serviceopgaver for sig.
    // Bruges både af kundeoversigten (aggregeret pr. kunde) og kundebilledets stats/site-liste.
    openSagerForSite(id) {
      const { S } = App;
      return {
        projekter: App.igangvaerendeProjekter(id),
        service: (S.serviceopgaver || []).filter(o => o.siteId === id && o.status === 'Åben').length,
      };
    },

    // ---------- F3: hele forløbet for ét site, samlet ét sted (A1, A1c, B5) ----------
    // Ren datafunktion uden DOM, så den kan afprøves direkte i tools/test-f3.js. Læser kun de nye felter
    // via kernens helpers; spejlfelterne (site.installation, p.status m.fl.) røres ikke.
    forloebForSite(siteId) {
      const { S } = App;
      const SL = kunSalgsLed();
      const projekter = (S.projekter || []).filter(p => p.siteId === siteId);
      // Spørgsmål 12: igangværende = projekt uden overdragelse, uanset faktureringsstatus.
      const igangvaerende = projekter.filter(p => App.erIgangvaerende(p));
      const overdragne = projekter.filter(p => !App.erIgangvaerende(p))
        .sort((a, b) => String((b.overdragelse || {}).dato || '').localeCompare(String((a.overdragelse || {}).dato || '')));
      // Salgsleddet: tildelte sager (p.salg, med S.salgsarkiv som reserve) og de poster, der stadig
      // ligger i indbakken. Nyeste først, så det senest solgte står øverst i båndet.
      const salg = projekter.map(p => ({ projekt: p, led: SL.forProjekt(p) })).filter(x => x.led)
        .sort((a, b) => String(b.led.modtaget || b.projekt.oprettet || '').localeCompare(String(a.led.modtaget || a.projekt.oprettet || '')));
      const installationer = App.installationer(siteId);
      const opgaver = (S.serviceopgaver || []).filter(o => o.siteId === siteId);
      const aabne = opgaver.filter(o => o.status === 'Åben');
      return {
        site: App.site(siteId), projekter, igangvaerende, overdragne,
        salg, afventer: SL.afventer(siteId),
        installationer,
        underInstallation: installationer.filter(i => i.status === App.INSTALLATION_STATUS[0]),
        opgaver, aabne, lukkede: opgaver.length - aabne.length,
        aftaler: App.serviceaftaler(siteId), eftersyn: App.eftersynSite(siteId),
        // B5: "har/er en igangværende installation". Demo-data har ingen installationer med status
        // "Under installation", fordi statussen først sættes ved overdragelsen – installationsarbejdet
        // ER projektet, så et ikke-overdraget projekt tæller med. Ellers ville markeringen aldrig ses.
        igang: installationer.some(i => i.status === App.INSTALLATION_STATUS[0]) || igangvaerende.length > 0,
      };
    },

    // Fire celler pr. site. Holdt adskilt fra render(), så hver kolonne kan læses for sig.
    forloebCeller(f) {
      const { h, kr, st, emp } = App;
      const mangelSted = f.site.stedNr ? '' : kunLinje('<span class="alert">Sted nr. mangler</span>');

      // Site: navn, adresse og B5-markeringen.
      const site = `<b>${h(f.site.kode || f.site.navn || f.site.id)}</b>`
        + kunLinje(`<span class="muted">${h(f.site.navn)}</span>`)
        + kunLinje(`<span class="caption muted">${h(App.siteAddress(f.site))}</span>`)
        + mangelSted
        + kunLinje(f.igang
          ? `<span class="st udf">Installation i gang</span>`
          : (f.installationer.length ? '<span class="st fakt">Alt i drift</span>' : '<span class="st">Ingen installationer</span>'));

      // Salg: det, der er solgt. Indbakke-poster først – de er det seneste, der er sket.
      const salgPoster = f.afventer.map(i => kunPost(
        `<b>${h(i.opportunity)}</b>`
        + kunLinje(`<span class="caption muted">${h([i.salg, i.dato].filter(Boolean).join(' · ')) || 'Sælger ikke registreret'}</span>`)
        + (i.service ? kunLinje(`<span class="caption">Service ${h(kr(i.service))}</span>`) : '')
        + kunLinje('<span class="caption muted">Afventer tildeling i indbakken</span>')))
        .concat(f.salg.map(x => kunPost(
          kunProjLink(x.projekt.id) + ` <span class="muted">${h(x.led.opportunity)}</span>`
          // Projekter fra før tildelingen gemte salgsleddet har hverken sælger eller modtagelsesdato;
          // så står projektets egen oprettelsesdato der i stedet for en tom linje.
          + kunLinje(`<span class="caption muted">${h([x.led.saelger || 'Sælger ikke registreret',
            x.led.modtaget || (x.projekt.oprettet ? 'oprettet ' + x.projekt.oprettet : '')].filter(Boolean).join(' · '))}</span>`)
          + (x.led.arkitekt ? kunLinje(`<span class="caption muted">Arkitekt ${h(x.led.arkitekt)}</span>`) : '')
          + (x.led.servicebeloeb ? kunLinje(`<span class="caption">Service ${h(kr(x.led.servicebeloeb))}</span>`) : ''))));
      const salg = salgPoster.join('') || '<span class="muted">Intet salg registreret på sitet.</span>';

      // Installation: installationerne med status, overdragelsesdato og projektet de kom fra (A1c),
      // og de projekter, der stadig er i gang på sitet.
      const instPoster = f.installationer.map(i => kunPost(
        `<b>${h(i.type)}</b> ${st(i.status)}`
        + (i.anlaeg ? kunLinje(`<span class="caption muted">Anlæg ${h(i.anlaeg)}</span>`) : '')
        + (i.overdraget
          ? kunLinje(`<span class="caption muted">Overdraget ${h(i.overdraget)}${i.fraProjekt ? ' fra ' + kunProjLink(i.fraProjekt) : ''}</span>`)
          : (i.fraProjekt ? kunLinje(`<span class="caption muted">Fra ${kunProjLink(i.fraProjekt)}</span>`) : ''))))
        .concat(f.igangvaerende.map(p => kunPost(
          kunProjLink(p.id) + ` ${st(App.projStatus(p).samlet)}`
          + kunLinje(`<span class="caption muted">${h(p.navn)}</span>`)
          + kunLinje(`<span class="caption muted">${h(emp(p.pm).navn)}${p.type ? ' · ' + h(p.type) : ''}</span>`))))
        // A1c: overdragne projekter står med, også når overdragelsen ikke pegede på en installation
        // (de to migrerede sager har tom installationIds) – ellers forsvandt de helt fra forløbet.
        .concat(f.overdragne.map(p => kunPost(
          kunProjLink(p.id) + ` ${st('Overdraget')}`
          + kunLinje(`<span class="caption muted">${h(p.navn)}</span>`)
          + kunLinje(`<span class="caption muted">Overdraget ${h(p.overdragelse.dato)} af ${h(emp(p.overdragelse.af).navn)}</span>`))));
      const installation = instPoster.join('') || '<span class="muted">Ingen installationer eller projekter på sitet.</span>';

      // Service: aftale, eftersyn og opgaverne. Lukkede opgaver tælles, åbne kan åbnes.
      const servicePoster = [kunPost(
        (f.aftaler.length ? `<b>${h(f.aftaler.join(', '))}</b>` : '<span class="alert">Ingen serviceaftale</span>')
        + kunLinje(`<span class="caption muted">${f.eftersyn.aktiv
          ? `Eftersyn: måned ${h(f.eftersyn.maaned || '–')} · ${h(f.eftersyn.interval)} mdr.${f.eftersyn.naeste ? ' · næste ' + h(f.eftersyn.naeste) : ''}`
          : 'Intet aktivt eftersyn'}</span>`))]
        .concat(f.aabne.map(o => kunPost(
          `<button type="button" class="tlink" data-opgave="${h(o.id)}">${h(o.id)}</button> ${st(o.status)}`
          + kunLinje(`<span class="caption muted">${h(o.beskrivelse)}</span>`)
          // fraProjekt sættes af Service-siden; parent er en delopgave oprettet fra projektkortet.
          + ((o.fraProjekt || o.parent) ? kunLinje(`<span class="caption muted">Fra ${kunProjLink(o.fraProjekt || o.parent)}</span>`) : ''))))
        .concat(f.lukkede ? [kunPost(`<span class="caption muted">${f.lukkede} lukket${f.lukkede === 1 ? ' opgave' : 'e opgaver'} på sitet</span>`)] : [])
        .concat(!f.aabne.length && !f.lukkede ? [kunPost('<span class="caption muted">Ingen serviceopgaver endnu.</span>')] : []);

      return { site, salg, installation, service: servicePoster.join('') };
    },

    // Kolonneopsæt til kundeoversigten (E1). De fire krævede kolonner er altid med; resten samles bag
    // "Vis flere felter", som i kontering.js' "Vis BC-felter" (planens konflikt 3, spørgsmål 13).
    columns() {
      const { h } = App;
      const base = [
        { label: 'Kunde', sort: 'text', cell: k => `<td><b>${h(k.navn)}</b></td>` },
        { label: 'CEP account', sort: 'text', cell: k => `<td>${h(k.account)}</td>` },
        { label: 'Sites', sort: 'num', num: true, cell: k => `<td class="num">${k.sites}</td>` },
        { label: 'Igangv. projekter', sort: 'num', num: true, cell: k => `<td class="num">${k.projekter}</td>` },
      ];
      const flere = [
        { label: 'Serviceaftaler', sort: 'num', num: true, cell: k => `<td class="num">${k.aftaler}</td>` },
        { label: "UL'er", sort: 'text', cell: k => `<td>${k.uler.length ? h(k.uler.join(', ')) : '–'}</td>` },
        { label: 'Åbne opgaver', sort: 'num', num: true, cell: k => `<td class="num">${k.service}</td>` },
      ];
      return App.S.kunderVisFlere ? [...base, ...flere] : base;
    },

    render() {
      const { $ } = App;
      // App._highlightSite sættes af projekt.js efter en overdragelse og peger på site-oversigten (nu
      // en selvstændig side) – findes flaget, må vi videresende dertil i stedet for at knække kaldet.
      // Deferet ét tick, så det ikke kolliderer med App.go()'s egen efterbehandling af DENNE navigation.
      if (App._highlightSite) { setTimeout(() => App.go('sites'), 0); return; }
      $('#kundeListeView').style.display = kCurrentKunde ? 'none' : '';
      $('#kundeDetailView').style.display = kCurrentKunde ? '' : 'none';
      if (kCurrentKunde) this.renderKundeDetail(); else this.renderKundeListe();
    },

    renderKundeListe() {
      const { $, $$, S, h } = App;
      $('#kFlere').classList.toggle('on', !!S.kunderVisFlere);
      // F2: "Ny kunde" er ikke bare væk for dem, der ikke må oprette – der står hvorfor, og hvem der må.
      const maaKunde = App.maaRette('kunde');
      $('#btnNewKunde').style.display = maaKunde ? '' : 'none';
      $('#kunNyKundeLaas').style.display = maaKunde ? 'none' : '';
      $('#kunNyKundeLaas').textContent = maaKunde ? '' : App.retteForklaring('kunde');
      kSearch = ($('#kSearch').value || '').trim().toLowerCase();
      // Kundelisten læser S.kunder direkte (§1.1) i stedet for at gruppere sites på s.kunde-tekststrenge.
      let kunder = (S.kunder || []).map(k => {
        const sites = S.sites.filter(s => s.kundeId === k.id);
        const sager = sites.map(s => this.openSagerForSite(s.id));
        const projekter = sager.reduce((a, x) => a + x.projekter, 0);
        const service = sager.reduce((a, x) => a + x.service, 0);
        const aftaler = sites.filter(s => App.serviceaftaler(s.id).length > 0).length;
        const uler = new Set(sites.flatMap(s => ulNavneForSite(s.id)));
        return { id: k.id, navn: k.navn, account: k.cepAccount ? `${k.cepAccount} – ${k.cepAccountNavn}` : '–', sites: sites.length, projekter, service, aftaler, uler: [...uler] };
      });
      kunder.sort((a, b) => a.navn.localeCompare(b.navn, 'da'));
      if (kSearch) kunder = kunder.filter(k => k.navn.toLowerCase().includes(kSearch));

      const cols = this.columns();
      // thead genskabes hver gang "Vis flere felter" kan ændre antal kolonner, så App.sortable aldrig dobbeltbindes.
      // Egen id (i stedet for this.table.querySelector('thead')): elementets EGEN querySelector bruges
      // ikke andre steder i kodebasen og understøttes ikke af tools/test-b2a.js' DOM-stub.
      $('#kunThead').innerHTML = `<tr>${cols.map(c => `<th${c.num ? ' class="num"' : ''} data-sort="${c.sort}">${c.label}</th>`).join('')}</tr>`;
      $('#kundeRows').innerHTML = kunder.map(k => `
        <tr class="click" data-kunde="${h(k.id)}" tabindex="0">${cols.map(c => c.cell(k)).join('')}</tr>`).join('')
        || `<tr><td colspan="${cols.length}" class="empty">Ingen kunder matcher søgningen. Ryd søgefeltet, eller opret en ny kunde.</td></tr>`;
      $$('[data-kunde]', $('#kundeRows')).forEach(r => r.addEventListener('click', () => this.openKunde(r.dataset.kunde)));
      App.sortable(this.table, 'kunder-liste', { col: 0, dir: 'asc' });
    },

    renderKundeDetail() {
      const { $, $$, S, h, siteLabel } = App;
      const kunde = App.kunde(kCurrentKunde);
      const sites = S.sites.filter(s => s.kundeId === kCurrentKunde);
      $('#kdKundeNavn').textContent = kunde.navn || '';
      $('#kdKundeAccount').textContent = kunde.cepAccount ? `Account: ${kunde.cepAccount} – ${kunde.cepAccountNavn}` : 'Account: ikke fundet i BC-mappingen';

      const sager = sites.map(s => this.openSagerForSite(s.id));
      const projekter = sager.reduce((a, x) => a + x.projekter, 0);
      const service = sager.reduce((a, x) => a + x.service, 0);
      const projekterTotal = sites.reduce((a, s) => a + S.projekter.filter(p => p.siteId === s.id).length, 0);
      const aftaler = sites.filter(s => App.serviceaftaler(s.id).length > 0).length;
      // B5 på kundeniveau: hvor mange af kundens sites har en installation i gang.
      const medIgang = sites.filter(s => this.forloebForSite(s.id).igang).length;
      $('#kdStats').innerHTML = [
        ['Sites', sites.length], ['Igangværende projekter', projekter], ['Åbne serviceopgaver', service],
        ['Serviceaftaler', aftaler], ['Sites med installation i gang', medIgang], ['Projekter i alt', projekterTotal],
      ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

      // A1c: færdigt/overdraget projekt som et felt på stamdata – ikke som bivirkning i "Sidst opdateret",
      // der betyder sidst efterset. Datoen og projektnummeret kommer fra p.overdragelse (krav C10).
      const overdragne = sites.flatMap(s => S.projekter.filter(p => p.siteId === s.id && p.overdragelse))
        .sort((a, b) => String(b.overdragelse.dato || '').localeCompare(String(a.overdragelse.dato || '')));
      const senest = overdragne[0];
      $('#kdOverdraget').innerHTML = senest
        ? `Senest overdraget til service: ${kunProjLink(senest.id)} · ${h(senest.overdragelse.dato)} · ${h(siteLabel(App.site(senest.siteId)))}`
          + (overdragne.length > 1 ? ` <span class="muted">(${overdragne.length} overdragne projekter i alt)</span>` : '')
        : '<span class="muted">Ingen projekter er overdraget til service endnu. Overdragelsen sker fra projektkortets "Afslut projekt".</span>';
      $$('[data-proj]', $('#kdOverdraget')).forEach(b => b.addEventListener('click', () => App.openProject(b.dataset.proj)));

      // F2 og F5: stamdata med rettigheder og historik, og kundens noter.
      this.renderStamdata();
      $('#kdNoteListe').innerHTML = kunNoteListe(kunde.noter);
      $$('[data-notedel]', $('#kdNoteListe')).forEach(b => b.addEventListener('click', () => {
        if (this.sletKundeNote(+b.dataset.notedel)) { App.toast('Noten er slettet'); this.renderKundeDetail(); }
      }));
      // F2: "Nyt site" følger site-rettigheden, ikke kunde-rettigheden – en PM må oprette sites.
      const maaSite = App.maaRette('site');
      $('#btnNewSite').style.display = maaSite ? '' : 'none';
      $('#kdNytSiteLaas').style.display = maaSite ? 'none' : '';
      $('#kdNytSiteLaas').textContent = maaSite ? '' : App.retteForklaring('site');

      // Kundebilledets ramme viser en kort site-liste (BC-detaljer og installationsdetaljer er ét
      // klik væk via site-detaljen); den fulde, foldbare site-oversigt med "Vis flere felter" er E2's
      // egen side (pages/sites.js) – se planens "Begge tabeller" (kundeoversigt + site-oversigt).
      kdSearch = ($('#kdSearch').value || '').trim().toLowerCase();
      let rows = sites;
      if (kdSearch) rows = rows.filter(s => `${s.kode || ''} ${s.navn} ${s.adresse}`.toLowerCase().includes(kdSearch));
      rows = [...rows].sort((a, b) => siteLabel(a).localeCompare(siteLabel(b), 'da'));

      this.renderForloeb(rows);

      $('#kdSiteRows').innerHTML = rows.map(s => {
        const sagerSite = this.openSagerForSite(s.id);
        return `<tr class="click" data-open="${h(s.id)}" tabindex="0">
          <td>${s.kode ? h(s.kode) : '–'}</td><td>${h(siteLabel(s))}</td><td>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</td>
          <td>${h(App.installationTyper(s.id)) || '–'}</td><td>${h(App.serviceaftaler(s.id).join(', ')) || '–'}</td>
          <td>${h(ulNavneForSite(s.id).join(', ')) || '–'}</td>
          <td class="num">${App.igangvaerendeProjekter(s.id)}</td><td class="num">${sagerSite.service}</td></tr>`;
      }).join('') || `<tr><td colspan="8" class="empty">Ingen sites matcher søgningen på denne kunde. Ryd søgefeltet, eller opret et nyt site.</td></tr>`;
      $$('[data-open]', $('#kdSiteRows')).forEach(r => r.addEventListener('click', () => window.SiteDetaljer.open(r.dataset.open)));
      App.sortable($('#kdTable'), 'kunde-sites', { col: 1, dir: 'asc' });
    },

    // ---------- F3: forløbsbåndene. Ét bånd pr. site, samme udvalg som site-tabellen under. ----------
    renderForloeb(sites) {
      const { $, $$, S, h } = App;
      const vis = S.kunderVisForloeb !== false;
      const btn = $('#kdForloebToggle');
      btn.textContent = vis ? 'Skjul forløb' : 'Vis forløb';
      btn.setAttribute('aria-expanded', vis ? 'true' : 'false');
      btn.classList.toggle('on', vis);
      $('#kdForloebBody').style.display = vis ? '' : 'none';
      if (!vis) return;   // display:none tager også båndene ud af tabulator-rækkefølgen

      $('#kdForloebRows').innerHTML = sites.map(s => {
        const f = this.forloebForSite(s.id);
        const c = this.forloebCeller(f);
        return `<tr class="click${f.igang ? ' igang' : ''}" data-open="${h(s.id)}" tabindex="0">
          <td>${c.site}</td><td>${c.salg}</td><td>${c.installation}</td><td>${c.service}</td></tr>`;
      }).join('') || '<tr><td colspan="4" class="empty">Ingen sites matcher søgningen. Ryd søgefeltet, eller opret et nyt site.</td></tr>';

      const rows = $('#kdForloebRows');
      $$('[data-open]', rows).forEach(r => r.addEventListener('click', () => window.SiteDetaljer.open(r.dataset.open)));
      // Klikfladerne inde i båndet må ikke også åbne sitet – samme greb som "Vis installationer" i sites.js.
      $$('[data-proj]', rows).forEach(b => {
        b.addEventListener('click', e => { e.stopPropagation(); App.openProject(b.dataset.proj); });
        kunStopTaster(b);
      });
      $$('[data-opgave]', rows).forEach(b => {
        b.addEventListener('click', e => {
          e.stopPropagation();
          const svc = App.getPage('service');
          if (svc && svc.openDetaljer) svc.openDetaljer(b.dataset.opgave);
        });
        kunStopTaster(b);
      });
    },
  });
})();

</script>
<script>
// Site-oversigt ("Alle sites", E2), site-detaljen og "Nyt site". Udskilt fra pages/kunder.js (PLAN-v6-spor2
// §F4): én række pr. site med foldbare installations-underrækker (orkestratorens beslutning på konflikt 8 –
// 23 rækker, ikke 42). Registreret som en egen (skjult) side, så "Alle sites" fortsat opfører sig som en fane
// ved siden af "Kunder" (planens ordlyd: "'Alle sites'-fanen beholdes"), men med sit eget filejerskab.
(function () {
  let siFilter = '';          // '' | 'med' | 'uden' serviceaftale
  let siSearch = '';          // søgning på site-oversigten
  let nsKundeId = null;       // kunden "Nyt site" opretter på – sat af kunder.js' openNewSiteFor()

  // ---------- lokal helper (samme som i kunder.js – kernen har ingen "UL-navne pr. site") ----------
  const ulNavneForSite = siteId => [...new Set(App.installationer(siteId).map(i => App.ulNavn(i.ulId)).filter(Boolean))];

  // ---------- F11: indeksering og specialaftaler (C6) ----------
  // installation.prisregulering er valgfrit (data.js sætter null på alle 42 installationer, jf. Spor 1's
  // rettelse i PLAN-v6-spor2 §F11) – { type, sats, sidsteJustering, naesteJustering, specialaftale }.
  // Ingen egen historik-liste: ændringer skrives felt for felt med App.saetFelt() og læses med
  // App.historikFor('installation', id). Disse to læsere tåler null/mangelfulde objekter, så en
  // installation uden aftale ikke vælter hverken panelet eller site-oversigten. Defineret på IIFE'ens
  // yderste niveau (som ulNavneForSite), så både columns() og init()'s lukninger kan bruge dem.
  const PRISREG_TYPER = ['Ingen', 'Nettoprisindeks', 'Fast procent'];
  const PRISREG_FELTER = ['type', 'sats', 'sidsteJustering', 'naesteJustering', 'specialaftale'];
  const PRISREG_LABEL = { type: 'Type', sats: 'Sats', sidsteJustering: 'Seneste justering', naesteJustering: 'Næste justering', specialaftale: 'Specialaftale' };
  const prisreguleringForfalden = i => {
    const p = i && i.prisregulering;
    return !!(p && p.naesteJustering && p.naesteJustering < App.today());
  };
  // ISO-datoer vises rå (som i.eftersyn.sidste andre steder i denne fil) i stedet for en ny dd.mm.åååå-
  // helper – holder filen i sin egen stil i stedet for at genopfinde eftersyn.js' ddmm().
  const prisreguleringSummary = i => {
    const p = i && i.prisregulering;
    if (!p || !p.type || p.type === 'Ingen') return 'Ingen aftale registreret';
    const sats = p.sats ? `${App.n(p.sats)} %` : 'uden sats';
    return `Seneste prisjustering: ${p.sidsteJustering || 'ingen dato endnu'} (${p.type} ${sats})`;
  };

  // ---------- F2: sitets stamdata, rettigheder og historik (B1a, E3, E3a) ----------
  // Site-id kommer fra CEP, og costcenter/TOS/account slås op i BC-mappingen ud fra sted nr. – de fire
  // rettes i kildesystemet og er derfor låst for alle (planens F2-afsnit). Sted nr. ER redigerbart,
  // fordi det netop er nøglen ind i mappingen. Kunden er en relation (kundeId) og flyttes ikke herfra.
  const SI_KOLONNER = 8;   // installationstabellens kolonner – bruges af underrækkernes colspan
  const SI_FELTER = [
    { felt: 'kode', label: 'Kode', rediger: true },
    { fast: s => s.id, label: 'Site (CEP)', laast: 'Nøgle fra CEP' },
    { fast: s => App.kundeNavn(s) || '–', label: 'Kunde', laast: 'Relation' },
    { felt: 'navn', label: 'Site-navn', rediger: true, kraevet: true },
    { felt: 'adresse', label: 'Leveringsadresse', rediger: true, kraevet: true },
    { felt: 'postnr', label: 'Postnr.', rediger: true },
    { felt: 'by', label: 'By', rediger: true },
    { felt: 'stedNr', label: 'Sted nr. (AS400)', rediger: true, hint: 'Nøgle til BC' },
    { fast: (s, m) => m ? `${m.costcenter} – ${m.costcenterNavn}` : '–', label: 'Costcenter', laast: 'Fra BC' },
    { fast: (s, m) => m ? `${m.tos} – ${m.tosNavn}` : '–', label: 'TOS', laast: 'Fra BC' },
    { fast: (s, m) => m ? `${m.account} – ${m.accountNavn}` : '–', label: 'Account', laast: 'Fra BC' },
    { felt: 'timepris', label: 'Timepris mod kunde', rediger: true, tal: true },
    { felt: 'koersel', label: 'Kørsel mod kunde', rediger: true, tal: true },
    { felt: 'kontakt', label: 'Kontakt', rediger: true },
  ];
  const SI_LABEL = { kode: 'Kode', navn: 'Site-navn', adresse: 'Leveringsadresse', postnr: 'Postnr.', by: 'By', stedNr: 'Sted nr.', kontakt: 'Kontakt', timepris: 'Timepris', koersel: 'Kørsel', type: 'Type', anlaeg: 'Anlæg', serviceaftale: 'Serviceaftale', ulId: 'Underleverandør', status: 'Status' };
  // Samme mønster som PRISREG_LABEL, men for hele posten: ulId logges som id og læses lettest som navn.
  const siFeltLabel = felt => PRISREG_LABEL[felt] || SI_LABEL[felt] || felt;
  const siVaerdi = (felt, v) => felt === 'ulId' ? (App.ulNavn(v) || v || '') : v;
  const siHistTekst = p => {
    if (p.felt === 'note') return p.til ? `Note tilføjet: ${p.til}` : `Note slettet: ${p.fra}`;
    if (p.felt === 'oprettet') return `Oprettet: ${p.til}`;
    return `${siFeltLabel(p.felt)}: ${siVaerdi(p.felt, p.fra) || '–'} → ${siVaerdi(p.felt, p.til) || '–'}`;
  };
  const siTomLi = tekst => `<li style="display:block; padding:12px 0; color:var(--text-secondary)">${tekst}</li>`;
  const siLogListe = poster => poster.length
    ? poster.map(p => `<li><time>${App.h(p.dato)}</time><span>${App.h(siHistTekst(p))}</span><span class="who">${App.h(p.af)}</span></li>`).join('')
    : siTomLi('Ingen ændringer registreret endnu.');
  // F5: nyeste note øverst, men slet-knappen peger på postens plads i det UREVERSEREDE array.
  const siNoteListe = (noter, redigerbar) => {
    const poster = (noter || []).map((n, i) => ({ n, i })).reverse();
    return poster.length ? poster.map(({ n, i }) => `<li><time>${App.h(n.dato)}</time><span>${App.h(n.tekst)}</span><span class="who">${App.h(App.emp(n.af).navn)}${redigerbar && n.af === App.S.user ? ` · <button type="button" class="tlink" data-notedel="${i}">Slet</button>` : ''}</span></li>`).join('')
      : siTomLi(redigerbar ? 'Ingen noter endnu. Skriv den første i feltet ovenfor.' : 'Ingen noter på kunden endnu.');
  };
  App.registerPage({
    id: 'sites', label: 'Alle sites', group: 'Stamdata', icon: 'home', order: 61, hidden: true,
    roles: ['Chef', 'PM', 'Fakturering', 'Service'],
    html: `
    <style>
      /* Sidste udvej (kun denne side, jf. PLAN-v2): med "Vis flere felter" slået til er der op til 18
         kolonner (F11 har føjet "Prisregulering" til). Tekstkolonnerne pines til smallere bredder end
         standard table-dense, så listen hverken får vandret scroll ved 1280 px (felter slået fra, hvor
         den nye kolonne slet ikke er med) eller ved 1920 px (felter slået til) – samme teknik som
         #konTable i kontering.js. */
      #siTable td.cut.w-s { max-width: 110px; }
      #siTable td.cut.w-m { max-width: 170px; }
      /* F2: feltets lille forklaring ("Fra BC") skal stå dæmpet til højre i etiketten. Uden denne
         regel arver den .form-grid label .caption fra scan-blokken, som er lilla og fed – for højt
         tonefald til et låst felt. */
      #siteDetail label .caption { float: right; color: var(--text-secondary); font-weight: 400; }
      /* Site-panelet bærer nu stamdata, installationer med otte kolonner, noter, projekter, opgaver og
         historik. 720 px (modalens standard) ville give installationstabellen vandret scroll i sin egen
         .table-wrap; 980 px er stadig inden for 1280 px minus modalens 24 px luft i begge sider. */
      #modalSite .modal { width: min(980px, 100%); }
      #siNoteForm { display: flex; gap: var(--space-3); align-items: flex-end; margin-bottom: var(--space-3); }
      #siNoteForm .field { flex: 1; }
    </style>
    <div class="page-head">
      <div>
        <h1>Alle sites</h1>
        <p>Én række pr. site. Installationerne foldes ud pr. type med anlæg, serviceaftale, UL og status.</p>
      </div>
    </div>

    <div class="ftabs" role="group" aria-label="Visning" style="margin-bottom:var(--space-4)">
      <button class="ftab" id="siTabKunder">Kunder</button>
      <button class="ftab on" id="siTabSites" aria-current="page">Alle sites</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="ftabs" id="siAftaleFilter" role="group" aria-label="Serviceaftale">
          <button class="ftab on" data-v="">Alle</button>
          <button class="ftab" data-v="med">Med serviceaftale</button>
          <button class="ftab" data-v="uden">Uden serviceaftale</button>
        </div>
        <label class="field">Søg <input type="text" id="siSearch" placeholder="Kunde, site, adresse" size="28"></label>
        <span class="spacer"></span>
        <button class="ftab" id="siFlere">Vis flere felter</button>
      </div>
      <div class="table-wrap">
        <table class="table-dense" id="siTable">
          <thead id="siThead"></thead>
          <tbody id="siteRows"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-bg" id="modalSite">
      <div class="modal" role="dialog" aria-labelledby="siteTitle">
        <header><h2 id="siteTitle">Site</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <p class="caption muted" id="siLaasTekst" style="margin-bottom:var(--space-3)"></p>
          <div class="form-grid" id="siteDetail" style="margin-bottom:18px"></div>
          <h3 style="margin-bottom:8px">Installationer</h3>

            <label class="field">Ny note<textarea id="siNoteTekst" rows="2" placeholder="Skriv en note om sitet"></textarea></label>
            <button class="btn" id="siNoteAdd">Tilføj note</button>
          </div>
          <ul class="log" id="siteNoter"></ul>

        </footer>

    <div class="modal-bg" id="modalNewSite">
      <div class="modal" role="dialog" aria-labelledby="newSiteTitle">

        <div class="body">

            <label>Leveringsadresse<input type="text" id="nsAdresse" required></label>
            <label>Postnr.<input type="text" id="nsPostnr" required></label>
            <label>By<input type="text" id="nsBy" required></label>
          </div>
          <div class="form-grid" style="margin-bottom:18px">
            <label>Sted nr. (AS400)<input type="text" id="nsStedNr"></label>
            <label class="auto">BC-opslag<input type="text" id="nsBcPreview" readonly></label>
            <label>Installation<select id="nsInstallation"><option>AIA</option><option>ADK</option><option>TVO</option><option>KOMBI</option><option>ANDET</option></select></label>
            <label>Serviceaftale<select id="nsServiceaftale"><option>Ingen</option><option>Serviceaftale 1</option><option>Serviceaftale 2</option><option>Serviceaftale 4</option><option>Novo rammeaftale</option></select></label>
            <label>UL<input type="text" id="nsUl" placeholder="valgfrit"></label>

      </div>
    </div>
  `,
    init() {
      const { $, $$, S, site, bc, h, kr, st, openModal, closeModal, save, toast, siteLabel, today } = App;
      this.table = $('#siTable');
      this.expanded = new Set(); // hvilke site-id'er der har installations-underrækker foldet ud
      this.priEdit = new Set();  // F11: installations-id'er hvis prisregulering redigeres i panelet lige nu
      this.priHist = new Set();  // F11: installations-id'er hvis historik er slået op i panelet
      this.instEdit = new Set(); // F2: installations-id'er hvis stamdata redigeres i panelet lige nu
      this.siOpenId = null;      // F11: hvilket site siteInstallationer-panelet hører til
      this.siRedigerer = false;  // F2: sitets stamdata står i redigeringstilstand
      let siHistSoeg = '';       // F2: filter på panelets historikliste

      // ---------- tabs ----------
      $('#siTabKunder').addEventListener('click', () => { App.getPage('kunder').tilbageTilListe(); App.go('kunder'); });

      // ---------- F11: installationstabellen i site-panelet, inkl. prisregulering (C6) ----------
      // Egen render, så et gem/annullér/historik-klik kan tegne panelet om uden at lukke modalen eller
      // genopbygge site-detaljen, projekterne og serviceopgaverne under den.
      const editRow = i => {
        const p = i.prisregulering || {};
        const typeVal = PRISREG_TYPER.includes(p.type) ? p.type : 'Ingen';
        return `<tr data-child="1"><td colspan="7">
          <div class="form-grid" style="margin:var(--space-3) 0">
            <label>Type<select data-prifelt="type" data-priid="${h(i.id)}">${PRISREG_TYPER.map(t => `<option${t === typeVal ? ' selected' : ''}>${h(t)}</option>`).join('')}</select></label>
            <label>Sats (%)<input type="number" step="0.1" min="0" data-prifelt="sats" data-priid="${h(i.id)}" value="${h(p.sats || '')}"></label>
            <label>Seneste justering<input type="date" data-prifelt="sidsteJustering" data-priid="${h(i.id)}" value="${h(p.sidsteJustering || '')}"></label>
            <label>Næste justering<input type="date" data-prifelt="naesteJustering" data-priid="${h(i.id)}" value="${h(p.naesteJustering || '')}"></label>
            <label style="grid-column:1/-1">Specialaftale<textarea data-prifelt="specialaftale" data-priid="${h(i.id)}" rows="2" placeholder="Fritekst – undtagelser der ikke kan sættes på formel">${h(p.specialaftale || '')}</textarea></label>
          </div>
          <div style="display:flex; gap:var(--space-3); justify-content:flex-end">
            <button type="button" class="btn" data-act="pri-cancel" data-id="${h(i.id)}">Annullér</button>
            <button type="button" class="btn cta" data-act="pri-save" data-id="${h(i.id)}">Gem prisregulering</button>
          </div>
        </td></tr>`;
      };
      // F2 udvider F11's historikvisning fra kun prisregulering til HELE installationens historik –
      // type, anlæg, serviceaftale, UL og status hører til samme post og skal ses samme sted.
      const historikRow = i => `<tr data-child="1"><td colspan="${SI_KOLONNER}">
          <ul class="log">${siLogListe(App.historikFor('installation', i.id))}</ul>
        </td></tr>`;
      // F2: installationens egne stamdata. Typen er med, fordi en forkert type ellers kun kan rettes
      // ved at oprette sitet igen; serviceaftalen er fritekst (Spor 1's afvigelse 3), og UL vælges
      // på id, så en omdøbt underleverandør ikke knækker forbindelsen.
      const instEditRow = i => {
        const typer = [...new Set([...App.INSTALLATION_TYPER, i.type].filter(Boolean))];
        const uler = (S.underleverandoerer || []);
        return `<tr data-child="1"><td colspan="${SI_KOLONNER}">
          <div class="form-grid" style="margin:var(--space-3) 0">
            <label>Type<select data-instfelt="type" data-instid="${h(i.id)}">${typer.map(t => `<option${t === i.type ? ' selected' : ''}>${h(t)}</option>`).join('')}</select></label>
            <label>Anlæg<input type="text" data-instfelt="anlaeg" data-instid="${h(i.id)}" value="${h(i.anlaeg || '')}"></label>
            <label>Serviceaftale<input type="text" data-instfelt="serviceaftale" data-instid="${h(i.id)}" value="${h(i.serviceaftale || '')}"></label>
            <label>Underleverandør<select data-instfelt="ulId" data-instid="${h(i.id)}"><option value=""${i.ulId ? '' : ' selected'}>Ingen</option>${uler.map(u => `<option value="${h(u.id)}"${u.id === i.ulId ? ' selected' : ''}>${h(u.navn)}</option>`).join('')}</select></label>
            <label>Status<select data-instfelt="status" data-instid="${h(i.id)}">${App.INSTALLATION_STATUS.map(t => `<option${t === i.status ? ' selected' : ''}>${h(t)}</option>`).join('')}</select></label>
          </div>
          <div style="display:flex; gap:var(--space-3); justify-content:flex-end">
            <button type="button" class="btn" data-act="inst-cancel" data-id="${h(i.id)}">Annullér</button>
            <button type="button" class="btn cta" data-act="inst-save" data-id="${h(i.id)}">Gem installation</button>
          </div>
        </td></tr>`;
      };
      this.renderInstallationer = () => {
        const id = this.siOpenId;
        const installs = App.installationer(id);
        // F2: én forklaring for hele tabellen, så hver række ikke skal gentage reglen. Er der ikke
        // skriveret, står der HVORFOR i stedet for at knapperne bare mangler (krav E3a).
        const maaInst = App.maaRette('installation');
        const forklaring = maaInst ? '' : App.retteForklaring('installation');
        $('#siteInstallationer').innerHTML = (installs.length ? `
          <div class="table-wrap"><table class="table-dense">
            <thead><tr><th>Type</th><th>Anlæg</th><th>Serviceaftale</th><th>UL</th><th>Status</th><th>Eftersyn</th><th>Prisregulering</th><th></th></tr></thead>
            <tbody>${installs.map(i => {
              const kanRette = App.maaRette('installation', i);
              const harAftale = !!(i.prisregulering && i.prisregulering.type && i.prisregulering.type !== 'Ingen');
              const forfalden = prisreguleringForfalden(i);
              let radHtml = `<tr>
                <td><b>${h(i.type)}</b></td><td>${h(i.anlaeg) || '–'}</td><td>${h(i.serviceaftale) || '–'}</td><td>${h(App.ulNavn(i.ulId)) || '–'}</td>
                <td>${st(i.status)}</td>
                <td>${i.eftersyn && i.eftersyn.aktiv ? h(i.eftersyn.interval + ' mdr.' + (i.eftersyn.sidste ? ' · sidst ' + i.eftersyn.sidste : '')) : 'Nej'}</td>
                <td style="white-space:normal; max-width:240px">
                  ${forfalden ? '<span class="alert">Forfalden · </span>' : ''}${h(prisreguleringSummary(i))}
                  ${i.prisregulering && i.prisregulering.specialaftale ? `<br><span class="muted">Specialaftale: ${h(i.prisregulering.specialaftale)}</span>` : ''}
                  ${kanRette ? `<div style="margin-top:4px"><button type="button" class="tlink" data-act="pri-edit" data-id="${h(i.id)}">${harAftale ? 'Rediger' : 'Registrér'}</button></div>` : ''}
                </td>
                <td class="actions" style="white-space:normal">
                  <div style="display:flex; gap:var(--space-3); flex-wrap:wrap">
                    <button type="button" class="tlink" data-act="pri-hist" data-id="${h(i.id)}">Historik</button>
                    ${kanRette ? `<button type="button" class="tlink" data-act="inst-edit" data-id="${h(i.id)}">Rediger</button>` : ''}
                  </div>
                </td>
              </tr>`;
              if (this.priHist.has(i.id)) radHtml += historikRow(i);
              if (this.instEdit.has(i.id) && kanRette) radHtml += instEditRow(i);
              if (this.priEdit.has(i.id) && kanRette) radHtml += editRow(i);
              return radHtml;
            }).join('')}</tbody>
          </table></div>` : '<p class="muted">Ingen installationer registreret på sitet.</p>')
          + (forklaring ? `<p class="caption muted" style="margin-top:var(--space-3)">${h(forklaring)}</p>` : '');
      };
      $('#siteInstallationer').addEventListener('click', e => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const { act, id } = btn.dataset;
        if (act === 'pri-hist') { this.priHist.has(id) ? this.priHist.delete(id) : this.priHist.add(id); this.renderInstallationer(); return; }
        if (act === 'pri-edit') { this.priEdit.add(id); this.renderInstallationer(); return; }
        if (act === 'pri-cancel') { this.priEdit.delete(id); this.renderInstallationer(); return; }
        if (act === 'inst-edit') { this.instEdit.add(id); this.renderInstallationer(); return; }
        if (act === 'inst-cancel') { this.instEdit.delete(id); this.renderInstallationer(); return; }
        if (act === 'inst-save') {
          const i = App.installation(id);
          // Vagten sidder på skrivningen, ikke kun på knappen – knappen er skjult uden ret, men en
          // skjult knap er ingen håndhævelse (planens "Kun simulerbart": rettigheder kan kun simuleres).
          if (!App.maaRette('installation', i)) { toast('Du kan ikke rette denne installation'); return; }
          const felt = navn => { const el = $(`[data-instfelt="${navn}"][data-instid="${id}"]`); return el ? String(el.value ?? '').trim() : ''; };
          let aendret = 0;
          // Som i gemSiteStamdata: et felt, installationen ikke har, må ikke opstå som tom streng.
          const saet = (navn, vaerdi) => { if (i[navn] === undefined && !vaerdi) return; if (App.saetFelt(i, 'installation', id, navn, vaerdi)) aendret++; };
          saet('type', felt('type') || i.type);
          saet('anlaeg', felt('anlaeg'));
          saet('serviceaftale', felt('serviceaftale'));
          saet('ulId', felt('ulId'));
          saet('status', App.INSTALLATION_STATUS.includes(felt('status')) ? felt('status') : i.status);
          save();
          this.instEdit.delete(id);
          this.renderSitePanel();
          this.render();   // site-oversigten bagved viser typer, aftale og UL – den skal følge med
          toast(aendret ? 'Installationen er gemt' : 'Ingen ændringer at gemme');
          return;
        }
        if (act === 'pri-save') {
          const i = App.installation(id);
          if (!App.maaRette('installation', i)) { toast('Ingen rettigheder til at redigere denne installation'); return; }
          const felt = navn => { const el = $(`[data-prifelt="${navn}"][data-priid="${id}"]`); return el ? el.value.trim() : ''; };
          // Prisregulering er null indtil første registrering (data.js); blokken oprettes her, og hvert
          // felt sættes for sig med App.saetFelt, som logger til S.historik (F11, ingen egen historik-liste).
          i.prisregulering = i.prisregulering || { type: 'Ingen', sats: 0, sidsteJustering: '', naesteJustering: '', specialaftale: '' };
          const p = i.prisregulering;
          const nyType = PRISREG_TYPER.includes(felt('type')) ? felt('type') : 'Ingen';
          App.saetFelt(p, 'installation', id, 'type', nyType);
          App.saetFelt(p, 'installation', id, 'sats', +felt('sats') || 0);
          App.saetFelt(p, 'installation', id, 'sidsteJustering', felt('sidsteJustering'));
          App.saetFelt(p, 'installation', id, 'naesteJustering', felt('naesteJustering'));
          App.saetFelt(p, 'installation', id, 'specialaftale', felt('specialaftale'));
          save();
          this.priEdit.delete(id);
          this.renderInstallationer();
          toast('Prisregulering gemt');
        }
      });
      // Forsvar mod samme tastaturfejl som data-fold (se ovenfor): disse knapper sidder i dag i
      // modalen, ikke i en klikbar tr.click[tabindex]-række, men stopPropagation her koster intet og
      // sikrer, at Enter/mellemrum kun udfører knappens egen handling, uanset hvor de senere flytter hen.
      $('#siteInstallationer').addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-act]')) e.stopPropagation();
      });

      // ---------- F2: sitets stamdata med rettigheder ----------
      // Egen render, så "Rediger"/"Gem"/"Annullér" kan skifte felterne mellem låst og skrivbar uden at
      // bygge installationstabellen, noterne og historikken op igen.
      const renderSiteDetalje = () => {
        const s = site(this.siOpenId), m = bc(s.stedNr);
        const maa = App.maaRette('site', s);
        if (!maa) this.siRedigerer = false;   // rolleskift midt i en redigering må ikke efterlade skrivbare felter
        $('#siteTitle').textContent = `${App.kundeNavn(s) || '–'} – ${s.navn}`;
        $('#siteDetail').innerHTML = SI_FELTER.map(f => {
          const skrivbar = this.siRedigerer && f.rediger;
          const raa = f.fast ? f.fast(s, m) : (s[f.felt] ?? '');
          const vist = skrivbar ? raa : (f.tal ? (raa ? kr(raa) : '–') : (String(raa).trim() || '–'));
          const note = f.laast ? `<span class="caption">${h(f.laast)}</span>` : (skrivbar && f.hint ? `<span class="caption">${h(f.hint)}</span>` : '');
          const id = f.felt ? ` id="sif-${f.felt}"` : '';
          return `<label>${h(f.label)}${note}<input type="text"${id} value="${h(String(vist))}"${skrivbar ? '' : ' readonly'}></label>`;
        }).join('');
        $('#siRetTekst').textContent = maa ? '' : App.retteForklaring('site', s);
        $('#siLaasTekst').textContent = maa
          ? 'Du må rette sitets stamdata. Site-id, costcenter, TOS og account kommer fra CEP og BC og rettes i kildesystemet.'
          : App.retteForklaring('site', s);
        $('#siBtnRediger').style.display = maa && !this.siRedigerer ? '' : 'none';
        $('#siBtnGem').style.display = this.siRedigerer ? '' : 'none';
        $('#siBtnAnnuller').style.display = this.siRedigerer ? '' : 'none';
      };

      // ---------- F5: noter på sitet, og kundens noter skrivebeskyttet ----------
      const renderSiteNoter = () => {
        const s = site(this.siOpenId);
        $('#siteNoter').innerHTML = siNoteListe(s.noter, true);
        $$('[data-notedel]', $('#siteNoter')).forEach(b => b.addEventListener('click', () => {
          if (this.sletSiteNote(+b.dataset.notedel)) { toast('Noten er slettet'); this.renderSitePanel(); }
        }));
        $('#siKundeNoter').innerHTML = siNoteListe(App.kundeAf(s).noter, false);
      };

      const renderSiteHistorik = () => {
        const s = site(this.siOpenId);
        // Installationernes historik hører til sitet: den, der leder efter "hvem skiftede serviceaftalen",
        // skal ikke først gætte hvilken installation det var. Posterne er allerede nyeste først hver for
        // sig og flettes på dato-strengen, som er sorterbar (ÅÅÅÅ-MM-DD tt:mm).
        const inst = App.installationer(s.id).map(i => i.id);
        const poster = App.historikFor('site', s.id)
          .concat(inst.flatMap(id => App.historikFor('installation', id)))
          .sort((a, b) => String(b.dato).localeCompare(String(a.dato)))
          .filter(p => !siHistSoeg || `${siFeltLabel(p.felt)} ${p.fra} ${p.til} ${p.af} ${p.dato}`.toLowerCase().includes(siHistSoeg));
        $('#siteHistorik').innerHTML = siLogListe(poster);
        $('#siHistorikForbehold').textContent = App.PROTOTYPE_FORBEHOLD;
      };

      // Hele panelet, så et gem ét sted også opdaterer de andre afsnit (fx navnet i titlen).
      this.renderSitePanel = () => {
        const id = this.siOpenId;
        renderSiteDetalje();
        this.renderInstallationer();
        renderSiteNoter();
        renderSiteHistorik();
        const projs = S.projekter.filter(p => p.siteId === id);
        $('#siteProjects').innerHTML = projs.map(p => `<li><time>${h(p.oprettet)}</time><span>${h(p.id)} – ${h(p.navn)}</span><span class="who">${st(App.projStatus(p).samlet)}</span></li>`).join('')
          || '<li style="display:block; padding:12px 0; color:var(--text-secondary)">Ingen projekter på sitet.</li>';
        const cases = (S.serviceopgaver || []).filter(c => c.siteId === id);
        $('#siteCases').innerHTML = cases.map(c => `<li><time>${h(c.id)}</time><span>${h(c.beskrivelse)}</span><span class="who">${st(c.status)}</span></li>`).join('')
          || '<li style="display:block; padding:12px 0; color:var(--text-secondary)">Ingen serviceopgaver på sitet.</li>';
      };

      // ---------- åbn site-modal (delt entry point – window.SiteDetaljer i bunden af filen) ----------
      this.openSite = id => {
        // installationer pr. type i stedet for enkeltfelterne fra det gamle site (§1.3). Prisregulering
        // (F11, C6) vises og redigeres i sin egen render, så et gem/annullér ikke skal bygge hele panelet om.
        if (this.siOpenId !== id) { this.priEdit.clear(); this.priHist.clear(); this.instEdit.clear(); this.siRedigerer = false; }
        this.siOpenId = id;
        this.renderSitePanel();
        openModal('modalSite');
        // openModal fokuserer første indtastningsfelt – i læsevisning er det historik-søgningen nederst, så panelet
        // åbnede scrollet til bunden. Start øverst med fokus på lukkeknappen; redigering flytter selv fokus.
        const panel = $('#modalSite .modal'); if (panel) panel.scrollTop = 0;
        const luk = $('#modalSite header [data-close]'); if (luk) luk.focus({ preventScroll: true });
      };

      $('#siBtnRediger').addEventListener('click', () => { this.siRedigerer = true; renderSiteDetalje(); });
      $('#siBtnAnnuller').addEventListener('click', () => { this.siRedigerer = false; renderSiteDetalje(); });
      $('#siBtnGem').addEventListener('click', () => this.gemSiteStamdata());
      $('#siHistorikSoeg').addEventListener('input', () => { siHistSoeg = ($('#siHistorikSoeg').value || '').trim().toLowerCase(); renderSiteHistorik(); });
      $('#siNoteAdd').addEventListener('click', () => {
        if (this.tilfoejSiteNote($('#siNoteTekst').value)) { $('#siNoteTekst').value = ''; toast('Noten er tilføjet'); this.renderSitePanel(); }
        else toast('Skriv en note, før den kan tilføjes');
      });

      // ---------- nyt site (kaldes af kunder.js' "Nyt site"-knap med en kendt kundekontekst) ----------
      const updateNsPreview = () => {
        const m = bc($('#nsStedNr').value);
        $('#nsBcPreview').value = m ? `${m.costcenter} · TOS ${m.tos} · ${m.account}` : ($('#nsStedNr').value ? 'Ikke fundet i mappingen' : '');
      };
      $('#nsStedNr').addEventListener('input', updateNsPreview);
      this.openNewSiteFor = kundeId => {
        // F2: samme vagt som på redigering – "Nyt site" er en skrivning på stamdata.
        if (!App.maaRette('site')) { toast(App.retteForklaring('site')); return; }
        nsKundeId = kundeId;
        $('#nsKunde').value = App.kunde(kundeId).navn || '';
        $('#nsNavn').value = ''; $('#nsKode').value = ''; $('#nsAdresse').value = ''; $('#nsPostnr').value = ''; $('#nsBy').value = '';
        $('#nsStedNr').value = ''; $('#nsInstallation').value = 'AIA'; $('#nsServiceaftale').value = 'Ingen'; $('#nsUl').value = '';
        updateNsPreview();
        openModal('modalNewSite');
      };
      // Opretter sitet og én installation pr. valgt type i S.installationer (næste I-id). KOMBI = AIA+ADK+TVO.
      // Serviceaftale/UL/eftersyn kopieres til alle typer på sitet, som migreringen gjorde det (§1.3).
      $('#nsOk').addEventListener('click', () => {
        if (!nsKundeId) return;
        if (!App.maaRette('site')) { toast('Du kan ikke oprette sites'); return; }
        const navn = $('#nsNavn').value.trim(), adresse = $('#nsAdresse').value.trim(), postnr = $('#nsPostnr').value.trim(), by = $('#nsBy').value.trim();
        if (!navn || !adresse || !postnr || !by) { toast('Udfyld site-navn, leveringsadresse, postnr. og by'); return; }
        const kundeNavn = App.kunde(nsKundeId).navn || '';
        let id; do { id = 'DK-S-' + String(Math.floor(100000 + Math.random() * 900000)); } while (S.sites.some(x => x.id === id));
        const serviceaftale = $('#nsServiceaftale').value === 'Ingen' ? '' : $('#nsServiceaftale').value;
        const ulNavn = $('#nsUl').value.trim();
        const ulId = App.ulAf(ulNavn);
        const valgt = $('#nsInstallation').value;
        const typer = valgt === 'KOMBI' ? ['AIA', 'ADK', 'TVO'] : [valgt];
        const s = {
          id, kundeId: nsKundeId, stedNr: $('#nsStedNr').value.trim(), navn, kode: $('#nsKode').value.trim(),
          adresse, postnr, by, kontakt: '', noter: [],
        };
        S.sites.push(s);
        let maxI = (S.installationer || []).reduce((a, i) => { const m = /^I-(\d+)$/.exec(i.id); return m ? Math.max(a, +m[1]) : a; }, 0);
        S.installationer = S.installationer || [];
        typer.forEach(type => {
          maxI++;
          const inst = {
            id: 'I-' + String(maxI).padStart(4, '0'), siteId: id, type, anlaeg: '', serviceaftale, ulId,
            status: 'I drift', overdraget: '', fraProjekt: '', prisregulering: null,
            eftersyn: { aktiv: false, maaned: 0, interval: 12, sidste: '', cas: '' },
          };
          S.installationer.push(inst);
          App.log('installation', inst.id, 'oprettet', '', `${type} på ${siteLabel(s)}`);
        });
        // Oprettelse er en sammensat hændelse og logges som én post, ikke ét felt ad gangen (§3).
        App.log('site', id, 'oprettet', '', `${siteLabel(s)} · ${kundeNavn}`);
        save(); closeModal('modalNewSite');
        toast(`${siteLabel(s)} er oprettet`);
        // "Nyt site" åbnes fra kundebilledet (kunder.js), som stadig er den synlige side bag modalen –
        // dens site-liste skal opdateres med det samme, ikke først ved næste navigation.
        App.getPage('kunder').render();
        this.render();
      });

      // ---------- site-oversigt: filter, søgning, "Vis flere felter" ----------
      $$('#siAftaleFilter .ftab').forEach(b => b.addEventListener('click', () => { siFilter = b.dataset.v; this.render(); }));
      $('#siSearch').addEventListener('input', () => this.render());
      $('#siFlere').addEventListener('click', () => { S.sitesVisFlere = !S.sitesVisFlere; save(); this.render(); });
    },

    // ---------- F2: gem sitets stamdata ----------
    // Hvert felt skrives med App.saetFelt, som kun logger ved en reel ændring – derfor er "aendret"
    // også svaret på, om der overhovedet skete noget.
    gemSiteStamdata() {
      const { $, toast } = App;
      const s = App.site(this.siOpenId);
      if (!App.maaRette('site', s)) { toast('Du kan ikke rette sitets stamdata'); return false; }
      const laes = f => { const el = $('#sif-' + f.felt); return el ? String(el.value ?? '').trim() : String(s[f.felt] ?? ''); };
      const mangler = SI_FELTER.filter(f => f.rediger && f.kraevet && !laes(f));
      if (mangler.length) { toast(`Udfyld ${mangler.map(f => f.label.toLowerCase()).join(' og ')}`); return false; }
      let aendret = 0;
      SI_FELTER.filter(f => f.rediger).forEach(f => {
        const raa = laes(f);
        const ny = f.tal ? (+raa || 0) : raa;
        // Et felt, sitet slet ikke HAR (fx timepris på et site uden egen pris), må ikke opstå som 0
        // eller tom streng, bare fordi formularen viste det tomt – det ville logge en ændring, der
        // ikke er sket, og give sitet en pris, ingen har indtastet.
        if (s[f.felt] === undefined && !ny) return;
        if (App.saetFelt(s, 'site', s.id, f.felt, ny)) aendret++;
      });
      App.save();
      this.siRedigerer = false;
      this.renderSitePanel();
      this.render();   // site-oversigten bagved skal vise det nye navn, kode og sted nr. med det samme
      toast(aendret ? 'Sitets stamdata er gemt' : 'Ingen ændringer at gemme');
      return aendret > 0;
    },

    // ---------- F5: noter på sitet ----------
    // Noter er ikke stamdata: alle, der kan se sitet, må skrive en note (planens F5-afsnit), og
    // App.maaRette spørges derfor bevidst ikke her. Slet-reglen er projektloggens: kun sine egne.
    tilfoejSiteNote(tekst) {
      const s = App.site(this.siOpenId);
      const t = String(tekst || '').trim();
      if (!s.id || !t) return false;
      s.noter = s.noter || [];
      s.noter.push({ dato: App.now(), af: App.S.user, tekst: t });
      App.log('site', s.id, 'note', '', t);   // også i historikken, så ét sted viser hele billedet
      return true;
    },
    sletSiteNote(i) {
      const s = App.site(this.siOpenId);
      const n = (s.noter || [])[i];
      if (!n) return false;
      if (n.af !== App.S.user) { App.toast('Du kan kun slette dine egne noter'); return false; }
      s.noter.splice(i, 1);
      App.log('site', s.id, 'note', n.tekst, '');
      return true;
    },

    // Kolonneopsæt til site-oversigten (E2). De syv krævede felter (Kode står i stedet for det lange
    // CEP-Site ID i den korte visning, som CEP-Site ID selv flytter bag "Vis flere felter" sammen med
    // resten af BC-feltet, jf. planens spørgsmål 13) er altid med; installationerne foldes ud som
    // underrækker i stedet for "for hver type" som egne kolonner (konflikt 8).
    columns() {
      const { h, kr } = App;
      const statusTxt = i => {
        let txt = App.st(i.status);
        if (i.status === 'I drift' && i.overdraget) txt += ` <span class="muted">· overdraget ${h(i.overdraget)} fra ${h(i.fraProjekt)}</span>`;
        else if (i.fraProjekt) txt += ` <span class="muted">· ${h(i.fraProjekt)}</span>`;
        return txt;
      };
      const base = [
        { label: 'Kode', sort: 'text', cell: r => `<td>${h(r.kode) || '–'}</td>`, child: () => '<td></td>' },
        { label: 'Kunde', sort: 'text', cell: r => `<td class="cut w-s" title="${h(r.kunde)}">${h(r.kunde) || '–'}</td>`, child: () => '<td></td>' },
        { label: 'Site navn', sort: 'text', cell: r => `<td class="cut w-s" title="${h(r.navn)}">${h(r.navn)}</td>`, child: () => '<td></td>' },
        { label: 'Adresse', sort: 'text', cell: r => `<td class="cut w-m" title="${h(r.adresseFuld)}">${h(r.adresseFuld)}</td>`, child: () => '<td></td>' },
        {
          label: 'Installationer', sort: 'text', cell: r => `<td>${h(r.typer) || '–'}</td>`,
          child: i => `<td class="cut w-s">↳ ${h(i.type)}${i.anlaeg ? ' – ' + h(i.anlaeg) : ''}</td>`,
        },
        {
          label: 'Serviceaftale', sort: 'text', cell: r => `<td class="cut w-s" title="${h(r.serviceaftaler.join(', '))}">${h(r.serviceaftaler.join(', ')) || '–'}</td>`,
          child: i => `<td class="cut w-s">${h(i.serviceaftale) || '–'}</td>`,
        },
        {
          label: 'UL', sort: 'text', cell: r => `<td class="cut w-s" title="${h(r.ul.join(', '))}">${h(r.ul.join(', ')) || '–'}</td>`,
          child: i => `<td class="cut w-s">${h(App.ulNavn(i.ulId)) || '–'}</td>`,
        },
        { label: 'Igangv. projekter', sort: 'num', num: true, cell: r => `<td class="num">${r.igangv}</td>`, child: i => `<td>${statusTxt(i)}</td>` },
      ];
      const flere = [
        { label: 'CEP-Site ID', sort: 'text', cell: r => `<td>${h(r.id)}</td>`, child: () => '<td></td>' },
        { label: 'Sted nr.', sort: 'text', cell: r => `<td>${h(r.stedNr) || '<span class="alert">Mangler</span>'}</td>`, child: () => '<td></td>' },
        { label: 'Costcenter', sort: 'text', cell: r => `<td class="cut w-s" title="${h(r.costcenter)}">${h(r.costcenter) || '–'}</td>`, child: () => '<td></td>' },
        { label: 'TOS', sort: 'text', cell: r => `<td class="cut w-s" title="${h(r.tos)}">${h(r.tos) || '–'}</td>`, child: () => '<td></td>' },
        { label: 'Account', sort: 'text', cell: r => `<td>${h(r.account) || '–'}</td>`, child: () => '<td></td>' },
        { label: 'Timepris', sort: 'num', num: true, cell: r => `<td class="num">${r.timepris ? kr(r.timepris) : '–'}</td>`, child: () => '<td></td>' },
        { label: 'Eftersyn', sort: 'text', cell: r => `<td>${h(r.eftersynTxt)}</td>`, child: () => '<td></td>' },
        {
          // F11 (C6): parent-cellen viser hvilke indekseringstyper der er registreret på sitets
          // installationer (som Serviceaftale/UL-kolonnerne); selve datoen og et "Forfalden"-mærke, når
          // naesteJustering er passeret, står kun i underrækken pr. installation.
          label: 'Prisregulering', sort: 'text',
          cell: r => `<td class="cut w-s" title="${h(r.prisregTyper.join(', '))}">${h(r.prisregTyper.join(', ')) || '–'}</td>`,
          child: i => `<td class="cut w-s" title="${h(prisreguleringSummary(i))}">${prisreguleringForfalden(i) ? '<span class="alert">Forfalden · </span>' : ''}${h(prisreguleringSummary(i))}</td>`,
        },
        { label: 'Sidst opdateret', sort: 'date', cell: r => `<td class="muted">${h(r.sidste) || '–'}</td>`, child: () => '<td></td>' },
      ];
      const tail = [
        {
          label: '', sort: '',
          cell: (r, open) => r.installationer.length
            ? `<td class="actions"><button type="button" class="tlink" data-fold="${h(r.id)}" title="${open ? 'Skjul installationer' : 'Vis installationer'}" aria-label="${open ? 'Skjul installationer' : `Vis ${r.installationer.length} installationer`}">${open ? 'Skjul' : `Vis (${r.installationer.length})`}</button></td>`
            : '<td></td>',
          child: () => '<td></td>',
        },
      ];
      return App.S.sitesVisFlere ? [...base, ...flere, ...tail] : [...base, ...tail];
    },

    render() {
      const { $, $$, S, h, bc } = App;
      $$('#siAftaleFilter .ftab').forEach(x => x.classList.toggle('on', x.dataset.v === siFilter));
      $('#siFlere').classList.toggle('on', !!S.sitesVisFlere);
      siSearch = ($('#siSearch').value || '').trim().toLowerCase();
      const highlight = App._highlightSite;

      let sites = S.sites.filter(s => {
        const hasSA = App.serviceaftaler(s.id).length > 0;
        if (siFilter === 'med' && !hasSA) return false;
        if (siFilter === 'uden' && hasSA) return false;
        if (siSearch && !`${s.id} ${s.kode || ''} ${App.kundeNavn(s)} ${s.navn} ${s.adresse}`.toLowerCase().includes(siSearch)) return false;
        return true;
      });
      sites = [...sites].sort((a, b) => App.kundeNavn(a).localeCompare(App.kundeNavn(b), 'da') || a.navn.localeCompare(b.navn, 'da'));

      const rows = sites.map(s => {
        const m = bc(s.stedNr);
        const e = App.eftersynSite(s.id);
        const installs = App.installationer(s.id);
        return {
          id: s.id, kode: s.kode || '', kunde: App.kundeNavn(s), navn: s.navn,
          adresseFuld: `${s.adresse}, ${s.postnr} ${s.by}`,
          installationer: installs, typer: App.installationTyper(s.id),
          serviceaftaler: App.serviceaftaler(s.id), ul: ulNavneForSite(s.id),
          igangv: App.igangvaerendeProjekter(s.id),
          // F11 (C6): unikke indekseringstyper på tværs af sitets installationer, til "flere felter".
          prisregTyper: [...new Set(installs.map(i => i.prisregulering && i.prisregulering.type).filter(t => t && t !== 'Ingen'))],
          stedNr: s.stedNr, costcenter: m ? `${m.costcenter} – ${m.costcenterNavn}` : '', tos: m ? `${m.tos} – ${m.tosNavn}` : '', account: m ? m.account : '',
          timepris: s.timepris, eftersynTxt: e.aktiv ? `${e.maaned ? 'Måned ' + e.maaned : '–'} / ${e.interval || 12} mdr.` : '–', sidste: e.sidste,
          highlight: s.id === highlight,
        };
      });

      const cols = this.columns();
      // thead genskabes hver gang "Vis flere felter" kan ændre antal kolonner, så App.sortable aldrig dobbeltbindes.
      // Egen id (i stedet for this.table.querySelector('thead')): elementets EGEN querySelector bruges
      // ikke andre steder i kodebasen og understøttes ikke af tools/test-b2a.js' DOM-stub.
      $('#siThead').innerHTML = `<tr>${cols.map(c => `<th${c.num ? ' class="num"' : ''} data-sort="${c.sort}">${c.label}</th>`).join('')}</tr>`;

      $('#siteRows').innerHTML = rows.map(r => {
        const open = this.expanded.has(r.id);
        const rowStyle = r.highlight ? ' style="background:var(--ui-purple-100)"' : '';
        const parent = `<tr class="click" data-open="${h(r.id)}" tabindex="0"${rowStyle}>${cols.map(c => c.cell(r, open)).join('')}</tr>`;
        const kids = open ? r.installationer.map(i => `<tr data-child="1">${cols.map(c => c.child(i, r)).join('')}</tr>`).join('') : '';
        return parent + kids;
      }).join('') || `<tr><td colspan="${cols.length}" class="empty">Ingen sites matcher filteret. Ryd filtrene, eller opret et nyt site fra en kundes side.</td></tr>`;

      $$('[data-open]', $('#siteRows')).forEach(r => r.addEventListener('click', () => this.openSite(r.dataset.open)));
      $$('[data-fold]', $('#siteRows')).forEach(b => {
        b.addEventListener('click', e => {
          e.stopPropagation();
          const id = b.dataset.fold;
          if (this.expanded.has(id)) this.expanded.delete(id); else this.expanded.add(id);
          this.render();
        });
        // Uden dette bobler Enter/mellemrum videre til app.js' globale keydown-lytter for
        // tr.click[tabindex] (den forælderrækken selv har), som så ÅBNER site-modalen oveni
        // foldningen – samme rettelse som F8's kolonnefilterknap (bindColFilterButton i app.js).
        b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') e.stopPropagation(); });
      });
      App.sortable(this.table, 'sites-oversigt', { col: 1, dir: 'asc' });
      if (highlight) delete App._highlightSite;
    },
  });

  // Delt indgang, så andre sider (F9 søgning, senere F3 kundebillede) kan åbne et site direkte uden at
  // kende sidens interne opbygning – samme mønster som window.ServiceKladde i service.js.
  window.SiteDetaljer = { open(id) { App.getPage('sites').openSite(id); } };
})();

</script>
<script>
// Serviceopgaver – egen skærm for service-flowet Åben → Lukket til fakturering → Faktureret.
// Erstatter Opgaver, Åbne Sager og Opgaver til fakturering i Opgavestyring-filen.

// F7/D2b: én række i "Udført dag for dag" pr. dato (grupperet af window.ServiceKladde.grupperDage,
// se bunden af filen). Ved mere end én registrering samme dato vises en foldbar underrække pr.
// oprindelig registrering (timer, OT1, OT2, udført), så detaljen bag summen ikke går tabt på skærmen.
// D2a (rettet i QA): #svcKladdeContent ER dokumentrammen (.pdf) – teknikerens navn/id må derfor IKKE stå
// noget sted heri, heller ikke skjult (browserens egen print, skærmbillede eller kopiering tager det med,
// uafhængigt af App.printSection()). Underrækkerne viser derfor kun tid og udført, aldrig hvem.
// Underrækkerne er tr[data-child], skjules som standard og tages desuden ikke med i "Gem som PDF" (init()).
// Navngivet med "svc"-præfiks, fordi sidefilerne deler topniveau-scope (AGENT-REGLER.md).
function svcDagRow(g) {
  const { h, n } = App;
  const flere = g.poster.length > 1;
  const top = `<tr${flere ? ` class="click" data-svc-dag="${h(g.dato)}" tabindex="0" aria-expanded="false"` : ''}>
    <td>${h(g.dato)}${flere ? ` <span class="muted caption">(${g.poster.length} reg.)</span>` : ''}</td>
    <td class="num">${n(g.timer)}</td><td class="num">${n(g.ot1)}</td><td class="num">${n(g.ot2)}</td><td>${h(g.udfoert)}</td>
  </tr>`;
  if (!flere) return top;
  const detaljer = g.poster.map(t => `<tr data-child="1" hidden>
    <td class="muted">–</td>
    <td class="num">${n(t.timer)}</td><td class="num">${n(t.ot1)}</td><td class="num">${n(t.ot2)}</td><td class="muted">${h(t.udfoert || '')}</td>
  </tr>`).join('');
  return top + detaljer;
}

App.registerPage({
  id: 'service', label: 'Serviceopgaver', group: 'Service', icon: 'calendar-check', order: 35,
  roles: ['Chef', 'PM', 'Fakturering', 'Service', 'Tekniker'],
  html: `
    <style>
      /* Sidste udvej (kun denne side, jf. PLAN-v2): 11 kolonner (12 for Chef/PM/Fakturering, som ser
         Tekniker-kolonnen) passer ikke i 1280 px med standard table-dense-bredder. Tættere kunde/site/
         tekniker-kolonner og trunkeret status (alle med title) her, indtil kernen evt. gør main-området

      #svcTable td.cut.w-xs { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
      #svcTable td.st-cut { max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Pinnes til den tætte bredde uanset skærmbredde (standard-padding og -klasserne udvider sig
         over 1440 px), så listen heller ikke får vandret scroll ved fx 1920 px. */
      #svcTable th, #svcTable td { padding: var(--space-2) 6px; }

    </style>

      </div>
      <div class="replaces">Erstatter <b>Opgaver</b>, <b>Åbne Sager</b> og <b>Opgaver til fakturering</b> i Opgavestyring-filen</div>
    </div>
    <div class="stats" id="svcStats"></div>
    <div class="card">
      <div class="toolbar">

          <button class="ftab" data-v="Faktureret">Faktureret</button>
          <button class="ftab" data-v="__delopgaver">Delopgaver</button>
        </div>
        <label class="field" id="svcTeknikerField">Tekniker <select id="svcTekniker"><option value="">Alle</option></select></label>
        <label class="field">Søg <input type="text" id="svcSearch" placeholder="Sag, kunde, beskrivelse" size="26"></label>
        <span class="spacer"></span>
        <button class="btn cta" id="svcNy">Ny serviceopgave</button>
      </div>
      <div class="table-wrap">
        <table class="table-dense" id="svcTable">
          <thead></thead>
          <tbody id="svcRows"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-bg" id="modalSvcNy">
      <div class="modal" role="dialog" aria-labelledby="svcNyTitle">
        <header><h2 id="svcNyTitle">Ny serviceopgave</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid">
            <label>Site<select id="svcSite"></select></label>
            <label>Type<select id="svcType"><option>Service</option><option>Eftersyn</option><option>Fejl</option></select></label>
            <label>Tekniker<select id="svcTekAssign"></select></label>
            <label>PO<input type="text" id="svcPo" placeholder="Indkøbsordre"></label>
            <label>Pris<input type="number" id="svcPris" min="0" step="1" placeholder="0"></label>
            <label style="grid-column:1/-1">Beskrivelse<textarea id="svcBeskrivelse" rows="3" placeholder="Hvad drejer opgaven sig om?"></textarea></label>
          </div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="svcNyOk">Opret serviceopgave</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalSvcDetaljer">
      <div class="modal" role="dialog" aria-labelledby="svcDetTitle">
        <header><h2 id="svcDetTitle">Serviceopgave</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body" id="svcDetBody"></div>
        <footer><button class="btn" data-close>Luk</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalSvcKladde">
      <div class="modal" style="width:min(980px, 100%)" role="dialog" aria-labelledby="svcKladdeTitle">
        <header><h2 id="svcKladdeTitle">Fakturakladde</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="pdf" id="svcKladdeContent"></div>
          <!-- D2a (KRAV-GAP-v6): hvem der har godkendt, vises uden for selve dokumentrammen (.pdf), så det ikke
               printes eller havner på fakturaen – App.printSection() printer kun indholdet af #svcKladdeContent. -->
          <p class="muted caption" id="svcKladdeGodkendtInfo" style="margin-top:12px" hidden></p>
          <div style="margin-top:18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap" id="svcKladdeActions"></div>
        </div>
        <footer><button class="btn" data-close>Luk</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, D, S, save, toast, today, h, kr, n, role, openModal, closeModal, emp, site } = App;

    const teknikere = () => D.medarbejdere.filter(m => m.rolle === 'Tekniker');

    // filterrække
    const tekSel = $('#svcTekniker');
    teknikere().forEach(t => tekSel.add(new Option(t.navn, t.id)));
    $$('#svcTabs .ftab').forEach(b => b.addEventListener('click', () => {
      $$('#svcTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.fStatus = b.dataset.v; this.render();
    }));
    tekSel.addEventListener('change', () => this.render());
    $('#svcSearch').addEventListener('input', () => this.render());

    this.table = $('#svcTable');
    // thead genskabes ved hver render (kolonnerne afhænger af rollen), så App.sortable bindes der i stedet.

    // "ny serviceopgave"-modal
    $('#svcNy').addEventListener('click', () => {
      const siteSel = $('#svcSite'); siteSel.innerHTML = '';
      (S.sites || []).forEach(s => siteSel.add(new Option(`${App.kundeNavn(s)} – ${App.siteLabel(s)}`, s.id)));
      const tekAssign = $('#svcTekAssign'); tekAssign.innerHTML = '';
      teknikere().forEach(t => tekAssign.add(new Option(t.navn, t.id)));
      $('#svcType').value = 'Service'; $('#svcPo').value = ''; $('#svcPris').value = ''; $('#svcBeskrivelse').value = '';
      openModal('modalSvcNy');
    });
    $('#svcNyOk').addEventListener('click', () => {
      const beskrivelse = $('#svcBeskrivelse').value.trim();
      if (!beskrivelse) return toast('Skriv en beskrivelse, før du opretter opgaven');
      const digits = () => String(Math.floor(100000 + Math.random() * 900000));
      const chars = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 33)]).join('');
      const id = `CAS-${digits()}-${chars()}`;
      S.serviceopgaver = S.serviceopgaver || [];
      S.serviceopgaver.push({
        id, siteId: $('#svcSite').value, beskrivelse, tekniker: $('#svcTekAssign').value, status: 'Åben',
        po: $('#svcPo').value.trim(), oprettet: today(), lukket: '', type: $('#svcType').value, pris: +$('#svcPris').value || 0,
      });
      save(); closeModal('modalSvcNy'); toast(`Serviceopgave ${id} oprettet`); this.render();
    });
