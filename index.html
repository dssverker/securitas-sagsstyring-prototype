        const hay = [u.navn, u.omraade, u.bestillingsmail, u.ccMail, ...(u.kontakter || []).flatMap(k => [k.navn, k.mail])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    $('#ulRows').innerHTML = rows.map(u => {
      const projCnt = S.projekter.filter(p => p.ulId === u.id).length;
      const siteCnt = ulSites(u.id).length;
      return `<tr class="click" data-open="${h(u.id)}" tabindex="0">
        <td><b>${h(u.navn)}</b></td><td>${h(u.omraade) || '–'}</td><td>${h(u.vagttelefon) || '–'}</td>
        <td>${h(u.bestillingsmail) || '–'}</td><td>${h(u.ccMail) || '–'}</td>
        <td class="num">${kr(u.timeprisKost)}</td><td class="num">${kr(u.timeprisSalg)}</td>
        <td class="num">${projCnt}</td><td class="num">${siteCnt}</td></tr>`;
    }).join('') || `<tr><td colspan="9" class="empty">${list.length ? 'Ingen underleverandører matcher filteret.' : 'Ingen underleverandører endnu.'}</td></tr>`;
  },
});

</script>
<script>
// Eftersyn – kalender og status for alle sites med eftersynsaftale.
// Erstatter kolonnerne Eftersyn, ES-måned, interval, "Eftersyn til kunden" og "CAS eftersyn 2025/2026" i Kundekartotek.

// ---------- lokal helper (kernen har ingen "UL-navne pr. site" – kun pr. installation via ulId, jf. pages/kunder.js) ----------
// Navngivet med ef-præfiks: top-level const i søskende-<script>-tags deler samme leksikalske scope i browseren,
// og pages/kunder.js har allerede en "ulNavneForSite" – to ens navne giver en SyntaxError ved indlæsning.
const efUlNavneForSite = siteId => [...new Set(App.installationer(siteId).map(i => App.ulNavn(i.ulId)).filter(Boolean))];

App.registerPage({
  id: 'eftersyn', label: 'Eftersyn', group: 'Service', icon: 'time', order: 45,
  roles: ['Chef', 'PM', 'Service', 'Tekniker', 'Fakturering'],
  html: `
    <style>
      /* Sidste udvej (kun denne side, jf. PLAN-v2): 11 kolonner passer ikke i 1280 px med standard
         table-dense-bredder. Tættere kunde/serviceaftale/UL/CAS-kolonner og trunkeret status (alle med
         title) her, indtil kernen evt. gør main-området bredere. */
      #efTable td.cut.w-xs { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
      #efTable td.st-cut { max-width: 116px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
    <div class="page-head">
      <div>
        <h1>Eftersyn</h1>
        <p>Overblik over næste eftersyn pr. site, beregnet ud fra sidste eftersyn og interval – eller ES-måned, hvis der endnu ikke er registreret et udført eftersyn.</p>
      </div>
      <div class="replaces">Erstatter kolonnerne <b>Eftersyn</b>, <b>ES-måned</b>, <b>interval</b>, <b>Eftersyn til kunden</b> og <b>CAS eftersyn 2025/2026</b> i Kundekartotek</div>
    </div>
    <div class="stats" id="efStats"></div>
    <div class="card">
      <div class="toolbar">
        <div class="ftabs" id="efTabs" role="group" aria-label="Status">
          <button class="ftab on" data-v="">Alle</button>
          <button class="ftab" data-v="over">Overskredet</button>
          <button class="ftab" data-v="30">30 dage</button>
          <button class="ftab" data-v="90">90 dage</button>
          <button class="ftab" data-v="uden">Uden aftale</button>
        </div>
        <div class="ftabs" id="efViewTabs" role="group" aria-label="Visning">
          <button class="ftab on" data-v="liste">Liste</button>
          <button class="ftab" data-v="kalender">Kalender</button>
        </div>
        <label class="field">Søg <input type="text" id="efSearch" placeholder="Site, kunde, installation" size="26"></label>
      </div>
      <div class="table-wrap" id="efListWrap">
        <table class="table-dense" id="efTable">
          <thead><tr>
            <th data-sort="text">Kunde</th><th data-sort="text">Site</th><th data-sort="text">Installation</th>
            <th data-sort="text">Serviceaftale</th><th data-sort="text">UL</th>
            <th data-sort="date">Sidst</th><th data-sort="date">Næste</th><th data-sort="num">Interval</th>
            <th data-sort="text">Status</th><th data-sort="text">CAS-nr.</th><th></th>
          </tr></thead>
          <tbody id="efRows"></tbody>
        </table>
      </div>
      <div class="card-body" id="efCalWrap" style="display:none"></div>
    </div>

    <div class="modal-bg" id="modalEfDetaljer">
      <div class="modal" role="dialog" aria-labelledby="efDetTitle">
        <header><h2 id="efDetTitle">Eftersyn</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body" id="efDetBody"></div>
        <footer><button class="btn" data-close>Luk</button><button class="btn cta" id="efSendPaamindelse">Send påmindelse til kunde</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalEfMail">
      <div class="modal" role="dialog" aria-labelledby="efMailTitle">
        <header><h2 id="efMailTitle">Påmindelse til kunde</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid" style="margin-bottom:18px">
            <label>Til<input type="text" id="efMailTil" readonly></label>
            <label>Fra<input type="text" id="efMailFra" readonly></label>
          </div>
          <div class="pdf" id="efMailPreview"></div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="efMailSend">Send</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, D, S, save, toast, today, h, kr, openModal, closeModal, emp, site } = App;

    // ---------- lokale datohjælpere (dansk format, TZ-sikre) ----------
    const parseISO = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const ddmm = s => { if (!s) return '–'; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };
    const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

    // Læser via App.eftersynSite(siteId) (§4) i stedet for sitets egne eftersynsfelter – det er kernens
    // aggregat over installationernes eftersyn (tidligste aktive), så eftersynslisten forbliver én række pr. site.
    const nextEftersyn = (s, t) => {
      const e = App.eftersynSite(s.id);
      return e.naeste ? parseISO(e.naeste) : null;
    };

    const opgaveFor = s => (S.serviceopgaver || []).find(o => o.siteId === s.id && o.type === 'Eftersyn' && o.status === 'Åben');

    const rowInfo = (s, t) => {
      const ef = App.eftersynSite(s.id);
      const nd = ef.aktiv ? nextEftersyn(s, t) : null;
      let status, cls, label;
      if (!ef.aktiv || !nd) { status = 'uden'; cls = ''; label = 'Uden aftale'; }
      else {
        const diff = Math.round((nd - t) / 86400000);
        if (diff < 0) { status = 'over'; cls = 'over'; label = 'Overskredet'; }
        else if (diff <= 30) { status = '30'; cls = 'snart'; label = 'Inden for 30 dage'; }
        else if (diff <= 90) { status = '90'; cls = 'snart'; label = 'Inden for 90 dage'; }
        else { status = 'planlagt'; cls = ''; label = 'Planlagt'; }
      }
      return { site: s, ef, nextDate: nd, status, cls, label };
    };

    const genCasId = () => {
      const digits = () => String(Math.floor(100000 + Math.random() * 900000));
      const chars = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 33)]).join('');
      return `CAS-${digits()}-${chars()}`;
    };

    this.helpers = { parseISO, ddmm, startOfToday, nextEftersyn, opgaveFor, rowInfo };

    // ---------- toolbar ----------
    $$('#efTabs .ftab').forEach(b => b.addEventListener('click', () => {
      $$('#efTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.fStatus = b.dataset.v; this.render();
    }));
    $$('#efViewTabs .ftab').forEach(b => b.addEventListener('click', () => {
      $$('#efViewTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.fView = b.dataset.v; this.render();
    }));
    $('#efSearch').addEventListener('input', () => this.render());

    this.table = $('#efTable');
    App.sortable(this.table, 'eftersyn-liste', { col: 7, dir: 'asc' });

    // ---------- rækkehandlinger ----------
    $('#efRows').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (btn) {
        const s = site(btn.dataset.id);
        if (!s || !s.id) return;
        // Aktive installationer på sitet – begge handlinger skriver på dem (§4), ikke på sitets spejlfelter alene.
        const aktive = App.installationer(s.id).filter(i => i.eftersyn && i.eftersyn.aktiv);
        if (btn.dataset.act === 'opret') {
          const forsteTekniker = (D.medarbejdere.find(m => m.rolle === 'Tekniker') || {}).id || '';
          const id = genCasId();
          S.serviceopgaver = S.serviceopgaver || [];
          S.serviceopgaver.push({ id, siteId: s.id, beskrivelse: `Eftersyn – ${App.siteLabel(s)}`, tekniker: forsteTekniker, status: 'Åben', type: 'Eftersyn', oprettet: today(), lukket: '', po: '', pris: 0 });
          aktive.forEach(i => { i.eftersyn.cas = id; });
          save(); toast(`Eftersynsopgave ${id} oprettet`); this.render();
        } else if (btn.dataset.act === 'udfoert') {
          aktive.forEach(i => { i.eftersyn.sidste = today(); });
          const opg = opgaveFor(s);
          if (opg) { opg.status = 'Lukket til fakturering'; opg.lukket = today(); }
          save(); toast(`${s.id} markeret som udført`); this.render();
        }
        return;
      }
      const tr = e.target.closest('tr[data-site]');
      if (tr) this.openDetaljer(tr.dataset.site);
    });

    $('#efCalWrap').addEventListener('click', e => {
      const li = e.target.closest('[data-site]');
      if (li) this.openDetaljer(li.dataset.site);
    });

    // ---------- detalje-modal ----------
    $('#efSendPaamindelse').addEventListener('click', () => {
      const s = site(this._curSite); if (!s || !s.id) return;
      const kundeNavn = App.kundeNavn(s);
      $('#efMailTil').value = s.kontakt || `Kontaktperson, ${kundeNavn}`;
      $('#efMailFra').value = emp(S.user).navn;
      const t = startOfToday();
      const ef = App.eftersynSite(s.id);
      const nd = ef.aktiv ? nextEftersyn(s, t) : null;
      $('#efMailPreview').innerHTML = `
        <div class="pdf-head"><b>Påmindelse om eftersyn</b><span class="muted">${today()}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
        <dl>
          <dt>Kunde</dt><dd>${h(kundeNavn)}</dd><dt>Site</dt><dd>${h(App.siteLabel(s))}</dd>
          <dt>Adresse</dt><dd>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</dd><dt>Kontaktperson</dt><dd>${h(s.kontakt) || '–'}</dd>
          <dt>Installation</dt><dd>${h(App.installationTyper(s.id)) || '–'}</dd><dt>Planlagt dato</dt><dd>${nd ? ddmm(nd.getFullYear() + '-' + String(nd.getMonth() + 1).padStart(2, '0') + '-' + String(nd.getDate()).padStart(2, '0')) : '–'}</dd>
        </dl>
        <p>Vi skal snart udføre planlagt eftersyn af jeres anlæg. Vi kontakter jer for at aftale nærmere tidspunkt.</p>
        <p class="caption muted" style="margin-top:18px">Alle felter ovenfor er hentet fra sitet. Ingen er tastet til denne påmindelse.</p>`;
      closeModal('modalEfDetaljer'); openModal('modalEfMail');
    });
    $('#efMailSend').addEventListener('click', () => {
      closeModal('modalEfMail'); toast('Påmindelse sendt til kunden');
    });
  },
  openDetaljer(siteId) {
    const { $, S, site, h, kr, st, openModal, siteLabel } = App;
    const { ddmm, startOfToday, nextEftersyn, opgaveFor, rowInfo } = this.helpers;
    const s = site(siteId); if (!s || !s.id) return;
    this._curSite = siteId;
    const t = startOfToday();
    const info = rowInfo(s, t);
    const opg = opgaveFor(s);
    const kundeNavn = App.kundeNavn(s);
    $('#efDetTitle').textContent = `Eftersyn · ${s.navn || kundeNavn}`;
    $('#efDetBody').innerHTML = `
      <div class="form-grid" style="margin-bottom:18px">
        <div><small class="muted">Site og kunde</small><br><b>${h(kundeNavn)}</b><br><span class="muted">${h(siteLabel(s))}</span></div>
        <div><small class="muted">Adresse</small><br><b>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</b></div>
        <div><small class="muted">Installation</small><br><b>${h(App.installationTyper(s.id)) || '–'}</b></div>
        <div><small class="muted">Serviceaftale</small><br><b>${h(App.serviceaftaler(s.id).join(', ')) || '–'}</b></div>
        <div><small class="muted">UL</small><br><b>${h(efUlNavneForSite(s.id).join(', ')) || '–'}</b></div>
        <div><small class="muted">Kontaktperson</small><br><b>${h(s.kontakt) || '–'}</b></div>
        <div><small class="muted">Sidste eftersyn</small><br><b>${ddmm(info.ef.sidste)}</b></div>
        <div><small class="muted">Næste eftersyn</small><br><b>${info.nextDate ? ddmm(info.nextDate.getFullYear() + '-' + String(info.nextDate.getMonth() + 1).padStart(2, '0') + '-' + String(info.nextDate.getDate()).padStart(2, '0')) : '–'}</b></div>
        <div><small class="muted">Interval</small><br><b>${info.ef.interval ? info.ef.interval + ' måneder' : '–'}</b></div>
        <div><small class="muted">Status</small><br>${`<span class="st ${info.cls}">${h(info.label)}</span>`}</div>
        <div><small class="muted">CAS-nr.</small><br><b>${h(opg ? opg.id : (info.ef.cas || '–'))}</b></div>
      </div>
    `;
    openModal('modalEfDetaljer');
  },
  render() {
    const { $, $$, S, h, kr, site, st, siteLabel } = App;
    const { ddmm, startOfToday, opgaveFor, rowInfo } = this.helpers;
    const t = startOfToday();
    const all = (S.sites || []).map(s => rowInfo(s, t));

    // KPI'er – uafhængige af tabel-/kalenderfilter
    const overskredne = all.filter(r => r.status === 'over').length;
    const inden30 = all.filter(r => r.status === '30').length;
    const inden90 = all.filter(r => r.status === '30' || r.status === '90').length;
    const iAlt = all.filter(r => r.ef.aktiv).length;
    $('#efStats').innerHTML = [
      ['Overskredet', overskredne],
      ['Inden for 30 dage', inden30],
      ['Inden for 90 dage', inden90],
      ['Sites med eftersynsaftale', iAlt],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

    // filtre
    const status = this.fStatus || '';
    const view = this.fView || 'liste';
    const q = $('#efSearch').value.trim().toLowerCase();
    let rows = all.filter(r => {
      if (status && r.status !== status) return false;
      if (q) {
        const hay = [r.site.id, r.site.kode, App.kundeNavn(r.site), r.site.navn, App.installationTyper(r.site.id), r.site.adresse].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => {
      const av = a.nextDate ? a.nextDate.getTime() : Infinity, bv = b.nextDate ? b.nextDate.getTime() : Infinity;
      return av - bv;
    });

    $('#efListWrap').style.display = view === 'liste' ? '' : 'none';
    $('#efCalWrap').style.display = view === 'kalender' ? '' : 'none';

    if (view === 'liste') {
      $('#efRows').innerHTML = rows.map(r => {
        const s = r.site;
        const opg = opgaveFor(s);
        const kundeNavn = App.kundeNavn(s);
        const iso = r.nextDate ? r.nextDate.getFullYear() + '-' + String(r.nextDate.getMonth() + 1).padStart(2, '0') + '-' + String(r.nextDate.getDate()).padStart(2, '0') : '';
        const kort = siteLabel(s, true);
        const siteCell = s.kode ? `<td>${h(kort)}</td>` : `<td class="cut w-xs" title="${h(siteLabel(s))}">${h(kort)}</td>`;
        const serviceaftale = App.serviceaftaler(s.id).join(', ');
        const ulNavne = efUlNavneForSite(s.id).join(', ');
        const casNr = opg ? opg.id : (r.ef.cas || '–');
        return `<tr class="click" data-site="${h(s.id)}" tabindex="0">
          <td class="cut w-xs" title="${h(kundeNavn)}"><b>${h(kundeNavn)}</b></td>
          ${siteCell}
          <td>${h(App.installationTyper(s.id)) || '–'}</td>
          <td class="cut w-xs" title="${h(serviceaftale)}">${h(serviceaftale) || '–'}</td>
          <td class="cut w-xs" title="${h(ulNavne)}">${h(ulNavne) || '–'}</td>
          <td>${ddmm(r.ef.sidste)}</td>
          <td>${iso ? ddmm(iso) : '–'}</td>
          <td>${r.ef.interval ? r.ef.interval + ' mdr.' : '–'}</td>
          <td class="st-cut" title="${h(r.label)}"><span class="st ${r.cls}">${h(r.label)}</span></td>
          <td class="cut w-xs" title="${h(casNr)}">${h(casNr)}</td>
          <td class="actions">
            ${!opg ? `<button class="tlink" data-act="opret" data-id="${h(s.id)}" title="Opret eftersynsopgave">Opret</button>` : ''}
            <button class="tlink" data-act="udfoert" data-id="${h(s.id)}" title="Marker eftersyn som udført">Udført</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="11" class="empty">Ingen sites matcher filteret.</td></tr>';

      App.applySort(this.table, 'eftersyn-liste');
    } else {
      // kalender – 12 måneder frem
      const months = [];
      for (let i = 0; i < 12; i++) {
        const d = new Date(t.getFullYear(), t.getMonth() + i, 1);
        months.push({ y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' }), items: [] });
      }
      const overdue = [];
      rows.forEach(r => {
        if (!r.nextDate) return;
        if (r.status === 'over') { overdue.push(r); return; }
        const y = r.nextDate.getFullYear(), m = r.nextDate.getMonth();
        const bucket = months.find(mo => mo.y === y && mo.m === m);
        if (bucket) bucket.items.push(r);
      });
      const cardHtml = (title, items, over) => `
        <div class="card${over ? ' overdue' : ''}">
          <div class="card-body">
            <h3>${h(title)}</h3>
            <div class="count">${items.length}</div>
            <ul>${items.map(r => `<li data-site="${h(r.site.id)}" tabindex="0" style="cursor:pointer"><b>${h(App.kundeNavn(r.site))}</b><br><span class="muted">${h(siteLabel(r.site, true))}</span></li>`).join('') || '<li class="muted">Ingen eftersyn</li>'}</ul>
          </div>
        </div>`;
      $('#efCalWrap').innerHTML = `<div class="ef-cal">${cardHtml('Overskredet', overdue, true)}${months.map(mo => cardHtml(mo.label, mo.items, false)).join('')}</div>`;
    }
  },
});

</script>
<script>
// Rapporter. Erstatter "Salg"-arket (omsætning pr. måned) og UL Q1-Q4-kolonnerne i kundekartoteket.
// Alle diagrammer er inline SVG genereret i JS – ingen eksterne biblioteker.
(function () {
  const MONTH_ABBR = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  const COL_NOVO = 'var(--sec-navy-blue)';
  const COL_GEN = 'var(--sec-purple)';
  const COL_GOOD = 'var(--sec-navy-blue)';
  const COL_WARN = 'var(--ui-blue-500)';
  const COL_BAD = 'var(--ui-red-500)';
  const CAT_COLORS = ['var(--sec-navy-blue)', 'var(--sec-purple)', 'var(--ui-blue-500)', 'var(--ui-purple-200)', 'var(--ui-blue-300)', 'var(--ui-grey-700)'];
  const COL_OTHER = 'var(--ui-grey-500)';

  // ---------- dato/periode-helpers ----------
  const monthKey = d => (d || '').slice(0, 7);
  const monthLabel = ym => { const [y, m] = ym.split('-'); return MONTH_ABBR[(+m || 1) - 1] + ' ' + y.slice(2); };
  const addMonths = (ym, delta) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + delta, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const qtrOf = ym => { const [y, m] = ym.split('-'); return y + ' K' + Math.ceil((+m) / 3); };
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

  function periodMonths(periode) {
    if (periode === '2025') return Array.from({ length: 12 }, (_, i) => '2025-' + String(i + 1).padStart(2, '0'));
    if (periode === '2026') return Array.from({ length: 12 }, (_, i) => '2026-' + String(i + 1).padStart(2, '0'));
    const cur = App.today().slice(0, 7);
    const arr = []; for (let i = 11; i >= 0; i--) arr.push(addMonths(cur, -i));
    return arr;
  }
  const periodLabel = p => p === '2025' ? '2025' : p === '2026' ? '2026' : 'Seneste 12 måneder';

  // ---------- talformat ----------
  const krShort = v => {
    const av = Math.abs(v || 0);
    if (av >= 1e6) return App.n((v / 1e6).toFixed(1)) + ' mio.';
    if (av >= 1000) return App.n(Math.round(v / 1000)) + ' t.';
    return App.n(Math.round(v || 0));
  };
  const niceCeil = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f0 = v / p; const f = f0 <= 1 ? 1 : f0 <= 2 ? 2 : f0 <= 5 ? 5 : 10; return f * p; };

  // ---------- SVG-byggeklodser ----------
  function svgWrap(w, h, title, inner) {
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;height:auto" role="img"><title>${App.h(title)}</title>${inner}</svg>`;
  }

  // Lodrette søjler, evt. stablet, en eller to serier (måneder/kvartaler på x-aksen)
  function barsChart(data, seriesDefs, { title, valueFmt = krShort, height = 260, stacked = true } = {}) {
    const W = Math.max(560, 46 + data.length * 54), H = height, ML = 56, MR = 12, MT = 16, MB = 42;
    const plotW = W - ML - MR, plotH = H - MT - MB;
    const gap = Math.max(6, Math.min(16, plotW / data.length * 0.22));
    const groupW = plotW / data.length;
    const bw = stacked ? groupW - gap : (groupW - gap) / seriesDefs.length;
    const maxStack = Math.max(1, ...data.map(d => stacked ? seriesDefs.reduce((a, s) => a + (d.values[s.key] || 0), 0) : Math.max(...seriesDefs.map(s => d.values[s.key] || 0))));
    const niceMax = niceCeil(maxStack);
    let grid = '', xlabels = '', bars = '';
    for (let i = 0; i <= 4; i++) {
      const v = niceMax / 4 * i, y = MT + plotH - (v / niceMax) * plotH;
      grid += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${ML + plotW}" y2="${y.toFixed(1)}" stroke="var(--ui-grey-300)" stroke-width="1"/>`;
      grid += `<text x="${ML - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">${valueFmt(v)}</text>`;
    }
    grid += `<line x1="${ML}" y1="${MT + plotH}" x2="${ML + plotW}" y2="${MT + plotH}" stroke="var(--ui-grey-400)" stroke-width="1"/>`;
    data.forEach((d, i) => {
      const gx = ML + i * groupW + gap / 2;
      xlabels += `<text x="${(gx + (groupW - gap) / 2).toFixed(1)}" y="${MT + plotH + 18}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${App.h(d.label)}</text>`;
      let yCursor = MT + plotH;
      seriesDefs.forEach((s, si) => {
        const v = d.values[s.key] || 0;
        const bh = (v / niceMax) * plotH;
        const x = stacked ? gx : gx + si * bw;
        const y = stacked ? yCursor - bh : MT + plotH - bh;
        if (v > 0) bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(0, bw - (stacked ? 0 : 2)).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${s.color}"><title>${App.h(d.label)} – ${App.h(s.label)}: ${App.kr(v)}</title></rect>`;
        if (stacked) yCursor -= bh + (bh > 0 ? 2 : 0);
      });
    });
    return svgWrap(W, H, title, grid + bars + xlabels);
  }

  // Vandrette søjler (fx DG pr. projekt) med referencelinje
  function hBarsChart(items, { title, refLine = 30, unit = ' %' } = {}) {
    const rowH = 24, ML = 190, MR = 56, MT = 12, MB = 26, W = 900;
    const H = MT + MB + items.length * rowH;
    const plotW = W - ML - MR;
    const vals = items.map(i => i.value);
    const domMin = Math.min(0, ...vals, refLine);
    const domMax = Math.max(refLine, ...vals, 0.001);
    const span = (domMax - domMin) || 1;
    const xScale = v => ML + ((v - domMin) / span) * plotW;
    const zeroX = xScale(0), refX = xScale(refLine);
    let bars = '', labels = '';
    items.forEach((it, i) => {
      const y = MT + i * rowH + 4;
      const x0 = xScale(Math.min(0, it.value)), x1 = xScale(Math.max(0, it.value));
      const color = it.value == null ? 'var(--ui-grey-400)' : it.value >= 30 ? COL_GOOD : it.value >= 15 ? COL_WARN : COL_BAD;
      bars += `<rect x="${x0.toFixed(1)}" y="${y}" width="${Math.max(0.5, x1 - x0).toFixed(1)}" height="${rowH - 8}" rx="2" fill="${color}"><title>${App.h(it.label)}: ${it.value == null ? '–' : App.pct(it.value)}</title></rect>`;
      labels += `<text x="${ML - 8}" y="${y + (rowH - 8) / 2 + 4}" text-anchor="end" font-size="12" fill="var(--text-primary)">${App.h(it.label)}</text>`;
      const vx = it.value >= 0 ? x1 + 6 : x1 - 6;
      labels += `<text x="${vx.toFixed(1)}" y="${y + (rowH - 8) / 2 + 4}" text-anchor="${it.value >= 0 ? 'start' : 'end'}" font-size="12" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">${it.value == null ? '–' : App.pct(it.value)}</text>`;
    });
    const ref = `<line x1="${refX.toFixed(1)}" y1="${MT - 4}" x2="${refX.toFixed(1)}" y2="${MT + items.length * rowH}" stroke="var(--ui-grey-700)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="${refX.toFixed(1)}" y="${MT - 6}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${refLine}${unit}</text>`;
    const zero = `<line x1="${zeroX.toFixed(1)}" y1="${MT - 4}" x2="${zeroX.toFixed(1)}" y2="${MT + items.length * rowH}" stroke="var(--ui-grey-400)" stroke-width="1"/>`;
    return svgWrap(W, H, title, zero + ref + bars + labels);
  }

  // Linjediagram – timer pr. måned, én linje pr. tekniker (op til 6 serier)
  // Valgfrit (PLAN-v5): unit = endelse i tooltip, labelFmt = x-akse-etiket, ML = venstre marg, serie.dash = stiplet linje,
  // serie.endLabel = direkte etiket ved sidste punkt. Værdier må være negative, og null giver et hul i linjen.
  function linesChart(months, series, { title, valueFmt = v => App.n(Math.round(v)), unit = ' t.', labelFmt = monthLabel, ML = 44 } = {}) {
    const W = Math.max(560, 46 + months.length * 54), H = 240, MR = series.some(s => s.endLabel) ? 84 : 16, MT = 16, MB = 34;
    const plotW = W - ML - MR, plotH = H - MT - MB;
    const all = series.flatMap(s => s.values).filter(v => v != null);
    // Pæne trin, der altid rammer nul – også når serien går under nul
    const hi = Math.max(1, ...all), lo = Math.min(0, ...all);
    const step = niceCeil((hi - lo) / 5);
    const minV = Math.floor(lo / step) * step, maxV = Math.ceil(hi / step) * step;
    const span = maxV - minV;
    const yOf = v => MT + plotH - ((v - minV) / span) * plotH;
    const xStep = months.length > 1 ? plotW / (months.length - 1) : 0;
    let grid = '', xlabels = '';
    for (let v = minV; v <= maxV + step / 1000; v += step) {
      const y = yOf(v), zero = Math.abs(v) < step / 1000;
      grid += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${ML + plotW}" y2="${y.toFixed(1)}" stroke="${zero && minV < 0 ? 'var(--ui-grey-600)' : 'var(--ui-grey-300)'}" stroke-width="1"/>`;
      grid += `<text x="${ML - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">${valueFmt(zero ? 0 : v)}</text>`;
    }
    months.forEach((m, i) => { xlabels += `<text x="${(ML + i * xStep).toFixed(1)}" y="${MT + plotH + 18}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${labelFmt(m)}</text>`; });
    let paths = '';
    series.forEach(s => {
      let d = '', dots = '', pen = false, last = null;
      s.values.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        const x = ML + i * xStep, y = yOf(v);
        d += (pen ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' '; pen = true; last = { x, y };
        dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface-card)" stroke-width="2"><title>${App.h(s.label)}, ${labelFmt(months[i])}: ${valueFmt(v)}${unit}</title></circle>`;
      });
      paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"${s.dash ? ' stroke-dasharray="5,4"' : ''}/>${dots}`;
      if (s.endLabel && last) paths += `<text x="${(last.x + 10).toFixed(1)}" y="${(last.y + 4).toFixed(1)}" font-size="12" fill="var(--text-secondary)">${App.h(s.endLabel)}</text>`;
    });
    return svgWrap(W, H, title, grid + paths + xlabels);
  }

  function legendHtml(items) {
    return `<div class="rap-legend">${items.map(it => `<span class="rap-lg"><i style="background:${it.color}"></i>${App.h(it.label)}</span>`).join('')}</div>`;
  }

  // Diagram-byggeklodserne deles med pages/oekonomi.js, så der kun findes én udgave (PLAN-v5)
  window.RapCharts = { barsChart, linesChart, legendHtml, krShort, MONTH_ABBR };

  // ---------- rapport-datalogik ----------
  function afdOk(afd) { return !App.S.rapAfd || afd === App.S.rapAfd; }

  function revenueData(months) {
    const { S, calc } = App;
    const mode = S.rapMode || 'fakt';
    const idx = {}; months.forEach((m, i) => idx[m] = i);
    const data = months.map(m => ({ label: monthLabel(m), values: { Novo: 0, Generel: 0 } }));
    S.projekter.forEach(p => {
      if (!afdOk(p.afdeling)) return;
      if (mode === 'fakt') {
        (p.fakturering || []).forEach(f => {
          if (f.status !== 'Faktureret') return;
          const i = idx[monthKey(f.dato)];
          if (i != null && data[i].values[p.afdeling] != null) data[i].values[p.afdeling] += (+f.beloeb || 0);
        });
      } else {
        const i = idx[p.maaned];
        if (i != null && data[i].values[p.afdeling] != null) data[i].values[p.afdeling] += calc(p).salg;
      }
    });
    return data;
  }

  function dgData(months) {
    const { S, calc, emp } = App;
    const projs = S.projekter.filter(p => afdOk(p.afdeling) && months.includes(p.maaned));
    const items = projs.map(p => ({ id: p.id, label: p.id, pm: p.pm, value: calc(p).dgF }))
      .sort((a, b) => (b.value ?? -999) - (a.value ?? -999));
    const byPm = {};
    projs.forEach(p => {
      const c = calc(p);
      const row = byPm[p.pm] || (byPm[p.pm] = { pm: p.pm, navn: emp(p.pm).navn, n: 0, salg: 0, udg: 0, dgSum: 0, dgN: 0 });
      row.n++; row.salg += c.salg; row.udg += c.udg;
      if (c.dgF != null) { row.dgSum += c.dgF; row.dgN++; }
    });
    return { items, byPm: Object.values(byPm).sort((a, b) => b.salg - a.salg) };
  }

  function techData(months) {
    const { S, emp } = App;
    const from30 = daysAgo(30), today = App.today();
    const techs = (S.medarbejdere || App.D.medarbejdere).filter(m => m.rolle === 'Tekniker' && afdOk(m.afdeling));
    const rows = techs.map(t => {
      const openCases = S.serviceopgaver.filter(c => c.tekniker === t.id && c.status === 'Åben').length;
      const projSet = new Set();
      S.tid.filter(r => r.tekniker === t.id && r.dato >= from30 && r.dato <= today).forEach(r => { if (S.projekter.some(p => p.id === r.sag)) projSet.add(r.sag); });
      return { id: t.id, navn: t.navn, openCases, projekter: projSet.size };
    });
    const idx = {}; months.forEach((m, i) => idx[m] = i);
    const series = techs.map((t, i) => ({
      key: t.id, label: t.navn, color: CAT_COLORS[i % CAT_COLORS.length],
      values: months.map(() => 0),
    }));
    // intern tid (ferie, sygdom, kursus m.m.) tælles aldrig med i sagstimerne pr. tekniker,
    // men vises som sin egen serie, så månedens samlede fravær stadig kan aflæses.
    const internSeries = { key: '__intern', label: 'Intern tid', color: 'var(--ui-grey-700)', values: months.map(() => 0) };
    S.tid.forEach(r => {
      const i = idx[monthKey(r.dato)];
      if (i == null) return;
      const timer = (+r.timer || 0) + (+r.ot1 || 0) + (+r.ot2 || 0);
      if (App.isIntern(r)) { internSeries.values[i] += timer; return; }
      const s = series.find(s => s.key === r.tekniker);
      if (s) s.values[i] += timer;
    });
    series.push(internSeries);
    return { rows, series };
  }

  function ulData(months) {
    const { S } = App;
    const quarters = [];
    months.forEach(m => { const q = qtrOf(m); if (!quarters.includes(q)) quarters.push(q); });
    const byQL = {}; // kvartal -> leverandoer -> sum
    const byL = {}; // leverandoer -> total
    const monthSet = new Set(months);
    S.projekter.forEach(p => {
      if (!afdOk(p.afdeling)) return;
      (p.udgifter || []).forEach(u => {
        const lev = (u.leverandoer || '').trim();
        if (!lev || lev === 'Securitas') return;
        const mk = monthKey(u.dato);
        if (!monthSet.has(mk)) return;
        const q = qtrOf(mk);
        (byQL[q] || (byQL[q] = {}))[lev] = (byQL[q][lev] || 0) + (+u.beloeb || 0);
        byL[lev] = (byL[lev] || 0) + (+u.beloeb || 0);
      });
    });
    const topSuppliers = Object.entries(byL).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const shown = topSuppliers.slice(0, 6);
    const rest = topSuppliers.slice(6);
    const data = quarters.map(q => {
      const values = {};
      shown.forEach(l => values[l] = (byQL[q] || {})[l] || 0);
      if (rest.length) values['Andre'] = rest.reduce((a, l) => a + ((byQL[q] || {})[l] || 0), 0);
      return { label: q, values };
    });
    const seriesDefs = shown.map((l, i) => ({ key: l, label: l, color: CAT_COLORS[i % CAT_COLORS.length] }));
    if (rest.length) seriesDefs.push({ key: 'Andre', label: 'Andre', color: COL_OTHER });
    const table = topSuppliers.map(l => ({ leverandoer: l, total: byL[l] }));
    return { quarters, data, seriesDefs, table };
  }

  // ---------- side ----------
  App.registerPage({
    // B6/F1: Rapporter flyttet ind i gruppen Økonomi, sidst (order: 70 holder den efter Økonomisk overblik,
    // Til fakturering og Kontering – v5-beslutning 7 om rækkefølgen inde i gruppen er uændret).
    id: 'rapporter', label: 'Rapporter', group: 'Økonomi', icon: 'screen', order: 70,
    roles: ['Chef', 'PM', 'Fakturering'],
    html: `
    <div class="page-head">
      <div>
        <h1>Rapporter</h1>
        <p>Omsætning, dækningsgrad, teknikerbelastning og UL-forbrug samlet ét sted. Periode og afdeling styrer alle fire rapporter.</p>
      </div>
      <div class="replaces">Erstatter <b>Salg</b>-arket og <b>UL Q1-Q4</b>-kolonnerne i kundekartoteket</div>
    </div>
    <div class="rap-toolbar">
      <div class="grp">
        <span class="lbl">Periode</span>
        <div class="ftabs" id="rapPeriode" role="group" aria-label="Periode">
          <button class="ftab" data-v="2025">2025</button>
          <button class="ftab" data-v="2026">2026</button>
          <button class="ftab" data-v="last12">Seneste 12 mdr.</button>
        </div>
      </div>
      <div class="grp">
        <span class="lbl">Afdeling</span>
        <div class="ftabs" id="rapAfd" role="group" aria-label="Afdeling">
          <button class="ftab" data-v="">Alle</button>
          <button class="ftab" data-v="Novo">Novo</button>
          <button class="ftab" data-v="Generel">Generel</button>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="rapExport"><svg class="ico s"><use href="#i-export"/></svg>Eksportér til Excel</button>
    </div>

    <div class="card rap-card">
      <div class="card-body">
        <h2>Omsætning pr. måned</h2>
        <p class="rap-sub"><span id="rapRevSub"></span><span id="rapTilOekWrap"> · <button class="tlink" type="button" id="rapTilOek">Se økonomisk overblik med år til dato</button></span></p>
        <div class="ftabs" id="rapMode" role="group" aria-label="Visning">
          <button class="ftab" data-v="fakt">Faktureret</button>
          <button class="ftab" data-v="salg">Salg total</button>
        </div>
        <div class="rap-chart" id="rapRevChart" style="margin-top:var(--space-4)"></div>
        ${legendHtml([{ label: 'Novo', color: COL_NOVO }, { label: 'Generel', color: COL_GEN }])}
        <div class="table-wrap"><table><thead><tr><th>Måned</th><th class="num">Novo</th><th class="num">Generel</th><th class="num">I alt</th></tr></thead><tbody id="rapRevTable"></tbody></table></div>
      </div>
    </div>

    <div class="card rap-card">
      <div class="card-body">
        <h2>Dækningsgrad pr. projekt og pr. PM</h2>
        <p class="rap-sub">DG faktisk (salg minus udgifter), sorteret. Stiplet linje viser 30 % målsætning.</p>
        <div class="rap-grid2">
          <div class="rap-chart" id="rapDgChart"></div>
          <div class="table-wrap"><table><thead><tr><th>PM</th><th class="num">Projekter</th><th class="num">Salg</th><th class="num">Udgifter</th><th class="num">DG snit</th></tr></thead><tbody id="rapDgTable"></tbody></table></div>
        </div>
      </div>
    </div>

    <div class="card rap-card">
      <div class="card-body">
        <h2>Åbne sager pr. tekniker</h2>
        <p class="rap-sub">Åbne serviceopgaver og projekter med timer registreret de seneste 30 dage, samt timer pr. måned.</p>
        <div class="table-wrap"><table><thead><tr><th>Tekniker</th><th class="num">Åbne serviceopgaver</th><th class="num">Projekter m. timer (30 dage)</th></tr></thead><tbody id="rapTechTable"></tbody></table></div>
        <h3 style="margin-top:var(--space-5)">Timer pr. måned</h3>
        <div class="rap-chart" id="rapTechChart" style="margin-top:var(--space-3)"></div>
        <div id="rapTechLegend"></div>
      </div>
    </div>

    <div class="card rap-card">
      <div class="card-body">
        <h2>UL-udgifter pr. kvartal</h2>
        <p class="rap-sub">Sum af fakturerede udgifter fra leverandører der ikke er Securitas selv, fordelt pr. kvartal og leverandør.</p>
        <div class="rap-chart" id="rapUlChart"></div>
        <div id="rapUlLegend"></div>
        <div class="table-wrap"><table><thead><tr><th>Leverandør</th><th class="num">I alt i perioden</th></tr></thead><tbody id="rapUlTable"></tbody></table></div>
      </div>
    </div>
  `,
    init() {
      const { $, $$, S, save, toast } = App;
      if (!S.rapPeriode) S.rapPeriode = 'last12';
      if (S.rapAfd == null) S.rapAfd = '';
      if (!S.rapMode) S.rapMode = 'fakt';
      $$('#rapPeriode .ftab').forEach(b => b.addEventListener('click', () => { S.rapPeriode = b.dataset.v; save(); this.render(); }));
      $$('#rapAfd .ftab').forEach(b => b.addEventListener('click', () => { S.rapAfd = b.dataset.v; save(); this.render(); }));
      $$('#rapMode .ftab').forEach(b => b.addEventListener('click', () => { S.rapMode = b.dataset.v; save(); this.render(); }));
      $('#rapExport').addEventListener('click', () => toast('Kun i den færdige løsning: her downloades rapporten som Excel-fil'));
      $('#rapTilOek').addEventListener('click', () => App.go('oekonomi'));
    },
    render() {
      const { $, $$, S, kr, pct, h, emp } = App;
      $$('#rapPeriode .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === S.rapPeriode));
      $$('#rapAfd .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === (S.rapAfd || '')));
      $$('#rapMode .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === (S.rapMode || 'fakt')));

      const months = periodMonths(S.rapPeriode);
      $('#rapRevSub').textContent = `Periode: ${periodLabel(S.rapPeriode)} · Afdeling: ${S.rapAfd || 'Alle'}`;
      // Fakturering har Rapporter, men ikke Økonomisk overblik – linket skjules, når siden ikke er tilgængelig for rollen
      const oek = App.getPage('oekonomi');
      $('#rapTilOekWrap').hidden = !(oek && oek.roles.includes(App.role()));

      // 1) Omsætning pr. måned
      const rev = revenueData(months);
      $('#rapRevChart').innerHTML = barsChart(rev, [{ key: 'Novo', label: 'Novo', color: COL_NOVO }, { key: 'Generel', label: 'Generel', color: COL_GEN }], { title: 'Omsætning pr. måned, Novo og Generel' });
      $('#rapRevTable').innerHTML = rev.map(d => `<tr><td>${h(d.label)}</td><td class="num">${kr(d.values.Novo)}</td><td class="num">${kr(d.values.Generel)}</td><td class="num">${kr(d.values.Novo + d.values.Generel)}</td></tr>`).join('')
        || '<tr><td colspan="4" class="empty">Ingen data i perioden.</td></tr>';

      // 2) DG pr. projekt / pr. PM
      const dg = dgData(months);
      $('#rapDgChart').innerHTML = dg.items.length
        ? hBarsChart(dg.items, { title: 'Dækningsgrad faktisk pr. projekt' })
        : '<p class="empty">Ingen projekter i perioden.</p>';
      $('#rapDgTable').innerHTML = dg.byPm.map(r => `<tr><td>${h(r.navn)}</td><td class="num">${r.n}</td><td class="num">${kr(r.salg)}</td><td class="num">${kr(r.udg)}</td><td class="num">${r.dgN ? pct(r.dgSum / r.dgN) : '–'}</td></tr>`).join('')
        || '<tr><td colspan="5" class="empty">Ingen projekter i perioden.</td></tr>';

      // 3) Åbne sager pr. tekniker
      const tech = techData(months);
      $('#rapTechTable').innerHTML = tech.rows.map(r => `<tr><td>${h(r.navn)}</td><td class="num">${r.openCases}</td><td class="num">${r.projekter}</td></tr>`).join('')
        || '<tr><td colspan="3" class="empty">Ingen teknikere i den valgte afdeling.</td></tr>';
      if (tech.series.length && tech.series.some(s => s.values.some(v => v > 0))) {
        $('#rapTechChart').innerHTML = linesChart(months, tech.series, { title: 'Timer pr. måned pr. tekniker', valueFmt: v => App.n(Math.round(v)) });
        $('#rapTechLegend').innerHTML = legendHtml(tech.series.map(s => ({ label: s.label, color: s.color })));
      } else {
        $('#rapTechChart').innerHTML = '<p class="empty">Ingen timeregistreringer i perioden.</p>';
        $('#rapTechLegend').innerHTML = '';
      }

      // 4) UL-udgifter pr. kvartal
      const ul = ulData(months);
      if (ul.data.length && ul.seriesDefs.length) {
        $('#rapUlChart').innerHTML = barsChart(ul.data, ul.seriesDefs, { title: 'UL-udgifter pr. kvartal og leverandør' });
        $('#rapUlLegend').innerHTML = legendHtml(ul.seriesDefs.map(s => ({ label: s.label, color: s.color })));
      } else {
        $('#rapUlChart').innerHTML = '<p class="empty">Ingen udgifter til underleverandører i perioden.</p>';
        $('#rapUlLegend').innerHTML = '';
      }
      $('#rapUlTable').innerHTML = ul.table.map(r => `<tr><td>${h(r.leverandoer)}</td><td class="num">${kr(r.total)}</td></tr>`).join('')
        || '<tr><td colspan="2" class="empty">Ingen udgifter til underleverandører i perioden.</td></tr>';
    },
  });
})();

</script>
<script>
// Økonomisk overblik (PLAN-v5). Månedens tal og år til dato for projekterne, afgrænset efter rolle via App.inScope.
// Periodisering på transaktionsdato: omsætning på fakturadato, udgifter på bogføringsdato, ordreindgang på oprettelsesmåned.
// Afsluttede projekter udledes af tallene og ikke af p.status, som senere deles op (KRAV-GAP-v6 afsnit 2.2).
(function () {
  const MONTHS = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
  const FAKTURERET = 'Faktureret';
  // krav C9: linjerne har fået et nyt mellemtrin "Sendt til fakturering". "Klar til fakturering nu" skal
  // tælle begge trin – KLAR bruger derfor kernens App.FAKTURALINJE_STATUS i stedet for egne tekststrenge,
  // så en fremtidig omdøbning af trinnene ikke skal rettes to steder.
  const KLAR = App.FAKTURALINJE_STATUS.slice(1, 3); // ['Klar til fakturering', 'Sendt til fakturering']
  const INTERN_LEV = 'Securitas';        // intern kost = udgiftslinjer fra Securitas selv (indgår allerede i DG)
  // Diagramfarver: bedste par i design-systemets skalaer (CVD- og kontrasttjek bestået). Den blå skala er bevidst afdæmpet,
  // så identitet bæres også af signaturforklaring, direkte etiketter og månedstabellen som tabelvisning.
  const COL_FAKT = 'var(--ui-blue-500)', COL_UDG = 'var(--ui-purple-300)';
  const COL_AAR = 'var(--sec-navy-blue)', COL_SIDSTE = 'var(--ui-grey-700)';

  // ---------- dato-helpers ----------
  const ym = d => (d || '').slice(0, 7);
  const addM = (m, delta) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + delta, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const monthsOfYear = y => Array.from({ length: 12 }, (_, i) => y + '-' + String(i + 1).padStart(2, '0'));
  const monthName = m => MONTHS[+m.slice(5) - 1] + ' ' + m.slice(0, 4);
  const monthShort = m => MONTHS[+m.slice(5) - 1].slice(0, 3);
  const lastClosedMonth = () => addM(App.today().slice(0, 7), -1);

  // ---------- talformat ----------
  const num = v => Math.round(v || 0).toLocaleString('da-DK');          // tabeller: uden "kr."
  const hrs = v => App.n((Math.round((v || 0) * 10) / 10).toFixed(1));
  const delta = (cur, prev) => prev ? (cur - prev) / Math.abs(prev) * 100 : null;
  const deltaTxt = d => d == null ? '–' : (d > 0 ? '+' : d < 0 ? '−' : '') + App.n(Math.abs(d).toFixed(1)) + ' %';
  // neutral: en stigning er ikke i sig selv god eller dårlig (fx udgifter) – så farves afvigelsen ikke
  const deltaHtml = (cur, prev, neutral) => { const d = delta(cur, prev); return `<span class="oek-delta${!neutral && d != null && d < 0 ? ' neg' : ''}">${deltaTxt(d)}</span>`; };

  // ---------- beregning ----------
  function flows(p, m) { // bevægelser i måneden
    let fakt = 0, udg = 0, intern = 0;
    (p.fakturering || []).forEach(f => { if (f.status === FAKTURERET && ym(f.dato) === m) fakt += +f.beloeb || 0; });
    (p.udgifter || []).forEach(u => {
      if (ym(u.dato) !== m) return;
      udg += +u.beloeb || 0;
      if ((u.leverandoer || '').trim() === INTERN_LEV) intern += +u.beloeb || 0;
    });
    return { fakt, udg, intern, ordre: p.maaned === m ? App.calc(p).salg : 0 };
  }
  function saldi(p, m) { // saldi ultimo måneden
    const salg = App.calc(p).salg;
    let faktTil = 0, udgTil = 0;
    (p.fakturering || []).forEach(f => { if (f.status === FAKTURERET && f.dato && ym(f.dato) <= m) faktTil += +f.beloeb || 0; });
    (p.udgifter || []).forEach(u => { if (u.dato && ym(u.dato) <= m) udgTil += +u.beloeb || 0; });
    const faerdig = salg > 0 && faktTil >= salg;
    return { beholdning: (p.maaned || '9999') <= m ? Math.max(0, salg - faktTil) : 0, wip: faerdig ? 0 : Math.max(0, udgTil - faktTil) };
  }
  function timer(projs, m) { // teknikertimer på projektsager (ikke intern tid) + PM- og SE-tid fra projektloggen
    const ids = projs.map(p => p.id);
    const mine = sag => ids.some(id => sag === id || (sag || '').startsWith(id + '-'));
    let tek = 0, pm = 0;
    (App.S.tid || []).forEach(t => { if (ym(t.dato) === m && !App.isIntern(t) && mine(t.sag)) tek += (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0); });
    projs.forEach(p => (p.log || []).forEach(l => { if (ym(l.dato) === m) pm += (+l.pmTid || 0) + (+l.seTid || 0); }));
    return { tek, pm };
  }
  function monthRow(projs, m) {
    const r = { m, fakt: 0, udg: 0, intern: 0, ordre: 0, beholdning: 0, wip: 0 };
    projs.forEach(p => {
      const f = flows(p, m), s = saldi(p, m);
      r.fakt += f.fakt; r.udg += f.udg; r.intern += f.intern; r.ordre += f.ordre; r.beholdning += s.beholdning; r.wip += s.wip;
    });
    const t = timer(projs, m);
    r.db = r.fakt - r.udg; r.timerTek = t.tek; r.timerPm = t.pm; r.timer = t.tek + t.pm;
    return r;
  }
  function yearToDate(rows, idx) { // bevægelser summeres, saldi tages ultimo den valgte måned
    const s = { fakt: 0, udg: 0, intern: 0, ordre: 0, timer: 0, timerTek: 0, timerPm: 0 };
    rows.slice(0, idx + 1).forEach(r => Object.keys(s).forEach(k => { s[k] += r[k]; }));
    s.db = s.fakt - s.udg; s.dg = s.fakt ? s.db / s.fakt * 100 : null;
    s.beholdning = rows[idx].beholdning; s.wip = rows[idx].wip;
    return s;
  }
  function afsluttede(projs, from, to) { // færdigfakturerede projekter, hvis sidste faktura faldt i perioden
    let n = 0, salg = 0, udg = 0;
    projs.forEach(p => {
      const c = App.calc(p);
      if (!(c.salg > 0) || c.rest > 0) return;
      const last = (p.fakturering || []).filter(f => f.status === FAKTURERET && f.dato).map(f => f.dato).sort().pop();
      if (!last || ym(last) < from || ym(last) > to) return;
      n++; salg += c.salg; udg += c.udg;
    });
    return { n, dg: salg ? (salg - udg) / salg * 100 : null };
  }
  function klarNu(projs) { // øjebliksbillede – linjerne har ingen dato, før de er faktureret. Delt op pr. status
    // (krav C9), så "sendt til fakturering" kan vises for sig i KPI-underteksten, uden at ændre totalen.
    const bySt = {}; KLAR.forEach(s => { bySt[s] = 0; });
    projs.forEach(p => (p.fakturering || []).forEach(f => { if (KLAR.includes(f.status)) bySt[f.status] += +f.beloeb || 0; }));
    return { total: KLAR.reduce((a, s) => a + bySt[s], 0), bySt };
  }
  function serviceFakt(scope, from, to) {
    // Serviceopgaver har hverken afdeling eller PM. Delopgaver følger deres projekt; øvrige henføres til afdeling ud fra kunden.
    const { S } = App; const s = App.resolveScope(scope);
    return (S.serviceopgaver || []).reduce((a, o) => {
      if (o.status !== FAKTURERET) return a;
      const d = ym(o.dato || o.lukket); if (!d || d < from || d > to) return a;
      const parent = o.parent && App.proj(o.parent);
      const ok = parent ? App.inScope(parent, s)
        : s === 'alle' || (s.startsWith('afd:') && (/novo/i.test(App.kundeNavn(o.siteId) || '') ? 'Novo' : 'Generel') === s.slice(4));
      return ok ? a + (+o.pris || 0) : a;
    }, 0);
  }
  function projRows(projs, from, to) { // drill-down: ét projekt pr. række for perioden from..to
    const months = []; for (let m = from; m <= to; m = addM(m, 1)) months.push(m);
    return projs.map(p => {
      const r = { p, fakt: 0, udg: 0, ordre: 0 };
      months.forEach(m => { const f = flows(p, m); r.fakt += f.fakt; r.udg += f.udg; r.ordre += f.ordre; });
      const s = saldi(p, to); r.wip = s.wip; r.rest = s.beholdning; r.db = r.fakt - r.udg;
      return r;
    }).filter(r => r.fakt || r.udg || r.ordre || r.wip || r.rest);
  }

  // Samlet model for den valgte måned og det valgte scope – bruges af både skærm og print, så tallene altid er ens
  function model() {
    const { S } = App;
    const scope = App.resolveScope(S.oekScope);
    const m = S.oekMaaned || lastClosedMonth();
    const year = m.slice(0, 4), prevYear = String(+year - 1), idx = +m.slice(5) - 1;
    const projs = (S.projekter || []).filter(p => App.inScope(p, scope));
    const rows = monthsOfYear(year).map(x => monthRow(projs, x));
    const prevRows = monthsOfYear(prevYear).map(x => monthRow(projs, x));
    const aatd = yearToDate(rows, idx), prevAatd = yearToDate(prevRows, idx);
    const jan = year + '-01', prevJan = prevYear + '-01', prevM = prevYear + m.slice(4);
    return {
      scope, m, year, prevYear, idx, projs, rows, prevRows, aatd, prevAatd, md: rows[idx], prevMd: prevRows[idx],
      afslMd: afsluttede(projs, m, m), afslAatd: afsluttede(projs, jan, m), klar: klarNu(projs),
      svcMd: serviceFakt(scope, m, m), svcAatd: serviceFakt(scope, jan, m),
      drillMd: projRows(projs, m, m), drillAatd: projRows(projs, jan, m),
      scopeLabel: (App.scopeOptions().find(o => o.v === scope) || {}).label || '',
      jan, prevJan, prevM,
    };
  }
  function perPm(M) {
    const by = {};
    M.drillAatd.forEach(r => {
      const b = by[r.p.pm] || (by[r.p.pm] = { pm: r.p.pm, navn: App.emp(r.p.pm).navn, n: 0, fakt: 0, udg: 0, rest: 0, wip: 0 });
      b.n++; b.fakt += r.fakt; b.udg += r.udg; b.rest += r.rest; b.wip += r.wip;
    });
    return Object.values(by).sort((a, b) => b.fakt - a.fakt);
  }

  // ---------- HTML-byggeklodser ----------
  const scopeTitle = M => M.scope === 'alle' ? 'Alle afdelinger' : M.scope.startsWith('afd:') ? 'Afdeling ' + M.scope.slice(4) : 'Projektleder ' + App.emp(M.scope.slice(3)).navn;
  const periodTxt = M => M.idx === 0 ? 'januar' : `januar–${MONTHS[M.idx]}`;

  function kpiHtml(M) {

    const aatdLine = (cur, prev, neutral) => [`År til dato ${kr(cur)}`, `${M.prevYear}: ${kr(prev)} ${deltaHtml(cur, prev, neutral)}`];

      ]),
      tile(`Ordreindgang · ${monthName(M.m)}`, kr(M.md.ordre), aatdLine(M.aatd.ordre, M.prevAatd.ordre)),
      tile('Ordrebeholdning · ultimo', kr(M.md.beholdning), ['Solgt, men endnu ikke faktureret', `${M.prevYear}: ${kr(M.prevMd.beholdning)} ${deltaHtml(M.md.beholdning, M.prevMd.beholdning, true)}`]),
      tile('Igangværende arbejde · ultimo', kr(M.md.wip), [

    ].join('');

  // Timer sammenlignes kun med sidste år, når der også dengang er registreret teknikertid – ellers sammenlignes to forskellige ting
  const timerComparable = M => M.prevAatd.timerTek > 0;

  const MONTH_COLS = [['fakt', 'Faktureret'], ['udg', 'Udgifter'], ['intern', 'Heraf intern kost'], ['db', 'DB'], ['ordre', 'Ordreindgang'], ['beholdning', 'Ordrebeholdning'], ['wip', 'Igangv. arbejde']];
  function monthBodyHtml(M, { onlyToSelected } = {}) {
    return M.rows.map((r, i) => {
      if (onlyToSelected && i > M.idx) return '';
      const empty = i > M.idx && !r.fakt && !r.udg && !r.ordre && !r.timer;
      const cells = MONTH_COLS.map(([k]) => `<td class="num${k === 'db' && r.db < 0 ? ' oek-neg' : ''}">${empty ? '–' : num(r[k])}</td>`).join('');
      return `<tr class="click${i === M.idx ? ' on' : ''}${i > M.idx ? ' later' : ''}" data-m="${r.m}" tabindex="0" aria-label="Vis ${monthName(r.m)}"><td>${monthName(r.m)}</td>${cells}<td class="num">${empty ? '–' : hrs(r.timer)}</td></tr>`;

  }
  function drillBodyHtml(rows) {

    return `

      ${C.legendHtml([{ label: 'Faktureret', color: COL_FAKT }, { label: 'Udgifter', color: COL_UDG }])}
      <h3>Akkumuleret dækningsbidrag</h3>
      <div class="rap-chart">${C.linesChart(M.rows.map(r => r.m), [

      ${C.legendHtml([{ label: `${M.year} (til og med ${MONTHS[M.idx]})`, color: COL_AAR }, { label: `${M.prevYear} (stiplet)`, color: COL_SIDSTE }])}`;
  }

  const DEFS = [
    ['Faktureret', 'Fakturalinjer med status Faktureret, henført til fakturadatoen.'],

    ['DB og DG', 'Dækningsbidrag er faktureret minus udgifter i perioden. Dækningsgrad vises kun for år til dato og for færdigfakturerede projekter, fordi udgifter og faktura sjældent falder i samme måned.'],

    ['Igangværende arbejde', 'Udgifter ved månedens udgang, som endnu ikke er dækket af fakturering, på projekter der ikke er færdigfakturerede.'],

    const el = document.createElement('div');
    el.innerHTML = `
      <svg class="oek-print-logo" viewBox="0 0 304 164" aria-label="Securitas"><use href="#logo-white"/></svg>
      <p class="oek-print-meta">${h(scopeTitle(M))} · ${h(monthName(M.m))} · udskrevet ${today()} af ${h(emp(S.user).navn)}<br>Alle beløb i kr. ekskl. moms. Omsætning efter fakturadato, udgifter efter bogføringsdato. Kun projekter – service er ikke med.</p>
      <h2>Nøgletal</h2>
      <table><thead><tr><th></th><th class="num">${h(monthName(M.m))}</th><th class="num">År til dato</th><th class="num">Samme periode ${M.prevYear}</th><th class="num">Afvigelse</th></tr></thead><tbody>
        ${money('Faktureret', 'fakt')}${money('Udgifter', 'udg')}${money('Heraf intern kost', 'intern')}${money('Dækningsbidrag', 'db')}
        ${k('Dækningsgrad', '', pct(M.aatd.dg), pct(M.prevAatd.dg))}
        ${money('Ordreindgang', 'ordre')}
        ${k('Ordrebeholdning, ultimo', kr(M.md.beholdning), '', kr(M.prevMd.beholdning), deltaTxt(delta(M.md.beholdning, M.prevMd.beholdning)))}
        ${k('Igangværende arbejde, ultimo', kr(M.md.wip), '', kr(M.prevMd.wip), deltaTxt(delta(M.md.wip, M.prevMd.wip)))}
        ${k('Klar til fakturering, dags dato', kr(M.klar.total), '', '')}

      <h2>Projekter, år til dato</h2>
      <table><thead><tr><th>Projekt</th><th>Navn</th><th>PM</th><th class="num">Faktureret</th><th class="num">Udgifter</th><th class="num">DB</th><th class="num">Igangv. arbejde</th><th class="num">Rest til fakturering</th></tr></thead>
      <tbody>${M.drillAatd.map(r => `<tr><td>${h(r.p.id)}</td><td>${h(r.p.navn)}</td><td>${h(r.p.pm)}</td><td class="num">${num(r.fakt)}</td><td class="num">${num(r.udg)}</td><td class="num">${num(r.db)}</td><td class="num">${num(r.wip)}</td><td class="num">${num(r.rest)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">I alt, ${M.drillAatd.length} projekter</td>${['fakt', 'udg', 'db', 'wip', 'rest'].map(x => `<td class="num">${num(sum(M.drillAatd, x))}</td>`).join('')}</tr></tfoot></table>
      <p class="oek-print-meta">Faktureret service uden for nøgletallene: ${h(monthName(M.m))} ${kr(M.svcMd)}, år til dato ${kr(M.svcAatd)}.</p>`;

      <span class="spacer"></span>
      <button class="btn primary" id="oekPrint">Udskriv månedsrapport</button>
      <button class="btn" id="oekExport"><svg class="ico s"><use href="#i-export"/></svg>Eksportér til Excel</button>
    </div>

    <div class="oek-kpis" id="oekKpis"></div>

    <div class="card rap-card">
      <div class="card-body">
        <h2 id="oekTableTitle">Måned for måned</h2>
        <p class="rap-sub">Alle beløb i kr. ekskl. moms. Vælg en måned i tabellen for at se projekterne bag tallene. Ordrebeholdning og igangværende arbejde er saldi ved månedens udgang.</p>
        <div class="table-wrap">
          <table class="table-dense oek-table" id="oekTable">
            <thead><tr><th>Måned</th><th class="num">Faktureret</th><th class="num">Udgifter</th><th class="num">Heraf intern kost</th><th class="num">DB</th><th class="num">Ordreindgang</th><th class="num">Ordrebeholdning</th><th class="num">Igangv. arbejde</th><th class="num">Timer</th></tr></thead>
            <tbody id="oekRows"></tbody>
            <tfoot id="oekFoot"></tfoot>
          </table>
        </div>
        <p class="rap-sub oek-note" id="oekService"></p>
        <details class="oek-def">
          <summary>Sådan er tallene opgjort</summary>

        </details>
      </div>
    </div>

    <div class="card rap-card" id="oekPmCard">
      <div class="card-body">
        <h2>Pr. projektleder</h2>
        <p class="rap-sub" id="oekPmSub"></p>
        <div class="table-wrap">
          <table class="table-dense" id="oekPmTable">
            <thead><tr><th data-sort="text">Projektleder</th><th class="num" data-sort="num">Projekter</th><th class="num" data-sort="num">Faktureret</th><th class="num" data-sort="num">Udgifter</th><th class="num" data-sort="num">DB</th><th class="num" data-sort="num">DG</th><th class="num" data-sort="num">Ordrebeholdning</th><th class="num" data-sort="num">Igangv. arbejde</th></tr></thead>
            <tbody id="oekPmRows"></tbody>

    init() {

      if (!S.oekMaaned || ![...$('#oekMaaned').options].some(o => o.value === S.oekMaaned)) S.oekMaaned = lastClosedMonth();
      if (!S.oekDrill) S.oekDrill = 'md';
      const M = model();
      $('#oekMaaned').value = M.m;

      // scope-omskifter: kun de valg brugeren har ret til (App.scopeOptions)
      const opts = App.scopeOptions();
      $('#oekScopeGrp').hidden = opts.length < 2;
      $('#oekScope').innerHTML = opts.map(o => `<button class="ftab${o.v === M.scope ? ' on' : ''}" data-v="${h(o.v)}">${h(o.label)}</button>`).join('');

      $('#oekKpis').innerHTML = kpiHtml(M);
      $('#oekTableTitle').textContent = `Måned for måned, ${M.year} · ${scopeTitle(M)}`;
      $('#oekRows').innerHTML = monthBodyHtml(M);
      $('#oekFoot').innerHTML = monthFootHtml(M);
      $('#oekService').textContent = `Faktureret service er ikke med i nøgletallene: ${monthName(M.m)} ${App.kr(M.svcMd)} · år til dato ${App.kr(M.svcAatd)}.`;

      // pr. projektleder – kun når visningen dækker flere projektledere
      const single = M.scope.startsWith('pm:');
      $('#oekPmCard').hidden = single;
      if (!single) {
        $('#oekPmSub').textContent = `År til dato (${periodTxt(M)} ${M.year}). Saldi er ved udgangen af ${monthName(M.m)}.`;
        $('#oekPmRows').innerHTML = perPm(M).map(r => `<tr><td>${h(r.navn)}</td><td class="num">${r.n}</td><td class="num">${num(r.fakt)}</td><td class="num">${num(r.udg)}</td><td class="num${r.fakt - r.udg < 0 ? ' oek-neg' : ''}">${num(r.fakt - r.udg)}</td><td class="num">${r.fakt ? pct((r.fakt - r.udg) / r.fakt * 100) : '–'}</td><td class="num">${num(r.rest)}</td><td class="num">${num(r.wip)}</td></tr>`).join('')
          || '<tr><td colspan="8" class="empty">Ingen projekter med tal i perioden.</td></tr>';
        App.applySort($('#oekPmTable'), 'oekPm');
      }

      // drill-down
      const aatd = S.oekDrill === 'aatd', rows = aatd ? M.drillAatd : M.drillMd;
      $$('#oekDrillMode .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === S.oekDrill));
      $('#oekDrillSub').textContent = (aatd ? `År til dato (${periodTxt(M)} ${M.year})` : monthName(M.m).replace(/^./, c => c.toUpperCase()))
        + '. Summen svarer til tallene ovenfor. Igangværende arbejde og rest til fakturering er saldi ved månedens udgang. Vælg et projekt for at åbne projektkortet.';
      $('#oekDrill').classList.toggle('hide-pm', single);
      $('#oekDrillRows').innerHTML = drillBodyHtml(rows) || '<tr><td colspan="10" class="empty">Ingen projekter med tal i perioden.</td></tr>';
      $('#oekDrillSum').innerHTML = drillFootHtml(rows, single ? 3 : 4);
      App.applySort($('#oekDrill'), 'oekDrill');

      $('#oekCharts').innerHTML = chartsHtml(M);
    },
  });
})();
