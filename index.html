    if (S.fPm && [...fPm.options].some(o => o.value === S.fPm)) fPm.value = S.fPm;
    fPm.addEventListener('input', () => { S.fPm = fPm.value; save(); this.render(); });
    App.UDFOERELSE_STATUS.forEach(v => $('#fStatus').add(new Option(v, v)));
    App.FAKTURERING_STATUS.forEach(v => $('#fFakStatus').add(new Option(v, v)));
    ['#fStatus', '#fFakStatus', '#fModel', '#fMaaned', '#fSearch'].forEach(s => $(s).addEventListener('input', () => this.render()));
    $$('#fAfd .ftab').forEach(b => b.addEventListener('click', () => { S.fAfd = b.dataset.v; App.save(); this.render(); }));
    $('#fEkonomi').addEventListener('click', () => { S.visOekonomi = !S.visOekonomi; save(); this.render(); });
    $('#btnExport').addEventListener('click', () => toast('Kun i den færdige løsning: her downloades listen som Excel-fil'));
    this.table = $('#projTable');

    const ncPm = $('#ncPm');
    D.medarbejdere.filter(m => m.rolle === 'PM').forEach(m => ncPm.add(new Option(`${m.navn} (${m.afdeling})`, m.id)));

    const siteSel = $('#ncSiteSel');
    const refreshSiteOptions = () => {
      siteSel.innerHTML = '<option value="">+ Nyt site</option>' + S.sites.map(s => `<option value="${s.id}">${h(App.kundeNavn(s))} – ${h(siteLabel(s))}</option>`).join('');
    };
    const updatePreview = () => {
      const m = bc($('#ncStedNr').value);
      $('#ncBcPreview').value = m ? `${m.costcenter} · TOS ${m.tos} · ${m.account}` : ($('#ncStedNr').value ? 'Ikke fundet i mappingen' : '');
    };
    const toggleNewSite = () => {
      const isNew = !siteSel.value;
      $('#ncNewSite').style.display = isNew ? '' : 'none';
      $('#ncStedNr').readOnly = !isNew;
      if (!isNew) { $('#ncStedNr').value = site(siteSel.value).stedNr || ''; }
      updatePreview();
    };
    siteSel.addEventListener('change', toggleNewSite);
    $('#ncStedNr').addEventListener('input', updatePreview);

    // ---- F10: kalk-import (krav C1) ----
    // Samme mønster som faktura-scanningen i projekt.js (runScan/showScan): en fremdriftslinje, derefter
    // felter med Sikker/Tjek/Usikker-mærkater, der kan rettes, før de overføres til den rigtige formular.
    // To indbyggede demo-kalker (Kontant og Solution), indtil Securitas sender rigtige filer (spørgsmål 4).
    const KALK_DEMOS = {
      kontant: {
        fil: 'Kalkulation_AIA_kontant.xlsx', salgspris: 342000, kost: 224000, ekstraArbejde: 12500,
        type: 'AIA', model: 'Kontant', mdlRate: 0, loebetid: 0, timer: 86, materialer: 168000,
        conf: { salgspris: .96, kost: .91, ekstraArbejde: .72, type: .97, model: .99, timer: .8, materialer: .69 },
      },
      solution: {
        fil: 'Kalkulation_ADK_solution.xlsx', salgspris: 96000, kost: 71500, ekstraArbejde: 0,
        type: 'ADK', model: 'Solution', mdlRate: 2150, loebetid: 60, timer: 52, materialer: 41500,
        conf: { salgspris: .94, kost: .88, ekstraArbejde: .95, type: .96, model: .99, timer: .77, materialer: .7 },
      },
    };
    // En vilkårlig uploadet fil læses ikke – den giver et plausibelt gæt, tydeligt mærket Usikker/Tjek,
    // ligesom guessFromFile() gør for fakturascanningen.
    const guessKalkFromFile = file => {
      const name = file.name.toLowerCase();
      const typeMap = { aia: 'AIA', adk: 'ADK', tvo: 'TVO', kombi: 'KOMBI' };
      const kendtType = Object.keys(typeMap).find(k => name.includes(k));
      const kendtModel = name.includes('solution') ? 'Solution' : name.includes('kontant') ? 'Kontant' : '';
      const model = kendtModel || (Math.random() < 0.5 ? 'Kontant' : 'Solution');
      const salgspris = 120000 + Math.round(Math.random() * 600000);
      const kost = Math.round(salgspris * (0.55 + Math.random() * 0.2));
      return {
        fil: file.name, salgspris, kost, ekstraArbejde: Math.round(Math.random() * 15000),
        type: kendtType ? typeMap[kendtType] : 'AIA', model,
        mdlRate: model === 'Solution' ? 1000 + Math.round(Math.random() * 2000) : 0,
        loebetid: model === 'Solution' ? 60 : 0,
        timer: 20 + Math.round(Math.random() * 100), materialer: 15000 + Math.round(Math.random() * 150000),
        conf: {
          salgspris: .4, kost: .35, ekstraArbejde: .3, type: kendtType ? .75 : .3, model: kendtModel ? .8 : .3,
          timer: .3, materialer: .3,
        },
      };
    };
    const kalkConf = v => v >= .85 ? '' : ' conf-low';
    const kalkConfTxt = v => v >= .85 ? 'Sikker' : v >= .6 ? 'Tjek' : 'Usikker';
    // Sidst overførte kalk i den åbne modal – null, når sagen skal oprettes uden kalk (65 %-gættet gælder).
    let sidsteKalk = null;
    const showKalk = r => {
      const res = $('#kalkResult'); res.hidden = false;
      const solutionNote = r.model === 'Solution' ? `<span class="caption muted">${r.loebetid} mdr. × ${kr(r.mdlRate)}</span>` : '';
      res.innerHTML = `
        <div class="scan-head"><b>Læst: ${h(r.fil)}</b><span class="muted caption">Felter markeret Tjek eller Usikker bør kontrolleres mod kalken</span></div>
        <div class="form-grid">
          <label class="${kalkConf(r.conf.salgspris)}">Salgspris <span class="caption">${kalkConfTxt(r.conf.salgspris)}</span><input type="number" id="kSalgspris" step="1" value="${r.salgspris}"></label>
          <label class="${kalkConf(r.conf.kost)}">Kostpris <span class="caption">${kalkConfTxt(r.conf.kost)}</span><input type="number" id="kKost" step="1" value="${r.kost}"></label>
          <label class="${kalkConf(r.conf.ekstraArbejde)}">Ekstra arbejde <span class="caption">${kalkConfTxt(r.conf.ekstraArbejde)}</span><input type="number" id="kEkstra" step="1" value="${r.ekstraArbejde}"></label>
          <label class="${kalkConf(r.conf.type)}">Installationstype <span class="caption">${kalkConfTxt(r.conf.type)}</span><input type="text" id="kType" value="${h(r.type)}"></label>
          <label class="${kalkConf(r.conf.model)}">Model <span class="caption">${kalkConfTxt(r.conf.model)}</span><input type="text" id="kModel" value="${h(r.model)}">${solutionNote}</label>
          <label class="${kalkConf(r.conf.timer)}">Timer i kalk <span class="caption">${kalkConfTxt(r.conf.timer)}</span><input type="number" id="kTimer" step="0.5" value="${r.timer}"></label>
          <label class="${kalkConf(r.conf.materialer)}">Materialesum <span class="caption">${kalkConfTxt(r.conf.materialer)}</span><input type="number" id="kMaterialer" step="1" value="${r.materialer}"></label>
        </div>
        <div class="scan-actions">
          <button class="btn primary" type="button" id="kToForm">Overfør til formularen</button>
          <button class="tlink" type="button" id="kCancel">Forkast</button>
        </div>`;
      const take = () => ({
        salgspris: +$('#kSalgspris').value || 0, kost: +$('#kKost').value || 0, ekstraArbejde: +$('#kEkstra').value || 0,
        type: $('#kType').value.trim(), model: $('#kModel').value.trim() === 'Solution' ? 'Solution' : 'Kontant',
        mdlRate: r.mdlRate || 0, loebetid: r.loebetid || 0, timer: +$('#kTimer').value || 0, materialer: +$('#kMaterialer').value || 0,
      });
      $('#kToForm').addEventListener('click', () => {
        const t = take();
        $('#ncSalgspris').value = t.salgspris;
        $('#ncKostpris').value = t.kost;
        if (App.INSTALLATION_TYPER.concat('KOMBI', 'ANDET').includes(t.type)) $('#ncType').value = t.type;
        $('#ncModel').value = t.model;
        sidsteKalk = { fil: r.fil, felter: t };
        res.hidden = true;
        toast('Felter overført fra kalken. Kontrollér og opret sagen.');
      });
      $('#kCancel').addEventListener('click', () => { res.hidden = true; });
    };
    const runKalk = r => {
      const res = $('#kalkResult'); res.hidden = false;
      res.innerHTML = `<div class="scan-head"><b>Læser ${h(r.fil)}</b><span class="muted caption">Henter salgspris, kostpris, installationstype og model fra kalkulationen</span></div><div class="scan-progress"><span></span></div>`;
      setTimeout(() => showKalk(r), 1200);
    };
    const kalkDrop = $('#kalkDrop'), kalkFileIn = $('#kalkFile');
    kalkDrop.addEventListener('click', e => { if (!e.target.closest('[data-kalkdemo]')) kalkFileIn.click(); });
    kalkDrop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kalkFileIn.click(); } });
    kalkFileIn.addEventListener('change', () => { if (kalkFileIn.files[0]) runKalk(guessKalkFromFile(kalkFileIn.files[0])); kalkFileIn.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => kalkDrop.addEventListener(ev, e => { e.preventDefault(); kalkDrop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => kalkDrop.addEventListener(ev, e => { e.preventDefault(); kalkDrop.classList.remove('over'); }));
    kalkDrop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) runKalk(guessKalkFromFile(f)); });
    $$('[data-kalkdemo]', kalkDrop).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); runKalk({ ...KALK_DEMOS[b.dataset.kalkdemo] }); }));

    $('#btnNewCase').addEventListener('click', () => {
      refreshSiteOptions(); siteSel.value = ''; toggleNewSite();
      $('#ncKunde').value = ''; $('#ncSiteNavn').value = ''; $('#ncSiteKode').value = ''; $('#ncAdresse').value = ''; $('#ncPostnr').value = ''; $('#ncBy').value = '';
      $('#ncOpportunity').value = ''; $('#ncBeskrivelse').value = ''; $('#ncSalgspris').value = ''; $('#ncKostpris').value = '';
      sidsteKalk = null; $('#kalkResult').hidden = true; kalkFileIn.value = '';
      openModal('modalNewCase');
    });

    // Kunden er en egen post i v7. Et nyt site SKAL have et kundeId, ellers står kundenavnet tomt
    // overalt – App.kundeNavn() falder med vilje ikke tilbage på en tekststreng (PLAN-v6-spor1 §4).
    const kundeIdFor = navn => {
      const v = navn.trim().toLowerCase();
      const fundet = (S.kunder || []).find(k => String(k.navn || '').trim().toLowerCase() === v);
      if (fundet) return fundet.id;
      const nr = (S.kunder || []).map(k => +String(k.id).replace(/\D/g, '') || 0).reduce((a, b) => Math.max(a, b), 0) + 1;
      const ny = { id: 'K-' + String(nr).padStart(4, '0'), navn: navn.trim(), cepAccount: '', cepAccountNavn: '', alias: [], noter: [], oprettet: App.today() };
      S.kunder = S.kunder || [];
      S.kunder.push(ny);
      App.log('kunde', ny.id, 'oprettet', '', ny.navn);
      return ny.id;
    };
    // Installationerne bærer anlæg, serviceaftale, UL og eftersyn i v7. Et nyt site får derfor mindst
    // én installation med det samme, under installation indtil projektet overdrages (krav C10).
    const opretInstallation = (siteId, type) => {
      const nr = (S.installationer || []).map(i => +String(i.id).replace(/\D/g, '') || 0).reduce((a, b) => Math.max(a, b), 0) + 1;
      const ny = {
        id: 'I-' + String(nr).padStart(4, '0'), siteId, type, anlaeg: '', serviceaftale: '', ulId: '',
        status: App.INSTALLATION_STATUS[0], overdraget: '', fraProjekt: '', prisregulering: null,
        eftersyn: { aktiv: false, maaned: 0, interval: 12, sidste: '', cas: '' },
      };
      S.installationer = S.installationer || [];
      S.installationer.push(ny);
      App.log('installation', ny.id, 'oprettet', '', `${type} på ${siteId}`);
      return ny;
    };
    $('#ncOk').addEventListener('click', () => {
      let s;
      const type = $('#ncType').value;
      if (!siteSel.value) {
        const kunde = $('#ncKunde').value.trim(), navn = $('#ncSiteNavn').value.trim();
        if (!kunde || !navn) { toast('Udfyld kunde og site-navn'); return; }
        let id; do { id = 'DK-S-' + String(Math.floor(100000 + Math.random() * 900000)); } while (S.sites.some(x => x.id === id));
        s = {
          id, kundeId: kundeIdFor(kunde), stedNr: $('#ncStedNr').value.trim(), navn, kode: $('#ncSiteKode').value.trim(),
          adresse: $('#ncAdresse').value.trim(), postnr: $('#ncPostnr').value.trim(), by: $('#ncBy').value.trim(),
          kontakt: '', noter: [],
        };
        S.sites.push(s);
        // KOMBI og ANDET er ikke installationstyper i modellen (AIA, ADK, TVO; BRAND og ANDET er reserveret),
        // så en kombisag får én installation af typen ANDET, indtil typerne rettes på sitet.
        (App.INSTALLATION_TYPER.includes(type) ? [type] : ['ANDET']).forEach(t => opretInstallation(s.id, t));
      } else {
        s = site(siteSel.value);
      }
      const opportunity = $('#ncOpportunity').value.trim(), beskrivelse = $('#ncBeskrivelse').value.trim();
      if (!opportunity || !beskrivelse) { toast('Udfyld opportunity og beskrivelse'); return; }
      // F10: kostprisen kommer fra kalken, når feltet er udfyldt (manuelt eller via overførsel) – ellers
      // holder ProjectFactory.create sig til 65 %-gættet, præcis som før F10 fandtes.
      const kostInput = $('#ncKostpris').value.trim();
      const p = window.ProjectFactory.create({
        navn: `${s.navn} – ${beskrivelse}`, siteId: s.id, opportunity,
        type, model: $('#ncModel').value, pm: ncPm.value,
        afdeling: $('#ncAfdeling').value, rekvirent: s.kontakt || '', salgspris: +$('#ncSalgspris').value || 0,
        salgKost: kostInput !== '' ? +kostInput : undefined,
        ekstraArbejde: sidsteKalk ? sidsteKalk.felter.ekstraArbejde : undefined,
        mdlRate: sidsteKalk ? sidsteKalk.felter.mdlRate : undefined,
        loebetid: sidsteKalk ? sidsteKalk.felter.loebetid : undefined,
        kalk: sidsteKalk ? { fil: sidsteKalk.fil, dato: App.today(), af: S.user, felter: sidsteKalk.felter } : undefined,
        logTekst: 'Oprettelse af sag direkte fra projektoverblikket',
      });
      save(); closeModal('modalNewCase');
      toast(`${p.id} er oprettet`);
      openProject(p.id);
    });
  },
  // Kolonneopsæt til projektoverblikket. Standardvisning passer i 1280 px uden vandret scroll;
  // "Vis økonomi" tilføjer fire kolonner. Både thead, rækker og sumrækken bygges ud fra dette array,
  // så kolonneantallet altid stemmer.
  columns() {
    const { h, kr, dgCell, st, siteLabel, role, S } = App;
    // Rollen PM: så længe filteret peger på én bestemt projektleder, er PM-kolonnen overflødig
    // (alle rækker viser samme navn) og skjules. Chef og Fakturering ser den altid.
    const pmColumnHidden = role() === 'PM' && !!S.fPm;
    const standard = [
      { label: 'Projekt', sort: 'text', cell: p => `<td><b>${h(p.id)}</b></td>` },
      { label: 'Navn', sort: 'text', cell: p => `<td class="cut w-m" title="${h(p.navn)}">${h(p.navn)}</td>` },
      { label: 'Kunde', sort: 'text', cell: (p, c, s) => `<td class="cut w-s" title="${h(App.kundeNavn(s))}">${h(App.kundeNavn(s) || '–')}</td>` },
      {
        label: 'Site', sort: 'text', cell: (p, c, s) => {
          const kort = siteLabel(s, true);
          return s.kode ? `<td>${h(kort)}</td>` : `<td class="cut w-s" title="${h(siteLabel(s))}">${h(kort)}</td>`;
        },
      },
      { label: 'Type', sort: 'text', cell: p => `<td>${h(p.type)}</td>` },
      // C2 (KRAV-GAP-v6): Solution/Kontant som kort kolonne (ordene er korte nok til at holde 1280 px uden vandret scroll).
      { label: 'Model', sort: 'text', cell: p => `<td>${h(p.model)}</td>` },
      { label: 'Afd.', sort: 'text', cell: p => `<td>${h(p.afdeling)}</td>` },
      ...(pmColumnHidden ? [] : [{ label: 'PM', sort: 'text', cell: (p, c, s, e) => `<td title="${h(e.navn)}">${h(p.pm)}</td>` }]),
      // Status står nu i to kolonner (PLAN-v6-spor1 §2.6): udførelsen, som PM styrer, og
      // faktureringsstatus, der er afledt af linjerne. Begge trunkeres med fuld tekst som title.
      // Overdragelsen står her som den samlede status – ikke i Rest-kolonnen, som skal kunne læses
      // som et beløb og holde 1280 px uden vandret scroll.
      {
        label: 'Udførelse', sort: 'text', cell: p => {
          const ps = App.projStatus(p);
          const v = ps.overdraget ? 'Overdraget' : ps.udfoerelse;
          const titel = ps.overdraget ? `${ps.udfoerelse} · overdraget ${p.overdragelse.dato}` : ps.udfoerelse;
          return `<td class="st-cut st-udf" title="${h(titel)}" data-value="${h(v)}">${App.stKort(v)}</td>`;
        },
      },
      { label: 'Fakturering', sort: 'text', cell: p => { const v = App.projStatus(p).fakturering; return `<td class="st-cut" title="${h(v)}" data-value="${h(v)}">${App.stKort(v)}</td>`; } },
      { label: 'Salg total', sort: 'num', num: true, cell: (p, c) => `<td class="num" data-value="${c.salg}">${kr(c.salg)}</td>`, sum: t => `<td class="num" data-value="${t.salg}">${kr(t.salg)}</td>` },
    ];
    const oekonomi = [
      { label: 'Kostpris', sort: 'num', num: true, cell: p => `<td class="num" data-value="${p.salgKost || 0}">${kr(p.salgKost)}</td>`, sum: t => `<td class="num" data-value="${t.kost}">${kr(t.kost)}</td>` },
      { label: 'Udgifter', sort: 'num', num: true, cell: (p, c) => `<td class="num" data-value="${c.udg}">${kr(c.udg)}</td>`, sum: t => `<td class="num" data-value="${t.udg}">${kr(t.udg)}</td>` },
      {
        label: 'DG beregnet', sort: 'num', num: true, cell: (p, c) => dgCell(c.dgB),
        sum: t => dgCell(t.salg ? (t.salg - t.kost) / t.salg * 100 : null),
      },
    ];
    const tail = [
      { label: 'DG faktisk', sort: 'num', num: true, cell: (p, c) => dgCell(c.dgF), sum: t => dgCell(t.salg ? (t.salg - t.udg) / t.salg * 100 : null) },
    ];
    const oekonomiHale = [
      { label: 'Faktureret', sort: 'num', num: true, cell: (p, c) => `<td class="num" data-value="${c.fakt}">${kr(c.fakt)}</td>`, sum: t => `<td class="num" data-value="${t.fakt}">${kr(t.fakt)}</td>` },
    ];
    const rest = [
      // C10: et overdraget projekt kan stadig have et udestående. Beløbet står her (F6: det udestående
      // ses tre steder), mens selve overdragelsen står i Udførelse-kolonnen og som title her.
      {
        label: 'Rest', sort: 'num', num: true,
        cell: (p, c) => `<td class="num" data-value="${c.rest}"${p.overdragelse ? ` title="Udestående på overdraget projekt, overdraget ${h(p.overdragelse.dato)}"` : ''}>${kr(c.rest)}</td>`,
        sum: t => `<td class="num" data-value="${t.rest}">${kr(t.rest)}</td>`,
      },
    ];
    return App.S.visOekonomi ? [...standard, ...oekonomi, ...tail, ...oekonomiHale, ...rest] : [...standard, ...tail, ...rest];
  },
  render() {
    const { $, $$, S, site, emp, calc, openProject, role, save } = App;
    // Forudindstillingen følger brugeren: PM ser egne projekter, øvrige roller alle. Skifter man bruger (demoens
    // rollevælger), nulstilles filteret – ellers så Chef kun den forrige projektleders sager. Brugerens eget valg
    // står i S.fPm og røres ikke, så længe brugeren er den samme.
    if (S.fPmUser !== S.user) { S.fPmUser = S.user; S.fPm = role() === 'PM' ? S.user : ''; save(); }
    if ($('#fPm').value !== (S.fPm || '')) $('#fPm').value = S.fPm || '';
    $$('#fAfd .ftab').forEach(x => x.classList.toggle('on', x.dataset.v === (S.fAfd || '')));
    $('#fEkonomi').classList.toggle('on', !!S.visOekonomi);
    const q = $('#fSearch').value.trim().toLowerCase();
    const rows = S.projekter.filter(p => {
      if (S.fAfd && p.afdeling !== S.fAfd) return false;
      if ($('#fPm').value && p.pm !== $('#fPm').value) return false;
      const ps = App.projStatus(p);
      if ($('#fStatus').value && ps.udfoerelse !== $('#fStatus').value) return false;
      if ($('#fFakStatus').value && ps.fakturering !== $('#fFakStatus').value) return false;
      if ($('#fModel').value && p.model !== $('#fModel').value) return false;
      if ($('#fMaaned').value && !(p.maaned || '').startsWith($('#fMaaned').value)) return false;
      if (q) {
        const s = site(p.siteId);
        const hay = [p.id, p.navn, App.kundeNavn(s), s.kode, s.navn, ...p.udgifter.flatMap(u => [u.faktura, u.leverandoer, u.ydelse, u.beloeb]), ...p.fakturering.map(f => f.tekst)].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const cols = this.columns();
    // thead genskabes hver gang, så antal kolonner altid stemmer og App.sortable aldrig dobbeltbindes.
    this.table.querySelector('thead').innerHTML = `<tr>${cols.map(c => `<th data-sort="${c.sort}">${c.label}</th>`).join('')}</tr>`;

    const tot = { salg: 0, kost: 0, udg: 0, fakt: 0, rest: 0 };
    $('#projRows').innerHTML = rows.map(p => {
      const c = calc(p); tot.salg += c.salg; tot.kost += p.salgKost || 0; tot.udg += c.udg; tot.fakt += c.fakt; tot.rest += c.rest;
      const s = site(p.siteId); const e = emp(p.pm);
      return `<tr class="click" data-open="${p.id}" tabindex="0">${cols.map(col => col.cell(p, c, s, e)).join('')}</tr>`;
    }).join('') || `<tr><td colspan="${cols.length}" class="empty">Ingen projekter matcher filteret. Ryd filtrene, eller opret en ny sag.</td></tr>`;

    const firstNum = cols.findIndex(c => c.num);
    $('#projSum').innerHTML = `<td colspan="${firstNum}">${rows.length} projekter</td>` + cols.slice(firstNum).map(c => c.sum(tot)).join('');

    App.sortable(this.table, 'projekter-liste', { col: 0, dir: 'desc' });

    $$('[data-open]').forEach(r => {
      r.addEventListener('click', () => openProject(r.dataset.open));
    });
    const all = S.projekter.map(calc);
    // Igangværende = ikke overdraget, uanset fakturering (PLAN-v6-spor1 §2.5). KPI'en for det klargjorte
    // tæller både klar og sendt, så tallet ikke falder, i det øjeblik PM sender anmodningen (C9).
    const iKoe = [App.FAKTURALINJE_STATUS[1], App.FAKTURALINJE_STATUS[2]];
    $('#projStats').innerHTML = [
      ['Igangværende projekter', S.projekter.filter(p => App.erIgangvaerende(p)).length],
      ['Klar og sendt til fakturering', App.kr(S.projekter.flatMap(p => p.fakturering).filter(f => iKoe.includes(f.status)).reduce((a, f) => a + +f.beloeb, 0))],
      ['Rest at fakturere', App.kr(all.reduce((a, c) => a + c.rest, 0))],
      ['Nye sager i indbakken', S.indbakke.length],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');
  },
});

</script>
<script>
// Projektkort. Erstatter ét PRDK-faneblad og Fakturering-arket. Åbnes via App.openProject(id).
let udgEditIdx = null, fakEditIdx = null, delopgEditId = null;

// Faktureringsflowets tre trin (krav C9) og overdragelsen (krav C10), samlet ét sted uden for
// registerPage – samme mønster som window.ProjectFactory. Projektkortet, køen "Til fakturering" og
// tools/test-b3.js kalder herind, så trinnene kun findes i én udgave og kan afprøves uden DOM.
window.ProjektFlow = {
  // Statusnavnene hentes fra kernen, så de aldrig staves forskelligt to steder.
  get KLAR() { return App.FAKTURALINJE_STATUS[1]; },
  get SENDT() { return App.FAKTURALINJE_STATUS[2]; },
  get FAKTURERET() { return App.FAKTURALINJE_STATUS[3]; },
  // PM sender anmodningen. Linjerne bliver stående i køen som "sendt", og faktureringsteamets
  // fakturadato og initialer røres ikke – det var dem, PM's send overskrev før (KRAV-GAP-v6 afsnit 5).
  send(p, dato, af) {
    const linjer = ((p || {}).fakturering || []).filter(f => f.status === this.KLAR);
    linjer.forEach(f => { f.status = this.SENDT; f.sendtDato = dato; f.sendtAf = af; });
    return linjer.length;
  },
  // Tilbagetrækning (F6): kun mulig, så længe linjen ikke er faktureret.
  traekTilbage(p, idx) {
    const f = ((p || {}).fakturering || [])[idx];
    if (!f || f.status !== this.SENDT) return false;
    f.status = this.KLAR; f.sendtDato = ''; f.sendtAf = '';
    return true;
  },
  // Faktureringsteamet markerer. Datoen er fakturadatoen, som Økonomisk overblik periodiserer på,
  // og initialerne er den, der fakturerede – ikke den, der sendte.
  markerFaktureret(p, f, dato, af) {
    if (!f || f.status === this.FAKTURERET) return false;
    f.status = this.FAKTURERET; f.dato = dato; f.initialer = af;
    return true;
  },
  // Udestående = linjer, der ikke er fakturerede. rest er salgsprisen minus det fakturerede og kan
  // være større, når arbejdet endnu ikke er skrevet på linjer.
  udestaaende(p) {
    const linjer = ((p || {}).fakturering || []).filter(f => f.status !== this.FAKTURERET);
    return { antal: linjer.length, beloeb: linjer.reduce((a, f) => a + (+f.beloeb || 0), 0), rest: p ? App.calc(p).rest : 0 };
  },
  // C10: afslutning kræver udført arbejde, ikke fakturering.
  kanAfsluttes(p) { return !!p && App.projStatus(p).udfoerelse === App.UDFOERELSE_STATUS[2] && !p.overdragelse; },
  // Overdragelsen sætter de valgte installationer i drift med dato og projektnummer. eftersyn.sidste
  // røres ikke – det betyder "sidst efterset", ikke "overdraget" (gap-rapport A1c).
  overdrag(p, installationIds, dato, af) {
    if (!p || p.overdragelse) return null;
    const ids = (installationIds || []).filter(id => App.installation(id).id);
    ids.forEach(id => {
      const i = App.installation(id);
      App.saetFelt(i, 'installation', id, 'status', App.INSTALLATION_STATUS[1]);
      App.saetFelt(i, 'installation', id, 'overdraget', dato);
      App.saetFelt(i, 'installation', id, 'fraProjekt', p.id);
    });
    p.overdragelse = { dato, af, installationIds: ids };
    App.log('projekt', p.id, 'overdragelse', '', `${dato} · ${ids.length} installationer`);
    return p.overdragelse;
  },
};

  init() {
    const { $, $$, D, S, proj, save, toast, today, now, site, bc, emp, kr, h, openModal, closeModal, nextSubtaskId } = App;

    // ---- AI-scan af faktura (mock: viser flowet, ingen model bag) ----
    const DEMOS = {
      adi:     { fil: 'ADI_faktura_5261118.pdf', faktura: '5261118', leverandoer: 'ADI', dato: today(), ydelse: '4 × Axis P3268-LVE kamera, 2 × wallmount', netto: 31840, moms: 7960, conf: { faktura: .98, leverandoer: .99, ydelse: .91, netto: .97, sag: .95 } },
      lindpro: { fil: 'Lindpro_44211.pdf', faktura: '44211', leverandoer: 'Lindpro', dato: today(), ydelse: 'Kabeltræk etape 3 – 38 timer', netto: 41800, moms: 10450, conf: { faktura: .97, leverandoer: .99, ydelse: .74, netto: .96, sag: .62 } },
      renta:   { fil: 'IMG_2043.jpg', faktura: '1651207', leverandoer: 'Renta', dato: today(), ydelse: 'Leje af lift, 3 dage', netto: 4125, moms: 1031.25, conf: { faktura: .88, leverandoer: .93, ydelse: .69, netto: .90, sag: .41 } },
    };
    const guessFromFile = file => {
      const name = file.name.toLowerCase();
      const map = { adi: 'ADI', eet: 'EET', lindpro: 'Lindpro', prosikring: 'Prosikring', renta: 'Renta', wood: 'Wood Security', certego: 'Certego', jansson: 'Jansson' };
      const known = Object.keys(map).find(k => name.includes(k));
      const netto = 1000 + Math.round(Math.random() * 40000);
      return { fil: file.name, faktura: String(100000 + Math.floor(Math.random() * 900000)), leverandoer: known ? map[known] : 'Ukendt leverandør', dato: today(), ydelse: 'Materialer jf. faktura', netto, moms: netto * 0.25,
        conf: { faktura: .82, leverandoer: known ? .9 : .35, ydelse: .5, netto: .85, sag: .3 } };

    const conf = v => v >= .85 ? '' : ' conf-low';
    const confTxt = v => v >= .85 ? 'Sikker' : v >= .6 ? 'Tjek' : 'Usikker';
    const showScan = r => {
      const p = cur();
      const res = $('#scanResult'); res.hidden = false;
      const sagMatch = r.conf.sag >= .6 ? `${p.id} (fundet som reference på fakturaen)` : `${p.id} (ikke fundet på fakturaen, valgt fra det åbne projekt)`;
      res.innerHTML = `
        <div class="scan-head"><b>Scannet: ${h(r.fil)}</b><span class="muted caption">Felter markeret Tjek eller Usikker bør kontrolleres mod fakturaen</span></div>
        <div class="form-grid">
          <label class="${conf(r.conf.faktura)}">Faktura nr. <span class="caption">${confTxt(r.conf.faktura)}</span><input type="text" id="scFaktura" value="${h(r.faktura)}"></label>
          <label class="${conf(r.conf.leverandoer)}">Leverandør <span class="caption">${confTxt(r.conf.leverandoer)}</span><input type="text" id="scLev" value="${h(r.leverandoer)}" list="levList"></label>
          <label>Fakturadato<input type="date" id="scDato" value="${r.dato}"></label>
          <label class="${conf(r.conf.ydelse)}">Ydelse <span class="caption">${confTxt(r.conf.ydelse)}</span><input type="text" id="scYdelse" value="${h(r.ydelse)}"></label>
          <label class="${conf(r.conf.netto)}">Beløb ekskl. moms <span class="caption">${confTxt(r.conf.netto)}</span><input type="number" id="scNetto" step="0.01" value="${r.netto}"></label>

          <label class="auto">I alt inkl. moms<input type="text" value="${kr(r.netto + r.moms)}" readonly></label>
          <label class="${conf(r.conf.sag)}">Sag <span class="caption">${confTxt(r.conf.sag)}</span><input type="text" value="${h(sagMatch)}" readonly></label>

        <div class="scan-actions">
          <button class="btn primary" type="button" id="scBook">Bogfør udgift</button>

      const take = () => ({ faktura: $('#scFaktura').value.trim(), leverandoer: $('#scLev').value.trim(), ydelse: $('#scYdelse').value.trim(), beloeb: +$('#scNetto').value, dato: today(), bilag: r.fil, fakturadato: $('#scDato').value });
      $('#scBook').addEventListener('click', () => {

    const runScan = r => {

      setTimeout(() => showScan(r), 1200);

    const drop = $('#scanDrop'), fileIn = $('#scanFile');
    drop.addEventListener('click', e => { if (!e.target.closest('[data-demo]')) fileIn.click(); });
    drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
    fileIn.addEventListener('change', () => { if (fileIn.files[0]) runScan(guessFromFile(fileIn.files[0])); fileIn.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) runScan(guessFromFile(f)); });
    $$('[data-demo]', drop).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); runScan({ ...DEMOS[b.dataset.demo] }); }));

    $('#fakForm').addEventListener('submit', e => {

        toast('Faktureringslinje opdateret');

        p.fakturering.push({ tekst: fd.get('tekst'), rekv: fd.get('rekv'), beloeb: +fd.get('beloeb'), status: App.FAKTURALINJE_STATUS[0], dato: '', initialer: '', sendtDato: '', sendtAf: '' });
      }

    $('#logForm').addEventListener('submit', e => {

      save(); e.target.reset(); this.render();
    });
    // Aftalenavne hentes af de installationer, der findes, i stedet for en håndskrevet liste –

    const aftaleOptions = valgt => {

          <label>ES-måned (1-12)<input type="number" min="1" max="12" data-affelt="esMaaned" data-afkey="${h(key)}" value="${h((o.eftersyn || {}).maaned || '')}"></label>
          <label>Interval<select data-affelt="esInterval" data-afkey="${h(key)}"><option${+(o.eftersyn || {}).interval === 6 ? ' selected' : ''}>6</option><option${+(o.eftersyn || {}).interval === 6 ? '' : ' selected'}>12</option></select></label>
        </div>
      </div>`;
    $('#btnAfslut').addEventListener('click', () => {
      const p = cur(); const s = site(p.siteId);
      const u = window.ProjektFlow.udestaaende(p);
      const rest = u.rest > u.beloeb ? ` Rest i forhold til salgsprisen: ${kr(u.rest)}.` : '';
      $('#afUdestaaende').hidden = !(u.antal || u.rest > 0);

      const inst = App.installationer(s.id);

      $('#afInstallationer').innerHTML =

      $('#afTimepris').value = s.timepris || 0;
      $('#afKoersel').value = s.koersel || 0;
      openModal('modalAfslut');
    });
    $('#afOk').addEventListener('click', () => {
      const p = cur(); const s = site(p.siteId);
      if (p.overdragelse) return toast('Projektet er allerede overdraget');

      const valgte = [];

      App.installationer(s.id).forEach(i => {
        App.saetFelt(i, 'installation', i.id, 'anlaeg', felt(i.id, 'anlaeg'));
        App.saetFelt(i, 'installation', i.id, 'serviceaftale', felt(i.id, 'serviceaftale'));

      save(); closeModal('modalAfslut');

      toast(u.antal ? `${p.id} overdraget til service. ${u.antal} ${u.antal === 1 ? 'linje' : 'linjer'} står stadig til fakturering.` : `${p.id} overdraget til service`);
      App._highlightSite = s.id;
      App.go('kunder');
    });
    $('#btnSendFak').addEventListener('click', () => {
      const p = cur(), s = site(p.siteId), m = bc(App.stedNr(p));
      const lines = p.fakturering.filter(f => f.status === window.ProjektFlow.KLAR);
      $('#fakFra').value = emp(S.user).navn;
      $('#pdfPreview').innerHTML = `
        <div class="pdf-head"><b>Faktureringsanmodning</b><span class="muted">${p.id} · ${today()}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
        <dl>
          <dt>Kunde</dt><dd>${h(App.kundeNavn(s))}</dd><dt>Account nr.</dt><dd>${m ? h(m.account) : '–'}</dd>
          <dt>Leveringsadresse</dt><dd>${h(App.siteAddress(s))}</dd><dt>Site nr.</dt><dd>${h(s.id)}</dd>
          <dt>Projekt nr.</dt><dd>${p.id}</dd><dt>Tilbuds nr.</dt><dd>${h(p.opportunity)}</dd>
          <dt>Costcenter</dt><dd>${m ? h(m.costcenter) : '–'}</dd><dt>Profitcenter</dt><dd>${m ? h(m.profitcenter) : '–'}</dd>
          <dt>TOS</dt><dd>${m ? h(m.tos) : '–'}</dd><dt>Rekvirent</dt><dd>${h(p.rekvirent) || '–'}</dd>
          <dt>WO</dt><dd>${h(p.wo) || '–'}</dd><dt>PO / rekv. nr.</dt><dd>${h(lines[0]?.rekv) || '–'}</dd>
        </dl>
        <table><thead><tr><th>Arbejdsbeskrivelse</th><th class="num">Beløb</th></tr></thead>
        <tbody>${lines.map(f => `<tr><td>${h(f.tekst)}</td><td class="num">${kr(f.beloeb)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Samlet pris ekskl. moms</td><td class="num">${kr(lines.reduce((a, f) => a + +f.beloeb, 0))}</td></tr></tfoot></table>
        <p class="caption muted" style="margin-top:18px">Alle felter ovenfor er hentet fra projektet. Ingen er tastet til denne anmodning.</p>`;
      openModal('modalFak');
    });
    // C9: PM sender – linjerne bliver "Sendt til fakturering" og bliver stående i køen, indtil
    // faktureringsteamet markerer dem. Fakturadato og initialer sættes dér, ikke her.
    $('#fakSend').addEventListener('click', () => {
      const p = cur();
      const antal = window.ProjektFlow.send(p, today(), S.user);
      p.log.unshift({ dato: now(), tekst: `Faktureringsanmodning sendt til ${$('#fakTil').value} (PDF via Outlook) – ${antal} ${antal === 1 ? 'linje' : 'linjer'}`, af: S.user, pmTid: 0.5, seTid: 0, ulTid: 0 });
      save(); closeModal('modalFak'); this.render();
      toast(`Faktureringsanmodning sendt. ${antal} ${antal === 1 ? 'linje står' : 'linjer står'} nu som sendt til fakturering.`);
    });
  },
  render() {
    const { $, $$, S, proj, site, bc, emp, calc, kr, n, pct, h, st, save, toast, go, siteLabel, subtasks } = App;
    const p = proj(App.currentProj); if (!p) return go('projekter');
    const s = site(p.siteId), c = calc(p);
    const delopgaver = subtasks(p.id);
    // C4/C5: valgfrie CEP-links vises som tekstlink i projekthovedet, ved siden af opportunity-nr.
    const cepLinks = [
      p.cepProjektUrl ? `<a class="tlink" href="${h(p.cepProjektUrl)}" target="_blank" rel="noopener noreferrer">CEP-projekt</a>` : '',
      p.opportunityUrl ? `<a class="tlink" href="${h(p.opportunityUrl)}" target="_blank" rel="noopener noreferrer">CEP-opportunity</a>` : '',
    ].filter(Boolean);
    $('#pId').innerHTML = `${h(p.id)} · ${h(p.opportunity)} · ${h(p.afdeling)}` + (cepLinks.length ? ' · ' + cepLinks.join(' · ') : '');
    $('#pNavn').textContent = p.navn;
    $('#pSub').textContent = `${App.kundeNavn(s)} · ${siteLabel(s)} · PM ${emp(p.pm).navn}`;
    // De tre dimensioner: udførelsen i dropdownen, faktureringsstatus og overdragelse som mærkater.
    const ps = App.projStatus(p);
    $('#pStatus').value = ps.udfoerelse;
    $('#pAfledt').innerHTML = st(ps.fakturering)
      // "Overdraget" med dato er ikke en fast statusværdi, så mærkatet skrives med samme klasse som st() ville give.
      + (ps.overdraget ? `<span class="st fakt" title="Overdraget af ${h(emp(p.overdragelse.af).navn)}">Overdraget ${h(p.overdragelse.dato)}</span>` : '');
    // C10: afslutningen kræver udført arbejde – ikke fakturering.
    $('#btnAfslut').disabled = !window.ProjektFlow.kanAfsluttes(p);
    $('#btnAfslut').title = ps.overdraget ? `Overdraget ${p.overdragelse.dato} af ${emp(p.overdragelse.af).navn}`
      : ps.udfoerelse !== App.UDFOERELSE_STATUS[2] ? 'Sæt udførelsen til Udført, før projektet kan overdrages' : '';
    $('#pStats').innerHTML = [
      ['Salg total', kr(c.salg)], ['Udgifter', kr(c.udg)], ['DG beregnet', pct(c.dgB)], ['DG faktisk', pct(c.dgF)],
      ['Faktureret', kr(c.fakt)], ['Rest', kr(c.rest)], ['Teknikertimer', n(c.timer) + ' t'],
      ['Delopgaver', `${delopgaver.filter(o => o.status === 'Åben').length} åbne / ${delopgaver.length} i alt`],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

    // Stamdata. Sted nr. bor kun på sitet (PLAN-v6-spor1 §1.2) og vises derfor skrivebeskyttet her –
    // før kunne de to felter komme ud af trit (gap-rapport afsnit 5).
    const stedNr = App.stedNr(p);
    const m = bc(stedNr);
    const f = (label, val, opts = {}) => `<label class="${opts.auto ? 'auto' : ''}">${label}<input type="${opts.type || 'text'}" value="${h(val)}" ${opts.name ? `name="${opts.name}"` : 'readonly'}></label>`;
    // C2b (KRAV-GAP-v6): Model var skrivebeskyttet – nu en select med samme to valg som "Ny sag".
    // mdlRate/løbetid hører til modeltypen "Solution" og er ikke selve kravet, så de vises som note, ikke som redigerbart felt.
    const modelField = `<label>Model<select name="model"><option${p.model === 'Kontant' ? ' selected' : ''}>Kontant</option><option${p.model === 'Solution' ? ' selected' : ''}>Solution</option></select>${p.model === 'Solution' ? `<span class="caption muted">${p.loebetid || 0} mdr. × ${kr(p.mdlRate)}</span>` : ''}</label>`;
    // Underleverandøren peger nu på et id i registret i stedet for et frit navn (PLAN-v6-spor1 §1.5).
    const ulField = `<label>Underleverandør<select name="ulId"><option value=""${p.ulId ? '' : ' selected'}>Ingen</option>${(S.underleverandoerer || []).map(u => `<option value="${h(u.id)}"${u.id === p.ulId ? ' selected' : ''}>${h(u.navn)}</option>`).join('')}</select></label>`;
    $('#stamForm').innerHTML = [
      f('Sted nr. (AS400)', stedNr, { auto: true }),
      f('Sted navn', m ? m.stedNavn : (stedNr ? 'Ukendt sted nr.' : 'Sitet har intet sted nr.'), { auto: true }),
      f('Costcenter', m ? `${m.costcenter} – ${m.costcenterNavn}` : '', { auto: true }),
      f('TOS', m ? `${m.tos} – ${m.tosNavn}` : '', { auto: true }),
      f('Account (DK-A)', m ? `${m.account} – ${m.accountNavn}` : '', { auto: true }),
      f('Profitcenter', m ? m.profitcenter : '', { auto: true }),
      f('Site (DK-S)', s.id, { auto: true }),
      f('Kunde', App.kundeNavn(s), { auto: true }),
      f('Adresse', `${s.adresse}, ${s.postnr} ${s.by}`, { auto: true }),
      f('Site-kode', s.kode, { name: 'siteKode' }),
      f('Rekvirent', p.rekvirent, { name: 'rekvirent' }),
      f('Ref. / formålsnr.', p.ref, { name: 'ref' }),
      f('WO', p.wo, { name: 'wo' }),
      // C5: opportunity-nr. kan nu rettes efter oprettelse (før var det kun sat ved oprettelse).
      f('Opportunity', p.opportunity, { name: 'opportunity' }),
      // C4/C5: valgfrie linkfelter – PM indsætter hele CEP-linket, da URL-mønstret ikke er kendt (åbent spørgsmål 5).
      f('Link til CEP-projekt', p.cepProjektUrl || '', { name: 'cepProjektUrl' }),
      f('Link til CEP-opportunity', p.opportunityUrl || '', { name: 'opportunityUrl' }),
      f('Installationstype', p.type, { auto: true }),
      modelField,
      ulField,
      f('Salgspris', p.salgspris, { name: 'salgspris', type: 'number' }),
      f('Ekstra arbejde', p.ekstraArbejde, { name: 'ekstraArbejde', type: 'number' }),
      f('Salg kostpris', p.salgKost, { name: 'salgKost', type: 'number' }),
    ].join('');
    $$('#stamForm input[name], #stamForm select[name]').forEach(i => i.addEventListener('change', () => {
      if (i.name === 'siteKode') { s.kode = i.value.trim(); save(); this.render(); return; }
      if (i.name === 'cepProjektUrl' || i.name === 'opportunityUrl') {
        const val = i.value.trim();
        if (val && !/^https:\/\//i.test(val)) { toast('Linket skal starte med https://'); this.render(); return; }
        p[i.name] = val; save(); this.render(); return;
      }
      if (i.name === 'ulId') {
        App.saetFelt(p, 'projekt', p.id, 'ulId', i.value);
        save(); this.render(); return;
      }
      p[i.name] = i.type === 'number' ? +i.value : i.value; save(); this.render();
    }));

    // Udgifter
    $('#udgRows').innerHTML = p.udgifter.map((u, i) => `<tr><td>${h(u.faktura)}${u.bilag ? `<br><span class="caption muted">Bilag: ${h(u.bilag)}</span>` : ''}</td><td>${h(u.leverandoer)}</td><td>${h(u.ydelse)}</td><td class="num">${kr(u.beloeb)}</td><td class="muted">${h(u.dato)}</td>
      <td><button class="tlink" data-udgedit="${i}">Rediger</button> <button class="tlink" data-udgdel="${i}">Slet</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Ingen udgifter endnu.</td></tr>';
    $('#udgSum').innerHTML = `<td colspan="3">Total</td><td class="num">${kr(c.udg)}</td><td></td><td></td>`;
    if (udgEditIdx == null && !$('#udgForm').dato.value) $('#udgForm').dato.value = App.today();
    $$('[data-udgedit]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.udgedit; const u = p.udgifter[i]; udgEditIdx = i;
      const form = $('#udgForm');
      form.faktura.value = u.faktura; form.leverandoer.value = u.leverandoer; form.ydelse.value = u.ydelse; form.beloeb.value = u.beloeb; form.dato.value = u.dato || App.today();
      form.querySelector('button[type=submit]').textContent = 'Gem ændring';
    }));
    $$('[data-udgdel]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.udgdel;
      App.confirmDialog('Slet udgiften?').then(ok => { if (!ok) return; p.udgifter.splice(i, 1); save(); this.render(); toast('Udgift slettet'); });
    }));

    // Fakturering. Tre trin (C9): PM sætter linjen klar, sender den (Sendt til fakturering), og
    // faktureringsteamet markerer den faktureret i køen "Til fakturering".
    const flow = window.ProjektFlow;
    const maaRettes = App.maaRette('projekt', p);
    $('#fakRows').innerHTML = p.fakturering.map((fl, i) => {
      const sendt = fl.status === flow.SENDT, faktureret = fl.status === flow.FAKTURERET;
      const statusCelle = faktureret ? st(fl.status)
        : sendt ? `<span title="Sendt af ${h(emp(fl.sendtAf).navn)}">${st(fl.status)}</span>`
          : `<select data-fstat="${i}" aria-label="Status">${App.FAKTURALINJE_STATUS.slice(0, 2).map(v => `<option${fl.status === v ? ' selected' : ''}>${h(v)}</option>`).join('')}</select>`;
      // "Rediger" og "Slet" er skjult på sendte linjer, ligesom de er det på fakturerede.
      const handling = faktureret ? ''
        : sendt ? (maaRettes ? `<button class="tlink" data-faktilbage="${i}">Træk tilbage</button>` : '')
          : `<button class="tlink" data-fakedit="${i}">Rediger</button> <button class="tlink" data-fakdel="${i}">Slet</button>`;
      return `<tr><td>${h(fl.tekst)}</td><td>${h(fl.rekv)}</td><td class="num">${kr(fl.beloeb)}</td>
      <td>${statusCelle}</td>
      <td class="muted">${h(sendt ? fl.sendtDato || '' : fl.dato)}</td><td>${h(fl.initialer)}</td>
      <td>${handling}</td></tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">Ingen faktureringslinjer endnu.</td></tr>';
    $('#fakSum').innerHTML = `<td colspan="2">Faktureret ${kr(c.fakt)} · Rest ${kr(c.rest)}</td><td class="num">${kr(p.fakturering.reduce((a, x) => a + +x.beloeb, 0))}</td><td colspan="4"></td>`;
    $$('[data-fstat]').forEach(sel => sel.addEventListener('change', () => {
      p.fakturering[+sel.dataset.fstat].status = sel.value; save(); this.render();
    }));
    $$('[data-faktilbage]').forEach(b => b.addEventListener('click', () => {
      if (!flow.traekTilbage(p, +b.dataset.faktilbage)) return;
      save(); this.render(); toast('Linjen er trukket tilbage og står igen som klar til fakturering');
    }));
    $('#btnSendFak').disabled = !p.fakturering.some(x => x.status === flow.KLAR);
    $$('[data-fakedit]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.fakedit; const fl = p.fakturering[i]; fakEditIdx = i;
      const form = $('#fakForm');
      form.tekst.value = fl.tekst; form.rekv.value = fl.rekv; form.beloeb.value = fl.beloeb;
      form.querySelector('button[type=submit]').textContent = 'Gem ændring';
    }));
    $$('[data-fakdel]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.fakdel;
      App.confirmDialog('Slet faktureringslinjen?').then(ok => { if (!ok) return; p.fakturering.splice(i, 1); save(); this.render(); toast('Faktureringslinje slettet'); });
    }));

    // Delopgaver
    const timerForDelopg = id => S.tid.filter(t => t.sag === id).reduce((a, t) => a + (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0), 0);
    $('#delopgRows').innerHTML = delopgaver.map(o => {
      const canLuk = o.status === 'Åben';
      const canGenaabn = o.status === 'Lukket til fakturering';
      return `<tr>
        <td><b>${h(o.id)}</b></td>
        <td>${h(o.beskrivelse)}</td>
        <td>${h(o.type || 'Service')}</td>
        <td>${h(emp(o.tekniker).navn)}</td>
        <td>${st(o.status)}</td>
        <td class="num">${n(timerForDelopg(o.id))}</td>
        <td class="num">${o.kladde ? kr(o.kladde.total) : '–'}</td>
        <td>
          <button class="tlink" data-act="kladde" data-id="${h(o.id)}">Fakturakladde</button> ·
          ${canLuk ? `<button class="tlink" data-act="luk" data-id="${h(o.id)}">Luk til fakturering</button> · ` : ''}
          ${canGenaabn ? `<button class="tlink" data-act="genaabn" data-id="${h(o.id)}">Genåbn</button> · ` : ''}
          <button class="tlink" data-act="rediger" data-id="${h(o.id)}">Rediger</button>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" class="empty">Ingen delopgaver på projektet endnu. Opret den første med "Ny delopgave".</td></tr>';

    // Tid og log (inkl. timer registreret på delopgaver)
    const rows = S.tid.filter(t => t.sag === p.id || (t.sag || '').startsWith(p.id + '-')).sort((a, b) => b.dato.localeCompare(a.dato));
    const sum = k => rows.reduce((a, t) => a + (+t[k] || 0), 0);
    $('#tidRows').innerHTML = rows.map(t => `<tr><td>${t.dato}</td><td>${h(t.sag)}</td><td>${h(emp(t.tekniker).navn)}</td><td class="num">${n(t.timer)}</td><td class="num">${n(t.ot1)}</td><td class="num">${n(t.ot2)}</td><td class="num">${n(t.koersel)}</td><td>${h(t.udfoert)}</td><td class="muted">${(t.materialer || []).map(x => `${x.antal} × ${h(x.model)}`).join(', ')}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">Ingen teknikertimer registreret på sagen.</td></tr>';
    $('#tidSum').innerHTML = `<td colspan="3">Total</td><td class="num">${n(sum('timer'))}</td><td class="num">${n(sum('ot1'))}</td><td class="num">${n(sum('ot2'))}</td><td class="num">${n(sum('koersel'))}</td><td colspan="2"></td>`;
    $('#logRows').innerHTML = p.log.map((l, i) => `<li><time>${h(l.dato)}</time><span>${h(l.tekst)}</span><span class="who">${h(emp(l.af).navn)} · PM ${n(l.pmTid)} t / SE ${n(l.seTid)} t / UL ${n(l.ulTid)} t${l.af === S.user ? ` · <button class="tlink" data-logdel="${i}">Slet</button>` : ''}</span></li>`).join('');
    $$('[data-logdel]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.logdel;
      App.confirmDialog('Slet log-posten?').then(ok => { if (!ok) return; p.log.splice(i, 1); save(); this.render(); toast('Log-post slettet'); });
    }));
  },
});

</script>
<script>
// Tidsregistrering – teknikerens telefon. Erstatter Tids_registrering og teknikerarkene.
App.registerPage({
  id: 'tid', label: 'Tidsregistrering', group: 'Service', icon: 'mobile', order: 40,
  html: `
    <div class="page-head">
      <div>
        <h1>Tidsregistrering – teknikerens telefon</h1>
        <p>Teknikeren vælger en af sine åbne sager – eller registrerer intern tid (ferie, sygdom, kursus m.m.). Kunde og adresse følger med fra sagen, så der kun tastes timer, udført arbejde og materialer.</p>
      </div>
      <div class="replaces">Erstatter <b>Tids_registrering</b> og de seks teknikerark</div>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <div class="app-bar"><div><b>Mine opgaver</b><small id="techName"></small></div><svg aria-label="Securitas"><use href="#logo-white"/></svg></div>
          <div class="content">
            <div class="field">Tekniker<select id="techSel"></select></div>
            <div class="field">Registrér på
              <div class="ftabs" id="regMode">
                <button type="button" class="ftab on" data-mode="sag">Sag</button>
                <button type="button" class="ftab" data-mode="intern">Intern tid</button>
              </div>
            </div>
            <div class="field" id="caseField">Mine åbne sager<ul class="my-cases" id="myCases"></ul></div>
            <div class="field" id="internField" hidden>Kategori<ul class="my-cases" id="internCats"></ul></div>
            <div class="site-chip" id="siteChip">Vælg en sag</div>
            <div class="field">Dato<input type="date" id="tDato"></div>
            <div class="row">
              <div class="field">Timer<input type="number" id="tTimer" step="0.5" value="7.5"></div>
              <div class="field">OT 1<input type="number" id="tOt1" step="0.5" value="0"></div>
              <div class="field">OT 2<input type="number" id="tOt2" step="0.5" value="0"></div>
              <div class="field" id="koerselField">Kørsel<input type="number" id="tKoersel" step="1" value="1"></div>
            </div>
            <div class="field">Udført<textarea id="tUdfoert" rows="3" placeholder="Hvad blev lavet?"></textarea></div>
            <div class="field" id="matField">Materialer der ikke er købt til sagen
              <div class="mat">
                <select id="mType"></select>
                <select id="mModel"></select>
                <input type="number" id="mAntal" value="1" min="1" aria-label="Antal">
                <button class="tlink" type="button" id="mAdd">Tilføj</button>
              </div>
              <div class="mat-list" id="matList"></div>
            </div>
            <button class="btn cta" id="tGem">Gem registrering</button>
          </div>
        </div>
      </div>
      <div class="side-note">
        <h2>Hvad sker der bag skærmen</h2>
        <ul>
          <li>Sagen (PRDK eller CAS) bærer selv kunde, adresse, sted nr. og PO. Teknikeren taster det aldrig.</li>
          <li>Registreringen lander direkte på projektkortets fane <b>Tid og log</b> og i kontering af timer.</li>
          <li>Intern tid (ferie, sygdom, kursus, afspadsering) tælles med i kontering og "denne måned", men vises aldrig i sags- eller faktureringslister.</li>
          <li>Materialer tages fra det fælles katalog (Materiale liste) og kan bruges til efterfakturering.</li>
          <li>Når en serviceopgave lukkes, går den til <b>Til fakturering</b> uden at nogen kopierer rækker.</li>
        </ul>
        <h2>Denne måned <small id="monthLabel"></small></h2>
        <div class="stats" id="monthStats"></div>
        <h2>Seneste registreringer</h2>
        <div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Dato</th><th>Sag</th><th>Tekniker</th><th class="num">Timer</th></tr></thead>
          <tbody id="recentTid"></tbody>
        </table></div></div>
      </div>
    </div>
  `,
  init() {
    const { $, $$, D, S, save, toast, today, h } = App;
    const techSel = $('#techSel');
    D.medarbejdere.filter(m => m.rolle === 'Tekniker').forEach(m => techSel.add(new Option(m.navn, m.id)));
    this.mode = 'sag'; this.selCase = null; this.selKat = null;
    $('#tDato').value = today();
    const mType = $('#mType'), mModel = $('#mModel');
    Object.keys(D.materialer).forEach(k => mType.add(new Option(k, k)));
    const fillModels = () => { mModel.innerHTML = ''; (D.materialer[mType.value] || []).forEach(m => mModel.add(new Option(m, m))); };
    mType.addEventListener('change', fillModels); fillModels();
    techSel.addEventListener('change', () => { this.selCase = null; this.selKat = null; this.render(); });

    $$('#regMode .ftab').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.mode === this.mode) return;
      this.mode = b.dataset.mode;
      if (this.mode === 'intern') { if (!this.selKat) this.selKat = App.INTERN_KATEGORIER[0]; $('#tTimer').value = this.selKat === 'Intern tid' ? 3 : 7.4; }
      this.render();
    }));

    const renderMats = () => {
      $('#matList').innerHTML = this.mats.map((m, i) => `<div class="item"><span>${m.antal} × ${h(m.type)} · ${h(m.model)}</span><button class="tlink" data-rm="${i}">Fjern</button></div>`).join('');
      $$('[data-rm]').forEach(b => b.addEventListener('click', () => { this.mats.splice(+b.dataset.rm, 1); renderMats(); }));
    };
    this.mats = [];
    $('#mAdd').addEventListener('click', () => { this.mats.push({ type: mType.value, model: mModel.value, antal: +$('#mAntal').value || 1 }); renderMats(); });

    $('#tGem').addEventListener('click', () => {
      const dato = $('#tDato').value, timer = +$('#tTimer').value, ot1 = +$('#tOt1').value, ot2 = +$('#tOt2').value;
      if (this.mode === 'sag') {
        if (!this.selCase) return toast('Vælg en sag først');
        if (!$('#tUdfoert').value.trim()) return toast('Skriv hvad der blev udført, før du gemmer');
        S.tid.push({ dato, sag: this.selCase, tekniker: techSel.value, timer, ot1, ot2, koersel: +$('#tKoersel').value, udfoert: $('#tUdfoert').value.trim(), materialer: this.mats });
        this.mats = []; renderMats(); $('#tUdfoert').value = ''; save(); this.render();
        toast(`Gemt på ${this.selCase}. Timerne vises nu på projektkortet.`);
      } else {
        if (!this.selKat) return toast('Vælg en kategori først');
        const udfoert = $('#tUdfoert').value.trim() || this.selKat;
        S.tid.push({ dato, sag: 'Intern', kategori: this.selKat, tekniker: techSel.value, timer, ot1: 0, ot2: 0, koersel: 0, udfoert, materialer: [] });
        $('#tUdfoert').value = ''; save(); this.render();
        toast(`Gemt som intern tid – ${this.selKat}.`);
      }
    });
  },
  myCases(tech) {
    const { S, emp, erIgangvaerende } = App;
    const t = emp(tech);
    const ps = S.projekter.filter(p => erIgangvaerende(p) && (p.afdeling === t.afdeling || S.tid.some(x => x.sag === p.id && x.tekniker === tech))).map(p => ({ id: p.id, navn: p.navn, siteId: p.siteId, kind: 'Projekt' }));
    const cs = (S.serviceopgaver || []).filter(c => c.tekniker === tech && c.status === 'Åben' && !c.parent).map(c => ({ id: c.id, navn: c.beskrivelse, siteId: c.siteId, kind: 'Service' }));
    const subs = (S.serviceopgaver || []).filter(c => c.tekniker === tech && c.status === 'Åben' && c.parent).map(c => {
      const parentP = (S.projekter || []).find(pp => pp.id === c.parent);
      return { id: c.id, navn: c.beskrivelse || (parentP ? parentP.navn : ''), siteId: c.siteId, kind: 'Delopgave' };
    });
    return [...cs, ...subs, ...ps];
  },
  render() {
    const { $, $$, S, site, siteLabel, emp, h, n, isIntern, INTERN_KATEGORIER, expectedHours } = App;
    const techSel = $('#techSel');
    // Er den aktuelle bruger tekniker, vælges vedkommende automatisk
    if (emp(S.user).rolle === 'Tekniker' && techSel.value !== S.user) { techSel.value = S.user; this.selCase = null; this.selKat = null; }
    const tech = techSel.value; $('#techName').textContent = emp(tech).navn;

    // ---- registrér-på tabs ----
    $$('#regMode .ftab').forEach(b => b.classList.toggle('on', b.dataset.mode === this.mode));
    $('#caseField').hidden = this.mode !== 'sag';
    $('#internField').hidden = this.mode !== 'intern';
    $('#koerselField').hidden = this.mode === 'intern';
    $('#matField').hidden = this.mode === 'intern';

    // ---- sagsliste ----
    const cases = this.myCases(tech);
    if (this.mode === 'sag' && (!this.selCase || !cases.find(c => c.id === this.selCase))) this.selCase = cases[0]?.id || null;
    $('#myCases').innerHTML = cases.map(c => `<li class="${c.id === this.selCase ? 'sel' : ''}" data-case="${c.id}" tabindex="0"><b>${c.kind === 'Delopgave' ? `${c.kind} · ${c.id}` : `${c.id} · ${c.kind}`}</b>${h(c.navn)}<br><span class="muted">${h(siteLabel(c.siteId))}</span></li>`).join('') || '<li class="empty">Ingen åbne sager på denne tekniker. Vælg en anden tekniker, eller opret en serviceopgave.</li>';
    $$('[data-case]').forEach(li => li.addEventListener('click', () => { this.mode = 'sag'; this.selCase = li.dataset.case; this.render(); }));

    // ---- interne kategorier ----
    if (!this.selKat) this.selKat = INTERN_KATEGORIER[0];
    $('#internCats').innerHTML = INTERN_KATEGORIER.map(k => `<li class="${this.mode === 'intern' && k === this.selKat ? 'sel' : ''}" data-kat="${h(k)}" tabindex="0"><b>${h(k)}</b></li>`).join('');
    $$('[data-kat]').forEach(li => li.addEventListener('click', () => {
      this.selKat = li.dataset.kat;
      $('#tTimer').value = this.selKat === 'Intern tid' ? 3 : 7.4;
      this.render();
    }));

    // ---- site-chip ----
    if (this.mode === 'intern') {
      $('#siteChip').innerHTML = '<b>Securitas A/S · intern tid</b>';
    } else {
      const c = cases.find(x => x.id === this.selCase); const s = c ? site(c.siteId) : null;
      $('#siteChip').innerHTML = s ? `<b>${h(siteLabel(s))}</b>${h(s.postnr)} ${h(s.by)} · sted nr. ${h(s.stedNr) || '–'}` : 'Vælg en sag';
    }

    // ---- denne måned ----
    const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + 1;
    const prefix = `${y}-${String(m).padStart(2, '0')}`;
    const monthTid = S.tid.filter(t => t.tekniker === tech && (t.dato || '').startsWith(prefix));
    const sum = list => list.reduce((a, t) => a + (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0), 0);
    const internHours = sum(monthTid.filter(isIntern));
    const caseHours = sum(monthTid.filter(t => !isIntern(t)));
    const total = internHours + caseHours;
    const expected = expectedHours(y, m);
    const diff = Math.round((total - expected) * 10) / 10;
    $('#monthLabel').textContent = now.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' });
    $('#monthStats').innerHTML = `
      <div class="stat"><small>Sager</small><b>${n(caseHours)}</b></div>
      <div class="stat"><small>Intern tid</small><b>${n(internHours)}</b></div>
      <div class="stat"><small>Registreret i alt</small><b>${n(total)}</b></div>
      <div class="stat"><small>Forventet</small><b>${n(expected)}</b></div>
      <div class="stat"><small>Difference</small><b>${diff > 0 ? '+' : ''}${n(diff)}</b></div>
    `;

    // ---- seneste registreringer ----
    $('#recentTid').innerHTML = [...S.tid].sort((a, b) => b.dato.localeCompare(a.dato)).slice(0, 8).map(t => `<tr><td>${t.dato}</td><td>${isIntern(t) ? `Intern · ${h(t.kategori)}` : h(t.sag)}</td><td>${h(emp(t.tekniker).navn)}</td><td class="num">${n((+t.timer) + (+t.ot1) + (+t.ot2))}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Ingen registreringer endnu.</td></tr>';
  },
});

</script>

  // ---------- lokal helper: salgsleddet (A1) ----------

  // Ét afsnit i en forløbscelle. Cellerne har flere små blokke under hinanden; klassen giver dem luft
