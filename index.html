        info.obj.log.unshift({ dato: now(), tekst: `Bestilling sendt til ${u.navn}`, af: S.user, pmTid: 0.25, seTid: 0, ulTid: 0 });
        save();
      }
      closeModal('modalBestilling');
      toast('Bestilling sendt til ' + u.navn + ' (Til: ' + (u.bestillingsmail || '–') + ', CC: ' + (u.ccMail || '–') + ')');
    });

    // ---------- Rækkeklik ----------
    $('#ulRows').addEventListener('click', e => {
      const tr = e.target.closest('[data-open]'); if (!tr) return;
      curId = tr.dataset.open; renderView(); openModal('modalUl');
    });
    $('#ulRows').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const tr = e.target.closest('[data-open]'); if (!tr || tr.matches('tr.click[tabindex]')) return; // kernen håndterer tr.click
      curId = tr.dataset.open; renderView(); openModal('modalUl');
    });
  },
  render() {
    const { $, $$, S, h, kr } = App;
    const list = S.underleverandoerer || [];
    const areas = ['', ...Array.from(new Set(list.map(u => u.omraade).filter(Boolean)))];
    const activeArea = S.ulOmraade && areas.includes(S.ulOmraade) ? S.ulOmraade : '';
    S.ulOmraade = activeArea;
    $('#ulOmraade').innerHTML = areas.map(a => `<button class="ftab ${a === activeArea ? 'on' : ''}" data-v="${h(a)}">${a ? h(a) : 'Alle'}</button>`).join('');
    $$('#ulOmraade .ftab').forEach(b => b.addEventListener('click', () => { S.ulOmraade = b.dataset.v; App.save(); this.render(); }));

    const q = $('#ulSearch').value.trim().toLowerCase();
    const rows = list.filter(u => {
      if (activeArea && u.omraade !== activeArea) return false;
      if (q) {
        const hay = [u.navn, u.omraade, u.bestillingsmail, u.ccMail, ...(u.kontakter || []).flatMap(k => [k.navn, k.mail])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    $('#ulRows').innerHTML = rows.map(u => {
      const projCnt = S.projekter.filter(p => p.ul === u.navn).length;
      const siteCnt = (S.sites || []).filter(s => s.ul === u.navn).length;
      return `<tr class="click" data-open="${h(u.id)}" tabindex="0">
        <td><b>${h(u.navn)}</b></td><td>${h(u.omraade) || '–'}</td><td>${h(u.vagttelefon) || '–'}</td>
        <td>${h(u.bestillingsmail) || '–'}</td><td>${h(u.ccMail) || '–'}</td>
        <td class="num">${kr(u.timeprisKost)}</td><td class="num">${kr(u.timeprisSalg)}</td>
        <td class="num">${projCnt}</td><td class="num">${siteCnt}</td></tr>`;
    }).join('') || `<tr><td colspan="9" class="empty">${list.length ? 'Ingen underleverandører matcher filteret.' : 'Ingen underleverandører endnu.'}</td></tr>`;
  },
});

</script>
<script>
// Eftersyn – kalender og status for alle sites med eftersynsaftale.
// Erstatter kolonnerne Eftersyn, ES-måned, interval, "Eftersyn til kunden" og "CAS eftersyn 2025/2026" i Kundekartotek.
App.registerPage({
  id: 'eftersyn', label: 'Eftersyn', group: 'Service', icon: 'time', order: 45,
  roles: ['Chef', 'PM', 'Service', 'Tekniker', 'Fakturering'],
  html: `
    <div class="page-head">
      <div>
        <h1>Eftersyn</h1>
        <p>Overblik over næste eftersyn pr. site, beregnet ud fra sidste eftersyn og interval – eller ES-måned, hvis der endnu ikke er registreret et udført eftersyn.</p>
      </div>
      <div class="replaces">Erstatter kolonnerne <b>Eftersyn</b>, <b>ES-måned</b>, <b>interval</b>, <b>Eftersyn til kunden</b> og <b>CAS eftersyn 2025/2026</b> i Kundekartotek</div>
    </div>
    <div class="stats" id="efStats"></div>
    <div class="card">
      <div class="toolbar">
        <div class="ftabs" id="efTabs" role="group" aria-label="Status">
          <button class="ftab on" data-v="">Alle</button>
          <button class="ftab" data-v="over">Overskredet</button>
          <button class="ftab" data-v="30">30 dage</button>
          <button class="ftab" data-v="90">90 dage</button>
          <button class="ftab" data-v="uden">Uden aftale</button>
        </div>
        <div class="ftabs" id="efViewTabs" role="group" aria-label="Visning">
          <button class="ftab on" data-v="liste">Liste</button>
          <button class="ftab" data-v="kalender">Kalender</button>
        </div>
        <label class="field">Søg <input type="text" id="efSearch" placeholder="Site, kunde, installation" size="26"></label>
      </div>
      <div class="table-wrap" id="efListWrap">
        <table>
          <thead><tr>
            <th>Site og kunde</th><th>Adresse</th><th>Installation</th><th>Serviceaftale</th><th>UL</th>
            <th>Sidste eftersyn</th><th>Næste eftersyn</th><th>Interval</th><th>Status</th><th>CAS-nr.</th><th></th>
          </tr></thead>
          <tbody id="efRows"></tbody>
        </table>
      </div>
      <div class="card-body" id="efCalWrap" style="display:none"></div>
    </div>

    <div class="modal-bg" id="modalEfDetaljer">
      <div class="modal" role="dialog" aria-labelledby="efDetTitle">
        <header><h2 id="efDetTitle">Eftersyn</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body" id="efDetBody"></div>
        <footer><button class="btn" data-close>Luk</button><button class="btn cta" id="efSendPaamindelse">Send påmindelse til kunde</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalEfMail">
      <div class="modal" role="dialog" aria-labelledby="efMailTitle">
        <header><h2 id="efMailTitle">Påmindelse til kunde</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid" style="margin-bottom:18px">
            <label>Til<input type="text" id="efMailTil" readonly></label>
            <label>Fra<input type="text" id="efMailFra" readonly></label>
          </div>
          <div class="pdf" id="efMailPreview"></div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="efMailSend">Send</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, D, S, save, toast, today, h, kr, openModal, closeModal, emp, site } = App;

    // ---------- lokale datohjælpere (dansk format, TZ-sikre) ----------
    const parseISO = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
    const ddmm = s => { if (!s) return '–'; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };
    const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

    const nextEftersyn = (s, t) => {
      if (s.sidsteEftersyn) {
        const d = parseISO(s.sidsteEftersyn);
        d.setMonth(d.getMonth() + (+s.interval || 12));
        return d;
      }
      if (s.esMaaned) {
        let d = new Date(t.getFullYear(), (+s.esMaaned) - 1, 1);
        if (d < t) d = new Date(t.getFullYear() + 1, (+s.esMaaned) - 1, 1);
        return d;
      }
      return null;
    };

    const opgaveFor = s => (S.serviceopgaver || []).find(o => o.siteId === s.id && o.type === 'Eftersyn' && o.status === 'Åben');

    const rowInfo = (s, t) => {
      const nd = s.eftersyn ? nextEftersyn(s, t) : null;
      let status, cls, label;
      if (!s.eftersyn || !nd) { status = 'uden'; cls = ''; label = 'Uden aftale'; }
      else {
        const diff = Math.round((nd - t) / 86400000);
        if (diff < 0) { status = 'over'; cls = 'over'; label = 'Overskredet'; }
        else if (diff <= 30) { status = '30'; cls = 'snart'; label = 'Inden for 30 dage'; }
        else if (diff <= 90) { status = '90'; cls = 'snart'; label = 'Inden for 90 dage'; }
        else { status = 'planlagt'; cls = ''; label = 'Planlagt'; }
      }
      return { site: s, nextDate: nd, status, cls, label };
    };

    const genCasId = () => {
      const digits = () => String(Math.floor(100000 + Math.random() * 900000));
      const chars = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 33)]).join('');
      return `CAS-${digits()}-${chars()}`;
    };

    this.helpers = { parseISO, ddmm, startOfToday, nextEftersyn, opgaveFor, rowInfo };

    // ---------- toolbar ----------
    $$('#efTabs .ftab').forEach(b => b.addEventListener('click', () => {
      $$('#efTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.fStatus = b.dataset.v; this.render();
    }));
    $$('#efViewTabs .ftab').forEach(b => b.addEventListener('click', () => {
      $$('#efViewTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.fView = b.dataset.v; this.render();
    }));
    $('#efSearch').addEventListener('input', () => this.render());

    // ---------- rækkehandlinger ----------
    $('#efRows').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (btn) {
        const s = site(btn.dataset.id);
        if (!s || !s.id) return;
        if (btn.dataset.act === 'opret') {
          const forsteTekniker = (D.medarbejdere.find(m => m.rolle === 'Tekniker') || {}).id || '';
          const id = genCasId();
          S.serviceopgaver = S.serviceopgaver || [];
          S.serviceopgaver.push({ id, siteId: s.id, beskrivelse: `Eftersyn – ${App.siteLabel(s)}`, tekniker: forsteTekniker, status: 'Åben', type: 'Eftersyn', oprettet: today(), lukket: '', po: '', pris: 0 });
          s.casEftersyn = id;
          save(); toast(`Eftersynsopgave ${id} oprettet`); this.render();
        } else if (btn.dataset.act === 'udfoert') {
          s.sidsteEftersyn = today();
          const opg = opgaveFor(s);
          if (opg) { opg.status = 'Lukket til fakturering'; opg.lukket = today(); }
          save(); toast(`${s.id} markeret som udført`); this.render();
        }
        return;
      }
      const tr = e.target.closest('tr[data-site]');
      if (tr) this.openDetaljer(tr.dataset.site);
    });

    $('#efCalWrap').addEventListener('click', e => {
      const li = e.target.closest('[data-site]');
      if (li) this.openDetaljer(li.dataset.site);
    });

    // ---------- detalje-modal ----------
    $('#efSendPaamindelse').addEventListener('click', () => {
      const s = site(this._curSite); if (!s || !s.id) return;
      $('#efMailTil').value = s.kontakt || `Kontaktperson, ${s.kunde}`;
      $('#efMailFra').value = emp(S.user).navn;
      const t = startOfToday();
      const nd = s.eftersyn ? nextEftersyn(s, t) : null;
      $('#efMailPreview').innerHTML = `
        <div class="pdf-head"><b>Påmindelse om eftersyn</b><span class="muted">${today()}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
        <dl>
          <dt>Kunde</dt><dd>${h(s.kunde)}</dd><dt>Site</dt><dd>${h(App.siteLabel(s))}</dd>
          <dt>Adresse</dt><dd>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</dd><dt>Kontaktperson</dt><dd>${h(s.kontakt) || '–'}</dd>
          <dt>Installation</dt><dd>${h(s.installation) || '–'}</dd><dt>Planlagt dato</dt><dd>${nd ? ddmm(nd.getFullYear() + '-' + String(nd.getMonth() + 1).padStart(2, '0') + '-' + String(nd.getDate()).padStart(2, '0')) : '–'}</dd>
        </dl>
        <p>Vi skal snart udføre planlagt eftersyn af jeres anlæg. Vi kontakter jer for at aftale nærmere tidspunkt.</p>
        <p class="caption muted" style="margin-top:18px">Alle felter ovenfor er hentet fra sitet. Ingen er tastet til denne påmindelse.</p>`;
      closeModal('modalEfDetaljer'); openModal('modalEfMail');
    });
    $('#efMailSend').addEventListener('click', () => {
      closeModal('modalEfMail'); toast('Påmindelse sendt til kunden');
    });
  },
  openDetaljer(siteId) {
    const { $, S, site, h, kr, st, openModal, siteLabel } = App;
    const { ddmm, startOfToday, nextEftersyn, opgaveFor, rowInfo } = this.helpers;
    const s = site(siteId); if (!s || !s.id) return;
    this._curSite = siteId;
    const t = startOfToday();
    const info = rowInfo(s, t);
    const opg = opgaveFor(s);
    $('#efDetTitle').textContent = `Eftersyn · ${s.navn || s.kunde}`;
    $('#efDetBody').innerHTML = `
      <div class="form-grid" style="margin-bottom:18px">
        <div><small class="muted">Site og kunde</small><br><b>${h(s.kunde)}</b><br><span class="muted">${h(siteLabel(s))}</span></div>
        <div><small class="muted">Adresse</small><br><b>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</b></div>
        <div><small class="muted">Installation</small><br><b>${h(s.installation) || '–'}</b></div>
        <div><small class="muted">Serviceaftale</small><br><b>${h(s.serviceaftale) || '–'}</b></div>
        <div><small class="muted">UL</small><br><b>${h(s.ul) || '–'}</b></div>
        <div><small class="muted">Kontaktperson</small><br><b>${h(s.kontakt) || '–'}</b></div>
        <div><small class="muted">Sidste eftersyn</small><br><b>${ddmm(s.sidsteEftersyn)}</b></div>
        <div><small class="muted">Næste eftersyn</small><br><b>${info.nextDate ? ddmm(info.nextDate.getFullYear() + '-' + String(info.nextDate.getMonth() + 1).padStart(2, '0') + '-' + String(info.nextDate.getDate()).padStart(2, '0')) : '–'}</b></div>
        <div><small class="muted">Interval</small><br><b>${s.interval ? s.interval + ' måneder' : '–'}</b></div>
        <div><small class="muted">Status</small><br>${`<span class="st ${info.cls}">${h(info.label)}</span>`}</div>
        <div><small class="muted">CAS-nr.</small><br><b>${h(opg ? opg.id : (s.casEftersyn || '–'))}</b></div>
      </div>
    `;
    openModal('modalEfDetaljer');
  },
  render() {
    const { $, $$, S, h, kr, site, st, siteLabel } = App;
    const { ddmm, startOfToday, opgaveFor, rowInfo } = this.helpers;
    const t = startOfToday();
    const all = (S.sites || []).map(s => rowInfo(s, t));

    // KPI'er – uafhængige af tabel-/kalenderfilter
    const overskredne = all.filter(r => r.status === 'over').length;
    const inden30 = all.filter(r => r.status === '30').length;
    const inden90 = all.filter(r => r.status === '30' || r.status === '90').length;
    const iAlt = all.filter(r => r.site.eftersyn).length;
    $('#efStats').innerHTML = [
      ['Overskredet', overskredne],
      ['Inden for 30 dage', inden30],
      ['Inden for 90 dage', inden90],
      ['Sites med eftersynsaftale', iAlt],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

    // filtre
    const status = this.fStatus || '';
    const view = this.fView || 'liste';
    const q = $('#efSearch').value.trim().toLowerCase();
    let rows = all.filter(r => {
      if (status && r.status !== status) return false;
      if (q) {
        const hay = [r.site.id, r.site.kode, r.site.kunde, r.site.navn, r.site.installation, r.site.adresse].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => {
      const av = a.nextDate ? a.nextDate.getTime() : Infinity, bv = b.nextDate ? b.nextDate.getTime() : Infinity;
      return av - bv;
    });

    $('#efListWrap').style.display = view === 'liste' ? '' : 'none';
    $('#efCalWrap').style.display = view === 'kalender' ? '' : 'none';

    if (view === 'liste') {
      $('#efRows').innerHTML = rows.map(r => {
        const s = r.site;
        const opg = opgaveFor(s);
        const iso = r.nextDate ? r.nextDate.getFullYear() + '-' + String(r.nextDate.getMonth() + 1).padStart(2, '0') + '-' + String(r.nextDate.getDate()).padStart(2, '0') : '';
        return `<tr class="click" data-site="${h(s.id)}" tabindex="0">
          <td><b>${h(s.kunde)}</b><br><span class="muted">${h(siteLabel(s))}</span></td>
          <td>${h(s.adresse) || '–'}${s.postnr ? ', ' + h(s.postnr) + ' ' + h(s.by) : ''}</td>
          <td>${h(s.installation) || '–'}</td>
          <td>${h(s.serviceaftale) || '–'}</td>
          <td>${h(s.ul) || '–'}</td>
          <td>${ddmm(s.sidsteEftersyn)}</td>
          <td>${iso ? ddmm(iso) : '–'}</td>
          <td>${s.interval ? s.interval + ' mdr.' : '–'}</td>
          <td><span class="st ${r.cls}">${h(r.label)}</span></td>
          <td>${h(opg ? opg.id : (s.casEftersyn || '–'))}</td>
          <td class="actions">
            ${!opg ? `<button class="tlink" data-act="opret" data-id="${h(s.id)}">Opret eftersynsopgave</button>` : ''}
            <button class="tlink" data-act="udfoert" data-id="${h(s.id)}">Marker udført</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="11" class="empty">Ingen sites matcher filteret.</td></tr>';
    } else {
      // kalender – 12 måneder frem
      const months = [];
      for (let i = 0; i < 12; i++) {
        const d = new Date(t.getFullYear(), t.getMonth() + i, 1);
        months.push({ y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' }), items: [] });
      }
      const overdue = [];
      rows.forEach(r => {
        if (!r.nextDate) return;
        if (r.status === 'over') { overdue.push(r); return; }
        const y = r.nextDate.getFullYear(), m = r.nextDate.getMonth();
        const bucket = months.find(mo => mo.y === y && mo.m === m);
        if (bucket) bucket.items.push(r);
      });
      const cardHtml = (title, items, over) => `
        <div class="card${over ? ' overdue' : ''}">
          <div class="card-body">
            <h3>${h(title)}</h3>
            <div class="count">${items.length}</div>
            <ul>${items.map(r => `<li data-site="${h(r.site.id)}" tabindex="0" style="cursor:pointer"><b>${h(r.site.kunde)}</b><br><span class="muted">${h(siteLabel(r.site, true))}</span></li>`).join('') || '<li class="muted">Ingen eftersyn</li>'}</ul>
          </div>
        </div>`;
      $('#efCalWrap').innerHTML = `<div class="ef-cal">${cardHtml('Overskredet', overdue, true)}${months.map(mo => cardHtml(mo.label, mo.items, false)).join('')}</div>`;
    }
  },
});

</script>
<script>
// Rapporter. Erstatter "Salg"-arket (omsætning pr. måned) og UL Q1-Q4-kolonnerne i kundekartoteket.
// Alle diagrammer er inline SVG genereret i JS – ingen eksterne biblioteker.
(function () {
  const MONTH_ABBR = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  const COL_NOVO = 'var(--sec-navy-blue)';
  const COL_GEN = 'var(--sec-purple)';
  const COL_GOOD = 'var(--sec-navy-blue)';
  const COL_WARN = 'var(--ui-blue-500)';
  const COL_BAD = 'var(--ui-red-500)';
  const CAT_COLORS = ['var(--sec-navy-blue)', 'var(--sec-purple)', 'var(--ui-blue-500)', 'var(--ui-purple-200)', 'var(--ui-blue-300)', 'var(--ui-grey-700)'];
  const COL_OTHER = 'var(--ui-grey-500)';

  // ---------- dato/periode-helpers ----------
  const monthKey = d => (d || '').slice(0, 7);
  const monthLabel = ym => { const [y, m] = ym.split('-'); return MONTH_ABBR[(+m || 1) - 1] + ' ' + y.slice(2); };
  const addMonths = (ym, delta) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + delta, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const qtrOf = ym => { const [y, m] = ym.split('-'); return y + ' K' + Math.ceil((+m) / 3); };
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

  function periodMonths(periode) {
    if (periode === '2025') return Array.from({ length: 12 }, (_, i) => '2025-' + String(i + 1).padStart(2, '0'));
    if (periode === '2026') return Array.from({ length: 12 }, (_, i) => '2026-' + String(i + 1).padStart(2, '0'));
    const cur = App.today().slice(0, 7);
    const arr = []; for (let i = 11; i >= 0; i--) arr.push(addMonths(cur, -i));
    return arr;
  }
  const periodLabel = p => p === '2025' ? '2025' : p === '2026' ? '2026' : 'Seneste 12 måneder';

  // ---------- talformat ----------
  const krShort = v => {
    const av = Math.abs(v || 0);
    if (av >= 1e6) return App.n((v / 1e6).toFixed(1)) + ' mio.';
    if (av >= 1000) return App.n(Math.round(v / 1000)) + ' t.';
    return App.n(Math.round(v || 0));
  };
  const niceCeil = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f0 = v / p; const f = f0 <= 1 ? 1 : f0 <= 2 ? 2 : f0 <= 5 ? 5 : 10; return f * p; };

  // ---------- SVG-byggeklodser ----------
  function svgWrap(w, h, title, inner) {
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;height:auto" role="img"><title>${App.h(title)}</title>${inner}</svg>`;
  }

  // Lodrette søjler, evt. stablet, en eller to serier (måneder/kvartaler på x-aksen)
  function barsChart(data, seriesDefs, { title, valueFmt = krShort, height = 260, stacked = true } = {}) {
    const W = Math.max(560, 46 + data.length * 54), H = height, ML = 56, MR = 12, MT = 16, MB = 42;
    const plotW = W - ML - MR, plotH = H - MT - MB;
    const gap = Math.max(6, Math.min(16, plotW / data.length * 0.22));
    const groupW = plotW / data.length;
    const bw = stacked ? groupW - gap : (groupW - gap) / seriesDefs.length;
    const maxStack = Math.max(1, ...data.map(d => stacked ? seriesDefs.reduce((a, s) => a + (d.values[s.key] || 0), 0) : Math.max(...seriesDefs.map(s => d.values[s.key] || 0))));
    const niceMax = niceCeil(maxStack);
    let grid = '', xlabels = '', bars = '';
    for (let i = 0; i <= 4; i++) {
      const v = niceMax / 4 * i, y = MT + plotH - (v / niceMax) * plotH;
      grid += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${ML + plotW}" y2="${y.toFixed(1)}" stroke="var(--ui-grey-300)" stroke-width="1"/>`;
      grid += `<text x="${ML - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">${valueFmt(v)}</text>`;
    }
    grid += `<line x1="${ML}" y1="${MT + plotH}" x2="${ML + plotW}" y2="${MT + plotH}" stroke="var(--ui-grey-400)" stroke-width="1"/>`;
    data.forEach((d, i) => {
      const gx = ML + i * groupW + gap / 2;
      xlabels += `<text x="${(gx + (groupW - gap) / 2).toFixed(1)}" y="${MT + plotH + 18}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${App.h(d.label)}</text>`;
      let yCursor = MT + plotH;
      seriesDefs.forEach((s, si) => {
        const v = d.values[s.key] || 0;
        const bh = (v / niceMax) * plotH;
        const x = stacked ? gx : gx + si * bw;
        const y = stacked ? yCursor - bh : MT + plotH - bh;
        if (v > 0) bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(0, bw - (stacked ? 0 : 2)).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${s.color}"><title>${App.h(d.label)} – ${App.h(s.label)}: ${App.kr(v)}</title></rect>`;
        if (stacked) yCursor -= bh + (bh > 0 ? 2 : 0);
      });
    });
    return svgWrap(W, H, title, grid + bars + xlabels);
  }

  // Vandrette søjler (fx DG pr. projekt) med referencelinje
  function hBarsChart(items, { title, refLine = 30, unit = ' %' } = {}) {
    const rowH = 24, ML = 190, MR = 56, MT = 12, MB = 26, W = 900;
    const H = MT + MB + items.length * rowH;
    const plotW = W - ML - MR;
    const vals = items.map(i => i.value);
    const domMin = Math.min(0, ...vals, refLine);
    const domMax = Math.max(refLine, ...vals, 0.001);
    const span = (domMax - domMin) || 1;
    const xScale = v => ML + ((v - domMin) / span) * plotW;
    const zeroX = xScale(0), refX = xScale(refLine);
    let bars = '', labels = '';
    items.forEach((it, i) => {
      const y = MT + i * rowH + 4;
      const x0 = xScale(Math.min(0, it.value)), x1 = xScale(Math.max(0, it.value));
      const color = it.value == null ? 'var(--ui-grey-400)' : it.value >= 30 ? COL_GOOD : it.value >= 15 ? COL_WARN : COL_BAD;
      bars += `<rect x="${x0.toFixed(1)}" y="${y}" width="${Math.max(0.5, x1 - x0).toFixed(1)}" height="${rowH - 8}" rx="2" fill="${color}"><title>${App.h(it.label)}: ${it.value == null ? '–' : App.pct(it.value)}</title></rect>`;
      labels += `<text x="${ML - 8}" y="${y + (rowH - 8) / 2 + 4}" text-anchor="end" font-size="12" fill="var(--text-primary)">${App.h(it.label)}</text>`;
      const vx = it.value >= 0 ? x1 + 6 : x1 - 6;
      labels += `<text x="${vx.toFixed(1)}" y="${y + (rowH - 8) / 2 + 4}" text-anchor="${it.value >= 0 ? 'start' : 'end'}" font-size="12" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">${it.value == null ? '–' : App.pct(it.value)}</text>`;
    });
    const ref = `<line x1="${refX.toFixed(1)}" y1="${MT - 4}" x2="${refX.toFixed(1)}" y2="${MT + items.length * rowH}" stroke="var(--ui-grey-700)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="${refX.toFixed(1)}" y="${MT - 6}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${refLine}${unit}</text>`;
    const zero = `<line x1="${zeroX.toFixed(1)}" y1="${MT - 4}" x2="${zeroX.toFixed(1)}" y2="${MT + items.length * rowH}" stroke="var(--ui-grey-400)" stroke-width="1"/>`;
    return svgWrap(W, H, title, zero + ref + bars + labels);
  }

  // Linjediagram – timer pr. måned, én linje pr. tekniker (op til 6 serier)
  function linesChart(months, series, { title, valueFmt = v => App.n(Math.round(v)) } = {}) {
    const W = Math.max(560, 46 + months.length * 54), H = 240, ML = 44, MR = 16, MT = 16, MB = 34;
    const plotW = W - ML - MR, plotH = H - MT - MB;
    const maxV = niceCeil(Math.max(1, ...series.flatMap(s => s.values)));
    const xStep = months.length > 1 ? plotW / (months.length - 1) : 0;
    let grid = '', xlabels = '';
    for (let i = 0; i <= 4; i++) {
      const v = maxV / 4 * i, y = MT + plotH - (v / maxV) * plotH;
      grid += `<line x1="${ML}" y1="${y.toFixed(1)}" x2="${ML + plotW}" y2="${y.toFixed(1)}" stroke="var(--ui-grey-300)" stroke-width="1"/>`;
      grid += `<text x="${ML - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">${valueFmt(v)}</text>`;
    }
    months.forEach((m, i) => { xlabels += `<text x="${(ML + i * xStep).toFixed(1)}" y="${MT + plotH + 18}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${monthLabel(m)}</text>`; });
    let paths = '';
    series.forEach(s => {
      let d = '', dots = '';
      s.values.forEach((v, i) => {
        const x = ML + i * xStep, y = MT + plotH - (v / maxV) * plotH;
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
        dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${s.color}"><title>${App.h(s.label)}, ${monthLabel(months[i])}: ${valueFmt(v)} t.</title></circle>`;
      });
      paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
    });
    return svgWrap(W, H, title, grid + paths + xlabels);
  }

  function legendHtml(items) {
    return `<div class="rap-legend">${items.map(it => `<span class="rap-lg"><i style="background:${it.color}"></i>${App.h(it.label)}</span>`).join('')}</div>`;
  }

  // ---------- rapport-datalogik ----------
  function afdOk(afd) { return !App.S.rapAfd || afd === App.S.rapAfd; }

  function revenueData(months) {
    const { S, calc } = App;
    const mode = S.rapMode || 'fakt';
    const idx = {}; months.forEach((m, i) => idx[m] = i);
    const data = months.map(m => ({ label: monthLabel(m), values: { Novo: 0, Generel: 0 } }));
    S.projekter.forEach(p => {
      if (!afdOk(p.afdeling)) return;
      if (mode === 'fakt') {
        (p.fakturering || []).forEach(f => {
          if (f.status !== 'Faktureret') return;
          const i = idx[monthKey(f.dato)];
          if (i != null && data[i].values[p.afdeling] != null) data[i].values[p.afdeling] += (+f.beloeb || 0);
        });
      } else {
        const i = idx[p.maaned];
        if (i != null && data[i].values[p.afdeling] != null) data[i].values[p.afdeling] += calc(p).salg;
      }
    });
    return data;
  }

  function dgData(months) {
    const { S, calc, emp } = App;
    const projs = S.projekter.filter(p => afdOk(p.afdeling) && months.includes(p.maaned));
    const items = projs.map(p => ({ id: p.id, label: p.id, pm: p.pm, value: calc(p).dgF }))
      .sort((a, b) => (b.value ?? -999) - (a.value ?? -999));
    const byPm = {};
    projs.forEach(p => {
      const c = calc(p);
      const row = byPm[p.pm] || (byPm[p.pm] = { pm: p.pm, navn: emp(p.pm).navn, n: 0, salg: 0, udg: 0, dgSum: 0, dgN: 0 });
      row.n++; row.salg += c.salg; row.udg += c.udg;
      if (c.dgF != null) { row.dgSum += c.dgF; row.dgN++; }
    });
    return { items, byPm: Object.values(byPm).sort((a, b) => b.salg - a.salg) };
  }

  function techData(months) {
    const { S, emp } = App;
    const from30 = daysAgo(30), today = App.today();
    const techs = (S.medarbejdere || App.D.medarbejdere).filter(m => m.rolle === 'Tekniker' && afdOk(m.afdeling));
    const rows = techs.map(t => {
      const openCases = S.serviceopgaver.filter(c => c.tekniker === t.id && c.status === 'Åben').length;
      const projSet = new Set();
      S.tid.filter(r => r.tekniker === t.id && r.dato >= from30 && r.dato <= today).forEach(r => { if (S.projekter.some(p => p.id === r.sag)) projSet.add(r.sag); });
      return { id: t.id, navn: t.navn, openCases, projekter: projSet.size };
    });
    const idx = {}; months.forEach((m, i) => idx[m] = i);
    const series = techs.map((t, i) => ({
      key: t.id, label: t.navn, color: CAT_COLORS[i % CAT_COLORS.length],
      values: months.map(() => 0),
    }));
    // intern tid (ferie, sygdom, kursus m.m.) tælles aldrig med i sagstimerne pr. tekniker,
    // men vises som sin egen serie, så månedens samlede fravær stadig kan aflæses.
    const internSeries = { key: '__intern', label: 'Intern tid', color: 'var(--ui-grey-700)', values: months.map(() => 0) };
    S.tid.forEach(r => {
      const i = idx[monthKey(r.dato)];
      if (i == null) return;
      const timer = (+r.timer || 0) + (+r.ot1 || 0) + (+r.ot2 || 0);
      if (App.isIntern(r)) { internSeries.values[i] += timer; return; }
      const s = series.find(s => s.key === r.tekniker);
      if (s) s.values[i] += timer;
    });
    series.push(internSeries);
    return { rows, series };
  }

  function ulData(months) {
    const { S } = App;
    const quarters = [];
    months.forEach(m => { const q = qtrOf(m); if (!quarters.includes(q)) quarters.push(q); });
    const byQL = {}; // kvartal -> leverandoer -> sum
    const byL = {}; // leverandoer -> total
    const monthSet = new Set(months);
    S.projekter.forEach(p => {
      if (!afdOk(p.afdeling)) return;
      (p.udgifter || []).forEach(u => {
        const lev = (u.leverandoer || '').trim();
        if (!lev || lev === 'Securitas') return;
        const mk = monthKey(u.dato);
        if (!monthSet.has(mk)) return;
        const q = qtrOf(mk);
        (byQL[q] || (byQL[q] = {}))[lev] = (byQL[q][lev] || 0) + (+u.beloeb || 0);
        byL[lev] = (byL[lev] || 0) + (+u.beloeb || 0);
      });
    });
    const topSuppliers = Object.entries(byL).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    const shown = topSuppliers.slice(0, 6);
    const rest = topSuppliers.slice(6);
    const data = quarters.map(q => {
      const values = {};
      shown.forEach(l => values[l] = (byQL[q] || {})[l] || 0);
      if (rest.length) values['Andre'] = rest.reduce((a, l) => a + ((byQL[q] || {})[l] || 0), 0);
      return { label: q, values };
    });
    const seriesDefs = shown.map((l, i) => ({ key: l, label: l, color: CAT_COLORS[i % CAT_COLORS.length] }));
    if (rest.length) seriesDefs.push({ key: 'Andre', label: 'Andre', color: COL_OTHER });
    const table = topSuppliers.map(l => ({ leverandoer: l, total: byL[l] }));
    return { quarters, data, seriesDefs, table };
  }

  // ---------- side ----------
  App.registerPage({
    id: 'rapporter', label: 'Rapporter', group: 'Rapporter', icon: 'screen', order: 70,
    roles: ['Chef', 'PM', 'Fakturering'],
    html: `
    <div class="page-head">
      <div>
        <h1>Rapporter</h1>
        <p>Omsætning, dækningsgrad, teknikerbelastning og UL-forbrug samlet ét sted. Periode og afdeling styrer alle fire rapporter.</p>
      </div>
      <div class="replaces">Erstatter <b>Salg</b>-arket og <b>UL Q1-Q4</b>-kolonnerne i kundekartoteket</div>
    </div>
    <div class="rap-toolbar">
      <div class="grp">
        <span class="lbl">Periode</span>
        <div class="ftabs" id="rapPeriode" role="group" aria-label="Periode">
          <button class="ftab" data-v="2025">2025</button>
          <button class="ftab" data-v="2026">2026</button>
          <button class="ftab" data-v="last12">Seneste 12 mdr.</button>
        </div>
      </div>
      <div class="grp">
        <span class="lbl">Afdeling</span>
        <div class="ftabs" id="rapAfd" role="group" aria-label="Afdeling">
          <button class="ftab" data-v="">Alle</button>
          <button class="ftab" data-v="Novo">Novo</button>
          <button class="ftab" data-v="Generel">Generel</button>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="rapExport"><svg class="ico s"><use href="#i-export"/></svg>Eksportér til Excel</button>
    </div>

    <div class="card rap-card">
      <div class="card-body">

        </div>
        <div class="rap-chart" id="rapRevChart" style="margin-top:var(--space-4)"></div>
        ${legendHtml([{ label: 'Novo', color: COL_NOVO }, { label: 'Generel', color: COL_GEN }])}
        <div class="table-wrap"><table><thead><tr><th>Måned</th><th class="num">Novo</th><th class="num">Generel</th><th class="num">I alt</th></tr></thead><tbody id="rapRevTable"></tbody></table></div>
      </div>
    </div>

    <div class="card rap-card">
      <div class="card-body">
        <h2>Dækningsgrad pr. projekt og pr. PM</h2>
        <p class="rap-sub">DG faktisk (salg minus udgifter), sorteret. Stiplet linje viser 30 % målsætning.</p>
        <div class="rap-grid2">

          <div class="table-wrap"><table><thead><tr><th>PM</th><th class="num">Projekter</th><th class="num">Salg</th><th class="num">Udgifter</th><th class="num">DG snit</th></tr></thead><tbody id="rapDgTable"></tbody></table></div>

    <div class="card rap-card">
      <div class="card-body">
        <h2>Åbne sager pr. tekniker</h2>
        <p class="rap-sub">Åbne serviceopgaver og projekter med timer registreret de seneste 30 dage, samt timer pr. måned.</p>
        <div class="table-wrap"><table><thead><tr><th>Tekniker</th><th class="num">Åbne serviceopgaver</th><th class="num">Projekter m. timer (30 dage)</th></tr></thead><tbody id="rapTechTable"></tbody></table></div>
        <h3 style="margin-top:var(--space-5)">Timer pr. måned</h3>

    <div class="card rap-card">
      <div class="card-body">
        <h2>UL-udgifter pr. kvartal</h2>

        <div class="rap-chart" id="rapUlChart"></div>
        <div id="rapUlLegend"></div>
        <div class="table-wrap"><table><thead><tr><th>Leverandør</th><th class="num">I alt i perioden</th></tr></thead><tbody id="rapUlTable"></tbody></table></div>
      </div>
    </div>
  `,
    init() {
      const { $, $$, S, save, toast } = App;
      if (!S.rapPeriode) S.rapPeriode = 'last12';
      if (S.rapAfd == null) S.rapAfd = '';
      if (!S.rapMode) S.rapMode = 'fakt';
      $$('#rapPeriode .ftab').forEach(b => b.addEventListener('click', () => { S.rapPeriode = b.dataset.v; save(); this.render(); }));
      $$('#rapAfd .ftab').forEach(b => b.addEventListener('click', () => { S.rapAfd = b.dataset.v; save(); this.render(); }));
      $$('#rapMode .ftab').forEach(b => b.addEventListener('click', () => { S.rapMode = b.dataset.v; save(); this.render(); }));
      $('#rapExport').addEventListener('click', () => toast('Kun i den færdige løsning: her downloades rapporten som Excel-fil'));
    },
    render() {
      const { $, $$, S, kr, pct, h, emp } = App;
      $$('#rapPeriode .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === S.rapPeriode));
      $$('#rapAfd .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === (S.rapAfd || '')));
      $$('#rapMode .ftab').forEach(b => b.classList.toggle('on', b.dataset.v === (S.rapMode || 'fakt')));

      const months = periodMonths(S.rapPeriode);
      $('#rapRevSub').textContent = `Periode: ${periodLabel(S.rapPeriode)} · Afdeling: ${S.rapAfd || 'Alle'}`;

      // 1) Omsætning pr. måned
      const rev = revenueData(months);
      $('#rapRevChart').innerHTML = barsChart(rev, [{ key: 'Novo', label: 'Novo', color: COL_NOVO }, { key: 'Generel', label: 'Generel', color: COL_GEN }], { title: 'Omsætning pr. måned, Novo og Generel' });
      $('#rapRevTable').innerHTML = rev.map(d => `<tr><td>${h(d.label)}</td><td class="num">${kr(d.values.Novo)}</td><td class="num">${kr(d.values.Generel)}</td><td class="num">${kr(d.values.Novo + d.values.Generel)}</td></tr>`).join('')
        || '<tr><td colspan="4" class="empty">Ingen data i perioden.</td></tr>';

      // 2) DG pr. projekt / pr. PM
      const dg = dgData(months);
      $('#rapDgChart').innerHTML = dg.items.length
        ? hBarsChart(dg.items, { title: 'Dækningsgrad faktisk pr. projekt' })
        : '<p class="empty">Ingen projekter i perioden.</p>';
      $('#rapDgTable').innerHTML = dg.byPm.map(r => `<tr><td>${h(r.navn)}</td><td class="num">${r.n}</td><td class="num">${kr(r.salg)}</td><td class="num">${kr(r.udg)}</td><td class="num">${r.dgN ? pct(r.dgSum / r.dgN) : '–'}</td></tr>`).join('')
        || '<tr><td colspan="5" class="empty">Ingen projekter i perioden.</td></tr>';

      // 3) Åbne sager pr. tekniker
      const tech = techData(months);
      $('#rapTechTable').innerHTML = tech.rows.map(r => `<tr><td>${h(r.navn)}</td><td class="num">${r.openCases}</td><td class="num">${r.projekter}</td></tr>`).join('')
        || '<tr><td colspan="3" class="empty">Ingen teknikere i den valgte afdeling.</td></tr>';
      if (tech.series.length && tech.series.some(s => s.values.some(v => v > 0))) {
        $('#rapTechChart').innerHTML = linesChart(months, tech.series, { title: 'Timer pr. måned pr. tekniker', valueFmt: v => App.n(Math.round(v)) });
        $('#rapTechLegend').innerHTML = legendHtml(tech.series.map(s => ({ label: s.label, color: s.color })));
      } else {
        $('#rapTechChart').innerHTML = '<p class="empty">Ingen timeregistreringer i perioden.</p>';
        $('#rapTechLegend').innerHTML = '';
      }

      // 4) UL-udgifter pr. kvartal
      const ul = ulData(months);
      if (ul.data.length && ul.seriesDefs.length) {
        $('#rapUlChart').innerHTML = barsChart(ul.data, ul.seriesDefs, { title: 'UL-udgifter pr. kvartal og leverandør' });
        $('#rapUlLegend').innerHTML = legendHtml(ul.seriesDefs.map(s => ({ label: s.label, color: s.color })));
      } else {
        $('#rapUlChart').innerHTML = '<p class="empty">Ingen udgifter til underleverandører i perioden.</p>';
        $('#rapUlLegend').innerHTML = '';
      }
      $('#rapUlTable').innerHTML = ul.table.map(r => `<tr><td>${h(r.leverandoer)}</td><td class="num">${kr(r.total)}</td></tr>`).join('')
        || '<tr><td colspan="2" class="empty">Ingen udgifter til underleverandører i perioden.</td></tr>';
    },
  });
})();

</script>
<script>
// Feedback: knap på alle skærme -> screenshot -> markering -> kommentar -> Supabase.
// Kræver window.PROTO_CONFIG = { supabaseUrl, supabaseKey }. Uden config vises intet (fx i Artifact-udgaven).
(function () {
  const CFG = window.PROTO_CONFIG || {};
  const ENABLED = !!(CFG.supabaseUrl && CFG.supabaseKey);
  const BUCKET = 'prototype-screenshots';
  const TYPES = ['Fejl', 'Forslag', 'Spørgsmål', 'Ros'];
  const STATUS = { ny: 'Ny', set: 'Set', planlagt: 'Planlagt', 'løst': 'Løst' };
  const H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  const api = (path, opts = {}) => fetch(CFG.supabaseUrl + path, {
    ...opts, headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, ...(opts.headers || {}) },
  });
  const shotUrl = p => `${CFG.supabaseUrl}/storage/v1/object/public/${BUCKET}/${p}`;
  const fmt = iso => { const d = new Date(iso); return d.toLocaleDateString('da-DK', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + d.toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }); };
  let h2cPromise = null;
  const loadH2C = () => h2cPromise || (h2cPromise = new Promise((res, rej) => {
    if (window.html2canvas) return res(window.html2canvas);
    const s = document.createElement('script'); s.src = H2C; s.onload = () => res(window.html2canvas); s.onerror = () => rej(new Error('html2canvas')); document.head.appendChild(s);
  }));

  // ---------- Feedback-siden (liste) ----------
  App.registerPage({
    id: 'feedback', label: 'Feedback', group: 'Rapporter', icon: 'chat', order: 90,
    html: `
      <div class="page-head">
        <div>
          <h1>Feedback fra teamet</h1>
          <p>Alt, der er sendt via knappen "Giv feedback". Status opdateres, når punkterne er behandlet, så I kan følge med i, hvad der sker.</p>
        </div>
        <div class="replaces">Skærmbillede, markering og kommentar gemmes centralt</div>
      </div>
      <div class="stats" id="fbStats"></div>
      <div class="card">
        <div class="toolbar">
          <div class="ftabs" id="fbStatus" role="group" aria-label="Status">
            <button class="ftab on" data-v="">Alle</button><button class="ftab" data-v="ny">Ny</button><button class="ftab" data-v="set">Set</button><button class="ftab" data-v="planlagt">Planlagt</button><button class="ftab" data-v="løst">Løst</button>
          </div>
          <label class="field">Type <select id="fbType"><option value="">Alle</option>${TYPES.map(t => `<option>${t}</option>`).join('')}</select></label>
          <span class="spacer"></span>
          <button class="btn" id="fbReload">Opdatér</button>
        </div>
        <div id="fbList" class="fb-list"></div>
      </div>
      <div class="modal-bg" id="modalShot">
        <div class="modal" style="width:min(1200px,100%)" role="dialog" aria-label="Skærmbillede">
          <header><h2 id="shotTitle">Skærmbillede</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
          <div class="body"><img id="shotImg" alt="Skærmbillede fra feedback" style="max-width:100%; border:1px solid var(--border-default); border-radius:6px"></div>
        </div>
      </div>
    `,
    init() {
      const { $, $$ } = App;
      this.filter = ''; this.rows = null;
      $$('#fbStatus .ftab').forEach(b => b.addEventListener('click', () => { this.filter = b.dataset.v; $$('#fbStatus .ftab').forEach(x => x.classList.toggle('on', x === b)); this.draw(); }));
      $('#fbType').addEventListener('change', () => this.draw());
      $('#fbReload').addEventListener('click', () => this.render(true));
    },
    async render(force) {
      const { $ } = App;
      if (!ENABLED) { $('#fbList').innerHTML = '<div class="empty">Feedback er kun aktiv på den delte testadresse.</div>'; $('#fbStats').innerHTML = ''; return; }
      if (!this.rows || force) {
        $('#fbList').innerHTML = '<div class="empty">Henter feedback…</div>';
        try {
          const r = await api('/rest/v1/prototype_feedback?select=*&order=created_at.desc');
          if (!r.ok) throw new Error(r.status);
          this.rows = await r.json();
        } catch (e) { $('#fbList').innerHTML = '<div class="empty">Kunne ikke hente feedback. Prøv igen om lidt.</div>'; return; }
      }
      this.draw();
    },
    draw() {
      const { $, $$, h } = App;
      const rows = (this.rows || []).filter(r => (!this.filter || r.status === this.filter) && (!$('#fbType').value || r.type === $('#fbType').value));
      const all = this.rows || [];
      $('#fbStats').innerHTML = [['I alt', all.length], ['Nye', all.filter(r => r.status === 'ny').length], ['Planlagt', all.filter(r => r.status === 'planlagt').length], ['Løst', all.filter(r => r.status === 'løst').length]]
        .map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');
      $('#fbList').innerHTML = rows.map(r => `
        <article class="fb-item">
          ${r.screenshot_path ? `<button class="fb-thumb" data-shot="${h(r.screenshot_path)}" aria-label="Vis skærmbillede"><img src="${shotUrl(r.screenshot_path)}" alt="" loading="lazy"></button>` : '<div class="fb-thumb fb-noshot muted caption">Uden skærmbillede</div>'}
          <div class="fb-body">
            <div class="fb-meta"><b>${h(r.navn)}</b><span class="muted">${h(r.rolle || '')}</span><span class="muted">${fmt(r.created_at)}</span><span class="muted">${h(r.skaerm || '')}</span></div>
            <div class="fb-tags"><span class="st nodot"><b>${h(r.type)}</b></span><span class="st ${{ ny: 'aaben', set: 'udf', planlagt: 'klar', 'løst': 'fakt' }[r.status] || ''}">${STATUS[r.status] || h(r.status)}</span></div>
            <p>${h(r.kommentar)}</p>
            ${r.svar ? `<p class="fb-svar"><b>Svar:</b> ${h(r.svar)}</p>` : ''}
          </div>
        </article>`).join('') || '<div class="empty">Ingen feedback endnu. Brug knappen "Giv feedback" nederst til højre.</div>';
      $$('[data-shot]').forEach(b => b.addEventListener('click', () => { $('#shotImg').src = shotUrl(b.dataset.shot); App.openModal('modalShot'); }));
    },
  });

  if (!ENABLED) return;

  // ---------- Widget ----------
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <button class="btn cta fb-btn" id="fbOpen"><svg class="ico s"><use href="#i-chat"/></svg>Giv feedback</button>
    <div class="fb-overlay" id="fbOverlay" hidden>
      <div class="fb-stage">
        <div class="fb-tools">
          <span class="fb-title">Markér det, du taler om</span>
          <div class="ftabs">
            <button class="ftab on" data-tool="rect">Ramme</button>
            <button class="ftab" data-tool="arrow">Pil</button>
            <button class="ftab" data-tool="pen">Frihånd</button>
          </div>
          <button class="tlink" id="fbUndo">Fortryd</button>
          <button class="tlink" id="fbNoShot">Send uden skærmbillede</button>
        </div>
        <div class="fb-canvas-wrap"><canvas id="fbCanvas"></canvas></div>
      </div>
      <form class="fb-form" id="fbForm" novalidate>
        <h2>Feedback</h2>
        <label class="field">Dit navn<input type="text" id="fbName" maxlength="80" autocomplete="name"></label>
        <label class="field">Type<select id="fbKind">${TYPES.map(t => `<option>${t}</option>`).join('')}</select></label>
        <label class="field">Kommentar<textarea id="fbText" rows="6" maxlength="4000" placeholder="Hvad så du, og hvad forventede du?"></textarea></label>
        <p class="caption muted" id="fbCtx"></p>
        <div class="fb-actions">
          <button class="btn cta" type="submit" id="fbSend">Send feedback</button>
          <button class="btn" type="button" id="fbCancel">Annullér</button>
        </div>
        <p class="caption muted">Skærmnavn, rolle og skærmstørrelse sendes med automatisk.</p>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  const $ = s => document.querySelector(s);
  const overlay = $('#fbOverlay'), canvas = $('#fbCanvas'), ctx = canvas.getContext('2d');
  let base = null, shapes = [], tool = 'rect', drawing = null, withShot = true;
  const PURPLE = '#8D5FFF';

  const redraw = () => {
    if (!base) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(base, 0, 0);
    ctx.lineWidth = 4; ctx.strokeStyle = PURPLE; ctx.fillStyle = PURPLE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    [...shapes, drawing].filter(Boolean).forEach(s => {
      if (s.t === 'rect') { ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1); }
      else if (s.t === 'arrow') {
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
        const a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1), L = 18;
        ctx.beginPath(); ctx.moveTo(s.x2, s.y2); ctx.lineTo(s.x2 - L * Math.cos(a - 0.5), s.y2 - L * Math.sin(a - 0.5)); ctx.lineTo(s.x2 - L * Math.cos(a + 0.5), s.y2 - L * Math.sin(a + 0.5)); ctx.closePath(); ctx.fill();
      } else if (s.t === 'pen') { ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
    });
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: (p.clientX - r.left) * canvas.width / r.width, y: (p.clientY - r.top) * canvas.height / r.height }; };
  const start = e => { if (!base) return; e.preventDefault(); const p = pos(e); drawing = tool === 'pen' ? { t: 'pen', pts: [p] } : { t: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y }; };
  const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); if (drawing.t === 'pen') drawing.pts.push(p); else { drawing.x2 = p.x; drawing.y2 = p.y; } redraw(); };
  const end = () => { if (drawing) { shapes.push(drawing); drawing = null; redraw(); } };
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
  document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => { tool = b.dataset.tool; document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x === b)); }));
  $('#fbUndo').addEventListener('click', () => { shapes.pop(); redraw(); });
  $('#fbNoShot').addEventListener('click', () => { withShot = false; overlay.classList.add('noshot'); });

  const context = () => {
    const page = document.querySelector('.page.active'); const title = page?.querySelector('h1')?.textContent || page?.id?.replace('page-', '') || '';
    return { skaerm: title, rolle: `${App.emp(App.S.user).navn} (${App.role()})`, viewport: `${innerWidth}×${innerHeight}` };
  };
  const open = async () => {
    shapes = []; drawing = null; withShot = true; base = null; overlay.classList.remove('noshot');
    $('#fbName').value = localStorage.getItem('proto-fb-name') || '';
    $('#fbText').value = '';
    const c = context(); $('#fbCtx').textContent = `Skærm: ${c.skaerm} · Rolle: ${c.rolle} · ${c.viewport}`;
    $('#fbOpen').hidden = true;
    try {
      const h2c = await loadH2C();
      const shot = await h2c(document.body, { scale: Math.min(1.5, devicePixelRatio || 1), useCORS: true, logging: false, x: scrollX, y: scrollY, width: innerWidth, height: innerHeight, windowWidth: innerWidth, windowHeight: innerHeight, ignoreElements: el => el.classList && (el.classList.contains('fb-btn') || el.classList.contains('fb-overlay')) });
      base = shot; canvas.width = shot.width; canvas.height = shot.height; redraw();
    } catch (e) { withShot = false; overlay.classList.add('noshot'); App.toast('Skærmbillede kunne ikke tages her. Du kan stadig sende en kommentar.'); }
    overlay.hidden = false; ($('#fbName').value ? $('#fbText') : $('#fbName')).focus();
  };
  const close = () => { overlay.hidden = true; $('#fbOpen').hidden = false; };
  $('#fbOpen').addEventListener('click', open);
  $('#fbCancel').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) close(); });

  $('#fbForm').addEventListener('submit', async e => {
    e.preventDefault();
    const navn = $('#fbName').value.trim(), kommentar = $('#fbText').value.trim();
    if (!navn) { App.toast('Skriv dit navn, så vi ved hvem der giver feedback'); return $('#fbName').focus(); }
    if (!kommentar) { App.toast('Skriv en kommentar, før du sender'); return $('#fbText').focus(); }
    localStorage.setItem('proto-fb-name', navn);
    const btn = $('#fbSend'); btn.disabled = true; btn.textContent = 'Sender…';
    try {
      let screenshot_path = null;
      if (withShot && base) {
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
        screenshot_path = `${new Date().toISOString().slice(0, 10)}/${crypto.randomUUID()}.jpg`;
        const up = await api(`/storage/v1/object/${BUCKET}/${screenshot_path}`, { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }, body: blob });
        if (!up.ok) { screenshot_path = null; App.toast('Skærmbilledet kunne ikke gemmes. Kommentaren sendes uden.'); }
      }
      const c = context();
      const ins = await api('/rest/v1/prototype_feedback', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ navn, rolle: c.rolle, skaerm: c.skaerm, viewport: c.viewport, type: $('#fbKind').value, kommentar, screenshot_path, user_agent: navigator.userAgent.slice(0, 200) }) });
      if (!ins.ok) throw new Error('insert ' + ins.status);
      close(); App.toast('Tak. Din feedback er sendt og kan ses under Feedback i menuen.');
      const p = App.getPage('feedback'); if (p) p.rows = null;
    } catch (err) {
      App.toast('Feedback kunne ikke sendes. Tjek forbindelsen og prøv igen.');
    } finally { btn.disabled = false; btn.textContent = 'Send feedback'; }
  });
})();

</script>
<script>

// Bruger window.PROTO_CONFIG.passwordHash (SHA-256 hex). Uden hash vises ingen adgangskode.
(function () {
  const CFG = window.PROTO_CONFIG || {};
  const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');

        <ul class="gate-list">
          <li><b>Skift rolle</b> nederst i menuen for at se skærmene som chef, projektleder, tekniker eller fakturering.</li>
          <li><b>Nulstil demo-data</b> samme sted, hvis du vil starte forfra.</li>
          <li><b>Giv feedback</b> med knappen nederst til højre. Tag et skærmbillede, markér det du taler om, og skriv en kommentar. Alle indsendte punkter kan ses under Feedback i menuen.</li>
          <li>Knapper der viser beskeden "Kun i den færdige løsning", er med for at vise flowet, ikke fordi noget er gået i stykker.</li>
        </ul>
        <button class="btn cta" id="welcomeOk" type="button">Start</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  const $ = s => document.querySelector(s);
  const showWelcome = () => {
    if (localStorage.getItem('proto-welcome-seen')) return;
    $('#welcome').hidden = false; $('#welcomeOk').focus();
    $('#welcomeOk').addEventListener('click', () => { localStorage.setItem('proto-welcome-seen', '1'); $('#welcome').hidden = true; });
  };
  if (!CFG.passwordHash || !crypto.subtle) { showWelcome(); return; }
  if (localStorage.getItem('proto-gate') === CFG.passwordHash) { showWelcome(); return; }
  document.documentElement.classList.add('gated');
  $('#gate').hidden = false; setTimeout(() => $('#gatePw').focus(), 50);
  $('#gateForm').addEventListener('submit', async e => {
    e.preventDefault();
    const ok = (await sha($('#gatePw').value.trim().toLowerCase())) === CFG.passwordHash;
    if (!ok) { $('#gateErr').hidden = false; $('#gatePw').select(); return; }
    localStorage.setItem('proto-gate', CFG.passwordHash);
    $('#gate').hidden = true; document.documentElement.classList.remove('gated'); showWelcome();
  });
})();

</script>
<script>
// Kontering pr. tekniker og måned. Erstatter Kontering af timer i Opgavestyring-filen og
// Jobstyrings "Kontering af tekniker": vælg tekniker og måned, se en grupperet linje pr. sag
// (og pr. intern kategori) med Business Central-felterne klar til bogføring.
(function () {
  // ---------- opslag ----------
  // Finder kunde, site, beskrivelse og BC-felter for en sag (projekt, delopgave eller serviceopgave/CAS).
  function resolveCase(sagId) {
    const { proj, site, bc, siteLabel } = App;
    const p = proj(sagId);
    if (p) {
      const s = site(p.siteId), m = bc(p.stedNr);
      return {
        kunde: s.kunde || '', site: siteLabel(s), beskrivelse: p.navn || '',
        stedNr: p.stedNr || '', costcenter: m ? `${m.costcenter} – ${m.costcenterNavn}` : '',
        tos: m ? `${m.tos} – ${m.tosNavn}` : '', account: m ? m.account : '', cepSite: s.id || '',
      };
    }
    const o = (App.S.serviceopgaver || []).find(x => x.id === sagId);
    if (o) {
      const s = site(o.siteId), m = bc(s.stedNr);
      return {
        kunde: s.kunde || '', site: siteLabel(s), beskrivelse: o.beskrivelse || '',
        stedNr: s.stedNr || '', costcenter: m ? `${m.costcenter} – ${m.costcenterNavn}` : '',
        tos: m ? `${m.tos} – ${m.tosNavn}` : '', account: m ? m.account : '', cepSite: s.id || '',
      };
    }
    return { kunde: '', site: '', beskrivelse: '', stedNr: '', costcenter: '', tos: '', account: '', cepSite: '' };
  }

  // Grupperer en teknikers tidsposter i en given måned pr. sag (eller pr. intern kategori).
  function groupData(tech, month) {
    const rows = (App.S.tid || []).filter(t => t.tekniker === tech && (t.dato || '').slice(0, 7) === month);
    const groups = new Map();
    rows.forEach(t => {
      const intern = App.isIntern(t);
      const key = intern ? 'intern:' + t.kategori : 'sag:' + t.sag;
      let g = groups.get(key);
      if (!g) {
        g = intern
          ? { key, intern: true, label: `Intern · ${t.kategori}`, kunde: 'Securitas A/S', site: '', beskrivelse: t.kategori, stedNr: '', costcenter: '', tos: '', account: '', cepSite: '' }
          : { key, intern: false, label: t.sag, ...resolveCase(t.sag) };
        g.timer = 0; g.ot1 = 0; g.ot2 = 0; g.koersel = 0; g.days = [];
        groups.set(key, g);
      }
      g.timer += +t.timer || 0; g.ot1 += +t.ot1 || 0; g.ot2 += +t.ot2 || 0; g.koersel += +t.koersel || 0;
      g.days.push(t);
    });
    return [...groups.values()].sort((a, b) => {
      if (a.intern !== b.intern) return a.intern ? 1 : -1;
      return a.label.localeCompare(b.label, 'da');
    });
  }

  App.registerPage({
    id: 'kontering', label: 'Kontering', group: 'Økonomi', icon: 'time', order: 52,
    roles: ['Chef', 'PM', 'Fakturering', 'Tekniker'],
    html: `
    <div class="page-head">
      <div>
        <h1>Kontering</h1>
        <p>Kontering af en teknikers timer i en given måned – grupperet pr. sag, med kunde, site og de Business Central-felter der skal bruges ved bogføring.</p>
      </div>
      <div class="replaces">Erstatter <b>Kontering af timer</b> i Opgavestyring-filen og Jobstyrings <b>Kontering af tekniker</b></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <label class="field">Tekniker <select id="konTekniker"></select></label>
        <label class="field">Måned <select id="konMaaned"></select></label>
        <span class="spacer"></span>
        <button class="btn" id="konPdf"><svg class="ico s"><use href="#i-download"/></svg>Gem som PDF</button>
        <button class="btn" id="konCsv"><svg class="ico s"><use href="#i-export"/></svg>Eksportér til Excel</button>
      </div>
      <div class="card-body">
        <div class="stats" id="konStats"></div>
        <div class="table-wrap" id="konTableWrap">
          <table id="konTable">
            <thead><tr>
              <th>Sag</th><th>Kunde og site</th><th>Beskrivelse</th>
              <th class="num">Timer</th><th class="num">Overtid 1</th><th class="num">Overtid 2</th><th class="num">Kørsel</th>
              <th>Sted nr.</th><th>Costcenter</th><th>TOS</th><th>CEP account</th><th>CEP site</th><th></th>
            </tr></thead>
            <tbody id="konRows"></tbody>
            <tfoot id="konFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>
  `,
    init() {
      const { $, $$, D, S, save, emp, role } = App;
      this.expanded = new Set();

      const teknikerSel = $('#konTekniker');
      D.medarbejdere.filter(m => m.rolle === 'Tekniker').forEach(m => teknikerSel.add(new Option(m.navn, m.id)));
      teknikerSel.addEventListener('change', () => { S.konTekniker = teknikerSel.value; this.expanded.clear(); save(); this.render(); });

      const maanedSel = $('#konMaaned');
      maanedSel.addEventListener('change', () => { S.konMaaned = maanedSel.value; this.expanded.clear(); save(); this.render(); });

      $('#konPdf').addEventListener('click', () => {
        const tech = emp(teknikerSel.value).navn, mnd = maanedSel.value;
        App.printSection($('#konTableWrap'), `Kontering ${tech} ${mnd}`);
      });
      $('#konCsv').addEventListener('click', () => {
        const tech = teknikerSel.value, mnd = maanedSel.value;
        const groups = groupData(tech, mnd);
        const rows = [['Sag', 'Kunde og site', 'Beskrivelse', 'Timer', 'Overtid 1', 'Overtid 2', 'Kørsel', 'Sted nr.', 'Costcenter', 'TOS', 'CEP account', 'CEP site']];
        let tTimer = 0, tOt1 = 0, tOt2 = 0, tKoersel = 0;
        groups.forEach(g => {
          rows.push([g.label, [g.kunde, g.site].filter(Boolean).join(' · '), g.beskrivelse, App.n(g.timer), App.n(g.ot1), App.n(g.ot2), App.n(g.koersel), g.stedNr, g.costcenter, g.tos, g.account, g.cepSite]);
          [...g.days].sort((a, b) => a.dato.localeCompare(b.dato)).forEach(d => {
            rows.push([d.dato, '', d.udfoert || '', App.n(d.timer), App.n(d.ot1), App.n(d.ot2), App.n(d.koersel), '', '', '', '', '']);
          });
          tTimer += g.timer; tOt1 += g.ot1; tOt2 += g.ot2; tKoersel += g.koersel;
        });
        rows.push(['I alt', '', '', App.n(tTimer), App.n(tOt1), App.n(tOt2), App.n(tKoersel), '', '', '', '', '']);
        if (groups.length === 0) { App.toast('Ingen registreringer i den valgte måned'); return; }
        App.csvDownload(`kontering-${tech}-${mnd}.csv`, rows);
      });
    },
    render() {
      const { $, $$, S, D, emp, role, siteLabel, n, h, expectedHours, workdays, isIntern, save } = App;
      const teknikerSel = $('#konTekniker'), maanedSel = $('#konMaaned');
      const teknikere = D.medarbejdere.filter(m => m.rolle === 'Tekniker');

      // Rollen Tekniker ser kun sig selv, og vælgeren er låst
      const lockedToSelf = role() === 'Tekniker';
      if (lockedToSelf) S.konTekniker = S.user;
      if (!S.konTekniker || !teknikere.some(m => m.id === S.konTekniker)) S.konTekniker = teknikere[0]?.id || '';
      teknikerSel.value = S.konTekniker;
      teknikerSel.disabled = lockedToSelf;

      // Måneder: dem der findes i tidsdata, nyeste først, standard = indeværende måned
      const months = [...new Set((S.tid || []).map(t => (t.dato || '').slice(0, 7)))].filter(Boolean).sort().reverse();
      if (!months.length) months.push(App.today().slice(0, 7));
      if (!S.konMaaned || !months.includes(S.konMaaned)) {
        const cur = App.today().slice(0, 7);
        S.konMaaned = months.includes(cur) ? cur : months[0];
      }
      maanedSel.innerHTML = '';
      months.forEach(m => maanedSel.add(new Option(m, m)));
      maanedSel.value = S.konMaaned;
      save();

      const tech = S.konTekniker, month = S.konMaaned;
      const groups = groupData(tech, month);

      // ---- KPI ----
      const [y, m] = month.split('-').map(Number);
      const caseHours = groups.filter(g => !g.intern).reduce((a, g) => a + g.timer + g.ot1 + g.ot2, 0);
      const internHours = groups.filter(g => g.intern).reduce((a, g) => a + g.timer + g.ot1 + g.ot2, 0);
      const total = caseHours + internHours;
      const expected = expectedHours(y, m);
      const diff = Math.round((total - expected) * 10) / 10;
      $('#konStats').innerHTML = `
        <div class="stat"><small>Registreret i alt</small><b>${n(total)}</b></div>
        <div class="stat"><small>Heraf på sager</small><b>${n(caseHours)}</b></div>
        <div class="stat"><small>Heraf intern tid</small><b>${n(internHours)}</b></div>
        <div class="stat"><small>Forventet (${workdays(y, m)} arbejdsdage)</small><b>${n(expected)}</b></div>
        <div class="stat"><small>Difference</small><b class="dg ${diff >= 0 ? 'good' : 'bad'}">${diff > 0 ? '+' : ''}${n(diff)}</b></div>
      `;

      // ---- tabel ----
      if (!groups.length) {
        $('#konRows').innerHTML = '<tr><td colspan="13" class="empty">Ingen registreringer i den valgte måned.</td></tr>';
        $('#konFoot').innerHTML = '';
        return;
      }
      const dayRowFixed = d => `<tr class="konDay"><td>${h(d.dato)}</td><td></td><td>${h(d.udfoert || '')}</td><td class="num">${n(d.timer)}</td><td class="num">${n(d.ot1)}</td><td class="num">${n(d.ot2)}</td><td class="num">${n(d.koersel)}</td><td colspan="5"></td></tr>`;
      $('#konRows').innerHTML = groups.map(g => {
        const open = this.expanded.has(g.key);
        const groupRow = `<tr class="konGroup">
          <td>${h(g.label)}</td>
          <td>${[g.kunde, g.site].filter(Boolean).map(h).join(' · ')}</td>
          <td>${h(g.beskrivelse)}</td>
          <td class="num">${n(g.timer)}</td>
          <td class="num">${n(g.ot1)}</td>
          <td class="num">${n(g.ot2)}</td>
          <td class="num">${n(g.koersel)}</td>
          <td>${h(g.stedNr) || '–'}</td>
          <td>${h(g.costcenter) || '–'}</td>
          <td>${h(g.tos) || '–'}</td>
          <td>${h(g.account) || '–'}</td>
          <td>${h(g.cepSite) || '–'}</td>
          <td><button type="button" class="tlink" data-toggle="${h(g.key)}">${open ? 'Skjul dage' : 'Vis dage'}</button></td>
        </tr>`;
        const dayRows = open ? [...g.days].sort((a, b) => a.dato.localeCompare(b.dato)).map(dayRowFixed).join('') : '';
        return groupRow + dayRows;
      }).join('');

      const tTimer = groups.reduce((a, g) => a + g.timer, 0), tOt1 = groups.reduce((a, g) => a + g.ot1, 0),
        tOt2 = groups.reduce((a, g) => a + g.ot2, 0), tKoersel = groups.reduce((a, g) => a + g.koersel, 0);
      $('#konFoot').innerHTML = `<tr class="konTotal"><td colspan="3"><b>I alt</b></td><td class="num"><b>${n(tTimer)}</b></td><td class="num"><b>${n(tOt1)}</b></td><td class="num"><b>${n(tOt2)}</b></td><td class="num"><b>${n(tKoersel)}</b></td><td colspan="6"></td></tr>`;

      $$('[data-toggle]').forEach(b => b.addEventListener('click', () => {
        const key = b.dataset.toggle;
        if (this.expanded.has(key)) this.expanded.delete(key); else this.expanded.add(key);
        this.render();
      }));
    },
  });
})();

</script>
