        <header><h2 id="newKundeTitle">Ny kunde</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid">
            <label>Kunde navn<input type="text" id="nkNavn" required></label>
            <label>Kunde nr.<input type="text" id="nkKundeNr" placeholder="valgfrit"></label>
            <label>Adresse<input type="text" id="nkAdresse" required></label>
            <label>Postnr.<input type="text" id="nkPostnr" required></label>
            <label>By<input type="text" id="nkBy" required></label>
            <label>Site-kode<input type="text" id="nkKode" placeholder="fx GSBC (valgfrit)"></label>
          </div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="nkOk">Opret kunde</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalNewSite">
      <div class="modal" role="dialog" aria-labelledby="newSiteTitle">
        <header><h2 id="newSiteTitle">Nyt site</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid" style="margin-bottom:18px">
            <label>Kunde<input type="text" id="nsKunde" readonly></label>
            <label>Site-navn<input type="text" id="nsNavn" required></label>
            <label>Kode<input type="text" id="nsKode" placeholder="valgfrit"></label>
            <label>Leveringsadresse<input type="text" id="nsAdresse" required></label>
            <label>Postnr.<input type="text" id="nsPostnr" required></label>
            <label>By<input type="text" id="nsBy" required></label>
          </div>
          <div class="form-grid" style="margin-bottom:18px">
            <label>Sted nr. (AS400)<input type="text" id="nsStedNr"></label>
            <label class="auto">BC-opslag<input type="text" id="nsBcPreview" readonly></label>
            <label>Installation<select id="nsInstallation"><option>AIA</option><option>ADK</option><option>TVO</option><option>KOMBI</option><option>ANDET</option></select></label>
            <label>Serviceaftale<select id="nsServiceaftale"><option>Ingen</option><option>Serviceaftale 1</option><option>Serviceaftale 2</option><option>Serviceaftale 4</option><option>Novo rammeaftale</option></select></label>
            <label>UL<input type="text" id="nsUl" placeholder="valgfrit"></label>
          </div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="nsOk">Opret site</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, S, site, bc, h, kr, st, openModal, closeModal, save, toast, siteLabel } = App;

    // ---------- visnings-tabs ----------
    $$('#kViewTabs .ftab').forEach(b => b.addEventListener('click', () => {
      kView = b.dataset.v;
      if (kView === 'kunder') kCurrentKunde = null;
      this.render();
    }));

    // ---------- åbn site-modal (delt af begge visninger) ----------
    this.openSite = id => {
      const s = site(id), m = bc(s.stedNr);
      $('#siteTitle').textContent = `${s.kunde} – ${s.navn}`;
      const rows = [
        ['Kode', s.kode || '–'], ['Site', s.id], ['Kunde', s.kunde], ['Site-navn', s.navn], ['Adresse', `${s.adresse}, ${s.postnr} ${s.by}`],
        ['Sted nr.', s.stedNr || '–'], ['Costcenter', m ? `${m.costcenter} – ${m.costcenterNavn}` : '–'],
        ['TOS', m ? `${m.tos} – ${m.tosNavn}` : '–'], ['Account', m ? `${m.account} – ${m.accountNavn}` : '–'],
        ['Installation', s.installation || '–'], ['Anlægstype', s.anlaeg || '–'], ['Serviceaftale', s.serviceaftale || '–'],
        ['UL', s.ul || '–'], ['Timepris mod kunde', s.timepris ? kr(s.timepris) : '–'], ['Kørsel mod kunde', s.koersel ? kr(s.koersel) : '–'],
        ['Eftersyn', s.eftersyn ? 'Ja' : 'Nej'], ['ES-måned', s.esMaaned || '–'], ['Interval', s.interval ? s.interval + ' mdr.' : '–'],
        ['Sidst opdateret', s.sidsteEftersyn || '–'], ['Kontakt', s.kontakt || '–'],
      ];
      $('#siteDetail').innerHTML = rows.map(([l, v]) => `<label>${h(l)}<input type="text" value="${h(String(v))}" readonly></label>`).join('');
      const projs = S.projekter.filter(p => p.siteId === id);
      $('#siteProjects').innerHTML = projs.map(p => `<li><time>${h(p.oprettet)}</time><span>${h(p.id)} – ${h(p.navn)}</span><span class="who">${st(p.status)}</span></li>`).join('')
        || '<li style="display:block; padding:12px 0; color:var(--text-secondary)">Ingen projekter på sitet.</li>';
      const cases = (S.serviceopgaver || []).filter(c => c.siteId === id);
      $('#siteCases').innerHTML = cases.map(c => `<li><time>${h(c.id)}</time><span>${h(c.beskrivelse)}</span><span class="who">${st(c.status)}</span></li>`).join('')
        || '<li style="display:block; padding:12px 0; color:var(--text-secondary)">Ingen serviceopgaver på sitet.</li>';
      openModal('modalSite');
    };

    // ---------- kundeliste ----------
    $('#kSearch').addEventListener('input', () => this.render());
    $('#btnBackKunder').addEventListener('click', () => { kCurrentKunde = null; this.render(); });
    $('#kdSearch').addEventListener('input', () => this.renderKundeDetail());

    this.openKunde = kunde => { kCurrentKunde = kunde; kSiteSearch = ''; $('#kdSearch').value = ''; this.render(); };

    // ---------- ny kunde ----------
    $('#btnNewKunde').addEventListener('click', () => {
      $('#nkNavn').value = ''; $('#nkKundeNr').value = ''; $('#nkAdresse').value = ''; $('#nkPostnr').value = ''; $('#nkBy').value = ''; $('#nkKode').value = '';
      openModal('modalNewKunde');
    });
    $('#nkOk').addEventListener('click', () => {
      const navn = $('#nkNavn').value.trim(), adresse = $('#nkAdresse').value.trim(), postnr = $('#nkPostnr').value.trim(), by = $('#nkBy').value.trim();
      if (!navn || !adresse || !postnr || !by) { toast('Udfyld kunde, adresse, postnr. og by'); return; }
      if (S.sites.some(s => s.kunde.toLowerCase() === navn.toLowerCase())) { toast('Kunden findes allerede'); return; }
      let id; do { id = 'DK-S-' + String(Math.floor(100000 + Math.random() * 900000)); } while (S.sites.some(x => x.id === id));
      const s = {
        id, stedNr: '', kunde: navn, navn: `${navn} – hovedadresse`, kode: $('#nkKode').value.trim(),
        adresse, postnr, by, installation: '', anlaeg: '', serviceaftale: '', ul: '', kontakt: '', kundeNr: $('#nkKundeNr').value.trim(),
      };
      S.sites.push(s); save(); closeModal('modalNewKunde');
      toast(`${navn} er oprettet`);
      this.openKunde(navn);
    });

    // ---------- nyt site ----------
    const updateNsPreview = () => {
      const m = bc($('#nsStedNr').value);
      $('#nsBcPreview').value = m ? `${m.costcenter} · TOS ${m.tos} · ${m.account}` : ($('#nsStedNr').value ? 'Ikke fundet i mappingen' : '');
    };
    $('#nsStedNr').addEventListener('input', updateNsPreview);
    $('#btnNewSite').addEventListener('click', () => {
      if (!kCurrentKunde) return;
      $('#nsKunde').value = kCurrentKunde;
      $('#nsNavn').value = ''; $('#nsKode').value = ''; $('#nsAdresse').value = ''; $('#nsPostnr').value = ''; $('#nsBy').value = '';
      $('#nsStedNr').value = ''; $('#nsInstallation').value = 'AIA'; $('#nsServiceaftale').value = 'Ingen'; $('#nsUl').value = '';
      updateNsPreview();
      openModal('modalNewSite');
    });
    $('#nsOk').addEventListener('click', () => {
      const navn = $('#nsNavn').value.trim(), adresse = $('#nsAdresse').value.trim(), postnr = $('#nsPostnr').value.trim(), by = $('#nsBy').value.trim();
      if (!navn || !adresse || !postnr || !by) { toast('Udfyld site-navn, leveringsadresse, postnr. og by'); return; }
      let id; do { id = 'DK-S-' + String(Math.floor(100000 + Math.random() * 900000)); } while (S.sites.some(x => x.id === id));
      const serviceaftale = $('#nsServiceaftale').value === 'Ingen' ? '' : $('#nsServiceaftale').value;
      const s = {
        id, stedNr: $('#nsStedNr').value.trim(), kunde: kCurrentKunde, navn, kode: $('#nsKode').value.trim(),
        adresse, postnr, by, installation: $('#nsInstallation').value, anlaeg: '', serviceaftale, ul: $('#nsUl').value.trim(), kontakt: '',
      };
      S.sites.push(s); save(); closeModal('modalNewSite');
      toast(`${siteLabel(s)} er oprettet`);
      this.render();
    });

    // ---------- alle sites (uændret funktion) ----------
    $$('#kFilter .ftab').forEach(b => b.addEventListener('click', () => { kFilter = b.dataset.v; this.render(); }));
    $('#asSearch').addEventListener('input', () => this.render());
  },

  // ---------- åbne sager pr. site/kunde ----------
  openSagerForSite(id) {
    const { S } = App;
    const projekter = S.projekter.filter(p => p.siteId === id && p.status !== 'Faktureret' && p.status !== 'Afsluttet').length;
    const opgaver = (S.serviceopgaver || []).filter(o => o.siteId === id && o.status === 'Åben').length;
    return projekter + opgaver;
  },

  render() {
    const { $, $$ } = App;
    $$('#kViewTabs .ftab').forEach(x => x.classList.toggle('on', x.dataset.v === kView));

    $('#alleSitesView').style.display = kView === 'alle' ? '' : 'none';
    $('#kundeListeView').style.display = kView === 'kunder' && !kCurrentKunde ? '' : 'none';
    $('#kundeDetailView').style.display = kView === 'kunder' && kCurrentKunde ? '' : 'none';

    if (kView === 'alle') { this.renderAlleSites(); return; }
    if (kCurrentKunde) { this.renderKundeDetail(); } else { this.renderKundeListe(); }
  },

  renderKundeListe() {
    const { $, $$, S, bc, h } = App;
    kSearch = ($('#kSearch').value || '').trim().toLowerCase();
    const grupper = new Map();
    S.sites.forEach(s => {
      if (!grupper.has(s.kunde)) grupper.set(s.kunde, []);
      grupper.get(s.kunde).push(s);
    });
    let kunder = [...grupper.entries()].map(([kunde, sites]) => {
      const withStedNr = sites.find(s => s.stedNr && bc(s.stedNr));
      const m = withStedNr ? bc(withStedNr.stedNr) : null;
      const aabne = sites.reduce((a, s) => a + this.openSagerForSite(s.id), 0);
      const aftaler = sites.filter(s => s.serviceaftale && s.serviceaftale !== 'Ingen').length;
      const uler = new Set(sites.map(s => s.ul).filter(Boolean));
      return { kunde, account: m ? `${m.account} – ${m.accountNavn}` : '–', sites: sites.length, aabne, aftaler, uler: [...uler] };
    });
    kunder.sort((a, b) => a.kunde.localeCompare(b.kunde, 'da'));
    if (kSearch) kunder = kunder.filter(k => k.kunde.toLowerCase().includes(kSearch));

    $('#kundeRows').innerHTML = kunder.map(k => `
      <tr class="click" data-kunde="${h(k.kunde)}" tabindex="0">
        <td><b>${h(k.kunde)}</b></td><td>${h(k.account)}</td><td class="num">${k.sites}</td><td class="num">${k.aabne}</td>
        <td class="num">${k.aftaler}</td><td>${k.uler.length ? h(k.uler.join(', ')) : '–'}</td>
      </tr>`).join('') || '<tr><td colspan="6" class="empty">Ingen kunder matcher søgningen. Ryd søgefeltet, eller opret en ny kunde.</td></tr>';
    $$('[data-kunde]', $('#kundeRows')).forEach(r => r.addEventListener('click', () => this.openKunde(r.dataset.kunde)));
  },

  renderKundeDetail() {
    const { $, $$, S, site, bc, h, kr, siteLabel } = App;
    const kunde = kCurrentKunde;
    const sites = S.sites.filter(s => s.kunde === kunde);
    const withStedNr = sites.find(s => s.stedNr && bc(s.stedNr));
    const m = withStedNr ? bc(withStedNr.stedNr) : null;
    $('#kdKundeNavn').textContent = kunde;
    $('#kdKundeAccount').textContent = m ? `Account: ${m.account} – ${m.accountNavn}` : 'Account: ikke fundet i BC-mappingen';

    const aabne = sites.reduce((a, s) => a + this.openSagerForSite(s.id), 0);
    const projekterTotal = sites.reduce((a, s) => a + S.projekter.filter(p => p.siteId === s.id).length, 0);
    $('#kdStats').innerHTML = [
      ['Sites', sites.length], ['Åbne sager', aabne], ['Projekter i alt', projekterTotal],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

    kSiteSearch = ($('#kdSearch').value || '').trim().toLowerCase();
    let rows = sites;
    if (kSiteSearch) {
      rows = rows.filter(s => `${s.kode || ''} ${s.navn} ${s.adresse}`.toLowerCase().includes(kSiteSearch));
    }
    rows = [...rows].sort((a, b) => siteLabel(a).localeCompare(siteLabel(b), 'da'));

    $('#kdSiteRows').innerHTML = rows.map(s => {
      const bcRow = bc(s.stedNr);
      const aabneSite = this.openSagerForSite(s.id);
      return `<tr class="click" data-open="${s.id}" tabindex="0">
        <td>${s.kode ? h(s.kode) : '–'}</td><td>${h(siteLabel(s))}</td><td>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</td>
        <td>${h(s.stedNr) || '<span class="alert">Mangler</span>'}</td>
        <td>${bcRow ? h(bcRow.costcenter) : '–'}</td><td>${bcRow ? h(bcRow.tos) : '–'}</td><td>${h(s.id)}</td>
        <td>${h(s.installation) || '–'}</td><td>${h(s.serviceaftale) || '–'}</td><td>${h(s.ul) || '–'}</td>
        <td class="num">${aabneSite}</td></tr>`;
    }).join('') || '<tr><td colspan="11" class="empty">Ingen sites matcher søgningen på denne kunde. Ryd søgefeltet, eller opret et nyt site.</td></tr>';
    $$('[data-open]', $('#kdSiteRows')).forEach(r => r.addEventListener('click', () => this.openSite(r.dataset.open)));
  },

  renderAlleSites() {
    const { $, $$, S, bc, h, kr } = App;
    $$('#kFilter .ftab').forEach(x => x.classList.toggle('on', x.dataset.v === kFilter));
    const q = ($('#asSearch').value || '').trim().toLowerCase();
    const highlight = App._highlightSite;
    const rows = S.sites.filter(s => {
      const hasSA = s.serviceaftale && s.serviceaftale !== 'Ingen';
      if (kFilter === 'med' && !hasSA) return false;
      if (kFilter === 'uden' && hasSA) return false;
      if (q && !`${s.id} ${s.kode || ''} ${s.kunde} ${s.navn} ${s.adresse}`.toLowerCase().includes(q)) return false;
      return true;
    });
    $('#siteRows').innerHTML = rows.map(s => {
      const m = bc(s.stedNr); const cnt = S.projekter.filter(p => p.siteId === s.id).length;
      const eftersyn = s.eftersyn ? `${s.esMaaned ? 'Måned ' + s.esMaaned : '–'} / ${s.interval || 12} mdr.` : '–';
      const rowStyle = s.id === highlight ? ' style="background:var(--ui-purple-100)"' : '';
      return `<tr class="click" data-open="${s.id}" tabindex="0"${rowStyle}>
        <td>${s.kode ? h(s.kode) : '–'}</td><td><b>${h(s.id)}</b></td><td>${h(s.kunde)}</td><td>${h(s.navn)}</td><td>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</td>
        <td>${h(s.stedNr) || '<span class="alert">Mangler</span>'}</td>
        <td>${m ? h(m.costcenter) : '–'}</td><td>${m ? h(m.tos) : '–'}</td><td>${m ? h(m.account) : '–'}</td>
        <td>${h(s.installation)}</td><td>${h(s.serviceaftale) || '–'}</td><td>${h(s.ul) || '–'}</td>
        <td class="num">${s.timepris ? kr(s.timepris) : '–'}</td><td>${eftersyn}</td><td class="muted">${h(s.sidsteEftersyn) || '–'}</td>
        <td class="num">${cnt}</td></tr>`;
    }).join('') || '<tr><td colspan="16" class="empty">Ingen sites matcher filteret. Ryd filtrene, eller opret en ny sag med et nyt site fra projektoverblikket.</td></tr>';
    $$('[data-open]', $('#siteRows')).forEach(r => {
      r.addEventListener('click', () => this.openSite(r.dataset.open));
    });
    if (highlight) delete App._highlightSite;
  },
});

</script>
<script>
// Serviceopgaver – egen skærm for service-flowet Åben → Lukket til fakturering → Faktureret.
// Erstatter Opgaver, Åbne Sager og Opgaver til fakturering i Opgavestyring-filen.
App.registerPage({
  id: 'service', label: 'Serviceopgaver', group: 'Service', icon: 'calendar-check', order: 35,
  roles: ['Chef', 'PM', 'Fakturering', 'Service', 'Tekniker'],
  html: `
    <div class="page-head">
      <div>
        <h1>Serviceopgaver</h1>
        <p>Alle serviceopgaver samlet ét sted – fra oprettelse over lukning til fakturering, uden regneark og uden kopiering mellem faner.</p>
      </div>
      <div class="replaces">Erstatter <b>Opgaver</b>, <b>Åbne Sager</b> og <b>Opgaver til fakturering</b> i Opgavestyring-filen</div>
    </div>
    <div class="stats" id="svcStats"></div>
    <div class="card">
      <div class="toolbar">
        <div class="ftabs" id="svcTabs" role="group" aria-label="Status">
          <button class="ftab on" data-v="">Alle</button>
          <button class="ftab" data-v="Åben">Åben</button>
          <button class="ftab" data-v="Lukket til fakturering">Lukket til fakturering</button>
          <button class="ftab" data-v="Faktureret">Faktureret</button>
          <button class="ftab" data-v="__delopgaver">Delopgaver</button>
        </div>
        <label class="field">Tekniker <select id="svcTekniker"><option value="">Alle</option></select></label>
        <label class="field">Søg <input type="text" id="svcSearch" placeholder="Sag, kunde, beskrivelse" size="26"></label>
        <span class="spacer"></span>
        <button class="btn cta" id="svcNy">Ny serviceopgave</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Sag</th><th>Kunde og site</th><th>Beskrivelse</th><th>Type</th><th>Tekniker</th><th>Oprettet</th><th>Status</th><th class="num">Timer</th><th class="num">Pris</th><th></th>
          </tr></thead>
          <tbody id="svcRows"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-bg" id="modalSvcNy">
      <div class="modal" role="dialog" aria-labelledby="svcNyTitle">
        <header><h2 id="svcNyTitle">Ny serviceopgave</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid">
            <label>Site<select id="svcSite"></select></label>
            <label>Type<select id="svcType"><option>Service</option><option>Eftersyn</option><option>Fejl</option></select></label>
            <label>Tekniker<select id="svcTekAssign"></select></label>
            <label>PO<input type="text" id="svcPo" placeholder="Indkøbsordre"></label>
            <label>Pris<input type="number" id="svcPris" min="0" step="1" placeholder="0"></label>
            <label style="grid-column:1/-1">Beskrivelse<textarea id="svcBeskrivelse" rows="3" placeholder="Hvad drejer opgaven sig om?"></textarea></label>
          </div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="svcNyOk">Opret serviceopgave</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalSvcDetaljer">
      <div class="modal" role="dialog" aria-labelledby="svcDetTitle">
        <header><h2 id="svcDetTitle">Serviceopgave</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body" id="svcDetBody"></div>
        <footer><button class="btn" data-close>Luk</button></footer>
      </div>
    </div>

    <div class="modal-bg" id="modalSvcKladde">
      <div class="modal" style="width:min(980px, 100%)" role="dialog" aria-labelledby="svcKladdeTitle">
        <header><h2 id="svcKladdeTitle">Fakturakladde</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="pdf" id="svcKladdeContent"></div>
          <div style="margin-top:18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap" id="svcKladdeActions"></div>
        </div>
        <footer><button class="btn" data-close>Luk</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, D, S, save, toast, today, h, kr, n, role, openModal, closeModal, emp, site } = App;

    const teknikere = () => D.medarbejdere.filter(m => m.rolle === 'Tekniker');

    // filterrække
    const tekSel = $('#svcTekniker');
    teknikere().forEach(t => tekSel.add(new Option(t.navn, t.id)));
    $$('#svcTabs .ftab').forEach(b => b.addEventListener('click', () => {
      $$('#svcTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.fStatus = b.dataset.v; this.render();
    }));
    tekSel.addEventListener('change', () => this.render());
    $('#svcSearch').addEventListener('input', () => this.render());

    // "ny serviceopgave"-modal
    $('#svcNy').addEventListener('click', () => {
      const siteSel = $('#svcSite'); siteSel.innerHTML = '';
      (S.sites || []).forEach(s => siteSel.add(new Option(`${s.kunde} – ${App.siteLabel(s)}`, s.id)));
      const tekAssign = $('#svcTekAssign'); tekAssign.innerHTML = '';
      teknikere().forEach(t => tekAssign.add(new Option(t.navn, t.id)));
      $('#svcType').value = 'Service'; $('#svcPo').value = ''; $('#svcPris').value = ''; $('#svcBeskrivelse').value = '';
      openModal('modalSvcNy');
    });
    $('#svcNyOk').addEventListener('click', () => {
      const beskrivelse = $('#svcBeskrivelse').value.trim();
      if (!beskrivelse) return toast('Skriv en beskrivelse, før du opretter opgaven');
      const digits = () => String(Math.floor(100000 + Math.random() * 900000));
      const chars = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 33)]).join('');
      const id = `CAS-${digits()}-${chars()}`;
      S.serviceopgaver = S.serviceopgaver || [];
      S.serviceopgaver.push({
        id, siteId: $('#svcSite').value, beskrivelse, tekniker: $('#svcTekAssign').value, status: 'Åben',
        po: $('#svcPo').value.trim(), oprettet: today(), lukket: '', type: $('#svcType').value, pris: +$('#svcPris').value || 0,
      });
      save(); closeModal('modalSvcNy'); toast(`Serviceopgave ${id} oprettet`); this.render();
    });

    // handlinger i tabellen (delegeret)
    $('#svcRows').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      if (btn.dataset.act === 'aabnprojekt') { App.openProject(btn.dataset.id); return; }
      const c = (S.serviceopgaver || []).find(x => x.id === btn.dataset.id);
      if (!c) return;
      if (btn.dataset.act === 'luk') {
        c.status = 'Lukket til fakturering'; c.lukket = today(); save(); toast(`${c.id} lukket til fakturering`); this.render();
      } else if (btn.dataset.act === 'genaabn') {
        c.status = 'Åben'; c.lukket = ''; save(); toast(`${c.id} genåbnet`); this.render();
      } else if (btn.dataset.act === 'detaljer') {
        this.openDetaljer(c.id);
      } else if (btn.dataset.act === 'kladde') {
        this.openKladde(c.id);
      }
    });

    // Fakturakladde-modal: redigerbare prislinjer (delegeret, containeren består på tværs af renderKladde())
    $('#svcKladdeContent').addEventListener('input', e => {
      const idx = e.target.dataset.lineidx;
      if (idx == null || !this._kladdeLines) return;
      const l = this._kladdeLines[idx];
      if (!l) return;
      l[e.target.dataset.field] = +e.target.value || 0;
      const beloeb = (+l.antal || 0) * (+l.enhedspris || 0);
      const cell = $(`[data-beloeb="${idx}"]`);
      if (cell) cell.textContent = (l.material && beloeb === 0) ? 'Efter regning' : kr(beloeb);
      const totalEl = $('#svcKladdeTotal');
      if (totalEl) totalEl.textContent = kr(this._kladdeLines.reduce((a, x) => a + (+x.antal || 0) * (+x.enhedspris || 0), 0));
    });

    $('#svcKladdeActions').addEventListener('click', e => {
      const btn = e.target.closest('button, .tlink');
      if (!btn) return;
      const c = (S.serviceopgaver || []).find(x => x.id === this._kladdeId);
      if (!c) return;
      if (btn.id === 'svcKladdePdf') {
        const el = $('#svcKladdeContent');
        $$('input', el).forEach(i => i.setAttribute('value', i.value));
        App.printSection(el, `Fakturakladde ${c.id}`);
      } else if (btn.id === 'svcKladdeGodkend') {
        const tid = (S.tid || []).filter(t => t.sag === c.id);
        const linjer = this._kladdeLines.map(l => ({ tekst: l.tekst, antal: +l.antal || 0, enhedspris: +l.enhedspris || 0, beloeb: (+l.antal || 0) * (+l.enhedspris || 0) }));
        const total = linjer.reduce((a, l) => a + l.beloeb, 0);
        c.kladde = {
          linjer, total,
          dage: new Set(tid.map(t => t.dato)).size,
          timer: tid.reduce((a, t) => a + (+t.timer || 0), 0),
          ot1: tid.reduce((a, t) => a + (+t.ot1 || 0), 0),
          ot2: tid.reduce((a, t) => a + (+t.ot2 || 0), 0),
          godkendtAf: S.user, dato: today(),
        };
        c.status = 'Lukket til fakturering'; c.lukket = today();
        save(); toast(`Fakturakladde for ${c.id} godkendt og sendt til fakturering`);
        this.renderKladde(); this.render();
      } else if (btn.id === 'svcKladdeNy') {
        delete c.kladde; save(); this.renderKladde(); this.render();
      }
    });
  },
  openDetaljer(id) {
    const { $, S, site, emp, h, kr, n, st, today, openModal } = App;
    const c = (S.serviceopgaver || []).find(x => x.id === id);
    if (!c) return;
    const s = site(c.siteId);
    const tid = (S.tid || []).filter(t => t.sag === c.id);
    $('#svcDetTitle').textContent = `Serviceopgave ${c.id}`;
    $('#svcDetBody').innerHTML = `
      <div class="form-grid" style="margin-bottom:18px">
        <div><small class="muted">Kunde og site</small><br><b>${h(s.kunde || '–')}</b><br><span class="muted">${h(App.siteLabel(s))}</span></div>
        <div><small class="muted">Type</small><br><b>${h(c.type || 'Service')}</b></div>
        <div><small class="muted">Tekniker</small><br><b>${h(emp(c.tekniker).navn)}</b></div>
        <div><small class="muted">Status</small><br>${st(c.status)}</div>
        <div><small class="muted">Oprettet</small><br><b>${h(c.oprettet || '–')}</b></div>
        <div><small class="muted">Lukket</small><br><b>${h(c.lukket || '–')}</b></div>
        <div><small class="muted">PO</small><br><b>${h(c.po || '–')}</b></div>
        <div><small class="muted">Pris</small><br><b>${kr(c.pris)}</b></div>
      </div>
      <p><b>Beskrivelse</b><br>${h(c.beskrivelse)}</p>
      <p style="margin-top:18px"><b>Tidsregistreringer</b></p>
      <div class="table-wrap"><table>
        <thead><tr><th>Dato</th><th>Tekniker</th><th>Udført</th><th class="num">Timer</th></tr></thead>
        <tbody>${tid.map(t => `<tr><td>${h(t.dato)}</td><td>${h(emp(t.tekniker).navn)}</td><td>${h(t.udfoert || '')}</td><td class="num">${n((+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0))}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Ingen timer registreret endnu.</td></tr>'}</tbody>
      </table></div>
    `;
    openModal('modalSvcDetaljer');
  },
  openKladde(id) {
    this._kladdeId = id;
    this.renderKladde();
    App.openModal('modalSvcKladde');
  },
  renderKladde() {
    const { $, S, site, emp, h, kr, n, today, pris, siteLabel, bc } = App;
    const c = (S.serviceopgaver || []).find(x => x.id === this._kladdeId);
    if (!c) return;
    const s = site(c.siteId);
    const m = bc(s.stedNr);
    const tid = (S.tid || []).filter(t => t.sag === c.id).sort((a, b) => a.dato.localeCompare(b.dato));

    const head = `
      <div class="pdf-head"><b>Fakturakladde</b><span class="muted">${h(c.id)} · ${today()}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
      <dl>
        <dt>Sag</dt><dd>${h(c.id)}${c.parent ? ` <span class="muted">(Delopgave under ${h(c.parent)})</span>` : ''}</dd>
        <dt>CEP account</dt><dd>${m ? h(m.account) : '–'}</dd>
        <dt>Kunde</dt><dd>${h(s.kunde || '–')}</dd>
        <dt>CEP site</dt><dd>${h(s.id || '–')}</dd>
        <dt>Adresse</dt><dd>${h(siteLabel(s))}</dd>
        <dt>Sted nr.</dt><dd>${h(s.stedNr || '–')}</dd>
        <dt>Costcenter</dt><dd>${m ? `${h(m.costcenter)} – ${h(m.costcenterNavn)}` : '–'}</dd>
        <dt>TOS</dt><dd>${m ? `${h(m.tos)} – ${h(m.tosNavn)}` : '–'}</dd>
        <dt>PO</dt><dd>${h(c.po || '–')}</dd>
        <dt>Type</dt><dd>${h(c.type || 'Service')}</dd>
      </dl>
      <p><b>Opgavebeskrivelse</b><br>${h(c.beskrivelse)}</p>
      <p style="margin-top:12px"><b>Udført dag for dag</b></p>
      <table><thead><tr><th>Dato</th><th>Tekniker</th><th class="num">Timer</th><th class="num">OT1</th><th class="num">OT2</th><th>Udført</th></tr></thead>
      <tbody>${tid.length ? tid.map(t => `<tr><td>${h(t.dato)}</td><td>${h(emp(t.tekniker).navn)}</td><td class="num">${n(t.timer)}</td><td class="num">${n(t.ot1)}</td><td class="num">${n(t.ot2)}</td><td>${h(t.udfoert || '')}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Ingen tidsregistreringer på opgaven endnu.</td></tr>'}</tbody></table>
    `;

    if (c.kladde) {
      const rowsHtml = c.kladde.linjer.map(l => `<tr><td>${h(l.tekst)}</td><td class="num">${n(l.antal)}</td><td class="num">${kr(l.enhedspris)}</td><td class="num">${(+l.beloeb || 0) === 0 ? 'Efter regning' : kr(l.beloeb)}</td></tr>`).join('');
      $('#svcKladdeContent').innerHTML = head + `
        <p style="margin-top:12px"><b>Prislinjer</b></p>
        <table><thead><tr><th>Tekst</th><th class="num">Antal</th><th class="num">Enhedspris</th><th class="num">Beløb</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr><td colspan="3">Total</td><td class="num">${kr(c.kladde.total)}</td></tr></tfoot></table>
        <p class="muted" style="margin-top:12px">Godkendt af ${h(emp(c.kladde.godkendtAf).navn)} den ${h(c.kladde.dato)}</p>
      `;
      const actions = [`<button class="btn" id="svcKladdePdf">Gem som PDF</button>`];
      if (c.status !== 'Faktureret') actions.push(`<button class="tlink" id="svcKladdeNy">Lav ny kladde</button>`);
      $('#svcKladdeActions').innerHTML = actions.join('');
      return;
    }

    const p = pris(s);
    const dage = new Set(tid.map(t => t.dato)).size;
    const sum = k => tid.reduce((a, t) => a + (+t[k] || 0), 0);
    const matMap = new Map();
    tid.forEach(t => (t.materialer || []).forEach(mt => {
      const mkey = `${mt.type}|${mt.model}`;
      matMap.set(mkey, (matMap.get(mkey) || 0) + (+mt.antal || 0));
    }));
    const fastPris = +c.pris > 0;
    const lines = [];
    if (fastPris) {
      lines.push({ tekst: 'Aftalt pris', antal: 1, enhedspris: +c.pris });
    } else {
      lines.push({ tekst: 'Timer normal', antal: sum('timer'), enhedspris: p.time });
      lines.push({ tekst: 'Overtid 1', antal: sum('ot1'), enhedspris: p.ot1 });
      lines.push({ tekst: 'Overtid 2', antal: sum('ot2'), enhedspris: p.ot2 });
      lines.push({ tekst: 'Servicevogn', antal: dage, enhedspris: p.koersel });
      matMap.forEach((antal, mkey) => {
        const [type, model] = mkey.split('|');
        lines.push({ tekst: `${type} · ${model}`, antal, enhedspris: 0, material: true });
      });
    }
    this._kladdeLines = lines;
    const infoLines = fastPris ? [
      { tekst: 'Timer normal', antal: sum('timer'), enhedspris: p.time },
      { tekst: 'Overtid 1', antal: sum('ot1'), enhedspris: p.ot1 },
      { tekst: 'Overtid 2', antal: sum('ot2'), enhedspris: p.ot2 },
      { tekst: 'Servicevogn', antal: dage, enhedspris: p.koersel },
      ...[...matMap.entries()].map(([mkey, antal]) => { const [type, model] = mkey.split('|'); return { tekst: `${type} · ${model}`, antal, enhedspris: 0 }; }),
    ] : [];
    const beloebTxt = l => { const b = (+l.antal || 0) * (+l.enhedspris || 0); return (l.material && b === 0) ? 'Efter regning' : kr(b); };
    const lineRow = (l, i) => `<tr>
      <td>${h(l.tekst)}</td>
      <td class="num"><input type="number" step="0.5" min="0" value="${l.antal}" data-lineidx="${i}" data-field="antal" style="width:70px"></td>
      <td class="num"><input type="number" step="1" min="0" value="${l.enhedspris}" data-lineidx="${i}" data-field="enhedspris" style="width:90px"></td>
      <td class="num" data-beloeb="${i}">${beloebTxt(l)}</td>
    </tr>`;
    $('#svcKladdeContent').innerHTML = head + `
      <p style="margin-top:12px"><b>Prislinjer</b></p>
      <table><thead><tr><th>Tekst</th><th class="num">Antal</th><th class="num">Enhedspris</th><th class="num">Beløb</th></tr></thead>
      <tbody>${lines.map(lineRow).join('')}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num" id="svcKladdeTotal">${kr(lines.reduce((a, l) => a + (+l.antal || 0) * (+l.enhedspris || 0), 0))}</td></tr></tfoot></table>
      ${infoLines.length ? `<p style="margin-top:12px"><b>Informativt (indgår ikke i beløbet – opgaven har aftalt pris)</b></p>
      <table><thead><tr><th>Tekst</th><th class="num">Antal</th><th class="num">Enhedspris</th><th class="num">Beløb</th></tr></thead>
      <tbody>${infoLines.map(l => `<tr><td>${h(l.tekst)}</td><td class="num">${n(l.antal)}</td><td class="num">${kr(l.enhedspris)}</td><td class="num">${kr((+l.antal || 0) * (+l.enhedspris || 0))}</td></tr>`).join('')}</tbody></table>` : ''}
    `;
    const canGodkend = c.status === 'Åben' || c.status === 'Lukket til fakturering';
    $('#svcKladdeActions').innerHTML = `<button class="btn" id="svcKladdePdf">Gem som PDF</button>` + (canGodkend ? `<button class="btn cta" id="svcKladdeGodkend">Godkend og send til fakturering</button>` : '');
  },
  render() {
    const { $, $$, S, site, emp, h, kr, n, st, role, siteLabel } = App;
    const isTekniker = role() === 'Tekniker';
    $('#svcNy').style.display = isTekniker ? 'none' : '';
    const all = (S.serviceopgaver || []).filter(c => !isTekniker || c.tekniker === S.user);

    const timerFor = id => (S.tid || []).filter(t => t.sag === id).reduce((a, t) => a + (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0), 0);

    // filtre
    const status = this.fStatus || '';
    const tek = $('#svcTekniker').value;
    const q = $('#svcSearch').value.trim().toLowerCase();
    const rows = all.filter(c => {
      if (status === '__delopgaver') { if (!c.parent) return false; }
      else if (status && c.status !== status) return false;
      if (tek && c.tekniker !== tek) return false;
      if (q) {
        const s = site(c.siteId);
        const hay = [c.id, c.beskrivelse, s.kunde, s.navn, s.kode, emp(c.tekniker).navn].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => (b.oprettet || '').localeCompare(a.oprettet || ''));

    $('#svcRows').innerHTML = rows.map(c => {
      const s = site(c.siteId);
      const timer = timerFor(c.id);
      const canLuk = c.status === 'Åben';
      const canGenaabn = c.status === 'Lukket til fakturering';
      return `<tr>
        <td><b>${h(c.id)}</b></td>
        <td>${h(s.kunde || '–')}<br><span class="muted">${h(siteLabel(s))}</span></td>
        <td>${h(c.beskrivelse)}${c.parent ? `<br><span class="muted caption">Delopgave under ${h(c.parent)}</span>` : ''}</td>
        <td>${h(c.type || 'Service')}</td>
        <td>${h(emp(c.tekniker).navn)}</td>
        <td>${h(c.oprettet || '–')}</td>
        <td>${st(c.status)}</td>
        <td class="num">${n(timer)}</td>
        <td class="num">${kr(c.pris)}</td>
        <td>
          ${canLuk ? `<button class="tlink" data-act="luk" data-id="${c.id}">Luk til fakturering</button> · ` : ''}
          ${canGenaabn ? `<button class="tlink" data-act="genaabn" data-id="${c.id}">Genåbn</button> · ` : ''}
          ${(c.status === 'Åben' || c.status === 'Lukket til fakturering') ? `<button class="tlink" data-act="kladde" data-id="${c.id}">Fakturakladde</button> · ` : ''}
          ${c.parent ? `<button class="tlink" data-act="aabnprojekt" data-id="${h(c.parent)}">Åbn projekt</button> · ` : ''}
          <button class="tlink" data-act="detaljer" data-id="${c.id}">Detaljer</button>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="10" class="empty">Ingen serviceopgaver matcher filteret. Ryd filtrene, eller opret en ny serviceopgave.</td></tr>';

    // KPI'er (rolle-afgrænset, men uafhængige af tabellens filtre)
    const aabne = all.filter(c => c.status === 'Åben');
    const lukket = all.filter(c => c.status === 'Lukket til fakturering');
    const perTek = {};
    aabne.forEach(c => { perTek[c.tekniker] = (perTek[c.tekniker] || 0) + 1; });
    const perTekList = Object.entries(perTek).sort((a, b) => b[1] - a[1]);
    const perTekTxt = perTekList.length
      ? perTekList.map(([id, cnt]) => `${h(emp(id).navn)}: ${cnt}`).join(' · ')
      : 'Ingen åbne opgaver';
    $('#svcStats').innerHTML = `
      <div class="stat"><small>Åbne opgaver</small><b>${aabne.length}</b></div>
      <div class="stat"><small>Lukket til fakturering</small><b>${lukket.length} · ${kr(lukket.reduce((a, c) => a + (+c.pris || 0), 0))}</b></div>
      <div class="stat"><small>Åbne pr. tekniker</small><b>${perTekList.length}</b><small>${perTekTxt}</small></div>
    `;
  },
});

// Genbruges af projektkortets fane "Delopgaver" (samme fakturakladde-modal som her).
window.ServiceKladde = { open(id) { App.getPage('service').openKladde(id); } };

</script>
<script>
// Global søgning på tværs af alt. Erstatter "Søg"-arket i Excel-filerne (faktura, leverandør, ydelse, beløb – nu på tværs af alle sager).
App.registerPage({
  id: 'soeg', label: 'Søg', group: 'Stamdata', icon: 'search', order: 55,
  html: `
    <div class="page-head">
      <div>
        <h1>Søg</h1>
        <p>Søg på tværs af projekter, udgifter og fakturaer, fakturering, serviceopgaver, sites, tid og underleverandører.</p>
      </div>
      <div class="replaces">Erstatter <b>Søg</b>-arket i Genneralle projekter.xlsm og Projekter Novo.xlsm</div>
    </div>
    <div class="card">
      <div class="card-body">
        <label class="field">Søg
          <input type="text" id="soegInput" placeholder="Søg på faktura, leverandør, ydelse, beløb, projekt, kunde, site, tekniker …" autocomplete="off">
        </label>
        <div class="ftabs" id="fKilde" role="group" aria-label="Kilde" style="margin-top: var(--space-3)">
          <button class="ftab on" data-v="">Alle</button>
          <button class="ftab" data-v="projekter">Projekter</button>
          <button class="ftab" data-v="udgifter">Udgifter og fakturaer</button>
          <button class="ftab" data-v="fakturering">Fakturering</button>
          <button class="ftab" data-v="service">Serviceopgaver</button>
          <button class="ftab" data-v="sites">Sites</button>
          <button class="ftab" data-v="tid">Tid</button>
          <button class="ftab" data-v="ul">Underleverandører</button>
        </div>
      </div>
    </div>
    <div id="soegResults"></div>
  `,
  init() {
    const { $, $$, S, save } = App;
    let timer;
    $('#soegInput').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        S.lastSearch = $('#soegInput').value;
        save();
        this.renderResults();
      }, 150);
    });
    $$('#fKilde .ftab').forEach(b => b.addEventListener('click', () => {
      S.lastSearchFilter = b.dataset.v; save();
      $$('#fKilde .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.renderResults();
    }));
  },
  render() {
    const { $, $$, S } = App;
    $('#soegInput').value = S.lastSearch || '';
    $$('#fKilde .ftab').forEach(x => x.classList.toggle('on', x.dataset.v === (S.lastSearchFilter || '')));
    this.renderResults();
    $('#soegInput').focus();
  },
  renderResults() {
    const { $, S, h, kr, emp, site, proj, openProject, go, toast, siteLabel } = App;
    const out = $('#soegResults');
    const query = ($('#soegInput').value || '').trim();
    const filter = S.lastSearchFilter || '';

    if (query.length < 2) {
      out.innerHTML = '<div class="card"><div class="empty">Skriv mindst 2 tegn for at søge.</div></div>';
      return;
    }

    const words = query.toLowerCase().split(/\s+/).filter(Boolean);

    // Match et ord mod en søgestreng. Tal matcher også når adskillertegn (. , mellemrum) er forskellige,
    // fx "34713" matcher "34.713".
    const matchWord = (hay, w) => {
      if (hay.includes(w)) return true;
      if (/^[\d.,\s]+$/.test(w)) return hay.replace(/[.,\s]/g, '').includes(w.replace(/[.,\s]/g, ''));
      return false;
    };
    const matchesAll = hay => words.every(w => matchWord(hay, w));

    // Fremhæv match i visningstekst med <mark>.
    const mark = text => {
      let out = h(text);
      words.forEach(w => {
        if (!w) return;
        const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(esc, 'ig');
        if (re.test(out)) { out = out.replace(new RegExp(esc, 'ig'), m => `<mark>${m}</mark>`); return; }
        if (/^[\d.,\s]+$/.test(w)) {
          const target = w.replace(/[.,\s]/g, '');
          out = out.replace(/[\d.,]+/g, m => (m.replace(/[.,]/g, '') === target ? `<mark>${m}</mark>` : m));
        }
      });
      return out;
    };

    const goOrToast = (pageId, msg) => {
      if (document.getElementById('page-' + pageId)) go(pageId);
      else toast(msg || 'Denne side er ikke tilgængelig endnu i prototypen');
    };

    const groups = [];

    // Projekter (id, navn, opportunity, kunde) + log-linjer
    {
      const rows = [];
      (S.projekter || []).forEach(p => {
        const s = site(p.siteId);
        const kunde = s.kunde || '';
        const hay = [p.id, p.navn, p.opportunity, kunde, s.kode].join(' ').toLowerCase();
        if (matchesAll(hay)) {
          rows.push({
            title: `${mark(p.id)} — ${mark(p.navn)}`,
            sub: `${mark(kunde)} · ${mark(siteLabel(s))} · ${mark(p.opportunity || '')} · ${emp(p.pm).navn}`,
            onClick: () => openProject(p.id),
          });
        }
        (p.log || []).forEach(l => {
          const hayL = [l.tekst].join(' ').toLowerCase();
          if (matchesAll(hayL)) {
            rows.push({
              title: `Log på ${h(p.id)}: ${mark(l.tekst)}`,
              sub: `${h(l.dato)} · ${h(l.af)} · ${h(p.navn)}`,
              onClick: () => openProject(p.id),
            });
          }
        });
      });
      if (rows.length) groups.push({ key: 'projekter', label: 'Projekter', rows });
    }

    // Udgifter og fakturaer (faktura, leverandør, ydelse, beløb) pr. projekt
    {
      const rows = [];
      (S.projekter || []).forEach(p => {
        (p.udgifter || []).forEach(u => {
          const hay = [u.faktura, u.leverandoer, u.ydelse, u.beloeb, kr(u.beloeb)].join(' ').toLowerCase();
          if (matchesAll(hay)) {
            rows.push({
              title: `Faktura ${mark(String(u.faktura ?? ''))} · ${mark(u.leverandoer)} · ${mark(u.ydelse)}`,
              sub: `${mark(kr(u.beloeb))} · ${h(p.id)} ${h(p.navn)}`,
              onClick: () => openProject(p.id),
            });
          }
        });
      });
      if (rows.length) groups.push({ key: 'udgifter', label: 'Udgifter og fakturaer', rows });
    }

    // Fakturering (tekst, rekv., beløb, status) pr. projekt
    {
      const rows = [];
      (S.projekter || []).forEach(p => {
        (p.fakturering || []).forEach(f => {
          const hay = [f.tekst, f.rekv, f.beloeb, kr(f.beloeb), f.status].join(' ').toLowerCase();
          if (matchesAll(hay)) {
            rows.push({
              title: mark(f.tekst),
              sub: `${mark(kr(f.beloeb))} · Rekv. ${mark(f.rekv || '')} · ${h(f.status)} · ${h(p.id)} ${h(p.navn)}`,
              onClick: () => openProject(p.id),
            });
          }
        });
      });
      if (rows.length) groups.push({ key: 'fakturering', label: 'Fakturering', rows });
    }

    // Serviceopgaver
    {
      const rows = [];
      (S.serviceopgaver || []).forEach(c => {
        const st = site(c.siteId);
        const kunde = st.kunde || '';
        const tekniker = emp(c.tekniker).navn || c.tekniker || '';
        const hay = [c.id, c.beskrivelse, c.po, c.tekniker, c.status, tekniker, kunde, st.kode].join(' ').toLowerCase();
        if (matchesAll(hay)) {
          rows.push({
            title: `${mark(c.id)} — ${mark(c.beskrivelse)}`,
            sub: `${mark(kunde)} · ${mark(siteLabel(st))} · ${mark(tekniker)} · ${h(c.status)}${c.po ? ' · PO ' + mark(c.po) : ''}`,
            onClick: () => goOrToast('service'),
          });
        }
      });
      if (rows.length) groups.push({ key: 'service', label: 'Serviceopgaver', rows });
    }

    // Sites
    {
      const rows = [];
      (S.sites || []).forEach(s => {
        const hay = [s.id, s.kode, s.kunde, s.navn, s.adresse, s.by, s.stedNr].join(' ').toLowerCase();
        if (matchesAll(hay)) {
          rows.push({
            title: `${mark(s.kunde)} — ${mark(siteLabel(s))}`,
            sub: `${mark(s.adresse || '')}, ${h(s.postnr || '')} ${mark(s.by || '')} · Sted nr. ${mark(s.stedNr || '–')}`,
            onClick: () => go('kunder'),
          });
        }
      });
      if (rows.length) groups.push({ key: 'sites', label: 'Sites', rows });
    }

    // Tid
    {
      const rows = [];
      (S.tid || []).forEach(t => {
        const tekniker = emp(t.tekniker).navn || t.tekniker || '';
        const hay = [t.sag, t.udfoert, t.tekniker, t.dato, tekniker].join(' ').toLowerCase();
        if (matchesAll(hay)) {
          const p = proj(t.sag);
          rows.push({
            title: mark(t.udfoert || ''),
            sub: `${h(t.dato)} · ${mark(tekniker)} · Sag ${mark(t.sag)}${p ? ' – ' + h(p.navn) : ''}`,
            onClick: () => { if (p) openProject(t.sag); else goOrToast('service'); },
          });
        }
      });
      if (rows.length) groups.push({ key: 'tid', label: 'Tid', rows });
    }

    // Underleverandører (findes måske ikke endnu)
    {
      const rows = [];
      (S.underleverandoerer || []).forEach(u => {
        const kontakter = (u.kontakter || []).map(k => k.navn).filter(Boolean);
        const hay = [u.navn, ...kontakter].join(' ').toLowerCase();
        if (matchesAll(hay)) {
          rows.push({
            title: mark(u.navn || ''),
            sub: kontakter.length ? `Kontakt: ${kontakter.map(mark).join(', ')}` : '',
            onClick: () => goOrToast('ul'),
          });
        }
      });
      if (rows.length) groups.push({ key: 'ul', label: 'Underleverandører', rows });
    }

    const shown = filter ? groups.filter(g => g.key === filter) : groups;
    const total = shown.reduce((a, g) => a + g.rows.length, 0);

    if (!total) {
      out.innerHTML = `<div class="card"><div class="empty">Ingen resultater for &ldquo;${h(query)}&rdquo;.</div></div>`;
      return;
    }

    out.innerHTML = shown.map(g => `
      <div class="card soeg-group">
        <div class="card-body">
          <h2>${h(g.label)} <span class="muted">(${g.rows.length})</span></h2>
          <div class="table-wrap">
            <table>
              <tbody>
                ${g.rows.map((r, i) => `<tr class="click" data-grp="${g.key}" data-i="${i}" tabindex="0"><td><b>${r.title}</b><br><span class="muted">${r.sub || ''}</span></td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `).join('');

    App.$$('#soegResults tr.click').forEach(tr => {
      const g = shown.find(x => x.key === tr.dataset.grp);
      const row = g && g.rows[+tr.dataset.i];
      if (!row) return;
      tr.addEventListener('click', row.onClick);
    });
  },
});

</script>
<script>
// Til fakturering – kø på tværs af projekter og serviceopgaver for faktureringsteamet.
// Punkt 6 i PLAN-v2.md. Ejer kun denne fil (+ én script-tag i index.html).
App.registerPage({
  id: 'fakturering', label: 'Til fakturering', group: 'Økonomi', icon: 'export', order: 50,
  roles: ['Chef', 'PM', 'Fakturering'],
  html: `
    <div class="page-head">
      <div>
        <h1>Til fakturering</h1>
        <p>Faktureringsklare linjer fra projekter og serviceopgaver, samlet i én kø.</p>
      </div>
      <div class="replaces">Erstatter <b>Opgaver til fakturering</b>-arket og fanen <b>Fakturering</b> på tværs af projekter</div>
    </div>
    <div class="stats" id="fkStats"></div>
    <div class="card">
      <div class="toolbar">
        <div class="ftabs" id="fkTabs">
          <button class="ftab on" data-t="alle">Alle</button>
          <button class="ftab" data-t="projekt">Projekter</button>
          <button class="ftab" data-t="service">Serviceopgaver</button>
        </div>
        <label class="field">Afdeling
          <select id="fkAfd">
            <option value="">Alle afdelinger</option>
            <option value="Novo">Novo</option>
            <option value="Generel">Generel</option>
          </select>
        </label>
        <label class="field">Søg
          <input type="text" id="fkSoeg" placeholder="Sag, kunde eller tekst">
        </label>
        <div class="spacer"></div>
        <button class="btn cta" id="fkMarker" disabled>Marker som faktureret</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th></th><th>Sag</th><th>Kunde og site</th><th>Tekst</th><th>Rekv. / PO</th><th>Costcenter</th>
            <th class="num">Beløb</th><th class="num">Timer</th><th>Afsendt af / dato</th><th></th><th></th>
          </tr></thead>
          <tbody id="fkRows"></tbody>
          <tfoot><tr id="fkSum"></tr></tfoot>
        </table>
      </div>
    </div>

    <p style="margin-top:18px"><button class="tlink" id="fkRecentToggle">Vis faktureret de seneste 30 dage</button></p>
    <div class="card" id="fkRecentCard" hidden>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Sag</th><th>Kunde og site</th><th>Tekst</th><th class="num">Beløb</th><th>Dato</th><th>Init.</th></tr></thead>
          <tbody id="fkRecentRows"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-bg" id="modalFkAnmodning">
      <div class="modal" role="dialog" aria-labelledby="fkAnmodningTitel">
        <header><h2 id="fkAnmodningTitel">Faktureringsanmodning</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="pdf" id="fkPdfPreview"></div>
        </div>
        <footer><button class="btn" data-close>Luk</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, S, save, toast, today, kr, h, bc, site, emp, proj, openModal, go } = App;

    // ---------- lokal tilstand ----------
    let tab = 'alle';
    let afd = '';
    let soeg = '';
    const valgt = new Set(); // nøgler: "projekt|PRDK.../0" eller "service|CAS-..."
    let recentOpen = false;

    // ---------- hjælpere ----------
    const afdForRow = row => {
      if (row.type === 'projekt') return row.p.afdeling || 'Generel';
      const s = site(row.s.id);
      return (s.kunde || '').trim().toLowerCase().startsWith('novo') ? 'Novo' : 'Generel';
    };
    const costcenterForRow = row => {
      const m = row.type === 'projekt' ? bc(row.p.stedNr) : bc(row.s.stedNr);
      return m ? `${m.costcenter} – ${m.costcenterNavn}` : '–';
    };
    const timerForRow = row => (S.tid || []).filter(t => t.sag === row.id).reduce((a, t) => a + (+t.timer || 0) + (+t.ot1 || 0) + (+t.ot2 || 0), 0);
    const beloebForRow = row => {
      if (row.type === 'projekt') return { beloeb: +row.line.beloeb || 0, forslag: false };
      if (row.opg.kladde) return { beloeb: +row.opg.kladde.total || 0, forslag: false };
      const pris = +row.opg.pris || 0;
      if (pris) return { beloeb: pris, forslag: false };
      return { beloeb: timerForRow(row) * 1025, forslag: true };
    };
    const manglerKladde = row => row.type === 'service' && !row.opg.kladde;
    const approxDate = row => {
      if (row.type === 'projekt') {
        const lg = (row.p.log || [])[0];
        return (lg ? lg.dato : row.p.oprettet || today()).slice(0, 10);
      }
      return (row.opg.lukket || row.opg.dato || today()).slice(0, 10);
    };
    const relatedProjectId = row => {
      if (row.type === 'projekt') return row.p.id;
      if (row.opg.parent) return row.opg.parent;
      const hit = (S.projekter || []).find(p => row.opg.id && row.opg.id.startsWith(p.id));
      return hit ? hit.id : null;
    };
    const key = row => row.type === 'projekt' ? `projekt|${row.p.id}|${row.idx}` : `service|${row.opg.id}`;

    // Samler alle kø-linjer (endnu ikke faktureret) på tværs af projekter og serviceopgaver
    function queueRows() {
      const out = [];
      (S.projekter || []).forEach(p => {
        (p.fakturering || []).forEach((line, idx) => {
          if (line.status === 'Klar til fakturering') {
            const s = site(p.siteId);
            out.push({ type: 'projekt', id: p.id, p, s, line, idx });
          }
        });
      });
      (S.serviceopgaver || []).forEach(opg => {
        if (opg.status === 'Lukket til fakturering') {
          const s = site(opg.siteId);
          out.push({ type: 'service', id: opg.id, opg, s });
        }
      });
      return out;
    }

    function recentRows() {
      const out = [];
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
      const cutoffStr = cutoff.toISOString().slice(0, 10);
      (S.projekter || []).forEach(p => {
        (p.fakturering || []).forEach(line => {
          if (line.status === 'Faktureret' && line.dato && line.dato >= cutoffStr) {
            const s = site(p.siteId);
            out.push({ sag: p.id, kunde: `${s.kunde} · ${App.siteLabel(s)}`, tekst: line.tekst, beloeb: +line.beloeb || 0, dato: line.dato, init: line.initialer });
          }
        });
      });
      (S.serviceopgaver || []).forEach(opg => {
        if (opg.status === 'Faktureret' && opg.dato && opg.dato >= cutoffStr) {
          const s = site(opg.siteId);
          out.push({ sag: opg.id, kunde: `${s.kunde} · ${App.siteLabel(s)}`, tekst: opg.beskrivelse, beloeb: +opg.pris || 0, dato: opg.dato, init: opg.initialer });
        }
      });
      return out.sort((a, b) => b.dato.localeCompare(a.dato));
    }

    function filtered() {
      return queueRows().filter(row => {
        if (tab === 'projekt' && row.type !== 'projekt') return false;
        if (tab === 'service' && row.type !== 'service') return false;
        if (afd && afdForRow(row) !== afd) return false;
        if (soeg) {
          const q = soeg.toLowerCase();
          const hay = [row.id, row.s.kunde, row.s.navn, row.s.kode, row.type === 'projekt' ? row.line.tekst : row.opg.beskrivelse].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function openAnmodning(row) {
      const { beloeb } = beloebForRow(row);
      const s = row.s;
      const rekv = row.type === 'projekt' ? row.line.rekv : row.opg.po;
      const tekst = row.type === 'projekt' ? row.line.tekst : row.opg.beskrivelse;
      const m = row.type === 'projekt' ? bc(row.p.stedNr) : bc(s.stedNr);
      $('#fkPdfPreview').innerHTML = `
        <div class="pdf-head"><b>Faktureringsanmodning</b><span class="muted">${h(row.id)} · ${today()}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
        <dl>
          <dt>Kunde</dt><dd>${h(s.kunde)}</dd><dt>Account nr.</dt><dd>${m ? h(m.account) : '–'}</dd>
          <dt>Adresse</dt><dd>${h(App.siteLabel(s))}</dd><dt>Site nr.</dt><dd>${h(s.id)}</dd>
          <dt>Sag</dt><dd>${h(row.id)}</dd><dt>Costcenter</dt><dd>${m ? h(m.costcenter) : '–'}</dd>
          <dt>PO / rekv. nr.</dt><dd>${h(rekv) || '–'}</dd><dt>TOS</dt><dd>${m ? h(m.tos) : '–'}</dd>
        </dl>
        <table><thead><tr><th>Arbejdsbeskrivelse</th><th class="num">Beløb</th></tr></thead>
        <tbody><tr><td>${h(tekst)}</td><td class="num">${kr(beloeb)}</td></tr></tbody>
        <tfoot><tr><td>Samlet pris ekskl. moms</td><td class="num">${kr(beloeb)}</td></tr></tfoot></table>
        <p class="caption muted" style="margin-top:18px">Alle felter ovenfor er hentet fra sagen.</p>`;
      openModal('modalFkAnmodning');
    }

    // Serviceopgaver med godkendt fakturakladde: vis den gemte kladde (samme .pdf-markup som service.js),
    // bygget ud fra de gemte linjer – service.js' render kan ikke genbruges på tværs af filer.
    function openKladdeVis(row) {
      const opg = row.opg, s = row.s, kladde = opg.kladde;
      const m = bc(s.stedNr);
      const rowsHtml = kladde.linjer.map(l => `<tr><td>${h(l.tekst)}</td><td class="num">${App.n(l.antal)}</td><td class="num">${kr(l.enhedspris)}</td><td class="num">${(+l.beloeb || 0) === 0 ? 'Efter regning' : kr(l.beloeb)}</td></tr>`).join('');
      $('#fkPdfPreview').innerHTML = `
        <div class="pdf-head"><b>Fakturakladde</b><span class="muted">${h(opg.id)} · ${h(kladde.dato)}</span><svg viewBox="0 0 304 164" aria-label="Securitas" style="width:84px;color:#031F30"><use href="#logo-white"/></svg></div>
        <dl>
          <dt>Sag</dt><dd>${h(opg.id)}${opg.parent ? ` <span class="muted">(Delopgave under ${h(opg.parent)})</span>` : ''}</dd>
          <dt>CEP account</dt><dd>${m ? h(m.account) : '–'}</dd>
          <dt>Kunde</dt><dd>${h(s.kunde)}</dd><dt>CEP site</dt><dd>${h(s.id)}</dd>
          <dt>Adresse</dt><dd>${h(App.siteLabel(s))}</dd><dt>Sted nr.</dt><dd>${h(s.stedNr) || '–'}</dd>
          <dt>Costcenter</dt><dd>${m ? `${h(m.costcenter)} – ${h(m.costcenterNavn)}` : '–'}</dd><dt>TOS</dt><dd>${m ? h(m.tos) : '–'}</dd>
          <dt>PO</dt><dd>${h(opg.po) || '–'}</dd><dt>Type</dt><dd>${h(opg.type || 'Service')}</dd>
        </dl>
        <p><b>Opgavebeskrivelse</b><br>${h(opg.beskrivelse)}</p>
        <table><thead><tr><th>Tekst</th><th class="num">Antal</th><th class="num">Enhedspris</th><th class="num">Beløb</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr><td colspan="3">Total</td><td class="num">${kr(kladde.total)}</td></tr></tfoot></table>
        <p class="caption muted" style="margin-top:18px">Godkendt af ${h(emp(kladde.godkendtAf).navn)} den ${h(kladde.dato)}</p>`;
      openModal('modalFkAnmodning');
    }

    // ---------- events ----------
    $$('#fkTabs .ftab').forEach(b => b.addEventListener('click', () => {
      tab = b.dataset.t;
      $$('#fkTabs .ftab').forEach(x => x.classList.toggle('on', x === b));
      this.render();
    }));
    $('#fkAfd').addEventListener('change', () => { afd = $('#fkAfd').value; this.render(); });
    $('#fkSoeg').addEventListener('input', () => { soeg = $('#fkSoeg').value.trim(); this.render(); });
    $('#fkRecentToggle').addEventListener('click', () => {
      recentOpen = !recentOpen;
      $('#fkRecentCard').hidden = !recentOpen;
      $('#fkRecentToggle').textContent = recentOpen ? 'Skjul faktureret de seneste 30 dage' : 'Vis faktureret de seneste 30 dage';
    });
    $('#fkMarker').addEventListener('click', () => {
      if (!valgt.size) return;
      const rows = queueRows().filter(r => valgt.has(key(r)) && !manglerKladde(r));
      if (!rows.length) return;
      const projekterBeroert = new Set();
      rows.forEach(row => {
        if (row.type === 'projekt') {
          row.line.status = 'Faktureret'; row.line.dato = today(); row.line.initialer = S.user;
          projekterBeroert.add(row.p.id);
        } else {
          row.opg.status = 'Faktureret'; row.opg.dato = today(); row.opg.initialer = S.user;
        }
      });
      projekterBeroert.forEach(id => {
        const p = proj(id);
        if (p && (p.fakturering || []).length && p.fakturering.every(l => l.status === 'Faktureret')) p.status = 'Faktureret';
      });
      valgt.clear();
      save();
      toast(rows.length === 1 ? 'Linje markeret som faktureret' : rows.length + ' linjer markeret som faktureret');
      this.render();
    });

    this._openAnmodning = openAnmodning;
    this._openKladdeVis = openKladdeVis;
    this._filtered = filtered;
    this._queueRows = queueRows;
    this._recentRows = recentRows;
    this._afdForRow = afdForRow;
    this._costcenterForRow = costcenterForRow;
    this._timerForRow = timerForRow;
    this._beloebForRow = beloebForRow;
    this._manglerKladde = manglerKladde;
    this._approxDate = approxDate;
    this._relatedProjectId = relatedProjectId;
    this._key = key;
    this._valgt = valgt;
  },
  render() {
    const { $, $$, S, save, toast, today, kr, n, h, emp, go } = App;
    const rows = this._filtered();
    const all = this._queueRows();

    // KPI'er
    const sumAlle = all.reduce((a, r) => a + this._beloebForRow(r).beloeb, 0);
    const thisMonth = today().slice(0, 7);
    let faktThisMonth = 0;
    (S.projekter || []).forEach(p => (p.fakturering || []).forEach(l => { if (l.status === 'Faktureret' && (l.dato || '').startsWith(thisMonth)) faktThisMonth += +l.beloeb || 0; }));
    (S.serviceopgaver || []).forEach(o => { if (o.status === 'Faktureret' && (o.dato || '').startsWith(thisMonth)) faktThisMonth += +o.pris || 0; });
    let aeldsteDage = 0;
    all.forEach(r => {
      const d = new Date(this._approxDate(r));
      const dage = Math.max(0, Math.round((Date.now() - d) / 86400000));
      if (dage > aeldsteDage) aeldsteDage = dage;
    });
    $('#fkStats').innerHTML = [
      ['Linjer klar', n(all.length)], ['Sum kr. klar', kr(sumAlle)],
      ['Faktureret denne måned', kr(faktThisMonth)], ['Ældste linje', aeldsteDage ? n(aeldsteDage) + ' dage' : '–'],
    ].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('');

    // Tabel
    if (!rows.length) {
      $('#fkRows').innerHTML = `<tr><td colspan="10" class="empty">${all.length ? 'Ingen linjer matcher filtrene.' : 'Ingen linjer klar til fakturering lige nu.'}</td></tr>`;
    } else {
      $('#fkRows').innerHTML = rows.map(row => {
        const k = this._key(row);
        const s = row.s;
        const tekst = row.type === 'projekt' ? row.line.tekst : row.opg.beskrivelse;
        const rekv = row.type === 'projekt' ? row.line.rekv : row.opg.po;
        const { beloeb, forslag } = this._beloebForRow(row);
        const timer = this._timerForRow(row);
        const dato = row.type === 'projekt' ? row.line.dato : row.opg.dato;
        const init = row.type === 'projekt' ? row.line.initialer : row.opg.initialer;
        const afsendt = dato ? `${h(dato)} · ${h(emp(init).navn)}` : '–';
        const relId = this._relatedProjectId(row);
        const mangler = this._manglerKladde(row);
        return `<tr>
          <td><input type="checkbox" data-k="${h(k)}" ${this._valgt.has(k) ? 'checked' : ''} ${mangler ? 'disabled' : ''} aria-label="Vælg linje"></td>
          <td>${h(row.id)}<div class="caption muted">${row.type === 'projekt' ? 'Projekt' : (row.opg.parent ? `Delopgave under ${h(row.opg.parent)}` : 'Serviceopgave')}</div></td>
          <td>${h(s.kunde)}<div class="caption muted">${h(App.siteLabel(s))}</div></td>
          <td>${h(tekst)}</td>
          <td>${h(rekv) || '–'}</td>
          <td>${this._costcenterForRow(row)}</td>
          <td class="num">${kr(beloeb)}${forslag ? '<div class="caption muted">Forslag</div>' : ''}${mangler ? '<div class="alert">Mangler kladde</div>' : ''}</td>
          <td class="num">${timer ? n(timer) + ' t' : '–'}</td>
          <td>${afsendt}</td>
          <td><button class="tlink" data-vis="${h(k)}">Vis anmodning</button></td>
          <td>${relId ? `<button class="tlink" data-aabn="${h(relId)}">Åbn projekt</button>` : ''}</td>
        </tr>`;
      }).join('');
    }
    const sumVis = rows.reduce((a, r) => a + this._beloebForRow(r).beloeb, 0);
    $('#fkSum').innerHTML = `<td></td><td colspan="5">Sum, viste linjer (${rows.length})</td><td class="num">${kr(sumVis)}</td><td colspan="3"></td>`;

    $$('#fkRows [data-k]').forEach(cb => cb.addEventListener('change', () => {
      const k = cb.dataset.k;
      if (cb.checked) this._valgt.add(k); else this._valgt.delete(k);
      $('#fkMarker').disabled = !this._valgt.size;
    }));
    $$('#fkRows [data-vis]').forEach(b => b.addEventListener('click', () => {
      const row = this._queueRows().find(r => this._key(r) === b.dataset.vis);
      if (!row) return;
      if (row.type === 'service' && row.opg.kladde) this._openKladdeVis(row);
      else this._openAnmodning(row);
    }));
    $$('#fkRows [data-aabn]').forEach(b => b.addEventListener('click', () => App.openProject(b.dataset.aabn)));
    $('#fkMarker').disabled = !this._valgt.size;

    // Faktureret de seneste 30 dage
    const recent = this._recentRows();
    $('#fkRecentRows').innerHTML = recent.map(r => `<tr><td>${h(r.sag)}</td><td>${h(r.kunde)}</td><td>${h(r.tekst)}</td><td class="num">${kr(r.beloeb)}</td><td class="muted">${h(r.dato)}</td><td>${h(r.init)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Ingen fakturerede linjer de seneste 30 dage.</td></tr>';
  },
});

</script>
<script>
// Underleverandør-register. Erstatter de skjulte ark "Underleverandør" og
// "Liste over Underlevendøre" der i dag er kopieret ind i tre Excel-filer.
// Datakilde: App.S.underleverandoerer (kopieret fra data.js ved load, kan mangle indtil videre).
App.registerPage({
  id: 'ul', label: 'Underleverandører', group: 'Stamdata', icon: 'user', order: 65,
  roles: ['Chef', 'PM', 'Fakturering', 'Service'],
  html: `
    <div class="page-head">
      <div>
        <h1>Underleverandører</h1>
        <p>Ét register for alle underleverandører. Erstatter de skjulte ark <b>Underleverandør</b> og <b>Liste over Underlevendøre</b> der i dag ligger kopieret ind i tre Excel-filer.</p>
      </div>
      <div style="display:flex; gap:12px; align-items:center">
        <div class="replaces">Erstatter <b>Underleverandør</b> og <b>Liste over Underlevendøre</b></div>
        <button class="btn primary" id="btnNewUl">Ny underleverandør</button>
      </div>
    </div>
    <div class="card">
      <div class="toolbar">
        <div class="ftabs" id="ulOmraade" role="group" aria-label="Område"></div>
        <label class="field">Søg <input type="text" id="ulSearch" placeholder="Navn, område, mail, kontakt" size="28"></label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Navn</th><th>Område</th><th>Vagttelefon</th><th>Bestillingsmail</th><th>CC</th>
            <th class="num">Timepris kost</th><th class="num">Timepris salg</th><th class="num">Projekter</th><th class="num">Sites</th>
          </tr></thead>
          <tbody id="ulRows"></tbody>
        </table>
      </div>
    </div>

    <!-- Detalje / rediger -->
    <div class="modal-bg" id="modalUl">
      <div class="modal" role="dialog" aria-labelledby="ulTitle">
        <header><h2 id="ulTitle">Underleverandør</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div id="ulView"></div>
          <div id="ulEditWrap" style="display:none">
            <form class="form-grid" id="ulEditForm" onsubmit="return false"></form>
            <h3 style="margin:24px 0 12px">Kontaktpersoner</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Navn</th><th>Rolle</th><th>Telefon</th><th>Mail</th><th></th></tr></thead>
                <tbody id="ulEditKontakter"></tbody>
              </table>
            </div>
            <form class="inline-form" id="ulKontaktForm" novalidate style="grid-template-columns: 1fr 1fr 1fr 1.3fr auto">
              <label>Navn <input type="text" name="navn" required></label>
              <label>Rolle <input type="text" name="rolle" placeholder="fx Vagtcentral"></label>
              <label>Telefon <input type="text" name="tlf"></label>
              <label>Mail <input type="text" name="mail"></label>
              <button class="btn" type="submit">Tilføj kontakt</button>
            </form>
          </div>
        </div>
        <footer id="ulFooterView">
          <button class="btn" data-close>Luk</button>
          <button class="btn" id="ulBtnEdit">Rediger</button>
          <button class="btn cta" id="ulBtnBestil">Ny bestilling</button>
        </footer>
        <footer id="ulFooterEdit" style="display:none">
          <button class="btn" id="ulBtnCancelEdit">Annullér</button>
          <button class="btn cta" id="ulBtnSaveEdit">Gem ændringer</button>
        </footer>
      </div>
    </div>

    <!-- Ny underleverandør -->
    <div class="modal-bg" id="modalUlNew">
      <div class="modal" role="dialog" aria-labelledby="ulNewTitle">
        <header><h2 id="ulNewTitle">Ny underleverandør</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <form class="form-grid" id="ulNewForm">
            <label>Navn <input type="text" name="navn" required></label>
            <label>Område <input type="text" name="omraade" placeholder="fx Fyn, Novo, Øst"></label>
            <label>Vagttelefon <input type="text" name="vagttelefon"></label>
            <label>Bestillingsmail <input type="text" name="bestillingsmail" required></label>
            <label>CC-mail <input type="text" name="ccMail"></label>
            <label>Timepris kost (kr.) <input type="number" name="timeprisKost" step="1"></label>
            <label>Timepris salg (kr.) <input type="number" name="timeprisSalg" step="1"></label>
            <label>Aftale <input type="text" name="aftale" placeholder="fx Rammeaftale 2026"></label>
          </form>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="ulNewSave">Opret underleverandør</button></footer>
      </div>
    </div>

    <!-- Ny bestilling -->
    <div class="modal-bg" id="modalBestilling">
      <div class="modal" role="dialog" aria-labelledby="bestTitle">
        <header><h2 id="bestTitle">Ny bestilling</h2><button class="btn icobtn" data-close aria-label="Luk"><svg class="ico s"><use href="#i-close"/></svg></button></header>
        <div class="body">
          <div class="form-grid" style="margin-bottom:18px">
            <label class="auto">Til<input type="text" id="bestTil" readonly></label>
            <label class="auto">CC (altid med på bestillinger)<input type="text" id="bestCc" readonly></label>
          </div>
          <div class="form-grid" style="margin-bottom:18px">
            <label>Sag <select id="bestSag"></select></label>
            <label>Ønsket dato <input type="date" id="bestDato"></label>
          </div>
          <label style="display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-secondary); margin-bottom:18px">Beskrivelse af opgave
            <textarea id="bestBeskrivelse" rows="3" placeholder="Beskriv opgaven til underleverandøren"></textarea>
          </label>
          <div class="pdf" id="bestPreview"></div>
        </div>
        <footer><button class="btn" data-close>Annullér</button><button class="btn cta" id="bestSend">Send via Outlook</button></footer>
      </div>
    </div>
  `,
  init() {
    const { $, $$, S, save, toast, today, now, h, kr, emp, site, openModal, closeModal } = App;
    if (!S.underleverandoerer) S.underleverandoerer = [];
    let curId = null;
    const list = () => S.underleverandoerer || [];
    const cur = () => list().find(u => u.id === curId);

    $('#ulSearch').addEventListener('input', () => this.render());

    // ---------- Ny underleverandør ----------
    $('#btnNewUl').addEventListener('click', () => { $('#ulNewForm').reset(); openModal('modalUlNew'); });
    $('#ulNewSave').addEventListener('click', () => {
      const fd = new FormData($('#ulNewForm'));
      const navn = (fd.get('navn') || '').trim();
      if (!navn) { toast('Navn er påkrævet'); return; }
      const nums = list().map(u => +String(u.id).replace(/\D/g, '') || 0);
      const id = 'UL-' + (nums.length ? Math.max(...nums) + 1 : 1);
      list().push({
        id, navn, omraade: fd.get('omraade') || '', vagttelefon: fd.get('vagttelefon') || '',
        bestillingsmail: fd.get('bestillingsmail') || '', ccMail: fd.get('ccMail') || '',
        timeprisKost: +fd.get('timeprisKost') || 0, timeprisSalg: +fd.get('timeprisSalg') || 0,
        aftale: fd.get('aftale') || '', kontakter: [],
      });
      save(); closeModal('modalUlNew'); this.render(); toast('Underleverandør oprettet: ' + navn);
    });

    // ---------- Detalje / rediger ----------
    const renderView = () => {
      const u = cur(); if (!u) return;
      const proj = S.projekter.filter(p => p.ul === u.navn);
      const sites = (S.sites || []).filter(s => s.ul === u.navn);
      $('#ulTitle').textContent = u.navn;
      $('#ulView').innerHTML = `
        <div class="form-grid" style="margin-bottom:24px">
          <label class="auto">Område<input readonly value="${h(u.omraade) || '–'}"></label>
          <label class="auto">Vagttelefon<input readonly value="${h(u.vagttelefon) || '–'}"></label>
          <label class="auto">Bestillingsmail<input readonly value="${h(u.bestillingsmail) || '–'}"></label>
          <label class="auto">CC-mail<input readonly value="${h(u.ccMail) || '–'}"></label>
          <label class="auto">Timepris kost<input readonly value="${kr(u.timeprisKost)}"></label>
          <label class="auto">Timepris salg<input readonly value="${kr(u.timeprisSalg)}"></label>
          <label class="auto">Aftale<input readonly value="${h(u.aftale) || '–'}"></label>
        </div>
        <h3 style="margin-bottom:12px">Kontaktpersoner</h3>
        <div class="table-wrap">
          <table><thead><tr><th>Navn</th><th>Rolle</th><th>Telefon</th><th>Mail</th></tr></thead>
          <tbody>${(u.kontakter || []).map(k => `<tr><td>${h(k.navn)}</td><td>${h(k.rolle)}</td><td>${h(k.tlf)}</td><td>${h(k.mail)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Ingen kontaktpersoner registreret.</td></tr>'}</tbody></table>
        </div>
        <h3 style="margin:24px 0 12px">Projekter med denne UL</h3>
        <div class="table-wrap">
          <table><thead><tr><th>Projekt</th><th>Navn</th><th>Status</th></tr></thead>
          <tbody>${proj.map(p => `<tr><td><b>${h(p.id)}</b></td><td>${h(p.navn)}</td><td>${App.st(p.status)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Ingen projekter bruger denne UL.</td></tr>'}</tbody></table>
        </div>
        <h3 style="margin:24px 0 12px">Sites med denne UL</h3>
        <div class="table-wrap">
          <table><thead><tr><th>Site</th><th>Navn</th><th>Adresse</th></tr></thead>
          <tbody>${sites.map(s => `<tr><td><b>${h(s.id)}</b></td><td>${h(App.siteLabel(s))}</td><td>${h(s.adresse)}, ${h(s.postnr)} ${h(s.by)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Ingen sites bruger denne UL.</td></tr>'}</tbody></table>
        </div>`;
      $('#ulFooterView').style.display = ''; $('#ulFooterEdit').style.display = 'none';
      $('#ulView').style.display = ''; $('#ulEditWrap').style.display = 'none';
    };

    const renderEditKontakter = () => {
      const u = cur(); if (!u) return;
      $('#ulEditKontakter').innerHTML = (u.kontakter || []).map((k, i) => `<tr><td>${h(k.navn)}</td><td>${h(k.rolle)}</td><td>${h(k.tlf)}</td><td>${h(k.mail)}</td><td><button class="tlink" type="button" data-rmk="${i}">Fjern</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Ingen kontaktpersoner endnu.</td></tr>';
      $$('#ulEditKontakter [data-rmk]').forEach(b => b.addEventListener('click', () => {
        u.kontakter.splice(+b.dataset.rmk, 1); save(); renderEditKontakter();
      }));
    };

    const renderEdit = () => {
      const u = cur(); if (!u) return;
      const f = (label, name, val, opts = {}) => `<label>${label}<input type="${opts.type || 'text'}" ${opts.step ? `step="${opts.step}"` : ''} name="${name}" value="${h(val)}"></label>`;
      $('#ulEditForm').innerHTML = [
        f('Navn', 'navn', u.navn), f('Område', 'omraade', u.omraade), f('Vagttelefon', 'vagttelefon', u.vagttelefon),
        f('Bestillingsmail', 'bestillingsmail', u.bestillingsmail), f('CC-mail', 'ccMail', u.ccMail),
        f('Timepris kost (kr.)', 'timeprisKost', u.timeprisKost, { type: 'number', step: '1' }),
        f('Timepris salg (kr.)', 'timeprisSalg', u.timeprisSalg, { type: 'number', step: '1' }),
        f('Aftale', 'aftale', u.aftale),
      ].join('');
      renderEditKontakter();
      $('#ulFooterView').style.display = 'none'; $('#ulFooterEdit').style.display = '';
      $('#ulView').style.display = 'none'; $('#ulEditWrap').style.display = '';
    };

    $('#ulKontaktForm').addEventListener('submit', e => {
      e.preventDefault(); const u = cur(); if (!u) return;
      const fd = new FormData(e.target);
      if (!u.kontakter) u.kontakter = [];
      u.kontakter.push({ navn: fd.get('navn'), rolle: fd.get('rolle') || '', tlf: fd.get('tlf') || '', mail: fd.get('mail') || '' });
      save(); e.target.reset(); renderEditKontakter();
    });
    $('#ulBtnEdit').addEventListener('click', renderEdit);
    $('#ulBtnCancelEdit').addEventListener('click', renderView);
    $('#ulBtnSaveEdit').addEventListener('click', () => {
      const u = cur(); if (!u) return;
      const fd = new FormData($('#ulEditForm'));
      u.navn = fd.get('navn') || u.navn; u.omraade = fd.get('omraade') || ''; u.vagttelefon = fd.get('vagttelefon') || '';
      u.bestillingsmail = fd.get('bestillingsmail') || ''; u.ccMail = fd.get('ccMail') || '';
      u.timeprisKost = +fd.get('timeprisKost') || 0; u.timeprisSalg = +fd.get('timeprisSalg') || 0; u.aftale = fd.get('aftale') || '';
      save(); renderView(); this.render(); toast('Underleverandør opdateret');
    });

    // ---------- Ny bestilling ----------
    const sagInfo = sagId => {
      const p = S.projekter.find(x => x.id === sagId);
      if (p) { const s = site(p.siteId); return { label: p.id, navn: p.navn, site: s, po: p.ref || p.wo || '', kontakt: p.rekvirent || s.kontakt || '', isProjekt: true, obj: p }; }
      const so = (S.serviceopgaver || []).find(x => x.id === sagId);
      if (so) { const s = site(so.siteId); return { label: so.id, navn: so.beskrivelse, site: s, po: so.po || '', kontakt: s.kontakt || '', isProjekt: false, obj: so }; }
      return null;
    };
    const renderBestPreview = () => {
      const u = cur(); if (!u) return;
      const info = sagInfo($('#bestSag').value);
      const beskrivelse = $('#bestBeskrivelse').value.trim();
      const dato = $('#bestDato').value;
      if (!info) { $('#bestPreview').innerHTML = '<p class="empty">Vælg en sag for at se bestillingen.</p>'; return; }
      $('#bestPreview').innerHTML = `
        <div class="pdf-head"><b>Bestilling til ${h(u.navn)}</b><span class="muted">${today()}</span></div>
        <dl>
          <dt>Emne</dt><dd>Bestilling – ${h(info.label)} – ${h(App.siteLabel(info.site))}</dd>
          <dt>Ønsket dato</dt><dd>${h(dato) || '–'}</dd>
          <dt>Adresse</dt><dd>${h(info.site.adresse) || '–'}, ${h(info.site.postnr) || ''} ${h(info.site.by) || ''}</dd>
          <dt>Sted nr.</dt><dd>${h(info.site.stedNr) || '–'}</dd>
          <dt>Kontaktperson</dt><dd>${h(info.kontakt) || '–'}</dd>
          <dt>PO / rekv. nr.</dt><dd>${h(info.po) || '–'}</dd>
        </dl>
        <p>${h(beskrivelse) || 'Ingen beskrivelse angivet endnu.'}</p>`;
    };
    $('#ulBtnBestil').addEventListener('click', () => {
      const u = cur(); if (!u) return;
      $('#bestTil').value = u.bestillingsmail || '–';
      $('#bestCc').value = u.ccMail || '–';
      const sel = $('#bestSag'); sel.innerHTML = '';
      S.projekter.filter(p => p.status !== 'Faktureret').forEach(p => sel.add(new Option(`${p.id} – ${p.navn}`, p.id)));
      (S.serviceopgaver || []).filter(s => s.status === 'Åben').forEach(s => sel.add(new Option(`${s.id} – ${s.beskrivelse}`, s.id)));
      $('#bestDato').value = ''; $('#bestBeskrivelse').value = '';
      renderBestPreview();
      openModal('modalBestilling');
    });
    ['#bestSag', '#bestDato', '#bestBeskrivelse'].forEach(sel => $(sel).addEventListener('input', renderBestPreview));
    $('#bestSend').addEventListener('click', () => {
      const u = cur(); if (!u) return;
      const info = sagInfo($('#bestSag').value);
      if (!info) { toast('Vælg en sag før bestillingen sendes'); return; }
      if (info.isProjekt) {
